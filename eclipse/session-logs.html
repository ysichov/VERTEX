<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Session Logs in Eclipse. The report page is VS Code's (resources/log-report.html), drawn in the frame below and
     spoken to as VS Code's panel speaks to it; the logs are read and deleted by LogsView and parsed by VS Code's
     log-report.js (logs.js, generated by eclipse/prepare.js). The plugin ships the copy prepare.js puts in
     org.vertex.abap.ui/assistant/; edit this one. -->
<style id="theme">
/* The VS Code theme names the pages are written in, given values for Eclipse: light, and dark when the system is. */
:root {
  --vscode-font-family: "Segoe UI", system-ui, sans-serif;
  --vscode-font-size: 13px;
  --vscode-editor-font-family: Consolas, "Courier New", monospace;
  --vscode-editor-background: #ffffff;
  --vscode-editor-foreground: #1f1f1f;
  --vscode-descriptionForeground: #717171;
  --vscode-editorWidget-background: #f8f8f8;
  --vscode-editorWidget-border: #e5e5e5;
  --vscode-textCodeBlock-background: #f3f3f3;
  --vscode-focusBorder: #005fb8;
  --vscode-panel-border: #e5e5e5;
  --vscode-textLink-foreground: #005fb8;
  --vscode-errorForeground: #e51400;
  --vscode-list-hoverBackground: #f0f0f0;
  --vscode-button-secondaryBackground: #e5e5e5;
  --vscode-button-secondaryForeground: #3b3b3b;
  --vscode-button-secondaryHoverBackground: #cccccc;
  --vscode-charts-blue: #1a85ff;
  --vscode-charts-green: #388a34;
  --vscode-charts-orange: #d18616;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --vscode-editor-background: #1f1f1f;
    --vscode-editor-foreground: #cccccc;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-editorWidget-background: #252526;
    --vscode-editorWidget-border: #3c3c3c;
    --vscode-textCodeBlock-background: #2b2b2b;
    --vscode-focusBorder: #0078d4;
    --vscode-panel-border: #3c3c3c;
    --vscode-textLink-foreground: #4daafc;
    --vscode-errorForeground: #f85149;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-button-secondaryBackground: #313131;
    --vscode-button-secondaryForeground: #cccccc;
    --vscode-button-secondaryHoverBackground: #3c3c3c;
    --vscode-charts-blue: #3794ff;
    --vscode-charts-green: #89d185;
    --vscode-charts-orange: #d18616;
    color-scheme: dark;
  }
}
</style>
<style>
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; background: var(--vscode-editor-background); color: var(--vscode-editor-foreground);
  font: 13px var(--vscode-font-family); }
#status { padding: 6px 12px; border-left: 3px solid var(--vscode-errorForeground); white-space: pre-wrap; }
#bar { padding: 6px 12px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--vscode-panel-border); }
#bar button { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground);
  border: 1px solid transparent; padding: 3px 10px; cursor: pointer; font: inherit; }
iframe { flex: 1; width: 100%; border: 0; background: var(--vscode-editor-background); }
</style>
</head>
<body>
<div id="status" hidden></div>
<div id="bar" hidden><button type="button" id="back">Back to the logs</button></div>
<iframe id="report" title="Session Logs"></iframe>
<iframe id="snapshot" title="Recorded context" hidden></iframe>
<script>/*LOGS_ENGINE*/</script>
<script>
"use strict";
var report = document.getElementById("report"), snapshotFrame = document.getElementById("snapshot"), bar = document.getElementById("bar");
var statusBox = document.getElementById("status");
var REPORT = /*INIT*/null/*INIT*/;

function say(text) { statusBox.hidden = !text; statusBox.textContent = text || ""; }

// One request to Eclipse at a time: it answers through sdeReady, and sdeTake hands over the one answer it holds.
var waiting = [], active = null;
function call(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    waiting.push({ name: name, args: args, resolve: resolve, reject: reject });
    pump();
  });
}
function pump() {
  if (active || !waiting.length) { return; }
  active = waiting.shift();
  window[active.name].apply(window, active.args);
}
window.sdeReady = function () {
  var raw = sdeTake(), item = active;
  active = null;
  if (item) {
    var text = raw === null || raw === undefined ? null : String(raw);
    if (text === null) { item.reject(new Error("Eclipse gave no answer to " + item.name + ".")); }
    else if (text.indexOf("ERROR:") === 0) { item.reject(new Error(text.slice(6))); }
    else { item.resolve(text); }
  }
  pump();
};

function nonce() {
  var bytes = new Uint8Array(16), text = "";
  crypto.getRandomValues(bytes);
  bytes.forEach(function (b) { text += (b < 16 ? "0" : "") + b.toString(16); });
  return text;
}
var theme = document.getElementById("theme").textContent;
function themed(html) { return html.replace("</head>", "<style>" + theme + "</style></head>"); }
// A document of its own in a fresh frame: one written into the old frame keeps that one's Content-Security-Policy.
function write(frame, html) {
  var fresh = frame.cloneNode(false);
  frame.parentNode.replaceChild(fresh, frame);
  fresh.contentDocument.open();
  fresh.contentDocument.write(html);
  fresh.contentDocument.close();
  return fresh;
}
function tell(message) { report.contentWindow.postMessage(message, "*"); }

// What the report asks, done as VS Code's log-report.js does it, with Eclipse's files, dialogs and editors.
async function refresh() {
  var read = JSON.parse(await call("sdeLogsRead"));
  var sessions = read.files.map(function (file) { return vertexLogs.parseSession(file.text, file.name); })
    .filter(Boolean).sort(function (a, b) { return b.start - a.start; });
  tell({ action: "data", report: { configured: read.configured, folder: read.folder, sessions: sessions } });
}
async function handle(message) {
  if (message.action === "ready" || message.action === "refresh") { await refresh(); }
  if (message.action === "settings") { sdeLogsSettings(); }
  if (message.action === "chooseFolder") { await call("sdeLogsChooseFolder"); await refresh(); }
  if (message.action === "clearConversations") {
    await call("sdeLogsClear", JSON.stringify(Array.isArray(message.ids) ? message.ids : []));
    await refresh();
  }
  if (message.action === "openSnapshot") {
    var mermaid = message.snapshot && message.snapshot.kind === "uml" ? await call("sdeLogsAsset", "mermaid") : "";
    var asset = mermaid ? URL.createObjectURL(new Blob([mermaid], { type: "text/javascript" })) : "";
    snapshotFrame = write(snapshotFrame, themed(vertexLogs.snapshotHtml(message.snapshot, asset, "blob:")));
    snapshotFrame.hidden = false;
    report.hidden = true;
    bar.hidden = false;
  }
  if (message.action === "openObject") {
    var object = vertexLogs.objectReference(message.object);
    if (!object.path && !object.object_name) { throw new Error("This log names no object that can be opened."); }
    await call("sdeLogsOpen", JSON.stringify(object));
  }
  if (message.action === "openRecording") {
    // Eclipse keeps no transpiler runs and records no SAP debug sessions; their recordings open in VS Code.
    throw new Error("Recorded runs and debug sessions open in VS Code: Eclipse has no viewer for them.");
  }
}
window.vertexLogsMessage = function (message) {
  if (!message) { return; }
  handle(message).catch(function (error) { tell({ action: "error", error: error.message }); });
};
document.getElementById("back").onclick = function () {
  snapshotFrame.hidden = true;
  bar.hidden = true;
  report.hidden = false;
};

if (!window.vertexLogs) { say("VERTEX: the log reading did not load into this window."); }
else {
  var key = nonce();
  report = write(report, themed(String(REPORT).split("{{NONCE}}").join(key)
    .replace("var vscode = acquireVsCodeApi();", "var vscode = { postMessage: function (m) { parent.vertexLogsMessage(m); } };")));
}
</script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><style>
/* Visual Debug: the source with its breakpoints, where the program stands,
   and every variable at once - the picture of Smart Debugger, drawn from the
   ADT debugger the assistant drives. Every colour comes from the theme. */
body{margin:0;background:var(--vscode-editor-background,Canvas);color:var(--vscode-editor-foreground,CanvasText);font:13px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit;background:var(--vscode-input-background,Field);border:1px solid var(--vscode-input-border,var(--vscode-panel-border,GrayText));padding:2px 6px}
/* Buttons and switches as chips, as in Versions: a switch that is on carries
   a lit lower edge and a soft glow in the theme's accent colour. */
button{--accent:var(--vscode-focusBorder,#0a66c2);cursor:pointer;padding:1px 8px;border-radius:6px;white-space:nowrap;border:none;
  border-bottom:2px solid transparent;background:var(--vscode-input-background,Field);color:var(--vscode-descriptionForeground,GrayText);
  transition:color .12s,box-shadow .12s,border-color .12s}
button:hover:not(:disabled){color:var(--vscode-editor-foreground,CanvasText)}
button.on{color:var(--vscode-editor-foreground,CanvasText);border-bottom-color:var(--accent);box-shadow:0 3px 8px -3px var(--accent)}
button:disabled{opacity:.45;cursor:default}
/* The two that end something - the program or the whole session - stand out. */
#terminate,#stop{color:var(--vscode-errorForeground,#c72e0f);--accent:var(--vscode-errorForeground,#c72e0f)}
#terminate:hover:not(:disabled),#stop:hover:not(:disabled){color:var(--vscode-errorForeground,#c72e0f);border-bottom-color:var(--accent)}
header{flex:none;padding:6px 8px;border-bottom:1px solid var(--vscode-panel-border,GrayText);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#title{font-weight:600;margin-right:6px}
#program{width:150px;font-family:var(--vscode-editor-font-family,monospace)}
#state{color:var(--vscode-descriptionForeground,GrayText);margin-left:6px}
#notice{flex:none;padding:4px 8px;display:none;color:var(--vscode-errorForeground,red);border-bottom:1px solid var(--vscode-panel-border,GrayText);white-space:pre-wrap}
#notice.on{display:block}
main{flex:1;display:flex;min-height:0}
#left{flex:1;display:flex;flex-direction:column;min-width:200px}
#codehead{flex:none;padding:3px 8px;border-bottom:1px solid var(--vscode-panel-border,GrayText);display:flex;gap:8px;align-items:center;color:var(--vscode-descriptionForeground,GrayText)}
#codehead b{color:var(--vscode-editor-foreground,CanvasText);font-family:var(--vscode-editor-font-family,monospace);font-weight:600}
#code{flex:1;overflow:auto;margin:0;font:13px var(--vscode-editor-font-family,monospace);tab-size:2}
.line{display:flex;white-space:pre;min-height:1.3em;line-height:1.3em}
.gut{flex:none;width:14px;margin-right:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
.gut:hover::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--vscode-debugIcon-breakpointForeground,#e51400);opacity:.35}
.bp .gut::after,.bp .gut:hover::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--vscode-debugIcon-breakpointForeground,#e51400);opacity:1}
.bp.cond .gut::after{border-radius:2px}
.bp.off .gut::after,.bp.off .gut:hover::after{background:transparent;border:2px solid var(--vscode-debugIcon-breakpointDisabledForeground,#848484);width:6px;height:6px}
#bps .row.off{opacity:.6}
.bp.log .gut::after{background:transparent;border:2px solid var(--vscode-debugIcon-breakpointForeground,#e51400);width:6px;height:6px}
.no{flex:none;width:3.2em;text-align:right;padding-right:2px;user-select:none;color:var(--vscode-editorLineNumber-foreground,GrayText)}
.txt{flex:1}
.line.here{background:var(--vscode-editor-stackFrameHighlightBackground,rgba(255,200,0,.25))}
.line.here .no{color:var(--vscode-editorLineNumber-activeForeground,CanvasText);font-weight:600}
.line.here .no::before{content:"\25B6 ";color:var(--vscode-debugIcon-continueForeground,#d9a400)}
.kw{color:var(--vscode-debugTokenExpression-name,Highlight)}
.str{color:var(--vscode-debugTokenExpression-string,DarkOliveGreen)}
.com{color:var(--vscode-editorLineNumber-foreground,GrayText);font-style:italic}
.split{flex:none;width:3px;cursor:col-resize;background:var(--vscode-panel-border,GrayText)}
.split:hover,.split.drag{background:var(--vscode-sash-hoverBorder,Highlight)}
body.drag{cursor:col-resize;user-select:none}
#right{width:420px;flex:none;display:flex;flex-direction:column;min-width:220px;overflow:hidden}
section{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--vscode-panel-border,GrayText)}
section h3{margin:0;padding:4px 8px;font-size:12px;font-weight:600;background:var(--vscode-sideBar-background,var(--vscode-editor-background,Canvas));display:flex;gap:6px;align-items:center;user-select:none}
/* A bar folds its section to the bar itself; the room goes to the others. */
section h3 .grow{flex:1}
section h3 label{font-weight:400;display:flex;gap:3px;align-items:center}
.list{overflow:auto;font-family:var(--vscode-editor-font-family,monospace)}
#stack,#bps,#vars,#logbox{flex:1;min-height:0}
#run,#into,#over,#out,#cont{display:inline-flex;align-items:center;gap:5px}
svg.dbg{width:16px;height:16px;flex:none}
#run svg.clock{width:15px;height:15px;flex:none}
table.stack{width:100%}
table.stack td.callers{color:var(--vscode-descriptionForeground,GrayText);font-style:italic}
table.stack td{cursor:pointer;overflow:hidden;text-overflow:ellipsis;max-width:220px}
table.stack tr.on td{background:var(--vscode-list-activeSelectionBackground,Highlight);color:var(--vscode-list-activeSelectionForeground,HighlightText)}

.row{padding:1px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.row:hover{background:var(--vscode-list-hoverBackground,Highlight)}
.row.on{background:var(--vscode-list-activeSelectionBackground,Highlight);color:var(--vscode-list-activeSelectionForeground,HighlightText)}
.row .x{margin-left:auto;padding:0 4px}
button.x{background:transparent;border:0}
.row .dim{color:var(--vscode-descriptionForeground,GrayText)}
.empty{padding:4px 8px;color:var(--vscode-descriptionForeground,GrayText);font-family:system-ui,sans-serif}
#filter{width:110px}
table.vars{border-collapse:collapse;width:100%;table-layout:fixed}
table.vars td{padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--vscode-editorWidget-background,transparent)}
table.vars td.n{width:45%}
table.vars td.t{width:22%;color:var(--vscode-descriptionForeground,GrayText)}
table.vars tr.grp td{font-weight:600;background:var(--vscode-editorWidget-background,var(--vscode-editor-background,Canvas));font-family:system-ui,sans-serif}
table.vars tr:hover td{background:var(--vscode-list-hoverBackground,Highlight)}
.tw{display:inline-block;width:12px;cursor:pointer;user-select:none}
.changed{color:var(--vscode-debugTokenExpression-error,var(--vscode-errorForeground,red));font-weight:600}
.tlink{text-decoration:underline;cursor:pointer}
.vis{display:inline-block;width:7px;height:7px;margin-right:4px}
.vis.public{background:#2e9e44}.vis.protected{background:#d9a400;transform:rotate(45deg)}.vis.private{background:#d33a2c;border-radius:50%}
#grids{flex:none;height:0;display:flex;flex-direction:column;border-top:1px solid var(--vscode-panel-border,GrayText)}
#grids.on{height:34%}
#gridtabs{flex:none;display:flex;gap:2px;padding:2px 4px;background:var(--vscode-sideBar-background,var(--vscode-editor-background,Canvas));overflow-x:auto}
#gridtabs .tab{padding:1px 8px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
#gridtabs .tab.on{border-color:var(--vscode-panel-border,GrayText);background:var(--vscode-editor-background,Canvas)}
#gridbody{flex:1;overflow:auto}
table.grid{border-collapse:collapse;font-family:var(--vscode-editor-font-family,monospace)}
table.grid th,table.grid td{border:1px solid var(--vscode-panel-border,GrayText);padding:1px 6px;white-space:nowrap;text-align:left}
table.grid th{position:sticky;top:0;background:var(--vscode-editorWidget-background,var(--vscode-editor-background,Canvas))}
#code .id{cursor:default}
#tip{position:fixed;z-index:6;display:none;max-width:480px;padding:4px 8px;white-space:pre;overflow:hidden;font:12px var(--vscode-editor-font-family,monospace);background:var(--vscode-editorHoverWidget-background,var(--vscode-editorWidget-background,Canvas));color:var(--vscode-editorHoverWidget-foreground,var(--vscode-editor-foreground,CanvasText));border:1px solid var(--vscode-editorHoverWidget-border,var(--vscode-panel-border,GrayText));pointer-events:none}
#tip.on{display:block}
#tip:has(table){max-width:min(900px,90vw)}
#tip table.grid{margin-top:3px;font-size:12px}
#tip table.grid th{position:static}
#tip .tiphead{font-weight:600}
#tip .tipmore{margin-top:2px;color:var(--vscode-descriptionForeground,GrayText)}
#flowpane{display:flex;flex-direction:column;min-height:0}
#right [hidden]{display:none!important}
#panes{flex:none;display:flex;gap:4px;flex-wrap:wrap;padding:4px 6px;border-bottom:1px solid var(--vscode-panel-border,GrayText);background:var(--vscode-sideBar-background,var(--vscode-editor-background,Canvas))}
.hsplit{flex:none;height:4px;cursor:row-resize;background:var(--vscode-panel-border,GrayText)}
.hsplit:hover,.hsplit.drag{background:var(--vscode-sash-hoverBorder,Highlight)}
body.vdrag{cursor:row-resize;user-select:none}
#logsec .logbar{padding:4px 6px}
#flowbar{flex:none;display:flex;gap:4px;padding:2px 4px;background:var(--vscode-sideBar-background,var(--vscode-editor-background,Canvas))}
#flowbar .grow{flex:1}
#flowbar{align-items:center}
#fzoom{min-width:3.5em;text-align:center;color:var(--vscode-descriptionForeground,GrayText);font-family:var(--vscode-editor-font-family,monospace)}
#flowsvg svg g.node.vx-now>rect,#flowsvg svg g.node.vx-now>polygon{fill:#66bb6a!important;stroke:#2e7d32!important;stroke-width:2px!important}
#flowsvg svg g.node.vx-again>rect,#flowsvg svg g.node.vx-again>polygon{fill:#2e7d32!important;stroke:#1b5e20!important;stroke-width:4px!important}
#flowsvg svg g.node.vx-again text,#flowsvg svg g.node.vx-again tspan{fill:#fff!important}
#flowsvg g.std text,#flowsvg g.std tspan{fill:#1e88e5!important}
#fspeed{background:var(--vscode-dropdown-background,Canvas);color:var(--vscode-dropdown-foreground,CanvasText);border:1px solid var(--vscode-dropdown-border,GrayText)}
#fslide{width:120px;accent-color:var(--vscode-focusBorder,#2e7d32)}
#flowsvg g.node{cursor:pointer}
#flowpane.full{position:fixed;inset:0;height:auto;z-index:7}
#flowsvg{flex:1;overflow:auto;padding:8px;background:var(--vscode-editor-background,Canvas)}
.logbar{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.logbar input{width:260px;font-family:var(--vscode-editor-font-family,monospace)}
#logcount{color:var(--vscode-descriptionForeground,GrayText)}
table.grid.log td:nth-child(3),table.grid.log td:nth-child(4){max-width:320px;overflow:hidden;text-overflow:ellipsis}
#why{flex-basis:100%;font:11px var(--vscode-editor-font-family,monospace);color:var(--vscode-descriptionForeground,GrayText);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#why:empty{display:none}
#stats{font-family:var(--vscode-editor-font-family,monospace);color:var(--vscode-descriptionForeground,GrayText)}
#partial{font-weight:400;color:var(--vscode-descriptionForeground,GrayText);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#bpedit{position:fixed;z-index:5;display:none;padding:8px;background:var(--vscode-editorWidget-background,var(--vscode-editor-background,Canvas));border:1px solid var(--vscode-editorWidget-border,var(--vscode-panel-border,GrayText));box-shadow:0 2px 8px var(--vscode-widget-shadow,rgba(0,0,0,.3));font-family:system-ui,sans-serif}
#bpedit.on{display:flex;flex-direction:column;gap:6px}
#bpedit input{width:300px;font-family:var(--vscode-editor-font-family,monospace)}
#bpedit .btns{display:flex;gap:6px;justify-content:flex-end}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-button{display:none}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{border-radius:4px;background:var(--vscode-scrollbarSlider-background,rgba(128,128,128,.4))}
::-webkit-scrollbar-thumb:hover{background:var(--vscode-scrollbarSlider-hoverBackground,rgba(128,128,128,.6))}
</style></head><body>
<header>
  <button id="run" title="Start the program in SAP (WebGUI) - the breakpoints catch it there"><svg class="clock" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#fff" stroke="#3a3a3a" stroke-width="1.2"/><path d="M8 3.8V8l2.6 1.6" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-linecap="round"/><path d="M9.2 12.2l1.8 1.8 3.6-4" fill="none" stroke="#2e9e3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Run in SAP</button>
  <input id="program" placeholder="Program, or empty for a test" title="A class or a function module is not run by itself: name the program that calls it, started in WebGUI" spellcheck="false">
  <span id="title">Visual Debug</span>
  <button id="into" title="Single Step (F5)" disabled><svg class="dbg" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h6M9 6h6M9 9h6M9 12h6" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M2 2v8h5" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 8l2 2-2 2" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Single Step</span></button>
  <button id="over" title="Execute (F6)" disabled><svg class="dbg" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h6M9 6h6M9 9h6M9 12h6" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M2 2v11h5" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11l2 2-2 2" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Execute</span></button>
  <button id="out" title="Return (F7)" disabled><svg class="dbg" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h6M9 6h6M9 9h6M9 12h6" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M3 14V4h4" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 2l2 2-2 2" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Return</span></button>
  <button id="cont" title="Continue to the next breakpoint (F8)" disabled><svg class="dbg" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h6M9 6h6M9 9h6M9 12h6" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M4 1.5v12" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11.5l2 2 2-2" fill="none" stroke="#d93025" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Continue</span></button>
  <button id="zonly" class="on" title="In a Visual run, a step that lands outside Z/Y code returns at once (F7): SAP's own code is passed in one go">Z only</button>
  <button id="flow" title="Continue (F8) from call to call, recording which routine calls which - the program's real flow, drawn as a diagram">Flow</button>
  <button id="visual"title="Continue (F8) as a run of F5 steps, drawn as it goes, without reading variables - and how long a step takes">Visual</button>
  <button id="rec" title="Record every stop while on - F5-F8 here, the assistant, a breakpoint; Continue then steps as Visual does and draws nothing until the run ends. The player replays the record">Rec</button>
  <span id="stats" title="Steps of the Visual run: time over steps; SAP is the step request alone"></span>
  <button id="terminate" title="End the program here, as the debugger's Exit does; the breakpoints stay for the next run" disabled>Exit program</button>
  <button id="stop" title="Let the program go and stop listening; the breakpoints stay here for the next run">Detach</button>
  <span id="state">Click beside a line number to set a breakpoint; right-click for a condition.</span>
  <div id="why"></div>
</header>
<div id="notice"></div>
<main>
  <div id="left">
    <div id="codehead"><span>Source</span><b id="shownname"></b><button id="home" hidden title="Back to the object's own source">Object source</button></div>
    <pre id="code"></pre>
    <div id="grids"><div id="gridtabs"></div><div id="gridbody"></div></div>
  </div>
  <div class="split" id="split" title="Drag to resize"></div>
  <div id="right">
    <div id="panes" title="Show or hide a section; drag the line between two sections to resize them">
      <button data-pane="stacksec" class="on">Stack</button><button data-pane="bpsec" class="on">Breakpoints</button><button data-pane="varsec" class="on">Variables</button><button data-pane="flowpane">Diagram</button><button data-pane="logsec">Log</button>
    </div>
    <section id="stacksec"><h3>Stack<span id="depth" class="dim"></span></h3><div class="list" id="stack"></div></section>
    <section id="bpsec"><h3><span>Breakpoints</span><span class="grow"></span><button id="bpall" title="Turn every breakpoint off, or on again, keeping them">Deactivate all</button><button id="bpclear" title="Remove every breakpoint, here and in SAP">Clear all</button></h3><div class="list" id="bps"></div></section>
    <section id="varsec"><h3><span>Variables</span><span id="partial" class="dim"></span><span class="grow"></span>
      <button id="globals" class="on" title="Read the global variables">Globals</button>
      <button id="locals" class="on" title="Read the local variables">Locals</button>
      <button id="params" class="on" title="Read the parameters">Params</button>
      <button id="syst" title="Show the system fields SY">SYST</button>
      <button id="initials" title="Show variables with an initial value">Initials</button>
      <input id="filter" placeholder="Filter" spellcheck="false"></h3>
      <div class="list" id="vars"></div></section>
    <div id="flowpane" hidden><div id="flowbar"><button id="fclasses" class="on">Classes</button><button id="fmethods">Methods</button><button id="ffirst" title="The first recorded stop">&#9198;</button><button id="fprev" title="One stop back in the recorded run">&#9664;</button><input type="range" id="fslide" min="1" max="1" value="1" title="Any recorded stop"><span id="fpos" class="dim"></span><button id="fnext" title="One stop forward; past the last one the chart is live again">&#9654;</button><button id="flast" title="The last stop - where the program is now">&#9197;</button><button id="fplay" title="Replay the recorded run as fast as the chart draws">&#9205;</button><select id="fspeed" title="Replay speed, stops per second"><option value="1">1/s</option><option value="2">2/s</option><option value="3" selected>3/s</option><option value="5">5/s</option><option value="10">10/s</option><option value="0">max</option></select><span class="grow"></span><button id="fzout" title="Smaller (Ctrl + wheel)">&#8722;</button><span id="fzoom">100%</span><button id="fzin" title="Larger (Ctrl + wheel)">+</button><button id="ffit" title="Fit the diagram into the pane">Fit</button><button id="ffull" title="The whole window (Esc to leave)">&#10530;</button><button id="fclose" class="x" title="Hide the diagram">&#215;</button></div><div id="flowsvg"></div></div>
    <section id="logsec" hidden><h3>Log</h3><div id="logbox" class="list"></div></section>
  </div>
</main>
<div id="tip"></div>
<div id="bpedit">
  <div id="bpwhere"></div>
  <input id="bpcond" placeholder="Condition, as an ABAP IF: lv_total > 1000" spellcheck="false">
  <label><select id="bpmode"><option value="stop">stop - the program waits</option><option value="log">log - record and run on</option></select></label>
  <div class="btns"><button id="bpremove">Remove</button><button id="bponoff">Deactivate</button><button id="bpcancel">Cancel</button><button id="bpok">Set</button></div>
</div>
<script>
var INITIAL=/*INIT*/null/*INIT*/;
var $=function(id){return document.getElementById(id);};
/* ---------- talking to the host: one answer per request, in order ---------- */
var waiting=[];
function sdeReady(){var raw=sdeTake(),cb=waiting.shift();if(!cb)return;if(String(raw).indexOf("ERROR:")===0){cb.fail(new Error(String(raw).slice(6)));return;}if(cb.raw){cb.ok(raw);return;}var data;try{data=JSON.parse(raw);}catch(e){cb.fail(e);return;}cb.ok(data);}
function ask(send){return new Promise(function(ok,fail){waiting.push({ok:ok,fail:fail});send();});}
function debug(command,args){if(typeof sdeDebug!=="function")return Promise.reject(new Error("Visual Debug needs the VS Code host."));return ask(function(){sdeDebug(command,args||{});});}
function notice(text){var n=$("notice");n.textContent=text||"";n.classList.toggle("on",!!text);}
function failed(error){notice(error&&error.message||String(error));}

/* ---------- state ---------- */
var object={url:"",lines:[],name:INITIAL&&INITIAL.name||"",type:INITIAL&&INITIAL.type||""};
var shown={url:"",lines:[],name:""};
var picture={breakpoints:[],stopped:null,listening:false,ended:0};
var stopKey="",lastEnded=null,previous={},current={},expanded={},scopes=null;
var norm=function(url){return String(url||"").split("#")[0].toLowerCase();};

/* ---------- the source ---------- */

function paint(node,text){

  var re=/("[^\n]*$)|('(?:[^']|'')*'|`[^`]*`|\|[^|]*\|)|([A-Za-z][A-Za-z0-9_-]*)/g,at=0,m;
  while((m=re.exec(text))){

    if(m[1])s.className="com";else if(m[2])s.className="str";else if(KW.test(m[3]))s.className="kw";
    else{s.className="id";s.dataset.name=m[3].replace(/-+$/,"").toUpperCase();}

/* Sources already drawn, the last few, kept whole: going back to one - as a
   run does between a caller and a callee all the time - only puts it back. */
var drawn=new Map();
function drawSource(){
  var code=$("code"),key=norm(shown.url),box=drawn.get(key);
  $("shownname").textContent=shown.name;
  $("home").hidden=!object.url||norm(shown.url)===norm(object.url);
  drawn.delete(key);

  // its text had come is drawn again once it has.
  if(!box||box.drawnFrom!==shown.lines){box=document.createElement("div");fill(box);box.drawnFrom=shown.lines;}
  if(!shown.lines.length){drawn.delete(key);if(code.firstChild!==box){code.textContent="";code.appendChild(box);}markSource();return;}
  drawn.set(key,box);
  while(drawn.size>6)drawn.delete(drawn.keys().next().value);

function fill(code){

    row.oncontextmenu=function(e){e.preventDefault();edit(n,e.clientX,e.clientY);};

/* Breakpoints and the current line, on the rows already drawn. */

/* Show the source at a URL - the object's, or where the program stands. */
function show(url,name,line){
  // The same source - a class's methods share one: only the name above it changes.
  if(norm(url)===norm(shown.url)){if(name){shown.name=name;$("shownname").textContent=name;}markSource();if(line)scrollTo(line);return Promise.resolve();}
  if(norm(url)===norm(object.url)){shown={url:object.url,lines:object.lines,name:object.name};drawSource();if(line)scrollTo(line);return Promise.resolve();}
  // A source read before is not read again.

  return debug("source",{url:url}).then(function(d){shown={url:url,lines:String(d.source||"").split(/\r?\n/),name:name||url};texts[norm(url)]=shown.lines;drawSource();if(line)scrollTo(line);});

/* ---------- hover: the value of a name in the source, while stopped ---------- */
var hoverTimer=0,hoverName="";
/* A value already in the tree, by its path as the source writes it: LS_NEW-PRICE. */
function known(name){
  var parts=name.split("-"),list=[];
  (scopes&&scopes.groups||[]).forEach(function(g){list=list.concat(g.children||[]);});
  var v=list.filter(function(x){return String(x.name).toUpperCase()===parts[0];})[0];
  for(var i=1;v&&i<parts.length;i++){var inside=expanded[v.id];if(!inside)return null;v=inside.filter(function(x){return String(x.name).toUpperCase()===parts[i];})[0];}
  return v&&(v.meta==="simple"||v.meta==="string")?v:null;
}

/* A table or a structure on hover: a small grid with its column names, as

/* ---------- a type as the source declares it ---------- */
/* SAP names an anonymous type \TYPE=%_T0000..., which says nothing. The
   declaration in the source says what the editor says: p LENGTH 8 DECIMALS 2. */
function declaration(name,owner){
  var lines=shown.lines.concat(norm(shown.url)===norm(object.url)?[]:object.lines),text=lines.join("\n");
  var esc=function(s){return String(s).replace(/[\\^$.*+?()[\]{}|\/]/g,"\\$&");};
  if(owner){
    var block=new RegExp("BEGIN\\s+OF\\s+"+esc(owner)+"\\s*,([\\s\\S]*?)END\\s+OF\\s+"+esc(owner)+"\\b","i").exec(text);
    if(block){var c=new RegExp("(?:^|[,\\s])"+esc(name)+"\\s+(TYPE|LIKE)\\s+([^,.]+)","i").exec(block[1]);if(c)return (c[1].toUpperCase()==="LIKE"?"LIKE ":"")+c[2].trim().replace(/\s+/g," ");}
    return "";
  }
  var d=new RegExp("(?:^|[\\s:,(])"+esc(name)+"\\s+(TYPE|LIKE)\\s+([^,.]+)","im").exec(text);
  return d?(d[1].toUpperCase()==="LIKE"?"LIKE ":"")+d[2].trim().replace(/\s+/g," "):"";
}
function shownType(type,technical,name,owner){
  if(!/^\\?TYPE=%_/i.test(String(type||"")))return type||technical||"";
  return declaration(String(name||"").split("-").pop(),owner)||technical||type;

/* The stack as SAP's debugger shows it: a table, the deepest level on top,
   numbered by depth. */
/* How many frames at the bottom are the caller's, not the object's: SE37 or
   SE24 test frames, the screen that started it. The object's outermost frame
   is found by the frame's own fields - the function module by its name, a
   class by its pool, a program by its name. Nothing found: nothing hidden. */
var showCaller=false;
function callerFrames(frames){
  var name=String(INITIAL&&INITIAL.name||"").toUpperCase(),type=String(INITIAL&&INITIAL.type||"").toUpperCase();
  for(var i=frames.length-1;i>=0;i--){var f=frames[i],prog=String(f.program||"").toUpperCase();
    var ours=type==="FUNC"?String(f.unitType).toUpperCase()==="FUNCTION"&&String(f.unit).toUpperCase()===name
      :type==="CLAS"?prog.replace(/=+CP$/,"")===name:prog===name;
    if(ours)return frames.length-1-i;}
  return 0;
}
function shownDepth(frames){return frames.length-(showCaller?0:callerFrames(frames));}
function stackTable(frames,on,click){
  var table=document.createElement("table");table.className="grid stack";
  var head=document.createElement("tr");["#","Event type","Event","Program","Include","Line"].forEach(function(t){var th=document.createElement("th");th.textContent=t;head.appendChild(th);});table.appendChild(head);
  var hide=showCaller?0:callerFrames(frames);
  frames.forEach(function(f,i){
    if(i>=frames.length-hide)return;
    var tr=document.createElement("tr");if(i===on)tr.className="on";
    // With the caller's frames hidden, depth counts from the object: its own frame is 1.
    [frames.length-i-hide,f.unitType,f.unit,f.program,f.include===f.program?"":f.include,f.line].forEach(function(v){var td=document.createElement("td");td.textContent=v==null?"":v;td.title=f.label||"";tr.appendChild(td);});
    if(click)tr.onclick=function(){click(f);};
    table.appendChild(tr);
  });

  if(below){var tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=6;td.className="callers";
    td.textContent=showCaller?"hide the "+below+" caller frames":below+" caller frames hidden (test frame, screen) - show";
    td.onclick=function(){showCaller=!showCaller;drawStack(replayAt!=null&&flow.timeline&&flow.timeline[replayAt]?flow.timeline[replayAt].stack:undefined);};
    tr.appendChild(td);table.appendChild(tr);}
  return table;
}

  if(!s){box.innerHTML='<div class="empty">'+(picture.listening?"Listening - start the program and it stops at a breakpoint.":"Not running.")+'</div>';return;}
  var cur=currentFrame();

}

/* Where a step started: the next stop reads again only what that statement

var lastStep=null;

/* In SAP's own code with our code below it on the stack - however it got
   there: Z only goes back out (F7) until it stands in our code again. */
function strayed(frames){
  var top=frames&&frames[0];
  return !!top&&!top.system&&!customer(top.program)&&frames.slice(1).some(function(f){return customer(f.program);});
}
/* Out of SAP's code back into ours in one go. F7 leaves one level only, and
   a standard call can be many deep - constructors, class constructors, one
   under another. So the nearest Z/Y frame below is taken, points are set on
   every statement of its routine, its end included, and F8 runs to the first
   the program reaches after the call returns: F6 as seen from our code.
   Without a map for that frame, F7. Sets lastMove for the log. */
function backToOurs(frames){
  var top=frames[0],ours=null;
  for(var i=1;i<frames.length;i++){if(customer(frames[i].program)){ours=frames[i];break;}}
  var out=function(why){lastMove={action:"outside Z/Y: F7",from:String(top.label),detail:why};return debug("step",{kind:"out",quick:true});};
  if(!ours)return out("no Z/Y frame below "+top.program);
  return mapFor(ours.program).then(function(map){return methodsFor(ours).then(function(){return map;});}).then(function(map){
    var list=map&&listFor(ours,map),at=-1,lines=[];
    if(list)for(var j=0;j<list.length;j++){if(list[j].line===ours.line){at=j;break;}}
    if(at<0)return out("top "+top.program+" is not Z/Y; no map for "+ours.label+" below it");
    var r=routine(list,at);
    for(var k=r.from+1;k<=r.to;k++){if(list[k].kind!=="decl"&&lines.indexOf(list[k].line)<0)lines.push(list[k].line);}
    if(!lines.length)return out("top "+top.program+" is not Z/Y; nothing to stop at in "+ours.label);
    lastMove={action:"back to "+ours.label+": F8",from:String(top.label),detail:"top "+top.program+" is not Z/Y; points on "+lines.join(", ")};
    return debug("runTo",{url:ours.url,lines:lines}).then(function(x){return x.placed?x:out("points not placed in "+ours.label);});
  });

/* Customer code: a program, class pool or function group of the Z/Y namespace. */
function customer(program){return /^(?:SAPL|SAPM|SAPD)?[ZY]/i.test(String(program||""));}

/* ---------- the statement map: stepping without asking for the stack ---------- */
/* ACE's map of a program, per include: where each statement starts and ends
   and its kind. From a plain statement to the next plain one the program
   cannot go anywhere else, so that line is taken without the stack; every
   other step asks SAP. A map that cannot be had means asking every time. */
var maps={};

    document.querySelectorAll("#code .line.here").forEach(function(r){r.classList.remove("here");});
    var h=$("l"+t.at.line);if(h)h.classList.add("here");});
}
function replay(i){var n=stops();if(!n)return;replayAt=i>=n-1?null:Math.max(0,i);drawPos();
  if(replayAt==null){markNow(liveCur());drawStack();drawVars();var f=currentFrame();if(f)show(f.url,null,f.line).catch(failed);}else showStop(replayAt).catch(failed);}
$("fprev").onclick=function(){if(playing)return;replay((replayAt==null?stops()-1:replayAt)-1);};
$("fnext").onclick=function(){if(playing||replayAt==null)return;replay(replayAt+1);};
$("ffirst").onclick=function(){if(!playing)replay(0);};
$("flast").onclick=function(){if(!playing)replay(stops()-1);};
$("fslide").oninput=function(){if(!playing)replay(+this.value-1);};
$("fplay").onclick=function(){
  if(playing){playing.stop=true;return;}
  var n=stops();if(!n)return;
  if(shapeOf()!==flowShape){showFlow();return;}
  playing={ms:0,frames:0,stop:false};var at=replayAt==null||replayAt>=n-1?0:replayAt,last=Date.now();
  // Source and block per stop, one per animation frame: ms/frame is what the
  // window takes to show a stop. The chart itself is not drawn again.
  function frame(){
    if(playing.stop||at>=n){var p=playing;playing=null;if(!p.stop)replay(n-1);else drawPos();return;}
    replayAt=at;
    var t0=Date.now();
    showStop(at).then(function(){playing.ms+=Date.now()-t0;playing.frames++;at++;drawPos();
      // The chosen pace, kept on animation frames: timers in the Tools
      // window's frame are slowed down, animation frames are not.
      var per=+$("fspeed").value,due=t0+(per?1000/per:0);
      (function wait(){if(playing&&!playing.stop&&Date.now()<due){requestAnimationFrame(wait);return;}frame();})();},
      function(e){playing=null;drawPos();failed(e);});
  }
  frame();
};
/* A standard block the run stepped over: its source here. The record names
   it but not its kind, so SAP is asked for a class, a function module and a
   program in turn; none of them found is said, not passed over. */
function tlHas(key,byOwner){return (flow.timeline||[]).some(function(t){return t.cur&&(byOwner?t.cur.owner:t.cur.name)===key;});}
function standardSource(name){
  var kinds=["CLAS","FUNC","PROG"],tried=[];
  function next(){
    var k=kinds.shift();
    if(!k)return Promise.reject(new Error(name+" was not found as "+tried.join(", ")+"."));
    tried.push(k);
    return ask(function(){sdeSource(name,k);}).catch(function(){return null;}).then(function(d){
      if(!d||!d.source_url)return next();
      return debug("source",{url:d.source_url}).then(function(r){texts[norm(d.source_url)]=String(r.source||"").split(/\r?\n/);return show(d.source_url,d.object_name||name,1);});
    });
  }
  notice("");return next().catch(failed);
}
/* A click on a block: the player goes to the next stop in that routine (or
   class), its source shown here. A standard block the run did not enter
   shows its source instead. */
$("flowsvg").addEventListener("click",function(e){
  var g=e.target.closest&&e.target.closest("g.node");if(!g)return;
  var id=/flowchart-(n\d+)-/.exec(g.id||"");if(!id)return;
  var key=Object.keys(flowIds).filter(function(k){return flowIds[k]===id[1];})[0];if(!key)return;
  var byOwner=flowMode==="classes",units=Object.keys(flow.nodes).map(function(k){return flow.nodes[k];})
    .filter(function(u){return byOwner?u.owner===key:u.name===key;});
  if(!units.length)return;
  if(!customer(units[0].owner)&&!tlHas(key,byOwner)){standardSource(units[0].owner);return;}
  var tl=flow.timeline||[],n=tl.length;if(!n||playing)return;
  var from=replayAt==null?-1:replayAt;
  for(var k=1;k<=n;k++){var i=(from+k)%n,c=tl[i].cur;
    // An entry: the routine is on top here and was not at the stop before.
    if(c&&(byOwner?c.owner:c.name)===key&&!(i>0&&tl[i-1].cur&&(byOwner?tl[i-1].cur.owner:tl[i-1].cur.name)===key)){replay(i===n-1?n-1:i);return;}}
});
$("fclose").onclick=function(){setPane("flowpane",false);};

/* A Visual run is ended first, then the debugger is asked. */
function halted(){if(!series)return Promise.resolve();series.stop=true;series.quiet=true;return series.done||Promise.resolve();}
$("stop").onclick=function(){notice("");flow.closed=true;steplog.closed=true;halted().then(function(){return debug("detach");}).then(refresh).catch(failed);};
$("terminate").onclick=function(){notice("");flow.closed=true;steplog.closed=true;halted().then(function(){return debug("terminate");}).then(refresh).catch(failed);};
$("run").onclick=function(){
  var p=$("program").hidden?String(INITIAL.name):$("program").value.trim();
  // An empty field for a class or a function module: its own test screen,
  // SE24 or SE37 with the name filled in; the test is started there with F8.
  if(!p){notice("");debug("run",{program:INITIAL.name,test:INITIAL.type}).then(function(){
    $("state").textContent="Opened "+(String(INITIAL.type).toUpperCase()==="FUNC"?"SE37":"SE24")+" in the browser - log on if asked, then start the test with F8.";}).catch(failed);return;}
  notice("");debug("run",{program:p}).then(function(){$("state").textContent="Opened in the browser - log on if asked, the program starts after that.";}).catch(failed);
};

/* ---------- variables ---------- */
function initial(v){
  if(v.meta==="table")return !v.lines;
  if(v.meta!=="simple"&&v.meta!=="string")return false;
  var t=String(v.value).trim();
  return t===""||/^0+([.,]0+)?-?$/.test(t);
}
/* Which switch a group of SAP's answers to; a group it does not name is always read. */
function groupKind(name){var n=String(name);return /^glob/i.test(n)?"globals":/^param/i.test(n)?"params":/^loc/i.test(n)?"locals":"";}
function groupOn(g){var k=groupKind(g.name);return !k||$(k).classList.contains("on");}
function loadScopes(){
  $("partial").textContent="";
  var withSy=$("syst").classList.contains("on");
  return debug("scopes",{sy:withSy}).then(function(d){
    scopes=d;current={};
    var groups=d.groups.filter(groupOn);
    return groups.reduce(function(p,g){return p.then(function(){return debug("children",{id:g.id}).then(function(c){g.children=c.children;});});},Promise.resolve())
      .then(function(){
        // What was open before stays open, read again at the new stop -
        // only under a group that is read.
        var roots={};groups.forEach(function(g){(g.children||[]).forEach(function(v){roots[String(v.id).toUpperCase()]=true;});});
        if(d.sy)roots.SY=true;
        Object.keys(expanded).forEach(function(id){if(!roots[String(id).split(/-|\[/)[0].toUpperCase()])delete expanded[id];});
        var open=Object.keys(expanded);
        return open.reduce(function(p,id){return p.then(function(){return debug("children",{id:id}).then(function(c){expanded[id]=c.children;}).catch(function(){delete expanded[id];});});},Promise.resolve());
      });
  }).then(drawVars);
}
function drawVars(){
  var box=$("vars");box.textContent="";
  if(!picture.stopped||!scopes){box.innerHTML='<div class="empty">The variables show when the program stops.</div>';return;}
  var filter=$("filter").value.trim().toUpperCase(),showInitials=$("initials").classList.contains("on");
  var table=document.createElement("table");table.className="vars";
  function row(v,depth,owner){
    var key=v.id;current[key]=v.value;
    if(!showInitials&&initial(v))return;
    if(depth===0&&filter&&String(v.name).toUpperCase().indexOf(filter)<0)return;
    var tr=document.createElement("tr"),n=document.createElement("td"),t=document.createElement("td"),val=document.createElement("td");
    n.className="n";t.className="t";n.style.paddingLeft=(6+depth*14)+"px";
    var open=["structure","object","objectref","dataref","class","boxref"].indexOf(v.meta)>=0;
    var tw=document.createElement("span");tw.className="tw";
    if(open){tw.textContent=expanded[key]?"▾":"▸";tw.onclick=function(){if(expanded[key]){delete expanded[key];drawVars();}else debug("children",{id:key}).then(function(c){expanded[key]=c.children;drawVars();}).catch(failed);};}
    n.appendChild(tw);
    if(v.access){var mark=document.createElement("span");mark.className="vis "+v.access;mark.title=v.access;n.appendChild(mark);}
    n.appendChild(document.createTextNode(v.name));n.title=v.name;
    var type=shownType(v.type,v.technical,v.name,owner);t.textContent=type;t.title=type;
    if(v.meta==="table"){var a=document.createElement("span");a.className="tlink";a.textContent=v.value;a.title="Open the rows";a.onclick=function(){openGrid(v);};val.appendChild(a);}
    else{val.textContent=v.value;val.title=v.value;}
    if(Object.prototype.hasOwnProperty.call(previous,key)&&previous[key]!==v.value)val.classList.add("changed");
    tr.appendChild(n);tr.appendChild(t);tr.appendChild(val);table.appendChild(tr);
    if(open&&expanded[key])expanded[key].forEach(function(c){row(c,depth+1,v.meta==="structure"?v.type:"");});
  }
  // Parameters and locals are those of the routine the program stands in.
  var f=currentFrame(),unit=f?String(f.label).replace(/^\S+\s*/,"").replace(/^EVENT\s+/i,""):"";
  function heading(name){return /^(PARAMETERS|LOCALS)$/i.test(name)&&unit?name+" · "+unit:name;}
  function group(name,list){
    var tr=document.createElement("tr");tr.className="grp";var td=document.createElement("td");td.colSpan=3;td.textContent=name;tr.appendChild(td);table.appendChild(tr);
    (list||[]).forEach(function(v){row(v,0);});
  }
  scopes.groups.forEach(function(g){if(groupOn(g)&&g.children)group(heading(g.name),g.children);});
  if(scopes.sy&&$("syst").classList.contains("on"))group("SY",[scopes.sy]);
  // Every group switched off: say so, rather than show a panel that looks broken.
  if(!table.rows.length){box.innerHTML='<div class="empty">Nothing is read: Globals, Locals, Params and SYST are switched off.</div>';return;}
  box.appendChild(table);
}
$("initials").onclick=function(){$("initials").classList.toggle("on");drawVars();};
/* A switch turned on reads its part now; turned off, it is not read at the next stops. */
function switched(id,read){$(id).onclick=function(){var on=$(id).classList.toggle("on");
  if(!on||!scopes||!picture.stopped||series){drawVars();return;}
  read().then(drawVars).catch(failed);};}
switched("syst",function(){return scopes.sy?Promise.resolve():debug("vars",{names:["SY"]}).then(function(d){scopes.sy=d.variables[0]||null;});});
["globals","locals","params"].forEach(function(kind){switched(kind,function(){
  return scopes.groups.filter(function(g){return groupKind(g.name)===kind&&!g.children;}).reduce(function(p,g){return p.then(function(){return debug("children",{id:g.id}).then(function(c){g.children=c.children;});});},Promise.resolve());});});$("filter").oninput=drawVars;

/* ---------- table grids, as many as are opened ---------- */
var grids=[],gridOn=null;
function openGrid(v){
  // One tab per table: SAP may give the same table another ID at the next stop.
  var have=grids.filter(function(g){return g.id===v.id||String(g.name).toUpperCase()===String(v.name).toUpperCase();})[0];
  if(have){gridOn=have;drawGrids();return;}
  debug("rows",{id:v.id,from:1,to:100}).then(function(d){var g={id:v.id,name:v.name,data:d};grids.push(g);gridOn=g;drawGrids();}).catch(failed);
}
function drawGrids(){
  var box=$("grids"),tabs=$("gridtabs"),body=$("gridbody");
  box.classList.toggle("on",grids.length>0);tabs.textContent="";body.textContent="";
  grids.forEach(function(g){
    var t=document.createElement("span");t.className="tab"+(g===gridOn?" on":"");t.textContent=g.name+" ("+g.data.rows+")";
    t.onclick=function(){gridOn=g;drawGrids();};
    var x=document.createElement("button");x.className="x";x.textContent="×";x.style.border="0";x.title="Close";
    x.onclick=function(e){e.stopPropagation();grids.splice(grids.indexOf(g),1);if(gridOn===g)gridOn=grids[0]||null;drawGrids();};
    t.appendChild(x);tabs.appendChild(t);
  });
  if(!gridOn)return;
  var d=gridOn.data,rows=d.shown||[],first=d.from||1;
  var cols=[];rows.forEach(function(r){if(r&&typeof r==="object")Object.keys(r).forEach(function(k){if(cols.indexOf(k)<0)cols.push(k);});});
  var table=document.createElement("table");table.className="grid";
  var head=document.createElement("tr");["#"].concat(cols.length?cols:["VALUE"]).forEach(function(c){var th=document.createElement("th");th.textContent=c;head.appendChild(th);});table.appendChild(head);
  rows.forEach(function(r,i){var tr=document.createElement("tr"),no=document.createElement("td");no.textContent=first+i;tr.appendChild(no);
    (cols.length?cols.map(function(c){return r[c];}):[r]).forEach(function(value){var td=document.createElement("td");td.textContent=value==null?"":String(value);tr.appendChild(td);});table.appendChild(tr);});
  body.appendChild(table);
  var last=first+rows.length-1;
  if(last<d.rows){var more=document.createElement("button");more.textContent="Next rows from "+(last+1)+" of "+d.rows;
    var g=gridOn;more.onclick=function(){debug("rows",{id:g.id,from:last+1,to:last+100}).then(function(n){g.data=n;drawGrids();}).catch(failed);};body.appendChild(more);}
}
/* A new stop: the rows of the open grids are those of before. Read them again. */
function refreshGrids(){
  return grids.reduce(function(p,g){return p.then(function(){return debug("rows",{id:g.id,from:g.data.from||1,to:(g.data.from||1)+99}).then(function(d){g.data=d;}).catch(function(){grids.splice(grids.indexOf(g),1);});});},Promise.resolve()).then(drawGrids);
}

/* ---------- the picture ---------- */
function apply(p){
  picture=p;
  // Rec is for every stop, whoever made it: F5-F8 here, the assistant, a
  // breakpoint. A Flow or Rec run records its own stops.
  if(p.stopped&&$("rec").classList.contains("on")&&!(series&&(series.flow||series.rec)))recordStop(p);
  drawBreakpoints();drawStack();drawButtons();
  if(lastEnded!==null&&p.ended>lastEnded)notice("The program ended.");
  lastEnded=p.ended;
  var f=currentFrame(),key=p.stopped?p.stopped.at+"|"+(f?f.n:""):"";
  if(key===stopKey){markSource();return;}
  stopKey=key;
  if(!p.stopped){scopes=null;lastStep=null;markSource();drawVars();return;}
  var name=f?String(f.label).split(" ")[0].split(":")[0]:"";
  // A Visual run shows the line the program stands on, and reads nothing else.
  if(series){show(f.url,name,f.line).catch(failed);return;}
  previous=current;
  var from=lastStep;lastStep=null;
  var statement=from&&from.kind!=="continue"&&scopes&&from.depth===p.stopped.frames.length&&from.unit===unitName(f)?statementAt(from.url,from.line):null;
  var read=statement!==null&&!isCall(statement)?function(){return readNamed(namesIn(statement));}:loadScopes;
  show(f.url,name,f.line).then(read).then(refreshGrids).catch(failed);
}

/* ---------- reading again only what a statement named ---------- */
/* ADT does not say what a step changed. A plain statement can change only
   what it names, so that is read again; a call, a step out of the routine or
   a Continue may change anything, and everything switched on is read. */
function statementAt(url,line){
  var lines=norm(url)===norm(shown.url)?shown.lines:norm(url)===norm(object.url)?object.lines:null;
  if(!lines)return null;
  var out=[];
  for(var i=line-1;i<lines.length&&i<line+19;i++){
    var code=String(lines[i]||"");if(/^\*/.test(code))continue;
    code=code.replace(/"[^\n]*$/,"");out.push(code);
    if(/\.\s*$/.test(code.replace(/'(?:[^']|'')*'|`[^`]*`|\|[^|]*\|/g,"")))break;
  }
  return out.join("\n");
}
function isCall(statement){
  var code=statement.replace(/'(?:[^']|'')*'|`[^`]*`|\|[^|]*\|/g,"''");
  return /\b(?:PERFORM|CALL|SUBMIT|RAISE|NEW|LEAVE)\b|\bSET\s+HANDLER\b|->|=>|[A-Za-z0-9_)]\(/i.test(code);
}
function namesIn(statement){
  var code=statement.replace(/'(?:[^']|'')*'|`[^`]*`|\|[^|]*\|/g," "),seen={},out=[],m,re=/<[A-Za-z0-9_]+>|[A-Za-z_][A-Za-z0-9_]*(?:-[A-Za-z0-9_]+)*/g;
  while((m=re.exec(code))){var root=m[0].split("-")[0].toUpperCase();if(!KW.test(root)&&!seen[root]){seen[root]=true;out.push(root);}}
  return out;
}
function readNamed(names){
  var groups=(scopes.groups||[]).filter(function(g){return g.children;});
  // The name as the program sees it: a local or a parameter hides a global.
  var order=groups.slice().sort(function(a,b){return (groupKind(a.name)==="globals")-(groupKind(b.name)==="globals");});
  var wanted=names.filter(function(n){return order.some(function(g){return g.children.some(function(v){return String(v.name).toUpperCase()===n;});});});
  if($("syst").classList.contains("on")&&scopes.sy)wanted.push("SY");
  var done=wanted.length?debug("vars",{names:wanted}):Promise.resolve({variables:[]});
  return done.then(function(d){
    d.variables.forEach(function(v){
      var key=String(v.name).toUpperCase();
      if(key==="SY"){scopes.sy=v;return;}
      for(var i=0;i<order.length;i++){var at=order[i].children.findIndex(function(x){return String(x.name).toUpperCase()===key;});if(at>=0){order[i].children[at]=v;return;}}
    });
    var open=Object.keys(expanded).filter(function(id){return wanted.indexOf(String(id).split(/-|\[/)[0].toUpperCase())>=0;});
    return open.reduce(function(p,id){return p.then(function(){return debug("children",{id:id}).then(function(c){expanded[id]=c.children;}).catch(function(){delete expanded[id];});});},Promise.resolve());
  }).then(function(){$("partial").textContent=" · read again: "+(wanted.length?wanted.join(", "):"nothing named here");drawVars();});
}
function refresh(){return debug("picture").then(apply);}
// During a Visual run the run draws each stop itself; the same stop told
// again by the debugger would be drawn twice.
function sdeDebugEvent(raw){if(series)return;try{apply(JSON.parse(raw));}catch(e){failed(e);}}

/* ---------- the window's parts list: jump to the unit in the object ---------- */
var partWaiting=null;
function sdeSelectPart(part){
  if(!part||!part.key)return;
  // Chosen before the object's source has come: done once it has.
  if(!object.lines.length){partWaiting=part;return;}
  var key=String(part.key).toUpperCase().replace(/\s+/g," ").trim(),re=new RegExp("^\\s*(?:METHOD|FORM|MODULE|FUNCTION)\\s+"+key.replace(/[\\^$.*+?()[\]{}|\/]/g,"\\$&")+"\\b","i");
  // An event is its statement as written, compared as View source compares
  // it: without a comment, the closing period or extra blanks.
  var bare=function(text){return String(text).replace(/".*$/,"").trim().replace(/\.$/,"").replace(/\s+/g," ").trim().toUpperCase();};
  show(object.url,object.name).then(function(){
    for(var i=0;i<shown.lines.length;i++){if(re.test(shown.lines[i])||bare(shown.lines[i])===key){scrollTo(i+1);return;}}
    notice("Not found in the source: "+part.key);
  }).catch(failed);
}
/* What the assistant is told this window shows. */
function sdeContext(){var s=picture.stopped;return {type:object.type,name:object.name,view:"visual debug",part:null,stopped_at:s?s.at:null,source_shown:shown.name||null};}
function sdeSelection(){var s=window.getSelection&&window.getSelection(),t=s?String(s.toString()):"";return t?{text:t.slice(0,12000),view:sdeContext()}:null;}

/* ---------- the resize line ---------- */
$("split").addEventListener("mousedown",function(e){if(e.button!==0)return;e.preventDefault();var right=$("right"),sp=e.currentTarget,x0=e.clientX,w0=right.getBoundingClientRect().width;sp.classList.add("drag");document.body.classList.add("drag");
  function move(ev){right.style.width=Math.max(220,Math.min(window.innerWidth-240,w0-(ev.clientX-x0)))+"px";}
  function up(){sp.classList.remove("drag");document.body.classList.remove("drag");document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);}
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);});

/* ---------- start: the object's active source, then the debugger as it is ---------- */
(function(){
  if(!INITIAL||!INITIAL.name)return;
  $("title").textContent=INITIAL.name+" · Visual Debug";
  // A program runs itself; only a class or a function module needs the program that calls it.
  if(String(INITIAL.type).toUpperCase()==="PROG")$("program").hidden=true;
  ask(function(){sdeSource(INITIAL.name,INITIAL.type);}).then(function(d){
    object.url=d.source_url;object.name=d.object_name||INITIAL.name;
    // The lines a breakpoint counts are those of the active version.
    return debug("source",{url:object.url});
  }).then(function(d){
    object.lines=String(d.source||"").split(/\r?\n/);texts[norm(object.url)]=object.lines;
    shown={url:object.url,lines:object.lines,name:object.name};drawSource();
    if(partWaiting||INITIAL.part){var chosen=partWaiting||INITIAL.part;partWaiting=null;sdeSelectPart(chosen);}
    return refresh();
  }).catch(failed);
})();
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:24px;background:var(--vscode-editor-background,Canvas);color:var(--vscode-editor-foreground,CanvasText);font:13px var(--vscode-font-family,system-ui,sans-serif)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}h1{font-size:18px;font-weight:600;margin:0;flex:1}
input[type=search]{width:min(320px,40vw);padding:6px 8px;color:var(--vscode-input-foreground,var(--vscode-foreground));background:var(--vscode-input-background,var(--vscode-editor-background));border:1px solid var(--vscode-input-border,var(--vscode-panel-border));border-radius:3px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--vscode-descriptionForeground);font-weight:600}th,td{padding:9px 10px;border-bottom:1px solid var(--vscode-panel-border,var(--vscode-editorWidget-border,GrayText))}tr[data-key]{cursor:pointer}tr[data-key]:hover td,tr[data-key]:focus td{background:var(--vscode-list-hoverBackground,transparent)}
.actions{display:flex;gap:4px;justify-content:flex-end}button{width:28px;height:28px;padding:3px;color:var(--vscode-descriptionForeground,var(--vscode-foreground));background:transparent;border:1px solid transparent;border-radius:3px;cursor:pointer;font:inherit}button:hover,button:focus-visible{color:var(--vscode-foreground);background:var(--vscode-toolbar-hoverBackground,var(--vscode-list-hoverBackground));border-color:var(--vscode-panel-border,transparent)}button:focus-visible,tr[data-key]:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:-1px}
.toolbar{width:auto;padding:3px 8px;border-color:var(--vscode-panel-border);background:var(--vscode-button-secondaryBackground);color:var(--vscode-button-secondaryForeground)}button:disabled{opacity:.5;cursor:default}input[type=checkbox]{accent-color:var(--vscode-focusBorder)}
#empty{padding:24px;color:var(--vscode-descriptionForeground)}.count{color:var(--vscode-descriptionForeground);white-space:nowrap}
</style></head><body>
<header><h1>SAP &amp; Transpiler Logs</h1><span id="count" class="count"></span><input id="filter" type="search" placeholder="Filter by program, type or date" aria-label="Filter execution recordings"><button id="refresh" class="toolbar">Refresh</button><button id="delete-selected" class="toolbar" disabled>Delete selected recordings</button></header>
<table><thead><tr><th></th><th>Date &amp; time</th><th>Type</th><th>Program</th><th>Steps</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<div id="empty" hidden>No matching execution recordings. SAP debug recordings and available transpiler runs appear here.</div>
<script>
const vscode=acquireVsCodeApi();let runs=[],selected=new Set();
const date=value=>{const parsed=new Date(value);return Number.isNaN(parsed.getTime())?String(value||""):parsed.toLocaleString();};
const selectionChanged=()=>{document.getElementById("delete-selected").disabled=selected.size===0;};
function button(label,action,key){const element=document.createElement("button");element.textContent=label;element.title=action==="rename"?"Rename session":"Delete recording";element.setAttribute("aria-label",element.title);element.onclick=event=>{event.stopPropagation();vscode.postMessage({action,key});};return element;}
function cell(text){const element=document.createElement("td");element.textContent=text;return element;}
function draw(){const wanted=document.getElementById("filter").value.trim().toLowerCase(),rows=document.getElementById("rows");rows.textContent="";const shown=runs.filter(run=>(run.name+" "+run.created+" "+(run.kind==="sap"?"SAP debug":"transpiler")).toLowerCase().includes(wanted));
  document.getElementById("count").textContent=runs.length+" recording"+(runs.length===1?"":"s");document.getElementById("empty").hidden=shown.length>0;
  shown.forEach(run=>{const row=document.createElement("tr");row.dataset.key=run.key;row.tabIndex=0;row.setAttribute("role","button");row.setAttribute("aria-label","Open recording for "+run.name);const open=()=>vscode.postMessage({action:"open",key:run.key});row.onclick=open;row.onkeydown=event=>{if(event.target===row&&(event.key==="Enter"||event.key===" ")){event.preventDefault();open();}};
    const choose=cell(""),check=document.createElement("input");check.type="checkbox";check.checked=selected.has(run.key);check.setAttribute("aria-label","Select recording "+run.name);check.onclick=event=>event.stopPropagation();check.onchange=()=>{if(check.checked)selected.add(run.key);else selected.delete(run.key);selectionChanged();};choose.append(check);
    const actions=cell(""),group=document.createElement("div");group.className="actions";if(run.kind==="sap")group.append(button("✎","rename",run.key));group.append(button("🗑","delete",run.key));actions.append(group);
    row.append(choose,cell(date(run.created)),cell(run.kind==="sap"?"SAP debug":"Transpiler"+(run.saved?"":" (this session)")),cell(run.name),cell(String(run.steps)),actions);rows.append(row);});}
document.getElementById("filter").addEventListener("input",draw);
document.getElementById("refresh").onclick=()=>vscode.postMessage({action:"refresh"});
document.getElementById("delete-selected").onclick=()=>vscode.postMessage({action:"deleteSelected",keys:Array.from(selected)});
window.addEventListener("message",event=>{if(event.data.type==="runs"){runs=event.data.runs||[];selected=new Set([...selected].filter(key=>runs.some(run=>run.key===key)));selectionChanged();draw();}});
vscode.postMessage({action:"ready"});
</script></body></html>

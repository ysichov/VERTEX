source.. = src/
output.. = bin/

# What the EXPORT compiles with. It does not read the project's JDT settings:
# left to itself it takes the target from whichever JRE the workspace bound to
# the JavaSE-21 execution environment, and on an Eclipse carrying only a newer
# one that lands at 26 against a compliance of 21. The export then refuses to
# compile and still writes a jar - resources, no classes.
javacSource = 21
javacTarget = 21
bin.includes = META-INF/,\
               .,\
               plugin.xml,\
               resources/,\
               assistant/

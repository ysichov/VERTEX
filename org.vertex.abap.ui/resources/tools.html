<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VERTEX Tools</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:var(--vscode-editor-background,Canvas);color:var(--vscode-editor-foreground,CanvasText);font:13px "Segoe UI",sans-serif}
#chat{width:30%;min-width:260px;flex:none;overflow:hidden;display:none;flex-direction:column}
#chat.open{display:flex}
#chat .chat-bar{display:flex;align-items:center;padding:4px 4px 4px 10px;border-bottom:1px solid #8886;font-weight:600}
#chat .chat-bar span{margin-right:auto}
#chat-close{border:0;background:transparent;padding:2px 7px;cursor:pointer;font-size:15px;line-height:1}
#chat-close:hover{background:var(--vscode-toolbar-hoverBackground,#8883)}
#chat iframe{flex:1;height:auto;min-height:0}
#chat-split{display:none;flex:none;width:3px;cursor:col-resize;border-left:1px solid #8886}
#chat.open+#chat-split{display:block}
#chat-split:hover,#chat-split.dragging{background:var(--vscode-sash-hoverBorder,Highlight)}
body.dragging{cursor:col-resize;user-select:none}body.dragging iframe{pointer-events:none}
#chat-toggle.on{color:var(--vscode-button-foreground,HighlightText);background:var(--vscode-button-background,Highlight)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border-bottom:1px solid #8886;align-items:center}
input,select,button{font:inherit;padding:5px;color:var(--vscode-input-foreground,var(--vscode-editor-foreground,#d4d4d4));background:var(--vscode-input-background,var(--vscode-editor-background,#1e1e1e));border:1px solid #8888}
select option{color:var(--vscode-input-foreground,var(--vscode-editor-foreground,#d4d4d4));background:var(--vscode-input-background,var(--vscode-editor-background,#1e1e1e))}
#object-field{position:relative;flex:0 1 380px;min-width:150px}
#object-matches{display:none;position:absolute;left:0;right:0;top:100%;z-index:20;max-height:320px;overflow:auto;background:var(--vscode-editorSuggestWidget-background,var(--vscode-input-background,Canvas));border:1px solid var(--vscode-editorSuggestWidget-border,#8888)}
#object-matches.on{display:block}
#object-matches div{padding:3px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#object-matches div.sel,#object-matches div:hover{color:var(--vscode-list-activeSelectionForeground,HighlightText);background:var(--vscode-list-activeSelectionBackground,Highlight)}
#object-matches small{opacity:.7;margin-left:8px}
#find-requests{display:none;position:absolute;right:1px;top:1px;bottom:1px;width:30px;padding:5px;border:0;background:transparent;cursor:pointer}
#find-requests:hover{background:var(--vscode-toolbar-hoverBackground,#8883)}
#find-requests:focus-visible{outline:1px solid var(--vscode-focusBorder,Highlight);outline-offset:-2px}
#find-requests svg{width:14px;height:14px;vertical-align:middle}
dialog{color:var(--vscode-foreground,CanvasText);background:var(--vscode-editor-background,Canvas);border:1px solid var(--vscode-panel-border,#8888);padding:16px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:8px 0}
#object-name{width:100%;padding-right:34px;text-transform:uppercase}iframe{border:0;width:100%;height:100%;display:block}
#object-type{min-width:150px}#function{min-width:100px}
#work{flex:1;min-height:0;display:flex}
#results{flex:1;min-width:0;min-height:0;position:relative}
/* The parts of the object, owned by the window: switching the function leaves
   them as they are, selection included. */
#tparts{flex:none;width:260px;overflow:auto;border-right:1px solid #8886;display:none;font-size:12px}
#tparts.shown{display:block}#tparts.folded{width:26px!important;overflow:hidden}
#tparts .head{display:flex;align-items:center;padding:5px 4px 5px 10px;font-weight:600;border-bottom:1px solid #8886;position:sticky;top:0;background:var(--vscode-sideBar-background,var(--vscode-editor-background,Canvas));z-index:1}
#tparts .head span{margin-right:auto}#tparts .head button{padding:0 6px;border:0;background:transparent;cursor:pointer}
#tparts.folded .head{flex-direction:column;padding:5px 0;gap:6px}#tparts.folded .head span{writing-mode:vertical-rl;margin:0}
#tparts.folded .object,#tparts.folded table{display:none}
#tparts .object{padding:5px 10px;font-weight:600;font-family:var(--vscode-editor-font-family,Consolas,monospace);border-bottom:1px solid #8886;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tparts table{border-collapse:collapse;width:100%;table-layout:fixed}
#tparts td{padding:3px 6px;border-bottom:1px solid #8883;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tparts td.vis{width:14px;padding-right:0}#tparts td.kind{width:52px;font-family:var(--vscode-editor-font-family,Consolas,monospace)}
#tparts tr.group td{font-weight:600}#tparts tr.pick{cursor:pointer}
#tparts tr.pick:hover td{background:var(--vscode-list-hoverBackground,#8882)}
#tparts tr.on td{background:var(--vscode-list-activeSelectionBackground,Highlight);color:var(--vscode-list-activeSelectionForeground,inherit);font-weight:600}
#tparts .mark{display:inline-block;width:8px;height:8px}
#tparts .mark.public{background:#2e9e44}#tparts .mark.protected{background:#d9a400;width:7px;height:7px;transform:rotate(45deg)}#tparts .mark.private{background:#d33a2c;border-radius:50%}
#tsplit{flex:none;width:3px;cursor:col-resize;display:none}#tparts.shown:not(.folded)+#tsplit{display:block}
#tsplit:hover,#tsplit.dragging{background:var(--vscode-sash-hoverBorder,Highlight)}#results iframe{position:absolute;inset:0;display:none}#results iframe.active{display:block}#notice{padding:8px;white-space:pre-wrap}#notice:empty{display:none}

/* Thin scrollbars in the theme's own colours instead of the engine's wide default. */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-button { display: none; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { border-radius: 4px; background: var(--vscode-scrollbarSlider-background, rgba(128, 128, 128, .4)); }
::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-hoverBackground, rgba(128, 128, 128, .6)); }
::-webkit-scrollbar-thumb:active { background: var(--vscode-scrollbarSlider-activeBackground, rgba(128, 128, 128, .8)); }
</style></head><body>
<aside id="chat" aria-label="Assistant"><div class="chat-bar"><span>Ask AI</span><button id="chat-close" title="Hide the assistant" aria-label="Hide the assistant">&#x2715;</button></div><iframe id="conversation" title="VERTEX assistant"></iframe></aside><div id="chat-split" title="Drag to resize the assistant"></div>
<main><header>
<button id="chat-toggle" title="Show or hide the assistant" aria-expanded="false">Ask AI</button>
<button id="back" title="Back to the previous VERTEX source" hidden>← Back</button>
<select id="object-type" aria-label="Object type"></select>
<div id="object-field"><input id="object-name" placeholder="Object name or mask: Z_VX*" aria-label="Object name" title="Enter an object name and press Enter; a name with * or + lists what matches" spellcheck="false"><button id="find-requests" type="button" title="Find transport requests" aria-label="Find transport requests"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><path d="m10 10 4 4"/></svg></button><div id="object-matches" role="listbox"></div></div>
<select id="function" aria-label="Function"></select>
</header><div id="notice" role="status"></div><div id="work"><aside id="tparts" aria-label="Parts"></aside><div id="tsplit" title="Drag to resize the parts"></div><div id="results" aria-label="Function result"></div></div></main>
<dialog id="request-dialog"><form method="dialog"><strong>Find transport requests</strong>
<label>User (empty = current user)<input id="request-user" autocomplete="username" placeholder="Current SAP user"></label>
<label><input type="checkbox" id="request-released"> Include released requests</label>
<menu><button value="cancel">Cancel</button><button id="request-find" value="find">Find</button></menu>
</form></dialog>
<script>
/*OBJECT_MODEL*/
/*TOOL_ROUTES*/
const bundle = /*BUNDLE*/{};
const initial = /*INIT*/null/*INIT*/;
let current = VertexObjects.normalize(initial || {});
let sequence = 0, activeRequest = null, queue = [], assistantTarget = null, navigation = [];
const typeBox = document.getElementById("object-type"), nameBox = document.getElementById("object-name");
const actionBox = document.getElementById("function"), results = document.getElementById("results");
let result = null;
const resultFrames = new Map();
const findButton = document.getElementById("find-requests"), requestDialog = document.getElementById("request-dialog");
const chat = document.getElementById("chat"), chatToggle = document.getElementById("chat-toggle");
const backButton=document.getElementById("back");
function showChat(open){chat.classList.toggle("open",open);chatToggle.classList.toggle("on",open);chatToggle.setAttribute("aria-expanded",String(open));}
chatToggle.onclick=()=>showChat(!chat.classList.contains("open"));
document.getElementById("chat-close").onclick=()=>showChat(false);
// The line between the assistant and the result, dragged to share the width.
// Frames swallow mouse moves, so they ignore the pointer while it is held.
document.getElementById("chat-split").addEventListener("mousedown",e=>{
  if(e.button!==0)return;e.preventDefault();
  const split=e.currentTarget,startX=e.clientX,startWidth=chat.getBoundingClientRect().width,room=document.body.getBoundingClientRect().width;
  split.classList.add("dragging");document.body.classList.add("dragging");
  const move=ev=>{chat.style.width=Math.max(260,Math.min(room-300,startWidth+ev.clientX-startX))+"px";};
  const up=()=>{split.classList.remove("dragging");document.body.classList.remove("dragging");document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);};
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
});
function notice(text){document.getElementById("notice").textContent=text;}
VertexObjects.objects.forEach(o=>typeBox.add(new Option(o[1],o[0])));
function fields(){
  typeBox.value=current.type; nameBox.value=current.name; actionBox.replaceChildren();
  VertexObjects.objects.find(o=>o[0]===current.type)[2].forEach(a=>actionBox.add(new Option(VertexObjects.labels[a],a)));
  actionBox.value=current.action;
  findButton.style.display = current.type === "TR" ? "inline-block" : "none";
}
/* A part a navigation named, waiting for the object's list to arrive. */
let pendingPart="";
function navigate(value,remember){
  try{if(remember!==false&&current.name)navigation.push(Object.assign({},current));current=VertexObjects.normalize(value);
    if(current.part)choosePart(current.part);backButton.hidden=!navigation.length;fields();if(current.name) run();}
  catch(e){notice(e.message);}
}
backButton.onclick=()=>{const previous=navigation.pop();if(previous)navigate(previous,false);backButton.hidden=!navigation.length;};
/* ---------- the parts, one list for every function ---------- */

// Which objects have parts, and which functions show the window's list.
// Diff keeps its own: parts and the versions under them are one column there,
// AVE's layout. It is still told which part is chosen, and tells back.
const PART_TYPES=["CLAS","INTF","PROG","INCL","FUNC","DEVC"];
const PART_ACTIONS=["view","vdebug","scheme","flow","metrics","uml"];
let partsFor="",partsList=[],selectedPart=null,partsFolded=false;

/* The one name every page knows a part by: the method, form or event as it
   is written, in capitals, without its class. Sections go by their type. */
function partKey(value){
  let text=String(value||"").toUpperCase();
  const at=text.lastIndexOf("=>");if(at>=0)text=text.slice(at+2);
  return text.replace(/\s+/g," ").replace(/\.$/,"").trim();
}
const SECTION_OF={CPUB:"public",CPRO:"protected",CPRI:"private"};
/* A class or interface: the parts its version history has - sections,
   methods with their visibility, local includes - as SE80 groups them. */
function classParts(data){
  const rows=[],parts=data.parts||[];
  ["public","protected","private"].forEach(section=>{
    const type={public:"CPUB",protected:"CPRO",private:"CPRI"}[section];
    const head=parts.find(p=>p.part_type===type);
    const members=parts.filter(p=>p.part_type==="METH"&&p.section===section);
    if(!head&&!members.length)return;
    rows.push({group:true,section,type,label:{public:"Public section",protected:"Protected section",private:"Private section"}[section],
      part:head?{key:type,type,name:{public:"Public section",protected:"Protected section",private:"Private section"}[section],vrsd:{name:head.name,part_type:head.part_type}}:null});
    members.forEach(m=>rows.push({section,part:{key:partKey(m.unit),type:"METH",name:String(m.unit||"").toLowerCase(),vrsd:{name:m.name,part_type:m.part_type}}}));
  });
  parts.filter(p=>!SECTION_OF[p.part_type]&&!(p.part_type==="METH"&&p.section)).forEach(p=>
    rows.push({part:{key:partKey(p.part_type==="METH"?p.unit:p.name),type:p.part_type,name:String(p.unit||p.name||""),vrsd:{name:p.name,part_type:p.part_type}}}));
  return rows;
}
/* A program: its events, forms and local methods, as ACE parses them. */
function programParts(data){
  return (data.units||[]).map(u=>{
    const type=/^(method|meth)$/i.test(u.unit_type||"")?"METH":String(u.unit_type||"").toUpperCase().slice(0,5);
    return {part:{key:partKey(u.unit_name),type,name:String(u.unit_name||""),include:u.include}};
  });
}
function renderTools(){
  const box=document.getElementById("tparts");
  box.textContent="";
  const head=document.createElement("div");head.className="head";
  const title=document.createElement("span");title.textContent="Parts";head.appendChild(title);
  const fold=document.createElement("button");fold.innerHTML=partsFolded?"&#8250;":"&#8249;";
  fold.title=partsFolded?"Show the parts":"Hide the parts";
  fold.onclick=()=>{partsFolded=!partsFolded;box.classList.toggle("folded",partsFolded);renderTools();};
  head.appendChild(fold);box.appendChild(head);
  const object=document.createElement("div");object.className="object";object.textContent=current.name;box.appendChild(object);
  const table=document.createElement("table"),body=document.createElement("tbody");
  partsList.forEach(row=>{
    const tr=document.createElement("tr");
    const p=row.part;
    tr.className=(row.group?"group ":"")+(p?"pick":"")+(p&&selectedPart&&p.key===selectedPart.key?" on":"");
    if(p){tr.dataset.key=p.key;tr.onclick=()=>pickPart(p);}
    const vis=document.createElement("td");vis.className="vis";
    if(row.section){const mark=document.createElement("span");mark.className="mark "+row.section;vis.appendChild(mark);}
    const kind=document.createElement("td");kind.className="kind";kind.textContent=row.group?row.type:(p?p.type:"");
    const name=document.createElement("td");name.textContent=row.group?row.label:(p?p.name:"");
    tr.append(vis,kind,name);body.appendChild(tr);
  });
  table.appendChild(body);box.appendChild(table);
}
/* Select a part by name - now if the list is there, when it arrives if not. */
function choosePart(name){
  const key=partKey(name);
  const row=partsList.find(r=>r.part&&r.part.key===key);
  if(row&&partsFor===current.type+":"+current.name){selectedPart=row.part;markPart(key);}
  else pendingPart=key;
}
function markPart(key){
  document.querySelectorAll("#tparts tr.pick").forEach(tr=>tr.classList.toggle("on",tr.dataset.key===key));
}
/* A click in the list: the function on screen follows it, nothing is drawn
   again. */
function pickPart(p){
  selectedPart=p;markPart(p.key);
  if(result&&result.contentWindow&&typeof result.contentWindow.sdeSelectPart==="function"){
    result.dataset.part=p.key;result.contentWindow.sdeSelectPart(p);
  }
}
/* A page chose a part itself - its first one, say. The list follows it. */
function partShown(key){
  const row=partsList.find(r=>r.part&&r.part.key===key);
  if(!row)return;
  selectedPart=row.part;markPart(key);
  if(result)result.dataset.part=key;
}
function showsParts(state){
  // A package's parts are its objects, a list only View source walks through.
  if(String(state.type||"").toUpperCase()==="DEVC"&&state.action!=="view")return false;
  return PART_TYPES.includes(String(state.type||"").toUpperCase())&&PART_ACTIONS.includes(state.action)&&!!state.name;
}
/* Read once per object: another function of the same object keeps the list. */
function loadParts(state,then){
  const identity=state.type+":"+state.name;
  const box=document.getElementById("tparts");
  // Read for every function of an object that has parts - Diff too, which
  // hides the list but still reports and follows the choice.
  // A function module shows the list only when it has local FORMs after it.
  box.classList.toggle("shown",showsParts(state)&&String(state.type).toUpperCase()!=="FUNC");
  if(!PART_TYPES.includes(String(state.type||"").toUpperCase())||!state.name){then();return;}
  if(partsFor===identity){then();return;}
  partsFor=identity;partsList=[];selectedPart=null;renderTools();
  // A class and a package both come from the version resource: a class's
  // sections and methods, a package's objects.
  const klass=["CLAS","INTF","DEVC"].includes(String(state.type).toUpperCase());
  const path=klass?VertexRoutes.SERVICES.versions.load([state.name,state.type,"","","",""])
                  :VertexRoutes.SERVICES.metrics.load([state.name,state.type]);
  enqueue({path,body:null},raw=>{
    if(partsFor!==identity)return;
    try{
      if(typeof raw!=="string"||raw.indexOf("ERROR:")===0)throw new Error(String(raw).substring(6));
      const data=JSON.parse(raw);
      partsList=klass?classParts(data):programParts(data);
    }catch(e){partsList=[];notice("The parts could not be read: "+e.message);}
    if(String(state.type).toUpperCase()==="FUNC")box.classList.toggle("shown",showsParts(state)&&partsList.some(r=>r.part&&r.part.type==="FORM"));
    if(pendingPart){const row=partsList.find(r=>r.part&&r.part.key===pendingPart);if(row)selectedPart=row.part;pendingPart="";}
    renderTools();then();
  },()=>partsFor===identity);
}

function run(){
  try{current=VertexObjects.normalize({type:typeBox.value,name:nameBox.value,action:actionBox.value});}
  catch(e){notice(e.message);return;}
  if(!current.name){notice("Enter an object name.");return;}
  notice(""); fields();
  // Visual Debug is a VS Code page: only that host puts it in the bundle.
  const service=current.action==="view"?"source":current.action==="vdebug"?"debug":["data","join","pivot"].includes(current.action)?"table":
    ["diff","review"].includes(current.action)?"versions":"metrics";
  const state=current;
  loadParts(state,()=>{if(current===state)mount(service,state);});
}
document.getElementById("tsplit").addEventListener("mousedown",e=>{
  if(e.button!==0)return;e.preventDefault();
  const box=document.getElementById("tparts"),split=e.currentTarget,startX=e.clientX,startWidth=box.getBoundingClientRect().width;
  split.classList.add("dragging");document.body.classList.add("dragging");
  const move=ev=>{box.style.width=Math.max(140,Math.min(700,startWidth+ev.clientX-startX))+"px";};
  const up=()=>{split.classList.remove("dragging");document.body.classList.remove("dragging");document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);};
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
});
function findRequests(){
  const user=document.getElementById("request-user").value.trim();
  const released=document.getElementById("request-released").checked ? "true" : "";
  // A finder has no selected request yet. Start Versions, not Review: Review
  // would otherwise ask the host for /review/ with an empty request number.
  current={type:"TR",name:"",action:"diff"}; fields();
  mount("versions",current,()=>sdeRequestSearch(user,released));
}
function mount(service,state,afterLoad){
  const key=service+":"+state.action;
  let frame=resultFrames.get(key);
  const identity=state.type+":"+state.name;
  if(frame&&frame.dataset.identity===identity){
    showFrame(frame);
    // The page kept its own choice while hidden; the list may have moved on.
    if(selectedPart&&frame.dataset.part!==selectedPart.key&&typeof frame.contentWindow.sdeSelectPart==="function"){
      frame.dataset.part=selectedPart.key;frame.contentWindow.sdeSelectPart(selectedPart);
    }
    if(afterLoad)afterLoad();return;}
  if(!frame){frame=document.createElement("iframe");frame.title="Function result";resultFrames.set(key,frame);results.appendChild(frame);}
  frame.dataset.identity=identity;
  const generation=++sequence;
  frame.dataset.generation=String(generation);
  let source=bundle[service];
  const withParts=showsParts(state)&&service!=="table";
  const carry=PART_TYPES.includes(String(state.type||"").toUpperCase())&&service!=="table"&&!!selectedPart;
  frame.dataset.part=selectedPart?selectedPart.key:"";
  const init=service==="table"?state.name:Object.assign({},state,carry?{part:selectedPart}:{},withParts?{partsOutside:true}:{});
  source=source.replace(["/*INIT*/","null","/*INIT*/"].join(""),()=>JSON.stringify(init).replace(/</g,"\\u003c"));
  const bootstrap="<script>parent.connect(window,"+JSON.stringify(service)+","+generation+");<"+"/script>";
  // The window's list stands in for each page's own, so a page drawn beside
  // it hides its parts - the versions of Diff stay, they are not parts.
  const ownParts=!withParts?"":service==="source"?".parts,#partssplit{display:none!important}"
    :service==="versions"?"#partsbox,#vsplit,#partsfold{display:none!important}"
    :service==="metrics"?"body.flow #list,body.flow #listsplit{display:none!important}":"";
  const hide=service==="chat"?"":"<style>#name,#type,#load,#mode,#assist,#open,#finder{display:none!important}"+ownParts+"</style>";
  frame.onload=()=>{showFrame(frame);if(afterLoad)afterLoad();};
  frame.srcdoc=source.replace("<script>",hide+bootstrap+"<script>");
}
function showFrame(frame){
  result=frame;
  resultFrames.forEach(value=>value.classList.toggle("active",value===frame));
}
function mountChat(){
  const frame=document.getElementById("conversation"),generation=++sequence;
  frame.dataset.generation=String(generation);
  const bootstrap="<script>parent.connect(window,\"chat\","+generation+");<"+"/script>";
  frame.srcdoc=bundle.chat.replace("<script>",bootstrap+"<script>");
}
// iframe documents do not inherit the host's CSS variables or theme updates.
// Copy the complete VS Code theme onto their body, where existing palettes live.
function syncTheme(child){
  const target=child.document.body;
  if(!target)return;
  const classes=["vscode-light","vscode-dark","vscode-high-contrast","vscode-high-contrast-light"];
  classes.forEach(name=>target.classList.toggle(name,document.body.classList.contains(name)));
  const css=getComputedStyle(document.body);
  Array.from(target.style).filter(name=>name.startsWith("--vscode-")).forEach(name=>target.style.removeProperty(name));
  Array.from(css).filter(name=>name.startsWith("--vscode-")).forEach(name=>target.style.setProperty(name,css.getPropertyValue(name)));
  if(!classes.some(name=>document.body.classList.contains(name)))return;
  const light=document.body.classList.contains("vscode-light")||document.body.classList.contains("vscode-high-contrast-light");
  target.style.colorScheme=light?"light":"dark";
  const mapping={bg:"editor-background",fg:"editor-foreground",muted:"descriptionForeground",faint:"disabledForeground",surface:"editorWidget-background","surface-2":"sideBar-background","field-bg":"input-background",input:"input-background","field-border":"input-border",border:"panel-border",line:"panel-border",hover:"list-hoverBackground","th-bg":"editorWidget-background","row-alt":"editor-background",selected:"list-activeSelectionBackground",button:"button-background","button-fg":"button-foreground"};
  Object.entries(mapping).forEach(([name,token])=>target.style.setProperty("--"+name,css.getPropertyValue("--vscode-"+token).trim()||css.getPropertyValue("--vscode-editor-background").trim()));
  Object.entries({"ins-bg":light?"#e8f6ea":"#17301c","ins-mark":light?"#2c7a39":"#6cc07a","del-bg":light?"#fdecec":"#3a1f1f","del-mark":light?"#a5292a":"#f48771"}).forEach(([name,value])=>target.style.setProperty("--"+name,value));
}
new MutationObserver(()=>{
  document.querySelectorAll("iframe").forEach(frame=>{if(frame.contentDocument)syncTheme(frame.contentWindow);});
}).observe(document.documentElement,{attributes:true,subtree:true,attributeFilter:["class","style"]});
function connect(child,service,generation){
  syncTheme(child);
  child.VERTEX_ACTION=current.action;
  // A cached page connects while it is still behind the visible page. Resolve
  // its own frame from the child window; `result` is only the visible frame.
  const owner=service==="chat"?document.getElementById("conversation"):[...resultFrames.values()].find(frame=>frame.contentWindow===child);
  const live=()=>owner.contentWindow===child&&owner.dataset.generation===String(generation);
  let pending=null;
  child.sdeTake=()=>{const answer=pending;pending=null;return answer;};
  child.sdeDeliver=value=>{if(live()){pending=value;child.sdeReady();}};
  const reply=value=>{if(live()){pending=value;child.sdeReady();}};
  child.sdeTitle=()=>{};
  child.sdePartShown=key=>{if(live()&&owner===result)partShown(key);};
  // `chat.html` is shared with Eclipse.  Only VS Code supplies this host
  // capability, where the API key lives in VS Code SecretStorage.
  child.sdeAnthropicApi=()=>typeof sdeAnthropicApi==="function"&&sdeAnthropicApi();
  child.sdeSelectObject=value=>navigate(value);
  child.sdeBrowse=url=>sdeBrowse(url);
  child.sdeOpen=name=>navigate({type:"TABL",name,action:"data"});
  child.sdeProject=()=>enqueue({path:"project"},reply,live);
  child.sdeAbout=()=>enqueue({path:"/sap/bc/adt/vertex/about"},reply,live);
  child.sdeAsset=name=>enqueue({asset:name},reply,live);
  child.sdeSource=(name,type)=>enqueue({source:[name,type]},reply,live);
  // A class part's current text, read from the include SAP keeps it in.
  child.sdePart=(name,type,part,ptype)=>enqueue({path:VertexRoutes.SERVICES.versions.load([name,type,part,ptype])+"&now=X"},reply,live);
  if(typeof sdeOpenEditor==="function")child.sdeOpenEditor=(name,type)=>sdeOpenEditor(String(name),String(type));
  if(typeof sdeRunUnitTests==="function")child.sdeRunUnitTests=(name,type)=>sdeRunUnitTests(String(name),String(type));
  // The debugger is VS Code's: a command goes to it and its answer comes back
  // as any other; what it does on its own arrives through sdeDebugEvent.
  if(typeof sdeDebug==="function")child.sdeDebug=(command,args)=>enqueue({debug:[String(command),JSON.stringify(args||{})]},reply,live);
  child.sdeContextUpdate=state=>{
    if(!live())return;
    const value=state&&typeof state==="object"?state:{};
    value.workspace=current;
    // Eclipse BrowserFunction accepts strings reliably across SWT engines.
    // Keeping this as JSON also prevents an object proxy from leaking between
    // the two nested webviews.
    sdeVertexContext(JSON.stringify(value));
  };
  Object.keys(VertexRoutes.SERVICES[service]||{}).forEach(call=>{
    const build=VertexRoutes.SERVICES[service][call];
    if(typeof build!=="function")return;
    child["sde"+call[0].toUpperCase()+call.slice(1)]=(...args)=>{
      const at=VertexRoutes.WRITES[call];
      enqueue({path:build(args),body:at===undefined?null:(args[at]||null)},reply,live);
    };
  });
  child.sdeModels=(...args)=>{assistantTarget={child,live};sdeModels(...args);};
  // VS Code shares the VERTEX panel's provider and model; Eclipse has neither.
  ["sdeAiProvider","sdeAiModel","sdeAiConfig"].forEach(name=>{
    if(typeof window[name]==="function")child[name]=(...args)=>{assistantTarget={child,live};window[name](...args);};
  });
  child.sdeAsk=(...args)=>{
    const state=JSON.parse(args[3]||"{}");state.workspace=current;
    // The left chat stays open while the result iframe drills from a request
    // into a class and then a method. Its parent selection is still the
    // request, so carry the result page's named location as well. This is
    // metadata, never rendered source; the assistant reads source through
    // its SAP tools when it needs it.
    const page=result.contentWindow;
    if(page&&typeof page.sdeContext==="function")state.vertex_view=page.sdeContext();
    if(!state.selected_fragment&&page&&typeof page.sdeSelection==="function")state.selected_fragment=page.sdeSelection();
    // A selection in a rendered Diff is an intentional, small piece of code
    // context. Keep it separate from the question and cap it, so ordinary
    // selection elsewhere in the window is never silently sent.
    try{
      const selection=page&&page.getSelection&&page.getSelection();
      const text=selection&&String(selection.toString()).trim();
      const node=selection&&selection.anchorNode&&(selection.anchorNode.nodeType===1?selection.anchorNode:selection.anchorNode.parentElement);
      if(text&&node&&node.closest&&node.closest("table.diff"))state.selected_fragment={text:text.slice(0,12000),view:state.vertex_view||null};
    }catch(e){/* an unloaded result frame simply has no selection */}
    args[3]=JSON.stringify(state);assistantTarget={child,live};sdeAsk(...args);
  };
  if(service!=="chat")child.sdeAskSelection=(question,fragment,view)=>{
    if(!live())return;
    const target=document.getElementById("conversation").contentWindow;
    if(target&&typeof target.sdeAskSelection==="function"){
      showChat(true);
      target.sdeAskSelection(question,fragment,view);
    }
  };
}
function enqueue(request,reply,live){queue.push({request,reply,live});pump();}
function pump(){
  if(activeRequest)return;
  while(queue.length){const item=queue.shift();if(item.live()){activeRequest=item;break;}}
  if(!activeRequest)return;
  const r=activeRequest.request;
  if(r.asset)sdeAsset(r.asset);else if(r.source)sdeSource(...r.source);else if(r.debug)sdeDebug(...r.debug);else sdeWorkspace(r.path,r.body);
}
/* The debugger moved - a stop, a step, a breakpoint the assistant set. The
   Visual Debug page, if it was opened, draws it again. */
function sdeDebugEvent(raw){
  const frame=resultFrames.get("debug:vdebug");
  const page=frame&&frame.contentWindow;
  if(page&&typeof page.sdeDebugEvent==="function")page.sdeDebugEvent(raw);
}
function sdeReady(){
  const raw=sdeTake(),item=activeRequest;activeRequest=null;
  if(item&&item.live())item.reply(raw);
  pump();
}
function sdeAssistant(raw){
  const target=assistantTarget;
  if(target&&target.live())target.child.sdeAssistant(raw);
  try{const data=JSON.parse(raw);if(!data.error&&data.plan&&data.plan.navigation)navigate(data.plan.navigation);}
  catch(e){notice(e.message);}
}
typeBox.onchange=()=>{current=VertexObjects.normalize({type:typeBox.value,name:nameBox.value});fields();};
findButton.onclick=()=>requestDialog.showModal();
document.getElementById("request-find").onclick=()=>{findRequests();};
/* A name with * or +: ADT's quick search lists what matches, of the chosen
   type; a pick fills the name and runs. A request number has its own finder. */
const ADT_TYPES={TABL:"TABL/DT",CLAS:"CLAS/OC",INTF:"INTF/OI",PROG:"PROG/P",INCL:"PROG/I",DEVC:"DEVC/K",FUGR:"FUGR/F",FUNC:"FUGR/FF",DDLS:"DDLS/DF",DOMA:"DOMA/DD",DTEL:"DTEL/DE"};
const matchBox=document.getElementById("object-matches");let matchAt=-1;
function closeMatches(){matchBox.classList.remove("on");matchBox.replaceChildren();matchAt=-1;}
function pick(name){nameBox.value=name;closeMatches();run();}
/* A plain name that SAP does not know is searched as NAME*: what was meant
   is usually the start of a name. A name SAP knows runs as before. */
function searchMask(exact){
  const typed=nameBox.value.trim().toUpperCase(),mask=exact?typed+"*":typed,kind=ADT_TYPES[typeBox.value];
  if(!kind){notice("A mask is not searched for this type.");return;}
  if(!/^[A-Z0-9_/$*+]{1,40}$/.test(mask)){notice("Use letters, digits, _ / $ and the wildcards * and +.");return;}
  notice("Searching "+mask+"...");
  enqueue({path:"/sap/bc/adt/repository/informationsystem/search?operation=quickSearch&maxResults=100&objectType="+encodeURIComponent(kind)+"&query="+encodeURIComponent(mask)},raw=>{
    if(String(raw).startsWith("ERROR:")){notice(String(raw).slice(6));return;}
    const doc=new DOMParser().parseFromString(String(raw),"application/xml"),found=[];
    for(const r of doc.getElementsByTagNameNS("*","objectReference")){
      const type=r.getAttribute("adtcore:type")||"",name=r.getAttribute("adtcore:name")||"";
      if(type===kind&&name)found.push({name,description:r.getAttribute("adtcore:description")||""});
    }
    // Found as typed - or not found at all: the quick search may leave out
    // an object the function itself can still open (a standard function
    // module, filtered by type), so the function is asked and says what it finds.
    if(exact&&(!found.length||found.some(f=>f.name===typed))){notice("");run();return;}
    notice(found.length?(exact?typed+" was not found - names starting with it:":""):"Nothing matches "+mask+".");
    matchBox.replaceChildren(...found.map((f,i)=>{const d=document.createElement("div");d.setAttribute("role","option");
      d.textContent=f.name;const small=document.createElement("small");small.textContent=f.description;d.appendChild(small);
      d.onmousedown=e=>{e.preventDefault();pick(f.name);};return d;}));
    matchAt=-1;matchBox.classList.toggle("on",found.length>0);
  },()=>true);
}
function moveMatch(step){const items=matchBox.children;if(!items.length)return;
  if(matchAt>=0)items[matchAt].classList.remove("sel");matchAt=(matchAt+step+items.length)%items.length;
  items[matchAt].classList.add("sel");items[matchAt].scrollIntoView({block:"nearest"});}
nameBox.onkeydown=e=>{
  if(matchBox.classList.contains("on")){
    if(e.key==="ArrowDown"){e.preventDefault();moveMatch(1);return;}
    if(e.key==="ArrowUp"){e.preventDefault();moveMatch(-1);return;}
    if(e.key==="Escape"){closeMatches();return;}
    if(e.key==="Enter"&&matchAt>=0){e.preventDefault();pick(matchBox.children[matchAt].firstChild.textContent);return;}
  }
  if(e.key!=="Enter")return;
  if(/[*+]/.test(nameBox.value))searchMask(false);
  else if(ADT_TYPES[typeBox.value]&&nameBox.value.trim()){closeMatches();searchMask(true);}
  else{closeMatches();run();}
};
nameBox.onblur=()=>setTimeout(closeMatches,150);
actionBox.onchange=()=>{if(nameBox.value.trim())run();};
fields();mountChat();
if(current.part)pendingPart=partKey(current.part);
if(current.name)run();
</script></body></html>

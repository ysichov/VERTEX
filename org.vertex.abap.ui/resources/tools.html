<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VERTEX Tools</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:var(--vscode-editor-background,Canvas);color:var(--vscode-editor-foreground,CanvasText);font:13px "Segoe UI",sans-serif}
#chat{width:30%;min-width:260px;flex:none;overflow:hidden;display:none;flex-direction:column}
#chat.open{display:flex}
#chat .chat-bar{display:flex;align-items:center;padding:4px 4px 4px 10px;border-bottom:1px solid #8886;font-weight:600}
#chat .chat-bar span{margin-right:auto}
#chat-close{border:0;background:transparent;padding:2px 7px;cursor:pointer;font-size:15px;line-height:1}
#chat-close:hover{background:var(--vscode-toolbar-hoverBackground,#8883)}
#chat iframe{flex:1;height:auto;min-height:0}
#chat-split{display:none;flex:none;width:3px;cursor:col-resize;border-left:1px solid #8886}
#chat.open+#chat-split{display:block}
#chat-split:hover,#chat-split.dragging{background:var(--vscode-sash-hoverBorder,Highlight)}
body.dragging{cursor:col-resize;user-select:none}body.dragging iframe{pointer-events:none}
#chat-toggle.on{color:var(--vscode-button-foreground,HighlightText);background:var(--vscode-button-background,Highlight)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border-bottom:1px solid #8886;align-items:center}
input,select,button{font:inherit;padding:5px;color:var(--vscode-input-foreground,var(--vscode-editor-foreground,#d4d4d4));background:var(--vscode-input-background,var(--vscode-editor-background,#1e1e1e));border:1px solid #8888}
select option{color:var(--vscode-input-foreground,var(--vscode-editor-foreground,#d4d4d4));background:var(--vscode-input-background,var(--vscode-editor-background,#1e1e1e))}
#object-field{position:relative;flex:1;min-width:150px}
#find-requests{display:none;position:absolute;right:1px;top:1px;bottom:1px;width:30px;padding:5px;border:0;background:transparent;cursor:pointer}
#find-requests:hover{background:var(--vscode-toolbar-hoverBackground,#8883)}
#find-requests:focus-visible{outline:1px solid var(--vscode-focusBorder,Highlight);outline-offset:-2px}
#find-requests svg{width:14px;height:14px;vertical-align:middle}
dialog{color:var(--vscode-foreground,CanvasText);background:var(--vscode-editor-background,Canvas);border:1px solid var(--vscode-panel-border,#8888);padding:16px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:8px 0}
#object-name{width:100%;padding-right:34px;text-transform:uppercase}iframe{border:0;width:100%;height:100%;display:block}
#object-type{min-width:150px}#function{min-width:100px}
#results{flex:1;min-height:0;position:relative}#results iframe{position:absolute;inset:0;display:none}#results iframe.active{display:block}#notice{padding:8px;white-space:pre-wrap}#notice:empty{display:none}
</style></head><body>
<aside id="chat" aria-label="Assistant"><div class="chat-bar"><span>Ask AI</span><button id="chat-close" title="Hide the assistant" aria-label="Hide the assistant">&#x2715;</button></div><iframe id="conversation" title="VERTEX assistant"></iframe></aside><div id="chat-split" title="Drag to resize the assistant"></div>
<main><header>
<button id="chat-toggle" title="Show or hide the assistant" aria-expanded="false">Ask AI</button>
<button id="back" title="Back to the previous VERTEX source" hidden>← Back</button>
<select id="object-type" aria-label="Object type"></select>
<div id="object-field"><input id="object-name" placeholder="Object name" aria-label="Object name" title="Enter an object name and press Enter" spellcheck="false"><button id="find-requests" type="button" title="Find transport requests" aria-label="Find transport requests"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><path d="m10 10 4 4"/></svg></button></div>
<select id="function" aria-label="Function"></select>
</header><div id="notice" role="status"></div><div id="results" aria-label="Function result"></div></main>
<dialog id="request-dialog"><form method="dialog"><strong>Find transport requests</strong>
<label>User (empty = current user)<input id="request-user" autocomplete="username" placeholder="Current SAP user"></label>
<label><input type="checkbox" id="request-released"> Include released requests</label>
<menu><button value="cancel">Cancel</button><button id="request-find" value="find">Find</button></menu>
</form></dialog>
<script>
/*OBJECT_MODEL*/
/*TOOL_ROUTES*/
const bundle = /*BUNDLE*/{};
const initial = /*INIT*/null/*INIT*/;
let current = VertexObjects.normalize(initial || {});
let sequence = 0, activeRequest = null, queue = [], assistantTarget = null, navigation = [];
const typeBox = document.getElementById("object-type"), nameBox = document.getElementById("object-name");
const actionBox = document.getElementById("function"), results = document.getElementById("results");
let result = null;
const resultFrames = new Map();
const findButton = document.getElementById("find-requests"), requestDialog = document.getElementById("request-dialog");
const chat = document.getElementById("chat"), chatToggle = document.getElementById("chat-toggle");
const backButton=document.getElementById("back");
function showChat(open){chat.classList.toggle("open",open);chatToggle.classList.toggle("on",open);chatToggle.setAttribute("aria-expanded",String(open));}
chatToggle.onclick=()=>showChat(!chat.classList.contains("open"));
document.getElementById("chat-close").onclick=()=>showChat(false);
// The line between the assistant and the result, dragged to share the width.
// Frames swallow mouse moves, so they ignore the pointer while it is held.
document.getElementById("chat-split").addEventListener("mousedown",e=>{
  if(e.button!==0)return;e.preventDefault();
  const split=e.currentTarget,startX=e.clientX,startWidth=chat.getBoundingClientRect().width,room=document.body.getBoundingClientRect().width;
  split.classList.add("dragging");document.body.classList.add("dragging");
  const move=ev=>{chat.style.width=Math.max(260,Math.min(room-300,startWidth+ev.clientX-startX))+"px";};
  const up=()=>{split.classList.remove("dragging");document.body.classList.remove("dragging");document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);};
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
});
function notice(text){document.getElementById("notice").textContent=text;}
VertexObjects.objects.forEach(o=>typeBox.add(new Option(o[1],o[0])));
function fields(){
  typeBox.value=current.type; nameBox.value=current.name; actionBox.replaceChildren();
  VertexObjects.objects.find(o=>o[0]===current.type)[2].forEach(a=>actionBox.add(new Option(VertexObjects.labels[a],a)));
  actionBox.value=current.action;
  findButton.style.display = current.type === "TR" ? "inline-block" : "none";
}
function navigate(value,remember){
  try{if(remember!==false&&current.name)navigation.push(Object.assign({},current));current=VertexObjects.normalize(value);backButton.hidden=!navigation.length;fields();if(current.name) run();}
  catch(e){notice(e.message);}
}
backButton.onclick=()=>{const previous=navigation.pop();if(previous)navigate(previous,false);backButton.hidden=!navigation.length;};
function run(){
  try{current=VertexObjects.normalize({type:typeBox.value,name:nameBox.value,action:actionBox.value});}
  catch(e){notice(e.message);return;}
  if(!current.name){notice("Enter an object name.");return;}
  notice(""); fields();
  const service=current.action==="view"?"source":["data","join","pivot"].includes(current.action)?"table":
    ["diff","review"].includes(current.action)?"versions":"metrics";
  mount(service,current);
}
function findRequests(){
  const user=document.getElementById("request-user").value.trim();
  const released=document.getElementById("request-released").checked ? "true" : "";
  // A finder has no selected request yet. Start Versions, not Review: Review
  // would otherwise ask the host for /review/ with an empty request number.
  current={type:"TR",name:"",action:"diff"}; fields();
  mount("versions",current,()=>sdeRequestSearch(user,released));
}
function mount(service,state,afterLoad){
  const key=service+":"+state.action;
  let frame=resultFrames.get(key);
  const identity=state.type+":"+state.name;
  if(frame&&frame.dataset.identity===identity){showFrame(frame);if(afterLoad)afterLoad();return;}
  if(!frame){frame=document.createElement("iframe");frame.title="Function result";resultFrames.set(key,frame);results.appendChild(frame);}
  frame.dataset.identity=identity;
  const generation=++sequence;
  frame.dataset.generation=String(generation);
  let source=bundle[service];
  const init=service==="table"?state.name:state;
  source=source.replace(["/*INIT*/","null","/*INIT*/"].join(""),()=>JSON.stringify(init).replace(/</g,"\\u003c"));
  const bootstrap="<script>parent.connect(window,"+JSON.stringify(service)+","+generation+");<"+"/script>";
  const hide=service==="chat"?"":"<style>#name,#type,#load,#mode,#assist,#open,#finder{display:none!important}</style>";
  frame.onload=()=>{showFrame(frame);if(afterLoad)afterLoad();};
  frame.srcdoc=source.replace("<script>",hide+bootstrap+"<script>");
}
function showFrame(frame){
  result=frame;
  resultFrames.forEach(value=>value.classList.toggle("active",value===frame));
}
function mountChat(){
  const frame=document.getElementById("conversation"),generation=++sequence;
  frame.dataset.generation=String(generation);
  const bootstrap="<script>parent.connect(window,\"chat\","+generation+");<"+"/script>";
  frame.srcdoc=bundle.chat.replace("<script>",bootstrap+"<script>");
}
// iframe documents do not inherit the host's CSS variables or theme updates.
// Copy the complete VS Code theme onto their body, where existing palettes live.
function syncTheme(child){
  const target=child.document.body;
  if(!target)return;
  const classes=["vscode-light","vscode-dark","vscode-high-contrast","vscode-high-contrast-light"];
  classes.forEach(name=>target.classList.toggle(name,document.body.classList.contains(name)));
  const css=getComputedStyle(document.body);
  Array.from(target.style).filter(name=>name.startsWith("--vscode-")).forEach(name=>target.style.removeProperty(name));
  Array.from(css).filter(name=>name.startsWith("--vscode-")).forEach(name=>target.style.setProperty(name,css.getPropertyValue(name)));
  if(!classes.some(name=>document.body.classList.contains(name)))return;
  const light=document.body.classList.contains("vscode-light")||document.body.classList.contains("vscode-high-contrast-light");
  target.style.colorScheme=light?"light":"dark";
  const mapping={bg:"editor-background",fg:"editor-foreground",muted:"descriptionForeground",faint:"disabledForeground",surface:"editorWidget-background","surface-2":"sideBar-background","field-bg":"input-background",input:"input-background","field-border":"input-border",border:"panel-border",line:"panel-border",hover:"list-hoverBackground","th-bg":"editorWidget-background","row-alt":"editor-background",selected:"list-activeSelectionBackground",button:"button-background","button-fg":"button-foreground"};
  Object.entries(mapping).forEach(([name,token])=>target.style.setProperty("--"+name,css.getPropertyValue("--vscode-"+token).trim()||css.getPropertyValue("--vscode-editor-background").trim()));
  Object.entries({"ins-bg":light?"#e8f6ea":"#17301c","ins-mark":light?"#2c7a39":"#6cc07a","del-bg":light?"#fdecec":"#3a1f1f","del-mark":light?"#a5292a":"#f48771"}).forEach(([name,value])=>target.style.setProperty("--"+name,value));
}
new MutationObserver(()=>{
  document.querySelectorAll("iframe").forEach(frame=>{if(frame.contentDocument)syncTheme(frame.contentWindow);});
}).observe(document.documentElement,{attributes:true,subtree:true,attributeFilter:["class","style"]});
function connect(child,service,generation){
  syncTheme(child);
  child.VERTEX_ACTION=current.action;
  // A cached page connects while it is still behind the visible page. Resolve
  // its own frame from the child window; `result` is only the visible frame.
  const owner=service==="chat"?document.getElementById("conversation"):[...resultFrames.values()].find(frame=>frame.contentWindow===child);
  const live=()=>owner.contentWindow===child&&owner.dataset.generation===String(generation);
  let pending=null;
  child.sdeTake=()=>{const answer=pending;pending=null;return answer;};
  child.sdeDeliver=value=>{if(live()){pending=value;child.sdeReady();}};
  const reply=value=>{if(live()){pending=value;child.sdeReady();}};
  child.sdeTitle=()=>{};
  // `chat.html` is shared with Eclipse.  Only VS Code supplies this host
  // capability, where the API key lives in VS Code SecretStorage.
  child.sdeAnthropicApi=()=>typeof sdeAnthropicApi==="function"&&sdeAnthropicApi();
  child.sdeSelectObject=value=>navigate(value);
  child.sdeBrowse=url=>sdeBrowse(url);
  child.sdeOpen=name=>navigate({type:"TABL",name,action:"data"});
  child.sdeProject=()=>enqueue({path:"project"},reply,live);
  child.sdeAbout=()=>enqueue({path:"/sap/bc/adt/vertex/about"},reply,live);
  child.sdeAsset=name=>enqueue({asset:name},reply,live);
  child.sdeSource=(name,type)=>enqueue({source:[name,type]},reply,live);
  child.sdeContextUpdate=state=>{
    if(!live())return;
    const value=state&&typeof state==="object"?state:{};
    value.workspace=current;
    // Eclipse BrowserFunction accepts strings reliably across SWT engines.
    // Keeping this as JSON also prevents an object proxy from leaking between
    // the two nested webviews.
    sdeVertexContext(JSON.stringify(value));
  };
  Object.keys(VertexRoutes.SERVICES[service]||{}).forEach(call=>{
    const build=VertexRoutes.SERVICES[service][call];
    if(typeof build!=="function")return;
    child["sde"+call[0].toUpperCase()+call.slice(1)]=(...args)=>{
      const at=VertexRoutes.WRITES[call];
      enqueue({path:build(args),body:at===undefined?null:(args[at]||null)},reply,live);
    };
  });
  child.sdeModels=(...args)=>{assistantTarget={child,live};sdeModels(...args);};
  // VS Code shares the VERTEX panel's provider and model; Eclipse has neither.
  ["sdeAiProvider","sdeAiModel","sdeAiConfig"].forEach(name=>{
    if(typeof window[name]==="function")child[name]=(...args)=>{assistantTarget={child,live};window[name](...args);};
  });
  child.sdeAsk=(...args)=>{
    const state=JSON.parse(args[3]||"{}");state.workspace=current;
    // The left chat stays open while the result iframe drills from a request
    // into a class and then a method. Its parent selection is still the
    // request, so carry the result page's named location as well. This is
    // metadata, never rendered source; the assistant reads source through
    // its SAP tools when it needs it.
    const page=result.contentWindow;
    if(page&&typeof page.sdeContext==="function")state.vertex_view=page.sdeContext();
    if(!state.selected_fragment&&page&&typeof page.sdeSelection==="function")state.selected_fragment=page.sdeSelection();
    // A selection in a rendered Diff is an intentional, small piece of code
    // context. Keep it separate from the question and cap it, so ordinary
    // selection elsewhere in the window is never silently sent.
    try{
      const selection=page&&page.getSelection&&page.getSelection();
      const text=selection&&String(selection.toString()).trim();
      const node=selection&&selection.anchorNode&&(selection.anchorNode.nodeType===1?selection.anchorNode:selection.anchorNode.parentElement);
      if(text&&node&&node.closest&&node.closest("table.diff"))state.selected_fragment={text:text.slice(0,12000),view:state.vertex_view||null};
    }catch(e){/* an unloaded result frame simply has no selection */}
    args[3]=JSON.stringify(state);assistantTarget={child,live};sdeAsk(...args);
  };
  if(service!=="chat")child.sdeAskSelection=(question,fragment,view)=>{
    if(!live())return;
    const target=document.getElementById("conversation").contentWindow;
    if(target&&typeof target.sdeAskSelection==="function"){
      showChat(true);
      target.sdeAskSelection(question,fragment,view);
    }
  };
}
function enqueue(request,reply,live){queue.push({request,reply,live});pump();}
function pump(){
  if(activeRequest)return;
  while(queue.length){const item=queue.shift();if(item.live()){activeRequest=item;break;}}
  if(!activeRequest)return;
  const r=activeRequest.request;
  if(r.asset)sdeAsset(r.asset);else if(r.source)sdeSource(...r.source);else sdeWorkspace(r.path,r.body);
}
function sdeReady(){
  const raw=sdeTake(),item=activeRequest;activeRequest=null;
  if(item&&item.live())item.reply(raw);
  pump();
}
function sdeAssistant(raw){
  const target=assistantTarget;
  if(target&&target.live())target.child.sdeAssistant(raw);
  try{const data=JSON.parse(raw);if(!data.error&&data.plan&&data.plan.navigation)navigate(data.plan.navigation);}
  catch(e){notice(e.message);}
}
typeBox.onchange=()=>{current=VertexObjects.normalize({type:typeBox.value,name:nameBox.value});fields();};
findButton.onclick=()=>requestDialog.showModal();
document.getElementById("request-find").onclick=()=>{findRequests();};
nameBox.onkeydown=e=>{if(e.key==="Enter")run();};
actionBox.onchange=()=>{if(nameBox.value.trim())run();};
fields();mountChat();
if(current.name)run();
</script></body></html>

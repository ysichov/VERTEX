<!DOCTYPE html>
<html>
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
<title>VERTEX Logs &amp; Cost</title>
<style>
  /* Every surface follows the active VS Code theme. */

  td.time, th.time { white-space: nowrap; }

  details.prompt > summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; min-width: 100%; }

  .topic-cell { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .conversation-holder { contain:layout style; }
  td.actions button + button { margin-left: 6px; }
  tr.conversation-row.technical > td { opacity: 0.6; }
  .list-tools[hidden]{display:none}

  .kind-filter { color: var(--vscode-descriptionForeground); white-space: nowrap; }
  .conversation-place { display: block; color: var(--vscode-descriptionForeground); font-size: 0.9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-context { font: inherit; padding: 3px 6px; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, var(--vscode-panel-border)); }
  .log-search { flex: 1; max-width: 420px; padding: 3px 6px; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, var(--vscode-panel-border)); }
  table.session-table th { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th.sortable { cursor: pointer; }
  tr.technical > td { opacity: 0.6; }

  .column-guide { position:fixed;top:0;bottom:0;width:2px;background:var(--vscode-focusBorder);pointer-events:none;z-index:1000; }
  /* Claude Code's steps: an edit as removed and added lines, in the theme's diff colours; each model call a line. */
  .step-diff { margin: 0; padding: 4px 0; font-family: var(--vscode-editor-font-family); font-size: 0.9em; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background)); }

  .step-line { padding: 2px 8px; }

  @media (prefers-color-scheme: dark) { body:not([class*="vscode-"]) .step-note.thinking { color: #a5b4fc; } }
  .step-note .label, .step-note .detail { color: inherit; }
  .markdown { white-space: normal; }
  .technical .step-note .detail { background: transparent; font: inherit; padding: 0; }
  .markdown p { margin: 0 0 6px; }
  .markdown p:last-child { margin-bottom: 0; }
  .markdown pre { white-space: pre-wrap; background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background)); padding: 8px; }
  .markdown code { font-family: var(--vscode-editor-font-family); }

  .markdown .md-table th { background: var(--vscode-editorWidget-background, var(--vscode-editor-background)); font-weight: 600; }
  .step-fields { margin: 0; padding: 4px 0; font-size: 0.9em; }
  .step-fields .step-line { font-family: var(--vscode-editor-font-family); overflow-wrap: anywhere; }
  .flow-selector { flex: 1; min-width: 180px; max-width: 760px; }
  .flow-stage { position: relative; height: min(70vh, 700px); min-height: 360px; border: 1px solid var(--vscode-panel-border); background: var(--vscode-editor-background); }
  .flow-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .flow-stats { display: block; margin: 8px 0 10px; padding: 12px 14px; border: 1px solid var(--vscode-panel-border); background: var(--vscode-editorWidget-background); color: var(--vscode-editor-foreground); }
  .flow-stats-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 18px; }

  .flow-lane-gain { position: absolute; top: 76px; left: 12px; width: 236px; box-sizing: border-box; min-height: 90px; padding: 10px; display: flex; flex-direction: column; gap: 5px; background: var(--vscode-editorWidget-background); border: 1px solid var(--vscode-panel-border); }
  .flow-lane-gain strong { color: var(--vscode-charts-green, var(--vscode-editor-foreground)); font-size: .9em; }
  .flow-lane-gain span { color: var(--vscode-descriptionForeground); font-size: .8em; }
  .flow-lane-gain .flow-comparison-bar { margin-top: auto; }
  .flow-stats[hidden] { display: none; }
  .flow-section { position: absolute; left: 12px; width: 236px; height: 40px; box-sizing: border-box; padding: 7px 10px; display: flex; align-items: center; justify-content: space-between; gap: 5px; border-top: 1px solid var(--vscode-panel-border); border-left: 3px solid var(--flow-accent); background: var(--vscode-editorWidget-background); color: var(--vscode-editor-foreground); font-size: .8em; }
  .flow-section strong { color: var(--flow-accent); }
  .flow-section span { color: var(--vscode-descriptionForeground); white-space: nowrap; }
  .flow-section.included { background: color-mix(in srgb, var(--vscode-charts-green, #79b36b) 24%, var(--vscode-editor-background)); border-top: 2px solid var(--vscode-charts-green, #79b36b); }
  .flow-section.excluded { background: color-mix(in srgb, var(--vscode-charts-red, #d16969) 24%, var(--vscode-editor-background)); border-top: 2px solid var(--vscode-charts-red, #d16969); }
  button.flow-node.included { background: color-mix(in srgb, var(--vscode-charts-green, #79b36b) 17%, var(--vscode-editor-background)); border-color: color-mix(in srgb, var(--vscode-charts-green, #79b36b) 48%, transparent); }
  button.flow-node.excluded { background: color-mix(in srgb, var(--vscode-charts-red, #d16969) 12%, var(--vscode-editor-background)); border: 1px dashed var(--vscode-charts-red, #d16969); }
  button.flow-node { position: absolute; left: 12px; width: 236px; height: 72px; text-align: left; padding: 9px 12px; background: transparent; color: var(--vscode-editor-foreground); border: 1px solid transparent; display: flex; flex-direction: column; gap: 5px; white-space: normal; overflow-wrap: anywhere; }
  .flow-node strong { color: var(--flow-accent); font-size: .95em; }
   .flow-node.flow-prompt { gap: 3px; padding: 6px 10px; }
   .flow-prompt .flow-model { display: block; flex: none; color: var(--vscode-editor-foreground); font-size: .78em; white-space: nowrap; text-overflow: ellipsis; }
   .flow-prompt .flow-prompt-text { display: -webkit-box; flex: 1; min-height: 0; color: var(--vscode-charts-green, var(--vscode-textLink-foreground)); font-size: .9em; line-height: 1.2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

   .flow-prompt .flow-prompt-footer strong { color: var(--vscode-descriptionForeground); font-size: .78em; white-space: nowrap; }
   .flow-prompt .flow-topic-badge { position: static; line-height: 13px; padding: 0 3px; font-size: .68em; }
   .flow-prompt .flow-usage { min-width: 0; color: var(--vscode-descriptionForeground); font-size: .68em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flow-node .flow-topic-badge { position: absolute; top: 7px; right: 9px; display: inline-block; width: auto; padding: 0 6px; border: 1px solid currentColor; border-radius: 4px; font-size: .8em; font-weight: bold; line-height: 18px; }
  .flow-node.flow-child strong::before { content: "↳ "; color: var(--vscode-descriptionForeground); }
  .flow-node span { font-size: .85em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  button.flow-node:hover { background: var(--vscode-list-hoverBackground); }
  button.flow-node:focus-visible, button.flow-node.selected { border-color: var(--vscode-focusBorder); outline: 1px solid var(--vscode-focusBorder); }

  .flow-dialog { box-sizing: border-box; width: min(900px, 92vw); max-height: 85vh; overflow: auto; color: var(--vscode-editor-foreground); background: var(--vscode-editorWidget-background); border: 1px solid var(--vscode-panel-border); }

  .flow-inspector { padding: 10px; overflow-wrap: anywhere; }

</style>

<body>
<header>
  <h1>Logs &amp; Cost</h1>
  <div class="vertex-segment-toggle" role="group" aria-label="Report"><button id="view-logs" class="active" aria-pressed="true">Logs</button><button id="view-flow" aria-pressed="false">Flow</button><button id="view-costs" aria-pressed="false">Usage &amp; Cost</button></div>
  <button id="folder">Choose Folder…</button>
  <button id="settings">Log Settings</button>
  <button id="refresh" title="Refresh session logs" aria-label="Refresh session logs">↻</button>
  <button id="clear-conversations" disabled>Clear selected conversations</button>
</header>
<div id="status" class="muted">Loading…</div>
<div class="muted">Enable <code>vertex.ai.log.request</code> to see VERTEX instructions and context for new prompts.</div>
<div id="date-range" class="list-tools" aria-label="Date range">
<button data-date="previous" title="Previous period" aria-label="Previous period">←</button>
<label><select data-date="period" class="log-context"><option value="all">All dates</option><option value="day" selected>Day</option><option value="week">Week</option><option value="month">Month</option><option value="year">Year</option><option value="custom">Custom range</option></select></label>
<span data-date="label" class="muted" aria-live="polite"></span>
<button data-date="next" title="Next period" aria-label="Next period">→</button>
<label>From <input type="date" data-date="from" id="from" class="log-context"></label>
<label>To <input type="date" data-date="to" id="to" class="log-context"></label>
</div>
<div id="date-error" class="error" role="alert"></div>
<div id="content"></div>
<div id="usage-content" hidden></div>
<script id="vertex-date-range" nonce="{{NONCE}}">
function vertexDateRange(root, changed) {
  var from = root.querySelector('[data-date="from"]'), to = root.querySelector('[data-date="to"]');
  var period = root.querySelector('[data-date="period"]'), previous = root.querySelector('[data-date="previous"]'), next = root.querySelector('[data-date="next"]'), label = root.querySelector('[data-date="label"]');
  function date(value) { var a = value.split('-').map(Number); return new Date(a[0], a[1]-1, a[2], 12); }
  function iso(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function controls() {
    previous.disabled = next.disabled = period.value === 'all';
    var custom = period.value === 'custom';
    from.parentElement.hidden = to.parentElement.hidden = !custom;
    var start = from.value ? date(from.value) : null, end = to.value ? date(to.value) : null;
    var fullDate = function (d, shortYear) { return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + (shortYear ? String(d.getFullYear()).slice(-2) : d.getFullYear()); };
    Array.prototype.forEach.call(period.options, function (option) {
      var kind = option.value;
      if (kind === 'all' || kind === 'custom') return;
      var anchor = kind === period.value && start ? new Date(start) : new Date();
      if (kind === 'day') option.textContent = fullDate(anchor);
      else if (kind === 'month') option.textContent = String(anchor.getMonth()+1).padStart(2,'0') + '.' + anchor.getFullYear();
      else if (kind === 'year') option.textContent = String(anchor.getFullYear());
      else if (kind === 'week') {
        anchor.setDate(anchor.getDate() - (anchor.getDay()+6)%7);
        var last = new Date(anchor); last.setDate(last.getDate()+6);
        option.textContent = fullDate(anchor, true) + ' - ' + fullDate(last, true);
      }
    });
    label.textContent = custom && start && end ? fullDate(start) + ' - ' + fullDate(end) : '';
    label.hidden = !custom;
  }
  function apply(anchor) {
    var start = new Date(anchor), end;
    if (period.value === 'all') { from.value = to.value = ''; }
    else {
      if (period.value === 'week') start.setDate(start.getDate() - (start.getDay()+6)%7);

        r.rows[0].hidden = !show; r.rows[1].hidden = !show || !r.open;
      });
      // Re-sort visible rows by last prompt time after filter changes (newly shown commit messages, context switches)
      var visible = records.filter(function (r) { return !r.rows[0].hidden; });
      visible.sort(function (a, b) { return b.item.lastPromptTime - a.item.lastPromptTime; });
      visible.forEach(function (r) {
        list.appendChild(r.rows[0]);
        list.appendChild(r.rows[1]);
      });
      // Naming the place keeps an empty list readable: nothing here yet, rather than something broken.
      var where = want === "none" ? "without a recorded place" : want && held[want] ? contextLabel(held[want].context) : "";
      status.textContent = (shown === records.length ? records.length : shown + " of " + records.length)
        + " conversations in " + report.folder + (where ? " · showing " + where : "");
      if (typeof reportMode !== "undefined" && reportMode === "flow") flowView(flowRoot, records.filter(function (r) { return !r.rows[0].hidden; }).map(function (r) { return r.item; }));
    };
    search.addEventListener("input", filter);
    if (contextSelect) contextSelect.addEventListener("change", filter);
    Object.keys(kindBoxes).forEach(function (kind) { kindBoxes[kind].addEventListener("change", filter); });
    var scroll = el("div", "table-scroll");
    scroll.appendChild(list);
    content.appendChild(scroll);
    var flowRoot;
    if (typeof reportMode !== "undefined" && reportMode === "flow") {
      scroll.hidden = true; actionPanel.hidden = true;
      flowRoot = el("div", "flow-root"); content.appendChild(flowRoot);
    }
    filter();
    if (typeof restoreFlowSelection !== "undefined" && restoreFlowSelection) {
      restoreFlowSelection = false;
      var restored = records.find(function (r) { return r.item.id === flowSelectedId && !r.rows[0].hidden; });
      if (restored) restored.toggle();
    }
    return records;
  }

  /* A conversation's questions: one row each, its answer opening under it. */
  function promptTable(s) {
    var table = el("table", "session-table");
    // Columns: a click on a heading sorts by it (as in Metrics), the grip on its right edge drags its width.
    var columns = [
      { name: "Conversation", cls: "", width: null, value: function (p) { return String(p.text || "").toLowerCase(); } },
      { name: "Topic", cls: "", width: 70, value: function (p) { return p.topic && p.topic.id ? Number(p.topic.id.slice(6)) : 0; }, num: true },
      { name: "Model", cls: "", width: 150, value: function (p) { return (p.provider || "") + " " + (p.model || ""); } },
      { name: "Run", cls: "num", width: 55, value: function (p) { return runsOf(p); }, num: true },
      { name: "Context ≈tok", cls: "num", width: 105, value: function (p) { return p.contextSize ? p.contextSize.estimatedTokens : -1; }, num: true },

      { name: "New in", cls: "num", width: 70, value: function (p) { return newInput(usageOf(p,"model")); }, num: true },
      { name: "Out", cls: "num", width: 65, value: function (p) { return usageOf(p,"model").output || 0; }, num: true },
      { name: "Cache read", cls: "num", width: 90, value: function (p) { return usageOf(p,"model").cacheRead || 0; }, num: true },
      { name: "Cost USD", cls: "num", width: 90, value: function (p) { return usageOf(p,"model").cost || 0; }, num: true },
      { name: "Duration", cls: "time", width: 90, value: function (p) { return (p.end || 0) - (p.time || 0); }, num: true },
      { name: "Tools", cls: "time", width: 75, value: function (p) { return p.flow?.timing?.toolMs || 0; }, num: true },
      { name: "LLM/host", cls: "time", width: 90, value: function (p) { return p.flow?.timing?.modelHostMs || 0; }, num: true },
      { name: "Time", cls: "time", width: 125, value: function (p) { return p.time || 0; }, num: true }];
    // A conversation whose models report no cost (a subscription) has no Cost column: it would be all dashes.
    var hasCost = s.prompts.some(function (p) { return p.usage && p.usage.cost != null; });
    if (!hasCost) columns = columns.filter(function (column) { return column.name !== "Cost USD"; });
    var rows = [];
    var chronological=s.prompts.slice().sort(function(a,b){return (a.time||0)-(b.time||0)||a.key.localeCompare(b.key);});
    var chatPrompts=chronological.filter(function(p){return p.operation==="Chat"||p.operation==="Web search";});
    var technicalByChat=new Map(),unlinkedTechnical=[],reviewOwners=new Map();
    if(chatPrompts.length) chronological.forEach(function(p){
      if(p.operation==="Chat"||p.operation==="Web search")return;
      // Every round of one AI Review belongs to the turn its first round was placed under, so it stays one step.
      var reviewKey=p.operation==="AI Review"&&p.sourceConversation,reviewOwner=reviewKey&&reviewOwners.get(reviewKey);
      if(reviewOwner){if(reviewOwner==="unlinked")unlinkedTechnical.push(p);else technicalByChat.get(reviewOwner).push(p);return;}
      var next=chatPrompts.find(function(q){return (q.time||0)>=(p.time||0);});
      var previous=chatPrompts.slice().reverse().find(function(q){return (q.time||0)<(p.time||0);});
      var exact=p.relatedTurnId&&chatPrompts.find(function(q){return q.turnId===p.relatedTurnId;});
      if(p.relatedTurnId&&!exact){unlinkedTechnical.push(p);if(reviewKey)reviewOwners.set(reviewKey,"unlinked");return;}
      // A review is asked after the answer it reviews, so without an exact turn it belongs to the previous question.
      var owner=exact||(reviewKey?previous||next:next&&previous?((p.time||0)-(previous.time||0)<=(next.time||0)-(p.time||0)?previous:next):next||previous);
      if(owner){if(!technicalByChat.has(owner))technicalByChat.set(owner,[]);technicalByChat.get(owner).push(p);if(reviewKey)reviewOwners.set(reviewKey,owner);}
    });
    var source=chatPrompts.length?chatPrompts.concat(unlinkedTechnical):s.prompts.slice(),pageNumber=0,pageSize=30;
    function childrenOf(p){return technicalByChat.get(p)||[];}
    function runsOf(p){return [p].concat(childrenOf(p)).reduce(function(sum,item){return sum+(item.toolCalls||0);},0);}
    function usageOf(p,kind){
      var combined={input:0,output:0,cacheRead:0,cacheWrite:0};
      [p].concat(childrenOf(p)).forEach(function(item){if((item.costKind==="jev"?"jev":"model")!==kind)return;var usage=item.usage||{};
        ["input","output","cacheRead","cacheWrite","costMissing","costEstimated"].forEach(function(key){combined[key]=(combined[key]||0)+(usage[key]||0);});
        if(usage.cost!=null)combined.cost=(combined.cost||0)+usage.cost;
      });
      return combined;
    }
    var navigation=el("div","list-tools"),pageLabel=el("span","muted");
    var previousPage=el("button","continue-session","Previous"),nextPage=el("button","continue-session","Next");
    var bottomNavigation=el("div","list-tools"),bottomLabel=el("span","muted");
    var bottomPrevious=el("button","continue-session","Previous"),bottomNext=el("button","continue-session","Next");
    previousPage.type=nextPage.type="button";
    bottomPrevious.type=bottomNext.type="button";
    navigation.appendChild(previousPage);navigation.appendChild(pageLabel);navigation.appendChild(nextPage);
    bottomNavigation.appendChild(bottomPrevious);bottomNavigation.appendChild(bottomLabel);bottomNavigation.appendChild(bottomNext);
    function changePage(direction){pageNumber+=direction;renderPage();navigation.scrollIntoView({block:"start"});}
    previousPage.onclick=bottomPrevious.onclick=function(){changePage(-1);};
    nextPage.onclick=bottomNext.onclick=function(){changePage(1);};
    sortableHead(table,columns,rows,function(column,down){
      source.sort(function(a,b){var x=column.value(a),y=column.value(b);return(x<y?-1:x>y?1:0)*(down?-1:1)||(a.time||0)-(b.time||0);});
      pageNumber=0;renderPage();
    });
    var several = s.prompts.length > 1;
    function renderPrompt(p, number) {
      var row = el("tr", several ? "compact" : "");
      var cell = el("td", "prompt-cell");
      // The conversation body gets a row of its own, spanning every column, as the conversation list already
      // does: inside the first cell a fixed-layout table squeezes an answer into the Conversation column.
      var detail = el("tr", "prompt-detail");
      var detailBody = el("td", "conversation-body");
      detailBody.colSpan = columns.length;
      detail.appendChild(detailBody);
      detail.hidden = true;
      if (several) {
        // One narrow line per prompt; its conversation opens under the line.
        var prompt = el("details", "prompt");
        var line = el("summary", "", number + ". " + (promptPreview([p]) || "(no prompt text)"));
        line.title = number + ". " + promptPreview([p]);
        prompt.appendChild(line);
        var promptLoaded = false;
        prompt.ontoggle = function () {
          row.className = prompt.open ? "" : "compact";
          if (prompt.open && !promptLoaded) { promptLoaded = true; p.technicalChildren=childrenOf(p); detailBody.appendChild(lazyConversation(p)); }
          detail.hidden = !prompt.open;
        };
        cell.appendChild(prompt);
      } else { detail.hidden = false; p.technicalChildren=childrenOf(p); detailBody.appendChild(lazyConversation(p)); }
      row.appendChild(cell);
      // Its topic, coloured as the chat colours it, so the topics of a conversation can be told apart at a glance.
      var topicCell = el("td", "topic-cell");
      if (p.topic && /^topic_\d{4,8}$/.test(p.topic.id)) {
        var colors = ["blue", "green", "orange", "purple", "red", "yellow"];
        var color = "var(--vscode-charts-" + colors[Number(p.topic.id.slice(6)) % colors.length] + ", var(--vscode-focusBorder))";
        cell.style.borderLeft = "3px solid " + color;
        topicCell.style.color = color;
        topicCell.textContent = "T" + Number(p.topic.id.slice(6));
        topicCell.title = p.topic.id + " · " + (p.topic.label || "");
        var later=s.prompts.slice(s.prompts.indexOf(p)+1).some(function(q){return q.topic&&q.topic.id===p.topic.id;});
        if(window.vertexCanContinue&&!later){
          var topicId=p.topic.id;
          var resumeTopic=el("button","continue-session topic-continue","T"+Number(topicId.slice(6)));
          resumeTopic.style.color=color;
          resumeTopic.title="Continue "+topicCell.title+"; subsequent requests are classified by Jev";
          resumeTopic.onclick=function(event){event.preventDefault();event.stopPropagation();vscode.postMessage({action:"continueConversation",id:s.id,topicId:topicId});};
          topicCell.textContent="";topicCell.appendChild(resumeTopic);
        }


      }
      // A technical request (a commit message, a PR description, a decision...) is not a chat question: muted,
      // with its operation where a topic would be. Continue and Tag topics leave it out.
      if (p.operation && p.operation !== "Chat" && p.operation !== "Web search") {
        row.classList.add("technical");
        topicCell.textContent = p.operation;
        topicCell.title = "Technical request: " + p.operation + " - not a chat question";
      }
      row.appendChild(topicCell);
      var identity = el("td", "identity");
      var modelLabel = el("div", "identity-label");
      modelLabel.title = p.provider + " · " + p.model;
      modelLabel.appendChild(el("span", "provider", p.provider));
      modelLabel.appendChild(document.createTextNode(" · "));
      modelLabel.appendChild(el("span", "prompt-model model-name", p.model));
      var promptJev=jevLink(usageOf(p,"jev"),usageOf(p,"jev"));if(promptJev){modelLabel.appendChild(document.createTextNode(", "));modelLabel.appendChild(promptJev);}
      identity.appendChild(modelLabel);
      if (p.branch && p.branch !== "main") identity.appendChild(el("div", "muted", "Branch " + p.branch));
      row.appendChild(identity);
      row.appendChild(el("td", "num", n(runsOf(p))));
      var context = el("td", "num", p.contextSize ? "≈" + n(p.contextSize.estimatedTokens) : "—");
      context.title = p.contextSize ? "Prepared context before sending: " + n(p.contextSize.characters) + " characters. Approximate tokens = characters / 4; not model-tokenizer counts. Includes instructions, history, current prompt, tools and answer schema. Excludes provider-added wrappers, binary images and later tool steps."
        : "Context size was not recorded in this log. Cumulative usage cannot reconstruct it.";
      row.appendChild(context);
      row.appendChild(el("td", "num", n(newInput(usageOf(p,"model")))));
      row.appendChild(el("td", "num", n(usageOf(p,"model").output)));
      row.appendChild(el("td", "num", n(usageOf(p,"model").cacheRead)));
      if (hasCost) row.appendChild(el("td", "num", costText(usageOf(p,"model"))));
      var duration = el("td", "time", span(p.time, p.end) || "—");
      duration.title = "Elapsed time from the prompt to its last recorded assistant response";
      row.appendChild(duration);
      row.appendChild(el("td", "time", span(1, 1 + (p.flow?.timing?.toolMs || 0))));
      var modelTime=el("td", "time", span(1, 1 + (p.flow?.timing?.modelHostMs || 0)));
      modelTime.title="Remaining step time includes LLM, Jev decisions and host overhead; Codex CLI does not report exact internal model time.";
      row.appendChild(modelTime);
      row.appendChild(el("td", "time", promptTime(p.time, s.start)));
      rows.push({ item: p, rows: [row, detail] });
      table.appendChild(row);
      table.appendChild(detail);
    }
    function renderPage(){
      rows.forEach(function(record){record.rows.forEach(function(row){row.remove();});});rows.length=0;
      var start=pageNumber*pageSize,end=Math.min(start+pageSize,source.length);
      source.slice(start,end).forEach(function(p,index){renderPrompt(p,start+index+1);});
      navigation.hidden=bottomNavigation.hidden=source.length<=pageSize;
      previousPage.disabled=bottomPrevious.disabled=pageNumber===0;
      nextPage.disabled=bottomNext.disabled=end>=source.length;
      pageLabel.textContent=bottomLabel.textContent=(start+1)+"–"+end+" of "+source.length+" questions";
    }
    renderPage();
    var scroll = el("div", "table-scroll");
    scroll.appendChild(navigation);scroll.appendChild(table);scroll.appendChild(bottomNavigation);
    return scroll;
  }


  window.addEventListener("message", function (event) {
    var m = event.data || {};
    if (m.action === "data") { lastReport = m.report; usageRows = m.usageRows || []; render(m.report); if (reportMode === "costs") renderCosts(); }
    if (m.action === "promptDetail") { var waiting = waitingDetail[m.key] || []; delete waitingDetail[m.key]; waiting.forEach(function (done) { done(m); }); }
    if (m.action === "error") { status.className = "error"; status.textContent = m.error; }
  });
  vscode.postMessage({ action: "ready" });
})();
</script>

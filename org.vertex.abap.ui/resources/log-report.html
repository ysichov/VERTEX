      restoreFlowSelection = false;
      var restored = records.find(function (r) { return r.item.id === flowSelectedId && !r.rows[0].hidden; });
      if (restored) restored.toggle();
    }
    if (conversationState && !conversationState.waiting) {
      var reopened = records.find(function (r) { return r.item.id === conversationState.id; });
      if (reopened) reopened.toggle(); else conversationState = null;
    }
    return records;
  }

  /* A conversation's questions: one row each, its answer opening under it. */
  function promptTable(s, topicId) {
    var table = el("table", "session-table");
    // Columns: a click on a heading sorts by it (as in Metrics), the grip on its right edge drags its width.
    var columns = [
      { name: "Conversation", cls: "", width: null, value: function (p) { return String(p.text || "").toLowerCase(); } },
      { name: "Topic", cls: "", width: 70, value: function (p) { return p.topic && p.topic.id ? Number(p.topic.id.slice(6)) : 0; }, num: true },
      { name: "Model", cls: "", width: 150, value: function (p) { return (p.model || "") + " " + (p.provider || ""); } },
      { name: "Run", cls: "num", width: 55, value: function (p) { return runsOf(p); }, num: true },
      { name: "Context ≈tok", cls: "num", width: 105, value: function (p) { return p.contextSize ? p.contextSize.estimatedTokens : -1; }, num: true },

      { name: "New in", cls: "num", width: 70, value: function (p) { return newInput(usageOf(p,"model")); }, num: true },
      { name: "Out", cls: "num", width: 65, value: function (p) { return usageOf(p,"model").output || 0; }, num: true },
      { name: "Cache read", cls: "num", width: 90, value: function (p) { return usageOf(p,"model").cacheRead || 0; }, num: true },
      { name: "Cost USD", cls: "num", width: 90, value: function (p) { return usageOf(p,"model").cost || 0; }, num: true },
      { name: "Duration", cls: "time", width: 90, value: function (p) { return (p.end || 0) - (p.time || 0); }, num: true },
      { name: "Tools", cls: "time", width: 75, value: function (p) { return p.flow?.timing?.toolMs || 0; }, num: true },
      { name: "LLM/host", cls: "time", width: 90, value: function (p) { return p.flow?.timing?.modelHostMs || 0; }, num: true },
      { name: "Time", cls: "time", width: 125, value: function (p) { return p.time || 0; }, num: true }];
    // A conversation whose models report no cost (a subscription) has no Cost column: it would be all dashes.
    var hasCost = s.prompts.some(function (p) { return p.usage && p.usage.cost != null; });
    if (!hasCost) columns = columns.filter(function (column) { return column.name !== "Cost USD"; });
    var rows = [];
    var steps=promptSteps(s.prompts),technicalByChat=steps.technicalByChat;
    var states = promptTable.states || (promptTable.states = Object.create(null));
    var tableState = states[s.id] || (states[s.id] = { page: 0 });
    var source=steps.rows.filter(function(prompt){return !topicId||topicId==="all"||prompt.topic?.id===topicId;}),pageNumber=tableState.page,pageSize=30;
    function childrenOf(p){return technicalByChat.get(p)||[];}
    function runsOf(p){return [p].concat(childrenOf(p)).reduce(function(sum,item){return sum+(item.toolCalls||0);},0);}
    function usageOf(p,kind){
      var combined={input:0,output:0,cacheRead:0,cacheWrite:0};
      [p].concat(childrenOf(p)).forEach(function(item){if((item.costKind==="jev"?"jev":"model")!==kind)return;var usage=item.usage||{};
        ["input","output","cacheRead","cacheWrite","costMissing","costEstimated"].forEach(function(key){combined[key]=(combined[key]||0)+(usage[key]||0);});
        if(usage.cost!=null)combined.cost=(combined.cost||0)+usage.cost;
      });
      return combined;
    }
    var navigation=el("div","list-tools"),pageLabel=el("span","muted");
    var previousPage=el("button","continue-session","Previous"),nextPage=el("button","continue-session","Next");
    var bottomNavigation=el("div","list-tools"),bottomLabel=el("span","muted");
    var bottomPrevious=el("button","continue-session","Previous"),bottomNext=el("button","continue-session","Next");
    previousPage.type=nextPage.type="button";
    bottomPrevious.type=bottomNext.type="button";
    navigation.appendChild(previousPage);navigation.appendChild(pageLabel);navigation.appendChild(nextPage);
    bottomNavigation.appendChild(bottomPrevious);bottomNavigation.appendChild(bottomLabel);bottomNavigation.appendChild(bottomNext);
    function changePage(direction){pageNumber+=direction;renderPage();navigation.scrollIntoView({block:"start"});}
    previousPage.onclick=bottomPrevious.onclick=function(){changePage(-1);};
    nextPage.onclick=bottomNext.onclick=function(){changePage(1);};
    function sortPrompts(column,down){
      source.sort(function(a,b){var x=column.value(a),y=column.value(b);return(x<y?-1:x>y?1:0)*(down?-1:1)||(a.time||0)-(b.time||0);});
    }
    sortableHead(table,columns,rows,function(column,down){
      tableState.sort = { name: column.name, down: down };
      sortPrompts(column,down);
      pageNumber=0;renderPage();
    });
    if (tableState.sort) {
      var sortColumn = columns.find(function(column){return column.name === tableState.sort.name;});
      if (sortColumn) sortPrompts(sortColumn,tableState.sort.down);
    }
    var several = s.prompts.length > 1;
    function renderPrompt(p, number) {
      var row = el("tr", several ? "compact" : "");
      row.dataset.promptKey = p.key;
      var cell = el("td", "prompt-cell");
      // The conversation body gets a row of its own, spanning every column, as the conversation list already
      // does: inside the first cell a fixed-layout table squeezes an answer into the Conversation column.
      var detail = el("tr", "prompt-detail");
      detail.setAttribute("data-prompt-key", p.key);
      var detailBody = el("td", "conversation-body");
      detailBody.colSpan = columns.length;
      detail.appendChild(detailBody);
      detail.hidden = true;
      if (several) {
        // One narrow line per prompt; its conversation opens under the line.
        var prompt = el("details", "prompt");
        var reviewStep = p.operation === "AI Review" ? "AI Review · " : "";
        var line = el("summary", "", number + ". " + reviewStep + (promptPreview([p]) || "(no prompt text)"));
        line.title = number + ". " + reviewStep + promptPreview([p]);
        prompt.appendChild(line);
        var promptLoaded = false;
        prompt.ontoggle = function () {
          row.className = prompt.open ? "" : "compact";
          if (prompt.open && !promptLoaded) { promptLoaded = true; p.technicalChildren=childrenOf(p); detailBody.appendChild(lazyConversation(p)); }
          detail.hidden = !prompt.open;
        };
        cell.appendChild(prompt);
        if (typeof readingState !== "undefined" && readingState[p.key]?.open) { prompt.open = true; prompt.ontoggle(); }
      } else { detail.hidden = false; p.technicalChildren=childrenOf(p); detailBody.appendChild(lazyConversation(p)); }
      row.appendChild(cell);
      // Its topic, coloured as the chat colours it, so the topics of a conversation can be told apart at a glance.
      var topicCell = el("td", "topic-cell");
      if (p.topic && /^topic_\d{4,8}$/.test(p.topic.id)) {
        var colors = ["blue", "green", "orange", "purple", "red", "yellow"];
        var color = "var(--vscode-charts-" + colors[Number(p.topic.id.slice(6)) % colors.length] + ", var(--vscode-focusBorder))";
        cell.style.borderLeft = "3px solid " + color;
        topicCell.style.color = color;
        topicCell.textContent = "T" + Number(p.topic.id.slice(6));
        topicCell.title = p.topic.id + " · " + (p.topic.label || "");
        var later=s.prompts.slice(s.prompts.indexOf(p)+1).some(function(q){return q.topic&&q.topic.id===p.topic.id;});
        if(window.vertexCanContinue&&!later){
          var topicId=p.topic.id;
          var resumeTopic=el("button","continue-session topic-continue","T"+Number(topicId.slice(6)));
          resumeTopic.style.color=color;
          resumeTopic.title="Continue "+topicCell.title+"; subsequent requests are classified by Jev";
          resumeTopic.onclick=function(event){event.preventDefault();event.stopPropagation();vscode.postMessage({action:"continueConversation",id:s.id,topicId:topicId});};
          topicCell.textContent="";topicCell.appendChild(resumeTopic);
        }


      }
      // A technical request (a commit message, a PR description, a decision...) is not a chat question: muted,
      // with its operation where a topic would be. Continue and Tag topics leave it out.
      // An AI Review round is a step of the chat: a regular row, marked with its operation where a topic would be.
      if (p.operation === "AI Review") {
        topicCell.textContent = "AI Review";
        topicCell.title = "AI Review of the assistant's changes: a separate review chat without the main chat history or tools";
      } else if (p.operation && p.operation !== "Chat" && p.operation !== "Web search") {
        row.classList.add("technical");
        topicCell.textContent = p.operation;
        topicCell.title = "Technical request: " + p.operation + " - not a chat question";
      }
      row.appendChild(topicCell);
      var identity = el("td", "identity");
      var modelLabel = el("div", "identity-label");
      modelLabel.title = p.model + " · " + p.provider;
      modelLabel.appendChild(el("span", "prompt-model model-name", p.model));
      modelLabel.appendChild(document.createTextNode(" · "));
      modelLabel.appendChild(el("span", "provider", p.provider));
      var promptJev=jevLink(usageOf(p,"jev"),usageOf(p,"jev"));if(promptJev){modelLabel.appendChild(document.createTextNode(", "));modelLabel.appendChild(promptJev);}
      identity.appendChild(modelLabel);
      if (p.branch && p.branch !== "main") identity.appendChild(el("div", "muted", "Branch " + p.branch));
      row.appendChild(identity);
      row.appendChild(el("td", "num", n(runsOf(p))));
      var context = el("td", "num", p.contextSize ? "≈" + n(p.contextSize.estimatedTokens) : "—");
      context.title = p.contextSize ? "Prepared context before sending: " + n(p.contextSize.characters) + " characters. Approximate tokens = characters / 4; not model-tokenizer counts. Includes instructions, history, current prompt, tools and answer schema. Excludes provider-added wrappers, binary images and later tool steps."
        : "Context size was not recorded in this log. Cumulative usage cannot reconstruct it.";
      row.appendChild(context);
      row.appendChild(el("td", "num", n(newInput(usageOf(p,"model")))));
      row.appendChild(el("td", "num", n(usageOf(p,"model").output)));
      row.appendChild(el("td", "num", n(usageOf(p,"model").cacheRead)));
      if (hasCost) row.appendChild(el("td", "num", costText(usageOf(p,"model"))));
      var duration = el("td", "time", span(p.time, p.end) || "—");
      duration.title = "Elapsed time from the prompt to its last recorded assistant response";
      row.appendChild(duration);
      row.appendChild(el("td", "time", span(1, 1 + (p.flow?.timing?.toolMs || 0))));
      var modelTime=el("td", "time", span(1, 1 + (p.flow?.timing?.modelHostMs || 0)));
      modelTime.title="Remaining step time includes LLM, Jev decisions and host overhead; Codex CLI does not report exact internal model time.";
      row.appendChild(modelTime);
      row.appendChild(el("td", "time", promptTime(p.time, s.start)));
      rows.push({ item: p, rows: [row, detail] });
      table.appendChild(row);
      table.appendChild(detail);
    }
    function renderPage(){
      pageNumber = Math.max(0, Math.min(pageNumber, Math.ceil(source.length / pageSize) - 1));
      tableState.page = pageNumber;
      rows.forEach(function(record){record.rows.forEach(function(row){row.remove();});});rows.length=0;
      var start=pageNumber*pageSize,end=Math.min(start+pageSize,source.length);
      source.slice(start,end).forEach(function(p,index){renderPrompt(p,start+index+1);});
      navigation.hidden=bottomNavigation.hidden=source.length<=pageSize;
      previousPage.disabled=bottomPrevious.disabled=pageNumber===0;
      nextPage.disabled=bottomNext.disabled=end>=source.length;
      pageLabel.textContent=bottomLabel.textContent=(start+1)+"–"+end+" of "+source.length+" questions";
    }
    renderPage();
    var scroll = el("div", "table-scroll");
    scroll.appendChild(navigation);scroll.appendChild(table);scroll.appendChild(bottomNavigation);
    return scroll;
  }


  function readingAnchor() {
    if (conversationState && !conversationScreen.hidden) return null;
    if (typeof document.querySelectorAll !== "function") return null;
    var selector = "tr[data-session-id]";
    var rows = Array.from(document.querySelectorAll(selector));
    var row = rows.find(function (item) { return item.getBoundingClientRect().bottom > 0; });
    if (!row) return null;
    return { selector: selector, key: row.dataset.promptKey || row.dataset.sessionId, top: row.getBoundingClientRect().top };
  }
  function conversationScroll() {
    var pane = document.querySelector("#conversation-screen .table-scroll");
    return conversationState && pane ? { top: pane.scrollTop, left: pane.scrollLeft } : null;
  }
  function restoreReadingAnchor(anchor, x, y) {
    window.scrollTo(x, y);
    if (!anchor) return;
    var row = Array.from(document.querySelectorAll(anchor.selector)).find(function (item) {
      return (item.dataset.promptKey || item.dataset.sessionId) === anchor.key;
    });
    if (row) window.scrollBy(0, row.getBoundingClientRect().top - anchor.top);
  }
  function restoreConversationScroll(position) {
    if (!position) return;
    var pane = document.querySelector("#conversation-screen .table-scroll");
    if (pane) { pane.scrollTop = position.top; pane.scrollLeft = position.left; }
  }
  var deferredReport = null;
  document.addEventListener("close", function () {
    if (deferredReport && !document.querySelector("dialog[open]")) {
      var data = deferredReport; deferredReport = null;
      window.dispatchEvent(new MessageEvent("message", { data: data }));
    }
  }, true);
  window.addEventListener("message", function (event) {
    var m = event.data || {};
    if (m.action === "data" && m.automatic && document.querySelector("dialog[open]")) { deferredReport = m; return; }
    if (m.action === "resetLiveConversation" && conversationState?.live && m.conversationId) {
      deferredReport = null;
      pendingConversationOpen = null;
      pendingReadingScroll = null;
      if (flowDispose) { flowDispose(); flowDispose = null; }
      flowDetailVersion++;
      document.querySelectorAll("dialog[open]").forEach(function (dialog) { dialog.close(); });
      conversationState = { id:"", conversationId:String(m.conversationId), mode:conversationState.mode, live:true, waiting:true };
      conversationScreen.textContent = "";
      var back = el("button", "continue-session", "← Back");
      back.type = "button"; back.onclick = function () { closeConversation(); };
      conversationScreen.appendChild(back);
      conversationScreen.appendChild(el("p", "muted", "Waiting for the new conversation's first prompt."));
      conversationScreen.hidden = false;
      document.body.classList.add("conversation-open");
    }
    if (m.action === "openConversation") { pendingConversationOpen = { id:String(m.id || ""), promptKey:String(m.promptKey||""), conversationId:String(m.conversationId||""), mode:m.mode === "flow" ? "flow" : "logs", live:m.live===true, placeKey:String(m.placeKey||""), place:m.place&&typeof m.place==="object"?m.place:null, date:String(m.date||"") }; openRequestedConversation(); }
    if (m.action === "data") {
      deferredReport = null;
      var scrollX = window.scrollX, scrollY = window.scrollY;
      var anchor = m.automatic ? readingAnchor() : null;
      var inside = conversationState?.waiting ? null : conversationScroll();
      rememberReading();
      lastReport = m.report; usageRows = m.usageRows || [];
      // Only the chat's live view follows a reset conversation; saved logs stay pinned.
      if (conversationState?.live && !pendingConversationOpen) {
        var currentSession = (m.report.sessions || []).find(function (session) {
          return session.current && !session.relatedConversation && session.prompts.some(chat)
            && (!conversationState.waiting || session.conversation === conversationState.conversationId);
        });
        if (currentSession && currentSession.id !== conversationState.id) {
          pendingConversationOpen = { id:currentSession.id, conversationId:currentSession.conversation || "", mode:conversationState.mode, live:true,
            placeKey:contextKey(currentSession.context), place:currentSession.context || null, date:"" };
        }
      }
      lastRenderedRecords = render(m.report, m.automatic) || []; if (reportMode === "costs") renderCosts();
      openRequestedConversation();
      restoreReadingAnchor(anchor, scrollX, scrollY);
      restoreConversationScroll(inside);
      pendingReadingScroll = Object.keys(waitingDetail).length ? { x: scrollX, y: scrollY, anchor: anchor, inside: inside } : null;
    }
    if (m.action === "promptDetail") {
      var waiting = waitingDetail[m.key] || []; delete waitingDetail[m.key];
      waiting.forEach(function (done) { done(m); });
      if (pendingReadingScroll && !Object.keys(waitingDetail).length) {
        restoreReadingAnchor(pendingReadingScroll.anchor, pendingReadingScroll.x, pendingReadingScroll.y);
        restoreConversationScroll(pendingReadingScroll.inside); pendingReadingScroll = null;
      }
    }
    if (m.action === "decisionRerun") {
      var run = pendingDecisionRuns[m.id]; if (!run) return; delete pendingDecisionRuns[m.id];
      run.button.disabled = false; run.output.className = "jev-rerun-output"; run.output.textContent = "";
      if (m.error) run.output.appendChild(el("p", "error", m.error));
      else {
        var result = m.result || {}, table = jevTable(result.text || "", run.decision);
        run.output.appendChild(table || el("pre", "detail", result.text || "Jev returned no answer text."));
        var meta = [result.model, result.elapsedMs != null ? result.elapsedMs + " ms" : "", result.usage ? usageText({input:result.usage.input_tokens,output:result.usage.output_tokens,cost:result.usage.cost_usd ?? result.usage.estimated_cost_usd}) : ""].filter(Boolean).join(" · ");
        if (meta) run.output.appendChild(el("div", "muted", meta));
      }
    }
    if (m.action === "error") { status.className = "error"; status.textContent = m.error; }
  });
  vscode.postMessage({ action: "ready" });
})();

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
<title>VERTEX Session Logs</title>
<style>
  /* Every surface follows the active VS Code theme. */
  body {
    margin: 0; padding: 12px 16px;
    background: var(--vscode-editor-background); color: var(--vscode-editor-foreground);
    font-family: var(--vscode-font-family); font-size: var(--vscode-font-size);
  }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 1.2em; margin: 0 auto 0 0; }
  button {
    background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground);
    border: 1px solid var(--vscode-button-border, transparent); padding: 3px 10px; cursor: pointer; font: inherit;
  }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button:disabled { opacity: .5; cursor: default; }
  .select-session { accent-color: var(--vscode-focusBorder); }
  .recording-link { margin: 4px 8px; color: var(--vscode-textLink-foreground); background: transparent; border: 0; padding: 0; text-decoration: underline; }
  .recording-link:focus-visible { outline: 1px solid var(--vscode-focusBorder); }
  .muted { color: var(--vscode-descriptionForeground); }
  .error { color: var(--vscode-errorForeground); }
  .totals { margin: 6px 0 12px; }
  details.session { border: 1px solid var(--vscode-panel-border); background: var(--vscode-editorWidget-background); margin-bottom: 6px; }
  details.session > summary { padding: 6px 8px; cursor: pointer; display: flex; gap: 12px; flex-wrap: wrap; }
  details.session > summary .preview { flex-basis: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.session[open] > summary .preview { display: none; }
  .provider { font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-top: 1px solid var(--vscode-editorWidget-border, var(--vscode-panel-border)); vertical-align: top; }
  th { color: var(--vscode-descriptionForeground); font-weight: 600; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .conversation { min-width: 240px; }
  /* The prompt's time takes only the width it needs: the date is in the session line above. */
  td.time, th.time { width: 1%; white-space: nowrap; }
  /* A session of several prompts opens as one narrow line per prompt; a line opens its conversation. */
  details.prompt > summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; min-width: 100%; }
  details.prompt > summary:hover { background: var(--vscode-list-hoverBackground); }
  details.prompt[open] > summary { color: var(--vscode-descriptionForeground); }
  tr.compact > td { padding-top: 2px; padding-bottom: 2px; }
  .entry { --entry-color: var(--vscode-descriptionForeground); margin: 6px 0; background: var(--vscode-editor-background); }
  /* No coloured bar at the side: the block's kind reads from its title colour. A block inside a block (a step in
     Steps, a call in Tools) is separated from the one before by a thin rule above. */
  .entry .entry { margin: 0; border-top: 1px solid var(--vscode-panel-border); }
  .entry .entry > summary { font-weight: normal; color: var(--vscode-editor-foreground); }
  .entry.user { --entry-color: var(--vscode-charts-blue, var(--vscode-textLink-foreground)); }
  .entry.model { --entry-color: var(--vscode-charts-green, var(--vscode-textLink-foreground)); }
  .entry > summary { padding: 6px 8px; cursor: pointer; color: var(--entry-color); font-weight: 600; }
  .entry > summary:hover { background: var(--vscode-list-hoverBackground); }
  summary:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .detail { margin: 0; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--vscode-editor-foreground); }
  .technical .detail { background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background)); font-family: var(--vscode-editor-font-family); font-size: 0.9em; }
  .entry-body { padding: 0 8px 4px; }
  .kind { padding: 4px 8px; color: var(--entry-color); font-size: 0.9em; }
  .table-scroll { overflow-x: auto; }
  /* Claude Code's steps: an edit as removed and added lines, in the theme's diff colours; each model call a line. */
  .step-diff { margin: 0; padding: 4px 0; font-family: var(--vscode-editor-font-family); font-size: 0.9em; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background)); }
  .step-diff .del, .step-diff .add { display: block; padding: 0 8px; }
  .step-diff .del { background: var(--vscode-diffEditor-removedLineBackground, var(--vscode-diffEditor-removedTextBackground)); }
  .step-diff .add { background: var(--vscode-diffEditor-insertedLineBackground, var(--vscode-diffEditor-insertedTextBackground)); }
  .step-line { padding: 2px 8px; }
  .step-line .label { color: var(--vscode-descriptionForeground); margin-right: 6px; }
  .model-step { margin: 0; padding: 6px 8px 4px; color: var(--vscode-descriptionForeground); font-size: 0.9em; border-top: 1px solid var(--vscode-panel-border); }
  .model-step strong { color: var(--vscode-editor-foreground); margin-right: 4px; }
  /* The tools a model step called sit indented under it, so the step reads as their parent. */
  .model-group > .entry, .model-group > .step-note { margin-left: 18px; }
  /* What Claude said or thought between its steps: the panel's "Claude reasoning", kept in the timeline. */
  .step-note { padding: 4px 8px; white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid var(--vscode-panel-border); }
  .step-note .label { display: block; color: var(--vscode-descriptionForeground); font-size: 0.85em; margin-bottom: 2px; }
  .step-note.thinking { color: var(--vscode-descriptionForeground); font-style: italic; }
  .step-fields { margin: 0; padding: 4px 0; font-size: 0.9em; }
  .step-fields .step-line { font-family: var(--vscode-editor-font-family); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Session Logs</h1>
  <button id="folder">Choose Folder…</button>
  <button id="settings">Log Settings</button>
  <button id="refresh">Refresh</button>
  <button id="clear-conversations" disabled>Clear selected conversations</button>
</header>
<div id="status" class="muted">Loading…</div>
<div class="muted">Enable <code>vertex.ai.log.request</code> to see VERTEX instructions and context for new prompts.</div>
<div id="content"></div>
<script nonce="{{NONCE}}">
(function () {
  "use strict";
  var vscode = acquireVsCodeApi();
  var status = document.getElementById("status");
  var content = document.getElementById("content");
  var selected = new Set();
  var clear = document.getElementById("clear-conversations");
  clear.onclick = function () { vscode.postMessage({ action: "clearConversations", ids: Array.from(selected) }); };
  function selectionChanged() { clear.disabled = selected.size === 0; }
  document.getElementById("refresh").onclick = function () { vscode.postMessage({ action: "refresh" }); };
  document.getElementById("folder").onclick = function () { vscode.postMessage({ action: "chooseFolder" }); };
  document.getElementById("settings").onclick = function () { vscode.postMessage({ action: "settings" }); };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function n(value) { return Number(value || 0).toLocaleString(); }
  function time(value) { return value ? new Date(value).toLocaleString() : ""; }
  // A prompt's time of day; the date only when it differs from the session's, which the session line shows.
  function promptTime(value, start) {
    if (!value) return "";
    var d = new Date(value);
    return start && new Date(start).toDateString() === d.toDateString() ? d.toLocaleTimeString() : d.toLocaleString();
  }
  function span(a, b) {
    if (!a || !b) return "";
    var s = Math.round((b - a) / 1000);
    return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";
  }
  function usageText(u) {
    return "in " + n(u.input) + " · out " + n(u.output) + " · cache read " + n(u.cacheRead) + " · cache write " + n(u.cacheWrite);
  }
  function promptPreview(prompts) {
    if (!prompts.length || !prompts[0].text) return "";
    return String(prompts[0].text).replace(/\s+/g, " ").trim();
  }

  function section(label, cls, text) {
    var box = el("details", "entry " + cls);
    box.appendChild(el("summary", "", label));
    if (text !== undefined) box.appendChild(el("div", "detail", text));
    return box;
  }
  function objectLinks(parent, objects) {
    // A call's arguments and its result often name the same object: one link per object in an entry.
    var seen = parent.vertexLinks || (parent.vertexLinks = new Set());
    (objects || []).forEach(function (object) {
      var key = JSON.stringify([object.object_name || "", object.object_type || "", object.path || ""]);
      if (seen.has(key)) return;
      seen.add(key);
      var link = el("button", "recording-link", "Open current object: " + (object.object_name || object.path));
      link.type = "button";
      link.title = "Opens the current source; it may have changed since this conversation.";
      link.onclick = function () { vscode.postMessage({ action: "openObject", object: object }); };
      parent.appendChild(link);
    });
  }
  /* Claude Code's own steps and the review, read as what they did rather than as JSON. */
  function fileName(file) { return String(file || "").split(/[\\/]/).filter(Boolean).pop() || String(file || ""); }
  // A tool call's arguments, from its JSON when the log has no structured copy (SAP tools).
  function argsOf(d) {
    if (d.input) return d.input;
    try { var parsed = JSON.parse(d.text.slice(d.text.indexOf("\n") + 1)); return parsed && typeof parsed === "object" ? parsed : null; } catch (e) { return null; }
  }
  function stepTitle(d) {
    var name = d.name || d.text.split("\n")[0], input = d.input || {};
    if (!d.step) {
      var a = argsOf(d) || {};
      var what = [a.object_type, a.object_name, a.method_name || a.include].filter(function (x) { return x && x !== "main"; }).join(" ") || a.query || a.pattern || "";
      return what ? name + ": " + String(what).slice(0, 90) : name;
    }
    if (name === "Bash") return "Bash: " + (input.description || String(input.command || "").split("\n")[0]).slice(0, 90);
    if (name === "Read" || name === "Edit" || name === "Write") return name + ": " + fileName(input.file_path);
    if (name === "Grep" || name === "Glob") return name + ": " + String(input.pattern || "").slice(0, 90);
    if (name === "Review") return "Review: " + (input.files || []).length + " file" + ((input.files || []).length === 1 ? "" : "s");
    return name;
  }
  function line(target, label, value) {
    var row = el("div", "step-line");
    row.appendChild(el("span", "label", label));
    row.appendChild(document.createTextNode(String(value)));
    target.appendChild(row);
  }
  function diffBlock(target, removed, added) {
    var box = el("pre", "step-diff");
    String(removed).split("\n").forEach(function (s) { box.appendChild(el("span", "del", "− " + s)); });
    String(added).split("\n").forEach(function (s) { box.appendChild(el("span", "add", "+ " + s)); });
    target.appendChild(box);
  }
  /* An object's fields as "name: value" lines: a long text cut, a nested value compact, a JSON list kept in a string
     (a system's connection, say) read as its items. Null when the text is not a JSON object. */
  function fields(target, value) {
    var object = value;
    if (typeof value === "string") { try { object = JSON.parse(value); } catch (e) { return false; } }
    if (!object || typeof object !== "object" || Array.isArray(object)) return false;
    var box = el("div", "step-fields");
    Object.keys(object).forEach(function (key) {
      var v = object[key], shown;
      if (typeof v === "string" && /^\s*\[/.test(v)) { try { var list = JSON.parse(v); if (Array.isArray(list)) v = list.filter(function (x) { return x !== null && x !== ""; }).join(", "); } catch (e) { /* plain text */ } }
      shown = v === null || v === undefined ? "—" : typeof v === "object" ? JSON.stringify(v) : String(v);
      if (shown.length > 300) shown = shown.slice(0, 300) + " … (" + shown.length + " characters)";
      line(box, key, shown);
    });
    target.appendChild(box);
    return true;
  }
  function drawStep(target, d) {
    var name = d.name, input = d.input || {};
    if (name === "Bash") {
      if (input.description) line(target, "What", input.description);
      target.appendChild(el("div", "detail", "$ " + String(input.command || "")));
      return true;
    }
    if (name === "Read") {
      line(target, "File", input.file_path || "");
      if (input.offset || input.limit) line(target, "Lines", (input.offset || 1) + (input.limit ? " + " + input.limit : ""));
      return true;
    }
    if (name === "Grep" || name === "Glob") {
      line(target, "Pattern", input.pattern || "");
      if (input.path) line(target, "In", input.path);
      if (input.glob) line(target, "Files", input.glob);
      return true;
    }
    if (name === "Edit") {
      line(target, "File", input.file_path || "");
      line(target, "Change", input.old_lines + " line" + (input.old_lines === 1 ? "" : "s") + " → " + input.new_lines + (input.replace_all ? ", every occurrence" : ""));
      if (typeof input.old_string === "string") diffBlock(target, input.old_string, input.new_string || "");
      return true;
    }
    if (name === "Write") {
      line(target, "File", input.file_path || "");
      line(target, "Size", input.lines + " lines, " + input.characters + " characters");
      if (typeof input.content === "string") target.appendChild(el("div", "detail", input.content));
      return true;
    }
    if (name === "Review") {
      if (input.folder) line(target, "Folder", input.folder);
      var table = el("table");
      var head = el("tr"); ["File", "Decision", "Reason"].forEach(function (h) { head.appendChild(el("th", "", h)); }); table.appendChild(head);
      (input.files || []).forEach(function (f) {
        var row = el("tr");
        row.appendChild(el("td", "", f.file || ""));
        row.appendChild(el("td", "", f.decision || ""));
        row.appendChild(el("td", "", f.reason || f.error || ""));
        table.appendChild(row);
      });
      var scroll = el("div", "table-scroll"); scroll.appendChild(table); target.appendChild(scroll);
      return true;
    }
    return false;
  }
  function conversation(p) {
    var body = el("div", "conversation");
    var user = section("User" + ((p.screenshots || []).length ? " · " + p.screenshots.length + " screenshot" + (p.screenshots.length === 1 ? "" : "s") : ""), "user", p.text);
    objectLinks(user, p.objects);
    (p.screenshots || []).forEach(function (shot, i) {
      if (!shot.file) { user.appendChild(el("div", "kind", "Screenshot " + (i + 1) + " (not saved: questions are not logged)")); return; }
      var link = el("button", "recording-link", "Open screenshot " + (i + 1));
      link.type = "button";
      link.onclick = function () { vscode.postMessage({ action: "openScreenshot", file: shot.file }); };
      user.appendChild(link);
    });
    body.appendChild(user);
    var answers = p.details.filter(function (d) { return d.type === "answer"; });
    if (answers.length) {
      var answer = section("Model answer", "model");
      answers.forEach(function (d, i) {
        if (answers.length > 1) answer.appendChild(el("div", "kind", "Response " + (i + 1)));
        answer.appendChild(el("div", "detail", d.text));
        objectLinks(answer, d.objects);
      });
      body.appendChild(answer);
    }
    var tools = p.details.filter(function (d) { return d.type === "tool" || d.type === "tool result"; });
    var modelSteps = (p.timeline || []).filter(function (t) { return t.kind === "model"; });
    if (tools.length || modelSteps.length) {
      var calls = tools.filter(function (d) { return d.type === "tool"; });
      // One timeline when the log has the model's calls: each model step with its tokens, then the tools it called.
      var steps = modelSteps.length > 0;
      var toolBox = section(steps ? "Steps (" + modelSteps.length + " model call" + (modelSteps.length === 1 ? "" : "s") + ", " + calls.length + " tool" + (calls.length === 1 ? "" : "s") + ")"
        : "Tools (" + calls.length + " calls)", "technical");
      if (steps) toolBox.open = true;
      var entries = new Map();
      function appendEntry(target, d) {
        if (d.type === "tool" && d.step && drawStep(target, d)) { objectLinks(target, d.objects); return; }
        target.appendChild(el("div", "kind", d.type === "tool" ? "Arguments" : "Result"));
        if (d.recording) {
          var link = el("button", "recording-link", (d.recording.kind === "transpiler" ? "Open transpiler recording " : "Open SAP debug recording ") + d.recording.id.slice(0, 8));
          link.type = "button";
          link.onclick = function () { vscode.postMessage({ action: "openRecording", recording: d.recording }); };
          target.appendChild(link);
        }
        var text = d.type === "tool" ? d.text.slice(d.text.indexOf("\n") + 1) : d.text;
        // Fields as lines where the text is a JSON object; anything else as it is.
        if (!fields(target, text)) target.appendChild(el("div", "detail", text));
        objectLinks(target, d.objects);
      }
      var byId = new Map(calls.map(function (d) { return [d.tool_id, d]; }));
      function addCall(d, into) {
        var entry = section(stepTitle(d), "technical");
        if (d.tool_id) entries.set(d.tool_id, entry);
        appendEntry(entry, d);
        (into || toolBox).appendChild(entry);
      }
      if (steps) {
        // Each model call is a group: its line on top, the tools it called indented under it.
        var k = 0, placed = new Set(), group = null;
        p.timeline.forEach(function (t) {
          if (t.kind === "model") {
            var u = t.usage || {};
            group = el("div", "model-group");
            var head = el("div", "model-step");
            head.appendChild(el("strong", "", "Model step " + (++k)));
            head.appendChild(document.createTextNode(" · in " + n(u.input_tokens) + " · out " + n(u.output_tokens)
              + " · cache read " + n(u.cache_read_input_tokens) + " · cache write " + n(u.cache_creation_input_tokens)));
            group.appendChild(head);
            toolBox.appendChild(group);
          } else if (t.kind === "tool" && byId.has(t.tool_id) && !placed.has(t.tool_id)) {
            placed.add(t.tool_id); addCall(byId.get(t.tool_id), group);
          } else if (t.kind === "note") {
            var note = el("div", "step-note " + t.note);
            note.appendChild(el("span", "label", t.note === "thinking" ? "Thinking" : "Claude"));
            note.appendChild(document.createTextNode(t.text));
            (group || toolBox).appendChild(note);
          }
        });
        calls.forEach(function (d) { if (!placed.has(d.tool_id)) addCall(d); });
      } else calls.forEach(function (d) { addCall(d); });
      tools.filter(function (d) { return d.type === "tool result"; }).forEach(function (d) {
        var entry = d.tool_id && entries.get(d.tool_id);
        if (!entry) { entry = section("Tool result", "technical"); toolBox.appendChild(entry); }
        appendEntry(entry, d);
      });
      body.appendChild(toolBox);
    }
    p.details.forEach(function (d) {
      if (d.type === "answer" || d.type === "tool" || d.type === "tool result") return;
      var label = d.type === "Model request and context" ? "Request and context" : d.type;
      if (d.snapshot) label = d.snapshot.kind === "uml" ? "Recorded UML" : "Recorded metrics";
      var detail = section(label, "technical", d.text);
      objectLinks(detail, d.objects);
      if (d.snapshot) {
        var open = el("button", "recording-link", "Open recorded " + (d.snapshot.kind === "uml" ? "UML" : "metrics"));
        open.type = "button";
        open.onclick = function () { vscode.postMessage({ action: "openSnapshot", snapshot: d.snapshot }); };
        detail.appendChild(open);
      }
      body.appendChild(detail);
    });
    return body;
  }

  function render(report) {
    selected.clear(); selectionChanged();
    content.textContent = "";
    if (!report.configured) { status.className = "muted"; status.textContent = "No log folder is set. Choose a folder to read session logs from."; return; }
    if (!report.sessions.length) { status.className = "muted"; status.textContent = "No sessions in " + report.folder + "."; return; }
    var total = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 };
    report.sessions.forEach(function (s) { for (var k in total) total[k] += s.usage[k]; });
    status.className = "muted";
    status.textContent = report.sessions.length + " sessions in " + report.folder;
    content.appendChild(el("div", "totals", "Total: " + usageText(total)));

    report.sessions.forEach(function (s) {
      var box = el("details", "session");
      var head = el("summary");
      var select = el("input", "select-session");
      select.type = "checkbox";
      select.setAttribute("aria-label", "Select conversation " + s.provider + " " + time(s.start));
      select.onclick = function (event) { event.stopPropagation(); };
      select.onchange = function () { if (select.checked) selected.add(s.id); else selected.delete(s.id); selectionChanged(); };
      head.appendChild(select);
      head.appendChild(el("span", "provider", s.provider));
      head.appendChild(el("span", "", time(s.start)));
      head.appendChild(el("span", "muted", span(s.start, s.end)));
      head.appendChild(el("span", "muted", s.prompts.length + " prompts"));
      head.appendChild(el("span", "muted", usageText(s.usage)));
      var preview = promptPreview(s.prompts);
      if (preview) {
        var excerpt = el("span", "preview muted", preview);
        excerpt.title = preview;
        head.appendChild(excerpt);
      }
      box.appendChild(head);

      var table = el("table");
      var hr = el("tr");
      ["Conversation", "Model", "In", "Out", "Cache read", "Time"].forEach(function (h, i) { hr.appendChild(el("th", i === 5 ? "time" : i > 1 ? "num" : "", h)); });
      table.appendChild(hr);
      var several = s.prompts.length > 1;
      s.prompts.forEach(function (p) {
        var row = el("tr", several ? "compact" : "");
        var cell = el("td");
        if (several) {
          // One narrow line per prompt; its conversation opens under the line.
          var prompt = el("details", "prompt");
          var line = el("summary", "", promptPreview([p]) || "(no prompt text)");
          line.title = promptPreview([p]);
          prompt.appendChild(line);
          prompt.appendChild(conversation(p));
          prompt.ontoggle = function () { row.className = prompt.open ? "" : "compact"; };
          cell.appendChild(prompt);
        } else cell.appendChild(conversation(p));
        row.appendChild(cell);
        row.appendChild(el("td", "", p.model));
        row.appendChild(el("td", "num", n(p.usage.input)));
        row.appendChild(el("td", "num", n(p.usage.output)));
        row.appendChild(el("td", "num", n(p.usage.cacheRead)));
        row.appendChild(el("td", "time", promptTime(p.time, s.start)));
        table.appendChild(row);
      });
      var scroll = el("div", "table-scroll");
      scroll.appendChild(table);
      box.appendChild(scroll);
      content.appendChild(box);
    });
  }

  window.addEventListener("message", function (event) {
    var m = event.data || {};
    if (m.action === "data") render(m.report);
    if (m.action === "error") { status.className = "error"; status.textContent = m.error; }
  });
  vscode.postMessage({ action: "ready" });
})();
</script>
</body>
</html>

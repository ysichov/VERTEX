<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
<title>VERTEX Session Logs</title>
<style>
  /* Every surface follows the active VS Code theme. */
  body {
    margin: 0; padding: 12px 16px;
    background: var(--vscode-editor-background); color: var(--vscode-editor-foreground);
    font-family: var(--vscode-font-family); font-size: var(--vscode-font-size);
  }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 1.2em; margin: 0 auto 0 0; }
  button {
    background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground);
    border: 1px solid var(--vscode-button-border, transparent); padding: 3px 10px; cursor: pointer; font: inherit;
  }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button:disabled { opacity: .5; cursor: default; }
  .select-session { accent-color: var(--vscode-focusBorder); }
  .recording-link { margin: 4px 8px; color: var(--vscode-textLink-foreground); background: transparent; border: 0; padding: 0; text-decoration: underline; }
  .recording-link:focus-visible { outline: 1px solid var(--vscode-focusBorder); }
  .muted { color: var(--vscode-descriptionForeground); }
  .error { color: var(--vscode-errorForeground); }
  .totals { margin: 6px 0 12px; }
  details.session { content-visibility: auto; contain-intrinsic-size: auto 110px; border: 1px solid var(--vscode-panel-border); background: var(--vscode-editorWidget-background); margin-bottom: 6px; }
  details.session > summary { padding: 6px 8px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
  .session-heading { flex: 1; min-width: 0; }
  .continue-session { flex: none; white-space: nowrap; }
  details.session > summary .preview { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; color: var(--vscode-descriptionForeground); font-size: 0.9em; }
  .provider { font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }
  table.prompt-table { min-width: 1140px; table-layout: fixed; }
  th, td { text-align: left; padding: 4px 8px; border-top: 1px solid var(--vscode-editorWidget-border, var(--vscode-panel-border)); vertical-align: top; }
  th { color: var(--vscode-descriptionForeground); font-weight: 600; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.prompt-cell { overflow: hidden; }
  td.identity { white-space: nowrap; }
  .identity-label { width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.identity > .muted { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .conversation { min-width: 240px; }
  /* The prompt's time takes only the width it needs: the date is in the session line above. */
  td.time, th.time { white-space: nowrap; }
  /* A session of several prompts opens as one narrow line per prompt; a line opens its conversation. */
  details.prompt > summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; min-width: 100%; }
  details.prompt > summary:hover { background: var(--vscode-list-hoverBackground); }
  details.prompt[open] > summary { color: var(--vscode-descriptionForeground); }
  tr.compact > td { padding-top: 2px; padding-bottom: 2px; }
  .entry { --entry-color: var(--vscode-descriptionForeground); margin: 6px 0; background: transparent; }
  /* No coloured bar at the side: the block's kind reads from its title colour. A block inside a block (a step in
     Steps, a call in Tools) is separated from the one before by a thin rule above. */
  .entry .entry { margin: 0; border-top: 1px solid var(--vscode-panel-border); }
  .entry .entry > summary { font-weight: normal; color: var(--vscode-editor-foreground); }
  .provider { color: var(--vscode-charts-purple, var(--vscode-textLink-foreground)); }
  .session-models, .prompt-model { color: var(--vscode-editor-foreground); }
  .preview, .prompt > summary { color: var(--vscode-charts-blue, var(--vscode-textLink-foreground)); }
  .entry.user { --entry-color: var(--vscode-charts-blue, var(--vscode-textLink-foreground)); }
  .entry.model { --entry-color: var(--vscode-charts-green, var(--vscode-textLink-foreground)); }
  .entry > summary { padding: 6px 8px; cursor: pointer; color: var(--entry-color); font-weight: 600; }
  .entry > summary:hover { background: var(--vscode-list-hoverBackground); }
  /* A failed request reads as a failure in the list, without opening it. */
  .entry.failed > summary { color: var(--vscode-errorForeground); }
  table.jev-table { width: 100%; margin: 4px 0; }
  table.jev-table td { vertical-align: top; }
  td.jev-about { max-width: 420px; overflow-wrap: anywhere; }
  td.jev-answer { font-weight: 600; }
  td.jev-odds { color: var(--vscode-descriptionForeground); font-size: 0.9em; }
  td.jev-odds .chosen { color: var(--vscode-foreground); font-weight: 600; }
  .topic-cell { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topic-continue { font-weight: 600; padding: 0 8px; }
  .prompt-count { font-weight: 600; color: var(--vscode-foreground); }
  summary:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .detail { margin: 0; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--vscode-editor-foreground); }
  .technical .detail { background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background)); font-family: var(--vscode-editor-font-family); font-size: 0.9em; }
  .entry-body { padding: 0 8px 4px; }
  .kind { padding: 4px 8px; color: var(--entry-color); font-size: 0.9em; }
  .table-scroll { overflow-x: auto; }
  table.session-table { table-layout: fixed; width:100%; }
  /* At least the fixed columns plus room for the question: below that the pane scrolls instead of hiding it. */
  table.conversation-table { table-layout: fixed; width:100%; }
  table.conversation-table th { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.conversation-title { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--vscode-textLink-foreground); }
  td.conversation-body { padding: 0 0 8px 24px; }
  .conversation-actions{position:sticky;top:0;z-index:3;padding:6px 0;background:var(--vscode-editor-background);border-bottom:1px solid var(--vscode-panel-border)}
  .conversation-actions[hidden]{display:none}
  .conversation-actions>.list-tools{margin:0;gap:6px}
  .action-conversation{max-width:min(50%,450px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.actions { white-space:nowrap; overflow:hidden; }
  td.actions button { vertical-align:middle; }
  table.conversation-table > tr > td:not(.conversation-body),table.session-table > tr > td:not(.prompt-cell) { overflow:hidden; text-overflow:ellipsis; }
  .conversation-holder { contain:layout style; }
  td.actions button + button { margin-left: 6px; }
  tr.conversation-row.technical > td { opacity: 0.6; }
  .list-tools[hidden]{display:none}
  .list-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
  .kind-filter { color: var(--vscode-descriptionForeground); white-space: nowrap; }
  .conversation-place { display: block; color: var(--vscode-descriptionForeground); font-size: 0.9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-context { font: inherit; padding: 3px 6px; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, var(--vscode-panel-border)); }
  .log-search { flex: 1; max-width: 420px; padding: 3px 6px; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, var(--vscode-panel-border)); }
  table.session-table th { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th.sortable { cursor: pointer; }
  tr.technical > td { opacity: 0.6; }
  tr.technical > td.topic-cell { font-weight: normal; font-style: italic; overflow: hidden; text-overflow: ellipsis; }
  th.sorted { color: var(--vscode-foreground); }
  .col-grip { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; }
  .col-grip:hover { background: var(--vscode-focusBorder); }
  body.dragging, body.dragging * { cursor: col-resize!important; user-select:none!important; }
  .column-guide { position:fixed;top:0;bottom:0;width:2px;background:var(--vscode-focusBorder);pointer-events:none;z-index:1000; }
  /* Claude Code's steps: an edit as removed and added lines, in the theme's diff colours; each model call a line. */
  .step-diff { margin: 0; padding: 4px 0; font-family: var(--vscode-editor-font-family); font-size: 0.9em; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background)); }
  .step-diff .del, .step-diff .add { display: block; padding: 0 8px; }
  .step-diff .del { background: var(--vscode-diffEditor-removedLineBackground, var(--vscode-diffEditor-removedTextBackground)); }
  .step-diff .add { background: var(--vscode-diffEditor-insertedLineBackground, var(--vscode-diffEditor-insertedTextBackground)); }
  .step-line { padding: 2px 8px; }
  .step-line .label { color: var(--vscode-descriptionForeground); margin-right: 6px; }
  .model-step { margin: 0; padding: 6px 8px 4px; color: var(--vscode-descriptionForeground); font-size: 0.9em; border-top: 1px solid var(--vscode-panel-border); }
  .model-step strong { color: var(--vscode-editor-foreground); margin-right: 4px; }
  /* The tools a model step called sit indented under it, so the step reads as their parent. */
  .model-group > .entry, .model-group > .step-note { margin-left: 18px; }
  /* What Claude said or thought between its steps: the panel's "Claude reasoning", kept in the timeline. */
  .step-note { padding: 4px 8px; white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid var(--vscode-panel-border); }
  .step-note .label { display: block; color: var(--vscode-descriptionForeground); font-size: 0.85em; margin-bottom: 2px; }
  .entry.user > .detail, .entry.model > .detail { color: var(--entry-color); }
  .step-note { color: var(--vscode-charts-green, var(--vscode-textLink-foreground)); }
  .step-note.thinking { color: #4f46e5; }
  body.vscode-dark .step-note.thinking, body.vscode-high-contrast .step-note.thinking { color: #a5b4fc; }
  @media (prefers-color-scheme: dark) { body:not([class*="vscode-"]) .step-note.thinking { color: #a5b4fc; } }
  .step-note .label, .step-note .detail { color: inherit; }
  .markdown { white-space: normal; }
  .technical .step-note .detail { background: transparent; font: inherit; padding: 0; }
  .markdown p { margin: 0 0 6px; }
  .markdown p:last-child { margin-bottom: 0; }
  .markdown pre { white-space: pre-wrap; background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background)); padding: 8px; }
  .markdown code { font-family: var(--vscode-editor-font-family); }
  .markdown ul, .markdown ol { margin: 4px 0; padding-left: 24px; }
  .markdown .md-table { overflow-x: auto; margin: 6px 0; }
  .markdown .md-table table { border-collapse: collapse; }
  .markdown .md-table th, .markdown .md-table td { border: 1px solid var(--vscode-panel-border); padding: 3px 8px; text-align: left; vertical-align: top; }
  .markdown .md-table th { background: var(--vscode-editorWidget-background, var(--vscode-editor-background)); font-weight: 600; }
  .step-fields { margin: 0; padding: 4px 0; font-size: 0.9em; }
  .step-fields .step-line { font-family: var(--vscode-editor-font-family); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Session Logs</h1>
  <button id="folder">Choose Folder…</button>
  <button id="settings">Log Settings</button>
  <button id="refresh" title="Refresh session logs" aria-label="Refresh session logs">↻</button>
  <button id="clear-conversations" disabled>Clear selected conversations</button>
</header>
<div id="status" class="muted">Loading…</div>
<div class="muted">Enable <code>vertex.ai.log.request</code> to see VERTEX instructions and context for new prompts.</div>
<div id="content"></div>
<script nonce="{{NONCE}}">
(function () {
  "use strict";
  var vscode = acquireVsCodeApi();
  var status = document.getElementById("status");
  var content = document.getElementById("content");
  var selected = new Set();
  var clear = document.getElementById("clear-conversations");
  clear.onclick = function () { vscode.postMessage({ action: "clearConversations", ids: Array.from(selected) }); };
  function selectionChanged() { clear.disabled = selected.size === 0; }
  document.getElementById("refresh").onclick = function () { vscode.postMessage({ action: "refresh" }); };
  document.getElementById("folder").onclick = function () { vscode.postMessage({ action: "chooseFolder" }); };
  document.getElementById("settings").onclick = function () { vscode.postMessage({ action: "settings" }); };

    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

    if (!token) return;

    // A cited step of a transpiler run: a link once the run is known (runLinks), plain text otherwise.
    if (cite) { node = document.createElement('span'); node.className = 'run-cite'; node.dataset.kind = cite[1]; node.dataset.run = cite[2]; node.dataset.step = cite[3]; node.textContent = token; }
    else if (/^\x60[^\x60]+\x60$/.test(token)) { node = document.createElement('code'); node.textContent = token.slice(1, -1); }
    else if (/^\*\*[^*]+\*\*$/.test(token)) { node = document.createElement('strong'); node.textContent = token.slice(2, -2); }

  function richText(text) {
    var node = el("div", "detail markdown");
    markdown(String(text || ""), node);
    return node;
  }
  function n(value) { return Number(value || 0).toLocaleString(); }
  function time(value) {

    content.appendChild(el("div", "totals", "Total: " + usageText(total)));

    // One row per conversation; Search and Hide technical filter them, the headings sort, the edges widen.
    var tools = el("div", "list-tools");
    var search = el("input", "log-search");
    search.type = "search"; search.placeholder = "Search questions, providers, models"; search.value = listState.query;
    search.setAttribute("aria-label", "Search conversations");
    tools.appendChild(search);
    content.appendChild(tools);
    var actionPanel=el("div","list-tools conversation-actions");actionPanel.hidden=true;
    actionPanel.setAttribute("aria-label","Actions for the selected conversation");content.appendChild(actionPanel);
    var chat = function (p) { return p.operation === "Chat" || p.operation === "Web search"; };
    // Technical conversations by kind (topic tagging, context optimization...): a checkbox each shows or hides that kind.
    var kindOf = function (s) { return String((s.prompts[0] && s.prompts[0].operation) || "Technical").replace(/ with Jev.*$/, ""); };
    var kinds = {};
    report.sessions.forEach(function (s) { if (!s.prompts.some(chat) && !internal(s)) kinds[kindOf(s)] = (kinds[kindOf(s)] || 0) + 1; });
    var kindBoxes = {};
    Object.keys(kinds).sort().forEach(function (kind) {
      if (!Object.prototype.hasOwnProperty.call(listState.hiddenKinds, kind)) listState.hiddenKinds[kind] = kind !== "Jev evaluation";
      var box = el("input"); box.type = "checkbox"; box.checked = !listState.hiddenKinds[kind];
      var label = el("label", "kind-filter");
      label.title = "Show the " + kinds[kind] + " technical conversation(s) of this kind";
      // The count stays in the hover: nine filters with their numbers spelled out wrap onto a second row.
      label.appendChild(box); label.appendChild(document.createTextNode(" " + kind));
      tools.appendChild(label);
      kindBoxes[kind] = box;
    });
    // Folders and systems the conversations were held in, each with its count. Offered only when there is
    // something to choose between; one folder alone is not a filter.
    var held = {};
    report.sessions.forEach(function (s) {
      var key = contextKey(s.context);
      if (!held[key]) held[key] = { key: key, context: s.context, count: 0 };
      held[key].count++;
    });
    var heldKeys = Object.keys(held).filter(function (key) { return key; }).sort();
    var contextSelect = null;
    if (Object.keys(held).length > 1) {
      contextSelect = el("select", "log-context");
      contextSelect.setAttribute("aria-label", "Show conversations held in one folder or SAP system");
      contextSelect.title = "Where the conversation was held: the local folder, or the SAP system";
      var option = function (value, text, hover) {
        var item = el("option", "", text); item.value = value; if (hover) item.title = hover;
        contextSelect.appendChild(item);
      };
      option("", "All folders and systems");
      heldKeys.forEach(function (key) {
        option(key, contextLabel(held[key].context) + " (" + held[key].count + ")", key.slice(key.indexOf(":") + 1));
      });
      if (held[""]) option("none", "Without context (" + held[""].count + ")", "Logged before VERTEX recorded where a conversation was held");
      contextSelect.value = listState.context || "";
      if (contextSelect.value !== (listState.context || "")) { listState.context = ""; contextSelect.value = ""; }
      tools.appendChild(contextSelect);
    } else listState.context = "";
    var anyCost = report.sessions.some(function (s) { return s.usage.cost != null; });
    var columns = [
      { name: "", cls: "select-cell", width: 34, nosort: true },
      { name: "Conversation", cls: "", width: null, value: function (s) { return String(promptPreview(s.prompts) || "").toLowerCase(); } },
      { name: "Prompts", cls: "num", width: 70, num: true, value: function (s) { return s.prompts.filter(chat).length || s.prompts.length; } },
      { name: "Providers", cls: "", width: 170, value: function (s) { return s.provider + " " + (s.models || []).join(" "); } },
      { name: "New in", cls: "num", width: 75, num: true, value: function (s) { return s.usage.input || 0; } },
      { name: "Out", cls: "num", width: 70, num: true, value: function (s) { return s.usage.output || 0; } },
      { name: "Cache read", cls: "num", width: 90, num: true, value: function (s) { return s.usage.cacheRead || 0; } },
      { name: "Cost USD", cls: "num", width: 80, num: true, value: function (s) { return s.usage.cost || 0; } },
      { name: "Duration", cls: "time", width: 75, num: true, value: function (s) { return (s.end || 0) - (s.start || 0); } },
      { name: "Time", cls: "time", width: 125, num: true, value: function (s) { return s.end || 0; } }];
    if (!anyCost) columns = columns.filter(function (column) { return column.name !== "Cost USD"; });
    var list = el("table", "conversation-table"), records = [];
    sortableHead(list, columns, records);
    report.sessions.forEach(function (s) {
      var main = el("tr", "conversation-row"), detail = el("tr", "conversation-detail");
      var technical = !s.prompts.some(chat);
      if (technical) main.classList.add("technical");
      var pick = el("td", "select-cell");
      var select = el("input", "select-session");
      select.type = "checkbox";
      select.setAttribute("aria-label", "Select conversation " + s.provider + " " + time(s.start));
      select.onchange = function () { s.fileIds.forEach(function (id) { if (select.checked) selected.add(id); else selected.delete(id); }); selectionChanged(); };
      pick.appendChild(select);
      main.appendChild(pick);
      var preview = promptPreview(s.prompts);
      var title = el("td", "conversation-title");
      var caret = el("span", "caret", "▸");
      title.appendChild(caret);
      title.appendChild(el("span", "preview", " " + (preview || "(no prompt text)")));
      title.title = preview;
      // Where it was held, under the question: with no filter chosen the list mixes places, and the row
      // has to say which one it belongs to. A conversation without a recorded place shows no line.
      if (s.context) {
        var place = el("span", "conversation-place", contextLabel(s.context));
        place.title = s.context.mode === "folder" ? s.context.folder
          : "SAP system " + s.context.system + (s.context.client ? ", client " + s.context.client : "");
        title.appendChild(place);
      }
      title.tabIndex = 0;
      main.appendChild(title);
      var actions = el("div", "list-tools");
      main.appendChild(el("td", "num prompt-count", String(s.prompts.filter(chat).length || s.prompts.length)));
      var models = s.models || [];
      var who = el("td", "identity");
      var whoLabel = el("div", "identity-label");
      whoLabel.title = s.provider + (models.length ? " · " + models.join(", ") : "");
      whoLabel.appendChild(el("span", "provider", s.provider));
      if (models.length) { whoLabel.appendChild(document.createTextNode(" · ")); whoLabel.appendChild(el("span", "session-models", models.join(", "))); }
      who.appendChild(whoLabel);
      main.appendChild(who);
      main.appendChild(el("td", "num", n(s.usage.input)));
      main.appendChild(el("td", "num", n(s.usage.output)));
      main.appendChild(el("td", "num", n(s.usage.cacheRead)));
      if (anyCost) main.appendChild(el("td", "num", s.usage.cost != null ? costText(s.usage) : s.usage.costMissing ? "unavailable" : "-"));
      main.appendChild(el("td", "time", span(s.start, s.end) || "—"));
      main.appendChild(el("td", "time", time(s.end)));
      // Continue this conversation in the VERTEX chat, with all the files it wrote (one per provider it used).
      // VS Code only: the host that has the chat says so; Eclipse's Session Logs show no button.
      if (window.vertexCanContinue && s.prompts.some(chat)) {
        var resume = el("button", "continue-session", "Continue");
        resume.title = "Open this conversation in the VERTEX chat and go on asking: its questions and answers become the history";
        resume.onclick = function (event) { event.preventDefault(); event.stopPropagation(); vscode.postMessage({ action: "continueConversation", id: s.id }); };
        actions.appendChild(resume);
        // Tag topics (Jev): questions logged without a topic get one, so Route topics can leave unrelated ones out.
        var untagged = s.prompts.filter(function (p) { return chat(p) && !p.topic; }).length;
        if (window.vertexCanTagTopics && untagged) {
          var tagTopics = el("button", "continue-session", "Tag topics (Jev)");
          tagTopics.title = "Ask Jev which topic each of the " + untagged + " questions without one belongs to; unclear ones stay untagged and are kept whole";
          tagTopics.onclick = function (event) { event.preventDefault(); event.stopPropagation(); vscode.postMessage({ action: "tagTopics", id: s.id }); };
          actions.appendChild(tagTopics);
        }
      }
      var body = el("td", "conversation-body");
      body.colSpan = columns.length;
      detail.appendChild(body);
      detail.hidden = true;
      var record = { item: s, rows: [main, detail], technical: technical, kind: technical ? kindOf(s) : "", context: contextKey(s.context), open: false, loaded: false,
        text: (s.prompts.map(function (p) { return p.text || ""; }).join(" ") + " " + s.provider + " " + models.join(" ")).toLowerCase() };
      // The questions' table is built the first time the conversation opens, and kept.
      record.toggle = function () {
        actionPanel.textContent="";actionPanel.hidden=!actions.children.length;
        if(actions.children.length){var selectedTitle=el("span","action-conversation",preview);selectedTitle.title=preview;actionPanel.appendChild(selectedTitle);actionPanel.appendChild(actions);}
        record.open = !record.open;
        caret.textContent = record.open ? "▾" : "▸";
        if (record.open && !record.loaded) { record.loaded = true; body.appendChild(promptTable(s)); }
        detail.hidden = !record.open;
      };
      title.addEventListener("click", record.toggle);
      title.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); record.toggle(); } });
      records.push(record);
      list.appendChild(main); list.appendChild(detail);
    });
    var filter = function () {
      listState.query = search.value;
      Object.keys(kindBoxes).forEach(function (kind) { listState.hiddenKinds[kind] = !kindBoxes[kind].checked; });
      if (contextSelect) listState.context = contextSelect.value;
      var q = String(search.value || "").trim().toLowerCase(), shown = 0, want = listState.context || "";
      records.forEach(function (r) {
        var here = !want || (want === "none" ? !r.context : r.context === want);
        var show = here && (!q || r.text.indexOf(q) >= 0) && !(r.technical && (Object.prototype.hasOwnProperty.call(listState.hiddenKinds, r.kind) ? listState.hiddenKinds[r.kind] : r.kind !== "Jev evaluation"));
        if (show) shown++;
        r.rows[0].hidden = !show; r.rows[1].hidden = !show || !r.open;
      });
      // Naming the place keeps an empty list readable: nothing here yet, rather than something broken.
      var where = want === "none" ? "without a recorded place" : want && held[want] ? contextLabel(held[want].context) : "";
      status.textContent = (shown === records.length ? records.length : shown + " of " + records.length)
        + " conversations in " + report.folder + (where ? " · showing " + where : "");
    };
    search.addEventListener("input", filter);
    if (contextSelect) contextSelect.addEventListener("change", filter);
    Object.keys(kindBoxes).forEach(function (kind) { kindBoxes[kind].addEventListener("change", filter); });
    var scroll = el("div", "table-scroll");
    scroll.appendChild(list);
    content.appendChild(scroll);
    filter();
    return records;
  }

  /* A conversation's questions: one row each, its answer opening under it. */
  function promptTable(s) {
    var table = el("table", "session-table");
    // Columns: a click on a heading sorts by it (as in Metrics), the grip on its right edge drags its width.
    var columns = [
      { name: "Conversation", cls: "", width: null, value: function (p) { return String(p.text || "").toLowerCase(); } },
      { name: "Topic", cls: "", width: 70, value: function (p) { return p.topic && p.topic.id ? Number(p.topic.id.slice(6)) : 0; }, num: true },
      { name: "Model", cls: "", width: 150, value: function (p) { return (p.provider || "") + " " + (p.model || ""); } },
      { name: "Context ≈tok", cls: "num", width: 105, value: function (p) { return p.contextSize ? p.contextSize.estimatedTokens : -1; }, num: true },
      { name: "New in", cls: "num", width: 70, value: function (p) { return p.usage.input || 0; }, num: true },
      { name: "Out", cls: "num", width: 65, value: function (p) { return p.usage.output || 0; }, num: true },
      { name: "Cache read", cls: "num", width: 90, value: function (p) { return p.usage.cacheRead || 0; }, num: true },
      { name: "Cost USD", cls: "num", width: 90, value: function (p) { return p.usage.cost || 0; }, num: true },
      { name: "Duration", cls: "time", width: 90, value: function (p) { return (p.end || 0) - (p.time || 0); }, num: true },
      { name: "Time", cls: "time", width: 125, value: function (p) { return p.time || 0; }, num: true }];
    // A conversation whose models report no cost (a subscription) has no Cost column: it would be all dashes.
    var hasCost = s.prompts.some(function (p) { return p.usage && p.usage.cost != null; });
    if (!hasCost) columns = columns.filter(function (column) { return column.name !== "Cost USD"; });
    var rows = [];
    var source=s.prompts.slice(),pageNumber=0,pageSize=30;
    var navigation=el("div","list-tools"),pageLabel=el("span","muted");
    var previousPage=el("button","continue-session","Previous"),nextPage=el("button","continue-session","Next");
    previousPage.type=nextPage.type="button";
    navigation.appendChild(previousPage);navigation.appendChild(pageLabel);navigation.appendChild(nextPage);
    previousPage.onclick=function(){pageNumber--;renderPage();};nextPage.onclick=function(){pageNumber++;renderPage();};
    sortableHead(table,columns,rows,function(column,down){
      source.sort(function(a,b){var x=column.value(a),y=column.value(b);return(x<y?-1:x>y?1:0)*(down?-1:1)||(a.time||0)-(b.time||0);});
      pageNumber=0;renderPage();
    });
    var several = s.prompts.length > 1;
    function renderPrompt(p) {
      var row = el("tr", several ? "compact" : "");
      var cell = el("td", "prompt-cell");
      // The conversation body gets a row of its own, spanning every column, as the conversation list already
      // does: inside the first cell a fixed-layout table squeezes an answer into the Conversation column.
      var detail = el("tr", "prompt-detail");
      var detailBody = el("td", "conversation-body");
      detailBody.colSpan = columns.length;
      detail.appendChild(detailBody);
      detail.hidden = true;
      if (several) {
        // One narrow line per prompt; its conversation opens under the line.
        var prompt = el("details", "prompt");
        var line = el("summary", "", promptPreview([p]) || "(no prompt text)");
        line.title = promptPreview([p]);
        prompt.appendChild(line);
        var promptLoaded = false;
        prompt.ontoggle = function () {
          row.className = prompt.open ? "" : "compact";
          if (prompt.open && !promptLoaded) { promptLoaded = true; detailBody.appendChild(lazyConversation(p)); }
          detail.hidden = !prompt.open;
        };
        cell.appendChild(prompt);
      } else { detail.hidden = false; detailBody.appendChild(lazyConversation(p)); }
      row.appendChild(cell);
      // Its topic, coloured as the chat colours it, so the topics of a conversation can be told apart at a glance.
      var topicCell = el("td", "topic-cell");
      if (p.topic && /^topic_\d{4,8}$/.test(p.topic.id)) {
        var colors = ["blue", "green", "orange", "purple", "red", "yellow"];
        var color = "var(--vscode-charts-" + colors[Number(p.topic.id.slice(6)) % colors.length] + ", var(--vscode-focusBorder))";
        cell.style.borderLeft = "3px solid " + color;
        topicCell.style.color = color;
        topicCell.textContent = "T" + Number(p.topic.id.slice(6));
        topicCell.title = p.topic.id + " · " + (p.topic.label || "");
        var later=s.prompts.slice(s.prompts.indexOf(p)+1).some(function(q){return q.topic&&q.topic.id===p.topic.id;});
        if(window.vertexCanContinue&&!later){
          var topicId=p.topic.id;
          var resumeTopic=el("button","continue-session topic-continue","T"+Number(topicId.slice(6)));
          resumeTopic.style.color=color;
          resumeTopic.title="Continue "+topicCell.title+"; subsequent requests are classified by Jev";
          resumeTopic.onclick=function(event){event.preventDefault();event.stopPropagation();vscode.postMessage({action:"continueConversation",id:s.id,topicId:topicId});};
          topicCell.textContent="";topicCell.appendChild(resumeTopic);
        }


      }
      // A technical request (a commit message, a PR description, a decision...) is not a chat question: muted,
      // with its operation where a topic would be. Continue and Tag topics leave it out.
      if (p.operation && p.operation !== "Chat" && p.operation !== "Web search") {
        row.classList.add("technical");
        topicCell.textContent = p.operation;
        topicCell.title = "Technical request: " + p.operation + " - not a chat question";
      }
      row.appendChild(topicCell);
      var identity = el("td", "identity");
      var modelLabel = el("div", "identity-label");
      modelLabel.title = p.provider + " · " + p.model;
      modelLabel.appendChild(el("span", "provider", p.provider));
      modelLabel.appendChild(document.createTextNode(" · "));
      modelLabel.appendChild(el("span", "prompt-model", p.model));
      identity.appendChild(modelLabel);
      if (p.branch && p.branch !== "main") identity.appendChild(el("div", "muted", "Branch " + p.branch));
      row.appendChild(identity);
      var context = el("td", "num", p.contextSize ? "≈" + n(p.contextSize.estimatedTokens) : "—");
      context.title = p.contextSize ? "Prepared context before sending: " + n(p.contextSize.characters) + " characters. Approximate tokens = characters / 4; not model-tokenizer counts. Includes instructions, history, current prompt, tools and answer schema. Excludes provider-added wrappers, binary images and later tool steps."
        : "Context size was not recorded in this log. Cumulative usage cannot reconstruct it.";
      row.appendChild(context);
      row.appendChild(el("td", "num", n(p.usage.input)));
      row.appendChild(el("td", "num", n(p.usage.output)));
      row.appendChild(el("td", "num", n(p.usage.cacheRead)));
      if (hasCost) row.appendChild(el("td", "num", costText(p.usage)));
      var duration = el("td", "time", span(p.time, p.end) || "—");
      duration.title = "Elapsed time from the prompt to its last recorded assistant response";
      row.appendChild(duration);
      row.appendChild(el("td", "time", promptTime(p.time, s.start)));
      rows.push({ item: p, rows: [row, detail] });
      table.appendChild(row);
      table.appendChild(detail);
    }
    function renderPage(){
      rows.forEach(function(record){record.rows.forEach(function(row){row.remove();});});rows.length=0;
      var start=pageNumber*pageSize,end=Math.min(start+pageSize,source.length);
      source.slice(start,end).forEach(renderPrompt);
      navigation.hidden=source.length<=pageSize;previousPage.disabled=pageNumber===0;nextPage.disabled=end>=source.length;
      pageLabel.textContent=(start+1)+"–"+end+" of "+source.length+" questions";
    }
    renderPage();
    var scroll = el("div", "table-scroll");
    scroll.appendChild(navigation);scroll.appendChild(table);
    return scroll;
  }


  window.addEventListener("message", function (event) {
    var m = event.data || {};
    if (m.action === "data") { lastReport = m.report; render(m.report); }
    if (m.action === "promptDetail") { var waiting = waitingDetail[m.key] || []; delete waitingDetail[m.key]; waiting.forEach(function (done) { done(m); }); }
    if (m.action === "error") { status.className = "error"; status.textContent = m.error; }
  });
  vscode.postMessage({ action: "ready" });
})();
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VERTEX Versions</title>
<style>
  /* Same three-way palette as the other pages, for the same reason: the hosts
     report the theme differently. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #1c1c1c;
    --muted: #666666;
    --faint: #b0b0b0;
    --border: #d6d6d6;
    --line: #e2e2e2;
    --surface: #fbfbfb;
    --surface-2: #f0f0f0;
    --field-bg: #ffffff;
    --field-border: #b8b8b8;
    --hover: #eaf2fb;
    --th-bg: #eef2f7;
    --selected: #dbe6f4;
    --row-alt: #fafafa;
    --danger: #a5292a;
    --ins-bg: #e8f6ea;
    --ins-mark: #2c7a39;
    --del-bg: #fdecec;
    --del-mark: #a5292a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1f1f1f;
      --fg: #d4d4d4;
      --muted: #9d9d9d;
      --faint: #5a5a5a;
      --border: #3c3c3c;
      --line: #333333;
      --surface: #252526;
      --surface-2: #2d2d30;
      --field-bg: #3c3c3c;
      --field-border: #5a5a5a;
      --hover: #2a3d55;
      --th-bg: #2b3a4a;
      --selected: #35506b;
      --row-alt: #232323;
      --danger: #f48771;
      --ins-bg: #17301c;
      --ins-mark: #6cc07a;
      --del-bg: #3a1f1f;
      --del-mark: #f48771;
    }
  }

  body.vscode-light {
    color-scheme: light;
    --bg: var(--vscode-editor-background, #ffffff); --fg: var(--vscode-editor-foreground, #1c1c1c); --muted: var(--vscode-descriptionForeground, #666666); --faint: var(--vscode-disabledForeground, #b0b0b0);
    --border: var(--vscode-panel-border, #d6d6d6); --line: var(--vscode-editorWidget-border, #e2e2e2); --surface: var(--vscode-editorWidget-background, #fbfbfb); --surface-2: var(--vscode-sideBar-background, #f0f0f0);
    --field-bg: var(--vscode-input-background, #ffffff); --field-border: var(--vscode-input-border, #b8b8b8); --hover: var(--vscode-list-hoverBackground, #eaf2fb);
    --th-bg: var(--vscode-keybindingTable-headerBackground, #eef2f7); --selected: var(--vscode-list-activeSelectionBackground, #dbe6f4); --row-alt: var(--vscode-tree-tableOddRowsBackground, #fafafa); --danger: var(--vscode-errorForeground, #a5292a);
    --ins-bg: #e8f6ea; --ins-mark: #2c7a39; --del-bg: #fdecec; --del-mark: #a5292a;
  }

  body.vscode-dark, body.vscode-high-contrast {
    color-scheme: dark;
    --bg: var(--vscode-editor-background, #1f1f1f); --fg: var(--vscode-editor-foreground, #d4d4d4); --muted: var(--vscode-descriptionForeground, #9d9d9d); --faint: var(--vscode-disabledForeground, #5a5a5a);
    --border: var(--vscode-panel-border, #3c3c3c); --line: var(--vscode-editorWidget-border, #333333); --surface: var(--vscode-editorWidget-background, #252526); --surface-2: var(--vscode-sideBar-background, #2d2d30);
    --field-bg: var(--vscode-input-background, #3c3c3c); --field-border: var(--vscode-input-border, #5a5a5a); --hover: var(--vscode-list-hoverBackground, #2a3d55);
    --th-bg: var(--vscode-keybindingTable-headerBackground, #2b3a4a); --selected: var(--vscode-list-activeSelectionBackground, #35506b); --row-alt: var(--vscode-tree-tableOddRowsBackground, #232323); --danger: var(--vscode-errorForeground, #f48771);
    --ins-bg: #17301c; --ins-mark: #6cc07a; --del-bg: #3a1f1f; --del-mark: #f48771;
  }

  html, body { margin: 0; padding: 0; height: 100%; }
  body { font: 12px "Segoe UI", system-ui, sans-serif; color: var(--fg);
         background: var(--bg); }

  button { padding: 2px 8px; font: inherit; cursor: pointer; color: var(--fg);
           background: var(--field-bg); border: 1px solid var(--field-border); }
  button:hover { background: var(--hover); }

  .app { display: flex; flex-direction: column; height: 100%; }
  .bar { padding: 6px 10px; background: var(--surface);
         border-bottom: 1px solid var(--border); display: flex;
         align-items: center; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; }
  .bar .status { margin-left: auto; color: var(--muted); }
  .bar select, .bar input { font: inherit; padding: 2px 4px; color: var(--fg);
                            background: var(--field-bg);
                            border: 1px solid var(--field-border); }
  .bar input { width: 240px; text-transform: uppercase; }

  /* What this system does not have, when a part of the window is left out. */
  .missing { padding: 4px 10px; color: var(--danger); background: var(--surface);
             border-bottom: 1px solid var(--line); }

  /* Finding transport requests by whose they are. Only there for TR. */
  .bar .finder { display: flex; align-items: center; gap: 6px; }
  .bar .finder #user { width: 110px; }
  .bar .finder label { display: flex; align-items: center; gap: 3px; color: var(--muted); }
  .bar .finder input[type=checkbox] { width: auto; margin: 0; padding: 0; }

  .panes { flex: 1 1 auto; display: flex; min-height: 0; }

  .parts { flex: 0 0 280px; border-right: 1px solid var(--border);
           background: var(--surface); overflow: auto; }
  .parts-head { padding: 5px 6px 5px 10px; background: var(--surface-2);
                border-bottom: 1px solid var(--line); font-weight: 600;
                position: sticky; top: 0; display: flex; align-items: center; }
  .parts-head .title { margin-right: auto; }
  .parts-head button { padding: 0 6px; }

  /* Folded away, the parts keep a strip with the button that brings them
     back; the width they had comes back with them. */
  .parts.folded { flex-basis: 24px !important; overflow: hidden; }
  .parts.folded #partlist { display: none; }
  .parts.folded .parts-head { flex-direction: column; padding: 5px 0; gap: 6px; }
  .parts.folded .parts-head .title { margin: 0; writing-mode: vertical-rl; }

  /* The line between the parts and the versions, dragged to share the width. */
  .splitter { flex: 0 0 3px; margin-left: -2px; cursor: col-resize; z-index: 3; }
  .splitter:hover, .splitter.dragging { background: var(--selected); }
  body.dragging { cursor: col-resize; user-select: none; }
  .part { padding: 3px 10px; cursor: pointer; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .part:hover { background: var(--hover); }
  .part.on { background: var(--selected); font-weight: 600; }
  .part .kind { color: var(--muted); font-weight: normal; margin-left: 6px; }

  /* The parts as a table, the type and then the name, headed by the object
     they belong to. */
  .parts-object { padding: 5px 10px; font-weight: 600; font-family: Consolas, monospace;
                  border-bottom: 1px solid var(--line); white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
  .parts table { table-layout: fixed; }
  .parts th { position: static; }
  .parts th:first-child, .parts td:first-child { width: 52px; }
  .parts td { overflow: hidden; text-overflow: ellipsis; }
  .parts tbody tr.on td { background: var(--selected); font-weight: 600; }

  /* Visibility, the way SE80 marks it: public a green square, protected a
     yellow diamond, private a red circle. */
  .vis { display: inline-block; width: 8px; height: 8px; }
  .parts table.sectioned th:first-child, .parts table.sectioned td:first-child { width: 10px; padding-right: 0; }
  .parts table.sectioned th:nth-child(2) { width: 52px; }
  .vis.public { background: #2e9e44; }
  .vis.protected { background: #d9a400; width: 7px; height: 7px; transform: rotate(45deg); }
  .vis.private { background: #d33a2c; border-radius: 50%; }

  .versions { flex: 1 1 auto; min-width: 0; overflow: auto; }

  table { border-collapse: collapse; white-space: nowrap; width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: 3px 8px;
           text-align: left; }
  th { position: sticky; top: 0; background: var(--th-bg); font-weight: 600;
       z-index: 1; }
  td.num { text-align: right; font-family: Consolas, monospace; }
  td.mono { font-family: Consolas, monospace; }
  td.empty { color: var(--faint); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--hover); }
  .message { padding: 12px; white-space: pre-wrap; font-family: Consolas, monospace;
             color: var(--danger); }
  .note { padding: 12px; color: var(--muted); }

  .cards { padding: 6px 10px; background: var(--surface-2);
           border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
  .cards button.on { background: var(--selected); font-weight: 600; }

  .review { padding: 10px; }
  .review h3 { margin: 14px 0 4px; font-size: 12px; }
  .review h3:first-child { margin-top: 0; }
  .review .ok { color: var(--ins-mark); }
  .review .no { color: var(--del-mark); }
  .review .open { color: var(--muted); }

  /* The band that starts a group. The colour sits on the cell, because the row
     underneath it is striped and hovered like any other. */
  tr.group td { background: var(--th-bg); font-weight: 600;
                border-top: 1px solid var(--border); }

  tbody tr.pick { cursor: pointer; }

  .diffbar { padding: 5px 10px; background: var(--surface-2);
             border-bottom: 1px solid var(--line); display: flex;
             align-items: center; gap: 12px; position: sticky; top: 0; z-index: 2; }
  .diffbar .back { cursor: pointer; color: var(--muted); }
  .diffbar .back:hover { color: var(--fg); text-decoration: underline; }
  .diffbar .counts { color: var(--muted); }
  .diffbar .counts .ins { color: var(--ins-mark); }
  .diffbar .counts .del { color: var(--del-mark); }

  table.diff { font-family: Consolas, monospace; white-space: pre; width: auto; }
  table.diff td { border: none; padding: 0 8px; vertical-align: top; }
  table.diff td.ln { text-align: right; color: var(--faint); user-select: none;
                     width: 1%; }
  table.diff td.mk { width: 1%; user-select: none; }
  table.diff tr { background: none; }
  table.diff tr:hover { background: none; }
  table.diff tr.ins { background: var(--ins-bg); }
  table.diff tr.ins td.mk { color: var(--ins-mark); }
  table.diff tr.del { background: var(--del-bg); }
  table.diff tr.del td.mk { color: var(--del-mark); }
  table.diff tr.gap td { color: var(--faint); }

  /* The action row of a block. Part of the diff table so that the block and
     its lines cannot drift apart: one rendering, with a row added. */
  table.diff tr.block td { background: var(--surface-2); color: var(--muted);
                           padding: 4px 8px; white-space: normal;
                           border-top: 1px solid var(--border); }
  table.diff tr.block .who { color: var(--fg); font-weight: 600; }
  table.diff tr.block .ok { color: var(--ins-mark); }
  table.diff tr.block .no { color: var(--del-mark); }
  table.diff tr.block .acts { float: right; display: flex; gap: 4px; }
  table.diff tr.block button { padding: 1px 7px; font-size: 11px; }

  /* The verdict and what was said about the block, each on its own line and
     each naming who and when - the shape AVE shows under a block. */
  table.diff tr.said td { background: var(--surface); white-space: normal;
                          padding: 3px 8px 3px 24px; }
  table.diff tr.said .who { color: var(--muted); }
  /* A comment is written in a box and has to come back out of it the same
     shape: line breaks and the indentation of a pasted snippet are part of
     what was said, and NORMAL on the cell would fold the lot onto one line. */
  table.diff tr.said .text { display: block; margin-top: 2px; padding: 4px 8px;
                             border: 1px solid var(--line); font-style: italic;
                             white-space: pre-wrap; overflow-wrap: anywhere; }
  table.diff tr.said .text.no { background: var(--del-bg);
                                border-color: var(--del-mark); }

  table.diff tr.words td { background: var(--surface); padding: 5px 8px 5px 24px;
                           white-space: normal; }
  table.diff tr.words textarea { display: block; width: 70%; min-height: 48px;
                                 font: inherit; padding: 3px 5px; resize: vertical;
                                 color: var(--fg); background: var(--field-bg);
                                 border: 1px solid var(--field-border); }
  table.diff tr.words .row { margin-top: 4px; display: flex; gap: 6px; }
  table.diff tr.words .hint { color: var(--muted); margin-left: auto;
                              align-self: center; }
  /* The setup page, and the short link that is always on the start screen.
     A link is a span, not an anchor: a real one would navigate the view away
     from the page it is on. */
  .setup { padding: 12px; max-width: 640px; }
  .setup h3 { margin: 0 0 8px; font-size: 13px; }
  .setup p { margin: 0 0 8px; color: var(--muted); }
  .setup ol { margin: 0 0 8px; padding-left: 20px; }
  .setup li { margin-bottom: 4px; }
  .setup li.ok { color: var(--ins-mark); }
  .setup li.no { color: var(--danger); }
  .setup pre.said { margin: 8px 0 0; padding: 8px; background: var(--surface);
                    border: 1px solid var(--line); border-radius: 6px;
                    white-space: pre-wrap; color: var(--muted);
                    font-family: Consolas, monospace; }
  .startlink { margin-top: 10px; color: var(--muted);
               font-family: "Segoe UI", system-ui, sans-serif; }
  .link { cursor: pointer; text-decoration: underline; }
  .link.plain { cursor: text; text-decoration: none; user-select: text;
                font-family: Consolas, monospace; }

  /* The assistant: a panel on the right, closed until it is asked for. The
     same panel as SelecTor's. */
  .chat { display: none; flex: 0 0 300px; flex-direction: column; min-width: 0;
          border-left: 1px solid var(--border); background: var(--surface); }
  .chat-head { display: flex; align-items: center; padding: 6px 6px 6px 10px;
               background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .chat-head .title { font-weight: 600; margin-right: auto; }
  .chat-pick { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); }
  .chat-pick select { flex: 1 1 0; min-width: 0; font: inherit; padding: 1px 3px;
                      color: var(--fg); background: var(--field-bg);
                      border: 1px solid var(--field-border); }
  .chat-log { flex: 1 1 auto; overflow: auto; padding: 6px; }
  .msg { margin-bottom: 10px; }
  .msg .who { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .msg .text { white-space: pre-wrap; }
  .msg.user .text { display: inline-block; padding: 4px 6px; border-radius: 6px;
                    background: var(--hover); }
  .msg.error .text { color: var(--danger); }
  .msg .did { margin-top: 3px; color: var(--muted); font-size: 11px;
              font-family: Consolas, monospace; }
  .chat-input { display: flex; flex-direction: column; gap: 4px; padding: 6px;
                border-top: 1px solid var(--line); }
  .chat-input textarea { font: inherit; min-height: 48px; resize: vertical; padding: 4px;
                         color: var(--fg); background: var(--field-bg);
                         border: 1px solid var(--field-border); }
  .chat-input .row { display: flex; align-items: center; gap: 6px; }
  .chat-input .working { margin-right: auto; color: var(--muted); }
  #selection-ask { color: var(--fg); background: var(--bg); border: 1px solid var(--border); padding: 14px; max-width: 520px; }
  #selection-ask::backdrop { background: rgba(0, 0, 0, .45); }
  #selection-ask label { display: block; margin: 8px 0 4px; }
  #selection-ask textarea { width: 100%; box-sizing: border-box; color: var(--fg); background: var(--field-bg); border: 1px solid var(--field-border); }
  #selection-ask pre { max-height: 150px; overflow: auto; white-space: pre-wrap; color: var(--muted); background: var(--surface); padding: 6px; }
  #selection-ask .row { display: flex; justify-content: end; gap: 6px; margin-top: 10px; }
  #versionid { font: inherit; padding: 2px 4px; color: var(--fg); background: var(--field-bg); border: 1px solid var(--field-border); }
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <select id="type" title="Object type"></select>
    <input id="name" spellcheck="false" autocomplete="off" placeholder="object name">
    <button id="load">Load</button>
    <span class="finder" id="finder">
      <input id="user" spellcheck="false" autocomplete="off" placeholder="user"
             title="Whose transport requests to find. Empty finds your own.">
      <label title="List released requests as well as open ones"><input type="checkbox" id="released"> released</label>
      <button id="find">Find</button>
    </span>
    <button id="assist" title="Say what to open, and let an assistant find it">Assistant</button>
    <span class="status" id="status"></span>
  </div>
  <div class="missing" id="missing" hidden></div>
  <div class="cards" id="cards"></div>
  <div class="panes">
    <aside class="parts" id="partspanel">
      <div class="parts-head">
        <span class="title">Parts</span>
        <button id="partsfold" title="Hide the parts">&#8249;</button>
      </div>
      <div id="partlist"></div>
    </aside>
    <div class="splitter" id="partssplit" title="Drag to resize the parts"></div>
    <main class="versions"><div id="root"></div></main>
    <aside class="chat" id="chat">
      <div class="chat-head">
        <span class="title">Assistant</span>
        <button id="chatclose" title="Hide the assistant">&#8250;</button>
      </div>
      <div class="chat-pick">
        <select id="who" title="Which assistant"></select>
        <select id="model" title="Which model"></select>
      </div>
      <div class="chat-pick">
        <select id="reviewpreset" title="Review instructions"></select>
        <button id="newconversation">New conversation</button>
      </div>
      <details style="padding: 6px">
        <summary>Review instructions</summary>
        <input id="presetname" placeholder="Profile name" style="width: 95%">
        <textarea id="presettext" rows="6" style="width: 95%" placeholder="Instructions for this review"></textarea>
        <button id="savepreset">Save profile</button>
        <button id="deletepreset">Delete profile</button>
      </details>
      <div class="chat-log" id="chatlog"></div>
      <div class="chat-input">
        <textarea id="ask" rows="3"
                  placeholder="For example: the last change of ZCL_AVE_POPUP=>BUILD_LAYOUT"></textarea>
        <div class="row">
          <span class="working" id="working"></span>
          <button id="send">Send</button>
        </div>
      </div>
    </aside>
  </div>
</div>
<dialog id="selection-ask">
  <strong>Ask assistant about selection</strong>
  <pre id="selection-preview"></pre>
  <label for="selection-question">Question</label>
  <textarea id="selection-question" rows="3" placeholder="What does this fragment do?"></textarea>
  <div class="row"><button id="selection-cancel" type="button">Cancel</button><button id="selection-send" type="button">Ask assistant</button></div>
</dialog>

<script>
"use strict";

var parts = [];
var current = null;
var versions = [];
var compact = true;

function status(text) {
  document.getElementById("status").textContent = text || "";
}

function message(text) {
  var root = document.getElementById("root");
  root.className = "message";
  root.textContent = text;
}

function note(text) {
  var root = document.getElementById("root");
  root.className = "note";
  root.textContent = text;
}

/* ---------- data ----------
   Two requests, not one. The parts of a class are its sections plus one per
   method, and reading the version directory of every one of them to draw a
   list of names would pay for eighty reads to show eighty rows. So the parts
   come first, and the versions of the one that is clicked come second. */

/* The types this service reads. The page does not enforce the list - a type
   the resource refuses comes back as its own sentence, and one authority for
   that rule is enough. */
var TYPES = [["TR", "Transport request"], ["DEVC", "Package"],
             ["CLAS", "Class"], ["INTF", "Interface"], ["PROG", "Program"],
             ["INCL", "Include"], ["FUGR", "Function group"], ["FUNC", "Function module"],
             ["DDLS", "CDS view"], ["TABL", "Table"], ["DOMA", "Domain"],
             ["DTEL", "Data element"]];

/* A transport request and a package hold objects, not versionable parts. The
   left pane shows the same list either way; what a click does differs, and the
   answer says which it is holding. */
var scope = false;
var came_from = null;

/* Versions or Review, the two questions to ask of the same transport request.
   A single object has only the first, so the cards appear with the scope. */
var mode = "V";

/* The last review summary, kept so that returning to it from one of its
   objects costs nothing. The object opened out of it is kept beside it, for
   the same reason the versions keep the part they belong to: the answer names
   the part by its padded key, and a reader wants the name they clicked. */
var review = null;
var review_part = null;

/* The stamp of the review this page is looking at. It goes back with every
   write, so that a write onto a review somebody else has saved in the meantime
   is refused instead of overwriting them. */
var review_saved_at = "";

function objectName() {
  return document.getElementById("name").value.trim().toUpperCase();
}

function objectType() {
  return document.getElementById("type").value;
}

function loadParts(keepTrail) {
  // The type can change under a load - drilling in, going back, a plan - and
  // the finder belongs to one type only.
  showFinder();
  var name = objectName();
  if (!name) {
    message("Type an object name and press Load.");
    return;
  }
  // Typing a name is leaving wherever the trail led.
  if (keepTrail !== true) { came_from = null; }
  // Parts belong to one object, so another object starts over.
  parts = [];
  current = null;
  versions = [];
  renderParts();
  status("reading " + name + " ...");
  sdeLoad(name, objectType(), "", "", "", "");
}

function loadReview() {
  // A host that cannot answer must say so, not leave "Reading ..." standing.
  // The table page has checked before calling since the join; this one did not,
  // and a missing function threw where nothing was watching.
  if (typeof sdeReview !== "function") {
    message("This host does not offer the review yet.");
    status("");
    return;
  }
  review_part = null;
  status("reading the review of " + objectName() + " ...");
  note("Reading ...");
  sdeReview(objectName(), "", "", "");
}

/* One object of the review: its blocks and the lines they were cut from, both
   as they were saved. Nothing is computed - a prepared review already holds
   the diff, and it stores the operations rather than the rendering. */
function loadReviewPart(object) {
  review_part = object;
  status("reading " + (object.display_name || object.obj_name) + " ...");
  note("Reading ...");
  sdeReview(objectName(), "", object.obj_name, object.objtype);
}

/* ---------- the parts panel: shown, folded, resized ---------- */

/* Whether the window has parts to show at all - a request list or a review of
   a scope has none. The splitter goes with the panel. */
var partsFolded = false;

function showPartsPanel(on) {
  document.getElementById("partspanel").style.display = on ? "" : "none";
  document.getElementById("partssplit").style.display = on && !partsFolded ? "" : "none";
}

function foldParts(folded) {
  var panel = document.getElementById("partspanel");
  var button = document.getElementById("partsfold");
  partsFolded = folded;
  panel.classList.toggle("folded", folded);
  button.innerHTML = folded ? "&#8250;" : "&#8249;";
  button.title = folded ? "Show the parts" : "Hide the parts";
  showPartsPanel(panel.style.display !== "none");
}

function renderCards() {
  // A system without the review resource gets no card for it.
  if (!usable("review")) { mode = "V"; }
  showPartsPanel(!(mode === "R" && scope));
  var box = document.getElementById("cards");
  box.innerHTML = "";
  // Only a scope has a review: in AVE the unit of work is the request, and a
  // review of one object is not a thing.
  if (!scope || !usable("review")) { return; }

  [["V", "Versions"], ["R", "Review"]].forEach(function (m) {
    var button = document.createElement("button");
    button.textContent = m[1];
    if (mode === m[0]) { button.className = "on"; }
    button.addEventListener("click", function () {
      mode = m[0];
      renderCards();
      if (mode === "R") { loadReview(); } else { loadParts(true); }
    });
    box.appendChild(button);
  });
}

var autoDiff = false;
function loadVersions(part, showList) {
  autoDiff = !showList && typeof INITIAL !== "undefined" && INITIAL && INITIAL.action === "diff";
  current = part;
  versions = [];
  updatePartSelection();
  status("reading versions of " + part.unit + " ...");
  note("Reading ...");
  sdeLoad(objectName(), objectType(), part.name, part.part_type, "", "");
}

/* Opening an object of a scope keeps the scope, so there is somewhere to go
   back to. One level is enough: a package holds objects, an object holds parts,
   and a part holds versions. */
function drillInto(part) {
  came_from = { name: objectName(), type: objectType() };
  document.getElementById("name").value = part.name;
  var box = document.getElementById("type");
  if (!Array.prototype.some.call(box.options, function (o) { return o.value === part.part_type; })) {
    var option = document.createElement("option");
    option.value = part.part_type;
    option.textContent = part.part_type;
    box.appendChild(option);
  }
  box.value = part.part_type;
  loadParts(true);
}

function goBack() {
  if (!came_from) { return; }
  document.getElementById("name").value = came_from.name;
  document.getElementById("type").value = came_from.type;
  came_from = null;
  loadParts(true);
}

/* A version is compared with the one below it in the list, which is the change
   that version made. The oldest has nothing below it, and comparing it against
   nothing is right: every line of it was added. */
function loadDiff(index) {
  var to = versions[index];
  var from = index + 1 < versions.length ? versions[index + 1].version : "";
  status("comparing " + (from ? asVersion(from) : "nothing")
         + " with " + asVersion(to.version) + " ...");
  note("Comparing ...");
  sdeLoad(objectName(), objectType(), current.name, current.part_type, from, to.version);
}

/* The type arrives from the object tree with its subtype - CLAS/OC. Only the
   head selects the entry; an unknown one is added rather than dropped, so a
   window opened on it still shows what it was opened for. */
function fillTypes(chosen) {
  var head = chosen ? String(chosen).split("/")[0] : "";
  var known = TYPES.slice();
  var found = known.some(function (t) { return t[0] === head; });
  if (head && !found) { known.unshift([head, head]); }

  var box = document.getElementById("type");
  known.forEach(function (t) {
    var option = document.createElement("option");
    option.value = t[0];
    option.textContent = t[1];
    if (t[0] === head) { option.selected = true; }
    box.appendChild(option);
  });
}

// Invoked by the host when the answer is waiting.
function sdeReady() {
  var raw = sdeTake();
  // The first thing a window asks is what the system has, and nothing else is
  // asked until that answer is in.
  if (askingAbout) { tookAbout(raw); return; }
  // A walk is a sequence of answers that belong to it, not to the view.
  if (walking) { tookPrepare(raw); return; }
  status("");
  if (typeof raw !== "string") { message("No response from the host."); return; }
  if (raw.indexOf("ERROR:") === 0) {
    var said = raw.substring(6);
    stopPlan();
    // The host marks the one failure that can be a setup state.
    if (said.indexOf("NOBACKEND:") === 0) { notFound(said.substring(10)); }
    else { message(said); }
    status("");
    return;
  }
  var data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    stopPlan();
    message("Response is not JSON:" + String.fromCharCode(10) + raw.substring(0, 2000));
    return;
  }
  // One page, six answers, each named by what it carries. The blocks come
  // before the operations: an object of a review carries both, and it is the
  // blocks that make it one.
  if (data.requests) { showing = { view: "requests" }; renderRequests(data); }
  else if (data.parts) { showing = { view: "parts" }; renderPartList(data); }
  else if (data.blocks) { showing = { view: "review_object" }; renderReviewPart(data); }
  else if (data.ops) { showing = { view: "diff", version: data.to }; renderDiff(data); }
  else if (data.reviewers) { showing = { view: "review" }; renderReview(data); }
  else { showing = { view: "versions" }; renderVersions(data); }
  // A plan from the assistant goes on from here, when this was the step it
  // was waiting for.
  if (pending) { continuePlan(data); }
}

/* ---------- parts ---------- */

/* The object the parts belong to, as the answer names it. It heads the table
   of parts, and for a class it stands for the class pool as well. */
var partsObject = "";

function renderPartList(data) {
  parts = data.parts || [];
  partsObject = String(data.object || "").toUpperCase();
  scope = data.scope === true;
  if (!scope) { mode = "V"; }
  renderCards();
  renderParts();
  // Optional on purpose: a host with no tab to rename simply does not define
  // it, and the VS Code shim is exactly that host today.
  if (typeof sdeTitle === "function") { sdeTitle(data.object.toUpperCase()); }
  if (parts.length === 0) {
    note(scope ? "It holds nothing." : "This object has no versionable part.");
    return;
  }
  status(parts.length + (parts.length === 1 ? " part" : " parts"));
  note("Pick a part to see its versions.");
  if (typeof INITIAL !== "undefined" && INITIAL && INITIAL.action === "diff" && !pending && !scope && parts.length) { loadVersions(parts[0]); }
}

var partRows = [];
function updatePartSelection() {
  partRows.forEach(function (row) {
    row.element.classList.toggle("on", isCurrent(row.part));
  });
}

function renderParts() {
  partRows = [];
  var box = document.getElementById("partlist");
  box.innerHTML = "";

  if (came_from) {
    var back = document.createElement("div");
    back.className = "part";
    back.textContent = "← " + came_from.name;
    back.title = "Back to " + came_from.name;
    back.addEventListener("click", goBack);
    box.appendChild(back);
  }
  if (parts.length === 0) { return; }

  // The object the parts belong to heads their table. A class pool is not
  // among them: it is generated, and the resource leaves it out.
  if (partsObject) {
    var head = document.createElement("div");
    head.className = "parts-object";
    head.textContent = partsObject;
    box.appendChild(head);
  }
  var sectioned = !scope && parts.some(function (p) { return !!p.section; });
  var rows = sectioned ? bySection() : parts.map(function (p) { return { part: p, section: "" }; });
  var list = table(sectioned ? ["", "Type", "Name"] : ["Type", "Name"], rows, function (tr, row) {
    var p = row.part;
    tr.className = (row.band ? "group " : "") + (p ? "pick" : "") + (p && isCurrent(p) ? " on" : "");
    if (p) {
      partRows.push({element: tr, part: p});
      tr.title = p.name + "  " + p.part_type;
      tr.addEventListener("click", function () { openPart(p); });
    }
    // In a class split by section the visibility comes first, in a column of
    // its own, so the icons line up the way SE80's do.
    if (sectioned) {
      var icon = document.createElement("td");
      icon.className = "icon";
      if (row.section) { icon.appendChild(visibility(row.section)); }
      tr.appendChild(icon);
    }
    if (!p) {
      // A band with no part behind it: a section whose include holds nothing,
      // or the parts that belong to no section.
      var only = document.createElement("td");
      only.colSpan = 2;
      only.textContent = row.label;
      tr.appendChild(only);
      return;
    }
    cell(tr, p.part_type, "mono");
    cell(tr, row.band ? row.label : p.unit);
  });
  if (sectioned) { list.className = "sectioned"; }
  box.appendChild(list);
}

function visibility(section) {
  var mark = document.createElement("span");
  mark.className = "vis " + section;
  mark.title = section;
  return mark;
}

/* A class the way SE80 shows it: each section, then the methods declared in
   it, marked by their visibility; what belongs to no section comes last. The
   section of each part is the resource's, read from the class builder. */
var SECTIONS = [
  { key: "public", type: "CPUB", label: "Public section" },
  { key: "protected", type: "CPRO", label: "Protected section" },
  { key: "private", type: "CPRI", label: "Private section" }
];

function bySection() {
  var rows = [];
  SECTIONS.forEach(function (s) {
    var head = null;
    parts.forEach(function (p) { if (p.part_type === s.type) { head = p; } });
    var members = parts.filter(function (p) { return p.part_type === "METH" && p.section === s.key; });
    if (!head && members.length === 0) { return; }
    rows.push({ band: true, section: s.key, part: head, label: head ? head.unit : s.label });
    members.forEach(function (p) { rows.push({ section: s.key, part: p }); });
  });
  var rest = parts.filter(function (p) {
    return !/^(CPUB|CPRO|CPRI)$/.test(p.part_type) && !(p.part_type === "METH" && p.section);
  });
  if (rest.length > 0) {
    rows.push({ band: true, section: "", part: null, label: "Other" });
    rest.forEach(function (p) { rows.push({ section: "", part: p }); });
  }
  return rows;
}

function isCurrent(p) {
  return !!current && current.name === p.name && current.part_type === p.part_type;
}

/* Only containers need expansion. Keep the scope as the resource's object and
   pass VRSD keys unchanged as part/ptype, padding included. */
function openPart(p) {
  if (scope && /^(CLAS|INTF|FUGR)$/.test(p.part_type)) { drillInto(p); }
  else { loadVersions(p); }
}

/* ---------- finding requests ----------

   A transport request is the one thing here looked for by whose it is rather
   than by its name: nobody remembers the number of the request they worked in
   last week. The user is all that is asked. Left empty, the server answers for
   whoever is logged on - it knows who that is, and this page does not. The
   requests where that user only holds a task count as theirs too, the way SE09
   lists them; released ones come only when asked for. */

function showFinder() {
  document.getElementById("finder").style.display =
    objectType() === "TR" && usable("requests") ? "" : "none";
}

function findRequests() {
  if (typeof sdeRequests !== "function") {
    message("This host does not find requests yet.");
    status("");
    return;
  }
  var user = document.getElementById("user").value.trim().toUpperCase();
  // A list of requests is not an object: nothing of the last one stays on
  // screen to be clicked by mistake, and there is nowhere to go back to.
  came_from = null;
  parts = [];
  current = null;
  versions = [];
  scope = false;
  mode = "V";
  renderCards();
  renderParts();
  status(user ? "finding the requests of " + user + " ..." : "finding your requests ...");
  note("Reading ...");
  sdeRequests(user, document.getElementById("released").checked ? "true" : "");
}

/* The user field starts as whoever is logged on, once the system has said who
   that is. What somebody typed there is never replaced. */
function fillUser(user) {
  var field = document.getElementById("user");
  if (user && !field.value.trim()) { field.value = user; }
}

function renderRequests(data) {
  // An empty field was a search for your own; the answer says whose that was.
  fillUser(data.user);
  // A request can have several tasks. The backend may report the parent once
  // through each task; the finder is a request picker, so show it once.
  var seen = {};
  var rows = (data.requests || []).filter(function (row) {
    if (!row.request || seen[row.request]) { return false; }
    seen[row.request] = true;
    return true;
  });
  showPartsPanel(false);
  var kind = data.released ? "requests" : "open requests";
  if (rows.length === 0) {
    note("No " + kind + " of " + data.user + ".");
    status("");
    return;
  }
  var root = document.getElementById("root");
  root.className = "";
  root.innerHTML = "";
  root.appendChild(table(["Request", "Description", "Owner", "Name", "Type", "Status", "Date", "Time"],
    rows, function (tr, r) {
      tr.className = "pick";
      tr.title = "Open " + r.request;
      tr.addEventListener("click", function () { openRequest(r.request); });
      cell(tr, r.request, "mono");
      cell(tr, r.text);
      cell(tr, r.owner, "mono");
      cell(tr, r.owner_name);
      cell(tr, r.type);
      cell(tr, r.status);
      cell(tr, asDate(r.date), "mono");
      cell(tr, asTime(r.time), "mono");
    }));
  status(rows.length + " " + (rows.length === 1 ? kind.replace(/s$/, "") : kind) + " of " + data.user);
}

/* A request picked from the list opens exactly as its typed number would. */
function openRequest(number) {
  // The unified Tools window owns the object selector in its header. Let it
  // take the selection too, so the request that was picked is visible there.
  if (typeof sdeSelectObject === "function") {
    // Opening a found request is a Versions operation. Review is explicitly
    // chosen afterwards; it must not be requested merely by selecting a row.
    sdeSelectObject({ type: "TR", name: number, action: "diff" });
    return;
  }
  document.getElementById("type").value = "TR";
  document.getElementById("name").value = number;
  loadParts(false);
}

/* ---------- versions ---------- */

/* AVE keys the active version 99998 so that it sorts after the numbered ones.
   It is not a number anybody can look up, so it is named. */
var ACTIVE = "99998";

function asVersion(value) {
  return value === ACTIVE ? "active" : value;
}

// The dictionary keeps them as digits; a reader wants separators.
function asDate(value) {
  if (!value || value.length !== 8) { return value || ""; }
  return value.substring(6, 8) + "." + value.substring(4, 6) + "." + value.substring(0, 4);
}

function asTime(value) {
  if (!value || value.length !== 6) { return value || ""; }
  return value.substring(0, 2) + ":" + value.substring(2, 4) + ":" + value.substring(4, 6);
}

function cell(tr, text, cls) {
  var td = document.createElement("td");
  if (text === "" || text === undefined || text === null) {
    td.className = "empty";
    td.textContent = "·";
  } else {
    td.textContent = text;
    if (cls) { td.className = cls; }
  }
  tr.appendChild(td);
  return td;
}

function renderVersions(data) {
  versions = data.versions || [];
  var root = document.getElementById("root");

  // The name in the payload is a VRSD key, padded to thirty characters and
  // unreadable. What the reader clicked on is the unit name.
  var label = current ? current.unit : data.part;

  if (versions.length === 0) {
    // Not an error: a part that was never changed after its creation has no
    // version of its own, and a section of a class often has none at all.
    note("No versions recorded for " + label + ".");
    return;
  }

  root.className = "";
  root.innerHTML = "";

  var headRow = document.createElement("tr");
  ["Version", "Date", "Time", "Author", "Name", "Request", "Task"].forEach(function (text) {
    var th = document.createElement("th");
    th.textContent = text;
    headRow.appendChild(th);
  });
  var thead = document.createElement("thead");
  thead.appendChild(headRow);

  var tbody = document.createElement("tbody");
  versions.forEach(function (v, index) {
    var tr = document.createElement("tr");
    tr.className = "pick";
    tr.title = "Compare with the version below it";
    tr.addEventListener("click", function () { loadDiff(index); });
    cell(tr, asVersion(v.version), "num");
    cell(tr, asDate(v.date), "mono");
    cell(tr, asTime(v.time), "mono");
    cell(tr, v.author, "mono");
    cell(tr, v.author_name);
    cell(tr, v.request, "mono");
    cell(tr, v.task, "mono");
    tbody.appendChild(tr);
  });

  var table = document.createElement("table");
  table.appendChild(thead);
  table.appendChild(tbody);
  root.appendChild(table);

  status(versions.length + (versions.length === 1 ? " version of " : " versions of ") + label);
  if (autoDiff && !pending && versions.length) { loadDiff(0); }
}

/* ---------- diff ---------- */

/* Unchanged lines further than this from a change are folded away in compact
   mode. Three is what a reader needs to place a change; more is scrolling. */
var CONTEXT = 3;

function showMask(ops) {
  var show = [];
  var i, k;
  for (i = 0; i < ops.length; i++) { show[i] = false; }
  for (i = 0; i < ops.length; i++) {
    if (ops[i].op === "=") { continue; }
    for (k = Math.max(0, i - CONTEXT); k <= Math.min(ops.length - 1, i + CONTEXT); k++) {
      show[k] = true;
    }
  }
  return show;
}

/* Line numbers follow the new version, so a deleted line carries none - it is
   not in the source you would open in the editor.

   BLOCKS is the review's, and optional: a plain diff has none. Where one
   begins, its row goes in ahead of the line. The diff is drawn by this one
   function either way, so a block and its lines cannot drift apart. */
function diffTable(ops, blocks) {
  var show = compact ? showMask(ops) : null;
  var tbody = document.createElement("tbody");
  var line = 0;
  var folded = false;

  // OP_FROM counts from one, and a block the payload could not be placed
  // against carries a zero - its row is drawn above the diff instead.
  var opens = {};
  (blocks || []).forEach(function (b) {
    if (b.op_from > 0) { opens[b.op_from - 1] = b; }
  });

  ops.forEach(function (o, index) {
    if (o.op !== "-") { line++; }

    if (opens[index]) {
      tbody.appendChild(blockRow(opens[index]));
      saidRows(opens[index]).forEach(function (row) { tbody.appendChild(row); });
      folded = false;
    }

    if (show && !show[index]) {
      if (!folded) {
        var gap = document.createElement("tr");
        gap.className = "gap";
        var td = document.createElement("td");
        td.colSpan = 3;
        td.textContent = "⋮";
        gap.appendChild(td);
        tbody.appendChild(gap);
        folded = true;
      }
      return;
    }
    folded = false;

    var tr = document.createElement("tr");
    if (o.op === "+") { tr.className = "ins"; }
    if (o.op === "-") { tr.className = "del"; }

    var ln = document.createElement("td");
    ln.className = "ln";
    ln.textContent = o.op === "-" ? "" : String(line);

    var mk = document.createElement("td");
    mk.className = "mk";
    mk.textContent = o.op === "=" ? " " : o.op;

    var cd = document.createElement("td");
    cd.textContent = o.text;

    tr.appendChild(ln);
    tr.appendChild(mk);
    tr.appendChild(cd);
    tbody.appendChild(tr);
  });

  var table = document.createElement("table");
  table.className = "diff";
  table.appendChild(tbody);
  return table;
}

function renderDiff(data) {
  var ops = data.ops || [];
  var root = document.getElementById("root");
  root.className = "";
  root.innerHTML = "";

  var bar = document.createElement("div");
  bar.className = "diffbar";

  var back = document.createElement("span");
  back.className = "back";
  back.textContent = "← Versions";
  back.addEventListener("click", function () { loadVersions(current, true); });
  bar.appendChild(back);

  var what = document.createElement("span");
  // An empty FROM is the oldest version, compared against nothing.
  what.textContent = (data.from ? asVersion(data.from) : "nothing")
                   + " → " + asVersion(data.to);
  bar.appendChild(what);

  var counts = document.createElement("span");
  counts.className = "counts";
  var ins = document.createElement("span");
  ins.className = "ins";
  ins.textContent = "+" + data.added;
  var del = document.createElement("span");
  del.className = "del";
  del.textContent = "−" + data.deleted;
  counts.appendChild(ins);
  counts.appendChild(document.createTextNode(" "));
  counts.appendChild(del);
  bar.appendChild(counts);

  var toggle = document.createElement("button");
  toggle.textContent = compact ? "Full" : "Compact";
  toggle.title = compact ? "Show the whole source"
                         : "Show only the changes and three lines around them";
  toggle.addEventListener("click", function () {
    compact = !compact;
    renderDiff(data);
  });
  bar.appendChild(toggle);

  root.appendChild(bar);

  if (ops.length === 0) {
    // A newly opened Diff should land on the newest *change*, rather than on
    // a version whose stored source happens to be identical to its predecessor.
    // The version endpoint cannot know that without calculating the diff, so
    // advance one pair at a time until a non-empty answer is found.
    if (autoDiff) {
      var currentIndex = versions.findIndex(function (version) {
        return String(version.version) === String(data.to);
      });
      if (currentIndex >= 0 && currentIndex + 1 < versions.length) {
        loadDiff(currentIndex + 1);
        return;
      }
      autoDiff = false;
    }
    // Not an error, and worth saying plainly: AVE folds away moved lines and
    // reformatting, so two versions can differ and still have nothing to show.
    var same = document.createElement("div");
    same.className = "note";
    same.textContent = "Nothing to show between these two versions.";
    root.appendChild(same);
    status("");
    return;
  }

  autoDiff = false;
  root.appendChild(diffTable(ops));
  status(data.added + " added, " + data.deleted + " deleted");
}

/* What stands above the lines of a block: which block it is, how much it
   changes, who wrote it, and the verdict it already carries. Read-only - the
   review is written in AVE, and this page shows what was written. */
function blockRow(b) {
  var tr = document.createElement("tr");
  tr.className = "block";
  var td = document.createElement("td");
  td.colSpan = 3;

  var no = document.createElement("span");
  no.className = "who";
  no.textContent = "#" + b.hunk_no;
  td.appendChild(no);

  td.appendChild(document.createTextNode(
    "  " + b.change_kind + ", " + b.change_count
    + (b.change_count === 1 ? " line" : " lines")
    + "  ·  line " + b.start_line
    + "  ·  " + (b.author_name || b.author)));

  var verdict = document.createElement("span");
  if (b.action === "A") {
    verdict.className = "ok";
    verdict.textContent = "  ·  ✓ approved by " + (b.reviewer_name || b.reviewer);
  } else if (b.action === "D") {
    verdict.className = "no";
    verdict.textContent = "  ·  ✗ declined by " + (b.reviewer_name || b.reviewer);
  } else {
    verdict.textContent = "  ·  open";
  }
  if (b.changed_at && b.action) {
    verdict.textContent = verdict.textContent + "  ·  " + asStamp(b.changed_at);
  }
  td.appendChild(verdict);

  // A host with no way to write shows the verdict and no buttons, rather than
  // buttons that do nothing.
  if (typeof sdeAct === "function") {
    var acts = document.createElement("span");
    acts.className = "acts";
    if (b.action !== "A") { acts.appendChild(actButton(b, "A", "Approve")); }
    if (b.action !== "D") { acts.appendChild(actButton(b, "D", "Decline")); }
    acts.appendChild(actButton(b, "C", "Comment"));
    if (b.action === "A" || b.action === "D") {
      acts.appendChild(actButton(b, "U", "Undo"));
    }
    td.appendChild(acts);
  }

  tr.appendChild(td);
  return tr;
}

/* What was said about a block: one row per message, each naming who and when,
   with the words in a box of their own. A decline is coloured like one.
   The note on the block is the last of these, so it is not repeated. */
function saidRows(block) {
  return (block.messages || []).map(function (m) {
    var tr = document.createElement("tr");
    tr.className = "said";
    var td = document.createElement("td");
    td.colSpan = 3;

    var who = document.createElement("span");
    who.className = "who";
    who.textContent = (m.author_name || m.author) + "  ·  " + asStamp(m.created_at);
    td.appendChild(who);

    var text = document.createElement("span");
    text.className = "text" + (m.is_decline === true || m.is_decline === "X" ? " no" : "");
    text.textContent = m.text;
    td.appendChild(text);

    tr.appendChild(td);
    return tr;
  });
}

function actButton(block, action, label) {
  var button = document.createElement("button");
  button.textContent = label;
  button.addEventListener("click", function () {
    // A decline and a comment are the words that go with them, so they ask.
    if (action === "D" || action === "C") { askWords(button, block, action); }
    else { act(block, action, ""); }
  });
  return button;
}

/* The box that takes the words. Inline rather than a dialog, because the block
   it is about has to stay on screen while they are written, and a box rather
   than a line, because a review comment is a paragraph as often as not - which
   is what the GUI opens an editor window for. */
function askWords(button, block, action) {
  var head = button.parentNode.parentNode.parentNode;
  var open = head.parentNode.querySelector("tr.words");
  if (open) {
    open.parentNode.removeChild(open);
    if (open.previousSibling === head) { return; }
  }

  var tr = document.createElement("tr");
  tr.className = "words";
  var td = document.createElement("td");
  td.colSpan = 3;

  var input = document.createElement("textarea");
  input.placeholder = action === "D" ? "why this block is declined"
                                     : "a comment on this block";
  var row = document.createElement("div");
  row.className = "row";

  var save = document.createElement("button");
  save.textContent = action === "D" ? "Decline" : "Comment";
  var cancel = document.createElement("button");
  cancel.textContent = "Cancel";
  var hint = document.createElement("span");
  hint.className = "hint";
  hint.textContent = "Ctrl+Enter sends, Esc closes";

  function send() {
    if (!input.value.trim()) { return; }
    act(block, action, input.value.trim());
  }
  function close() {
    if (tr.parentNode) { tr.parentNode.removeChild(tr); }
  }
  save.addEventListener("click", send);
  cancel.addEventListener("click", close);
  input.addEventListener("keydown", function (e) {
    // Enter is a new line here, so sending needs the modifier.
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { send(); }
    if (e.key === "Escape") { close(); }
  });

  row.appendChild(save);
  row.appendChild(cancel);
  row.appendChild(hint);
  td.appendChild(input);
  td.appendChild(row);
  tr.appendChild(td);

  // Under the block and under whatever has already been said about it.
  var at = head.nextSibling;
  while (at && at.className === "said") { at = at.nextSibling; }
  head.parentNode.insertBefore(tr, at);
  input.focus();
}

/* SAVED_AT is the stamp this page last read. The resource refuses a write built
   on a state that has since moved, and it is refused rather than merged: a save
   writes the whole review, and a merge nobody asked for is how approvals get
   lost. */
function act(block, action, note) {
  status("writing ...");
  sdeAct(objectName(), "", review_part.obj_name, review_part.objtype,
         JSON.stringify({ hunk_key: block.hunk_key, action: action,
                          note: note, saved_at: review_saved_at }));
}

/* ---------- one object of the review ---------- */

function renderReviewPart(data) {
  var ops = data.ops || [];
  var blocks = data.blocks || [];
  review_saved_at = data.saved_at || "";
  var label = review_part ? (review_part.display_name || review_part.obj_name)
                          : data.part;

  if (data.saved !== true) {
    note("No review saved for " + data.request + ".");
    status("");
    return;
  }

  var root = document.getElementById("root");
  root.className = "";
  root.innerHTML = "";

  var bar = document.createElement("div");
  bar.className = "diffbar";

  var back = document.createElement("span");
  back.className = "back";
  back.textContent = "← Review";
  back.addEventListener("click", function () {
    review_part = null;
    // The summary is already in hand; asking for it again would only cost a
    // round trip to be told the same thing.
    if (review) { renderReview(review); } else { loadReview(); }
  });
  bar.appendChild(back);

  var what = document.createElement("span");
  what.textContent = label + "   "
                   + (data.versno_old ? asVersion(data.versno_old) : "nothing")
                   + " → " + asVersion(data.versno_new);
  bar.appendChild(what);

  var counts = document.createElement("span");
  counts.className = "counts";
  var ins = document.createElement("span");
  ins.className = "ins";
  ins.textContent = "+" + data.added;
  var del = document.createElement("span");
  del.className = "del";
  del.textContent = "−" + data.deleted;
  counts.appendChild(ins);
  counts.appendChild(document.createTextNode(" "));
  counts.appendChild(del);
  bar.appendChild(counts);

  var toggle = document.createElement("button");
  toggle.textContent = compact ? "Full" : "Compact";
  toggle.title = compact ? "Show the whole source"
                         : "Show only the changes and three lines around them";
  toggle.addEventListener("click", function () {
    compact = !compact;
    renderReviewPart(data);
  });
  bar.appendChild(toggle);

  root.appendChild(bar);

  if (data.ddic === true) {
    // A dictionary object has no line diff. AVE reviews it as a table of
    // fields and keeps that page ready-made, because there is nothing left to
    // rebuild it from. VERTEX does not render it, and says so.
    var ddic = document.createElement("div");
    ddic.className = "note";
    ddic.textContent = "This is a dictionary object. Its review is a table of"
                     + " fields rather than a line diff, and VERTEX does not"
                     + " render that page yet.";
    root.appendChild(ddic);
    status("");
    return;
  }

  if (ops.length === 0) {
    var same = document.createElement("div");
    same.className = "note";
    same.textContent = "The saved review holds no diff for this object.";
    root.appendChild(same);
    status("");
    return;
  }

  // A block the operations could not be placed against still has to be seen,
  // with its verdict, rather than quietly disappear.
  var loose = blocks.filter(function (b) { return !(b.op_from > 0); });
  if (loose.length > 0) {
    var orphans = document.createElement("table");
    orphans.className = "diff";
    var tbody = document.createElement("tbody");
    var head = document.createElement("tr");
    head.className = "gap";
    var td = document.createElement("td");
    td.colSpan = 3;
    td.textContent = loose.length + (loose.length === 1 ? " block is" : " blocks are")
                   + " not in the saved diff of this object.";
    head.appendChild(td);
    tbody.appendChild(head);
    loose.forEach(function (b) {
      tbody.appendChild(blockRow(b));
      saidRows(b).forEach(function (row) { tbody.appendChild(row); });
    });
    orphans.appendChild(tbody);
    root.appendChild(orphans);
  }

  root.appendChild(diffTable(ops, blocks));

  var approved = blocks.filter(function (b) { return b.action === "A"; }).length;
  var declined = blocks.filter(function (b) { return b.action === "D"; }).length;
  status(blocks.length + (blocks.length === 1 ? " block, " : " blocks, ")
         + approved + " approved, " + declined + " declined, "
         + (blocks.length - approved - declined) + " open");
}

/* ---------- the saved review ---------- */

function renderReview(data) {
  review = data;
  review_part = null;
  review_saved_at = data.saved_at || "";
  var root = document.getElementById("root");
  root.className = "review";
  root.innerHTML = "";

  if (data.table !== true) {
    // Not an error: nothing is broken, there is simply nowhere for a review to
    // have been saved yet.
    note("This system has no ZAVE_REVIEW table, so no review can have been saved."
       + " It ships with the ABAP half, under src/.");
    status("");
    return;
  }
  if (data.saved !== true) {
    // Not the end of the road either: nothing has been built for this request
    // yet, and building it is what this window is for.
    offerPrepare(data.request, data.remote || "");
    status("");
    return;
  }

  root.appendChild(heading("Saved " + asStamp(data.saved_at) + " by " + data.saved_by));
  root.appendChild(section("Objects", objectTable(data.objects || [])));
  root.appendChild(section("Reviewers", reviewerTable(data.reviewers || [])));
  if (data.history && data.history.length > 0) {
    root.appendChild(section("Saves", historyTable(data.history)));
  }

  var open = (data.objects || []).reduce(function (n, o) { return n + o.open; }, 0);
  status(open === 0 ? "nothing open" : open + (open === 1 ? " block open" : " blocks open"));
}

/* ---------- building a review ----------

   A review is built one object at a time. The walk lives here rather than in
   the ABAP half for two reasons: every call is then short enough that nothing
   has to survive being slow, and stopping is a matter of not asking again -
   there is no run to interrupt, no dialog to keep alive, and nothing to
   estimate beforehand. What each object leaves behind is written before the
   answer comes back, so a window closed halfway costs the object in hand and
   nothing that was finished before it. */

var walking = null;

function offerPrepare(request, remote) {
  var root = document.getElementById("root");
  root.className = "note";
  root.innerHTML = "";

  var said = document.createElement("p");
  said.textContent = "No review has been built for " + request + " yet.";
  root.appendChild(said);

  var how = document.createElement("p");
  how.className = "hint";
  how.textContent = "Building one walks the objects of the request, reads the"
                  + " versions of each and cuts what changed into blocks. It goes"
                  + " object by object and keeps what it finishes, so stopping"
                  + " costs the object it is on and nothing before it.";
  root.appendChild(how);

  // A host older than this page cannot be asked to build anything, and a
  // button that throws on the first click is worse than no button: say what is
  // missing instead.
  if (typeof sdePrepare !== "function") {
    var older = document.createElement("p");
    older.className = "hint";
    older.textContent = "This window cannot build one: the host it runs in is"
                      + " older than the page. Update the VERTEX plugin or"
                      + " extension.";
    root.appendChild(older);
    return;
  }

  var build = document.createElement("button");
  build.textContent = "Build it";
  build.addEventListener("click", function () {
    build.disabled = true;
    startPrepare(request, remote);
  });
  root.appendChild(build);
}

function startPrepare(request, remote) {
  walking = { request: request, remote: remote, list: null, at: 0, blocks: 0 };
  status("reading what " + request + " holds ...");
  sdePrepare(request, remote, "");
}

function tookPrepare(raw) {
  if (typeof raw !== "string") { stopWalk("No response from the host."); return; }
  if (raw.indexOf("ERROR:") === 0) { stopWalk(raw.substring(6)); return; }
  var data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    stopWalk("Response is not JSON:" + String.fromCharCode(10) + raw.substring(0, 2000));
    return;
  }

  if (walking.list === null) {
    walking.list = data.objects || [];
    if (walking.list.length === 0) {
      stopWalk("This request records no object a review could be built from.");
      return;
    }
  } else {
    walking.blocks = walking.blocks + (data.hunks || 0);
    walking.at = walking.at + 1;
  }
  stepPrepare();
}

function stepPrepare() {
  var walk = walking;
  if (walk.at >= walk.list.length) {
    walking = null;
    status(walk.blocks + (walk.blocks === 1 ? " block built" : " blocks built"));
    // What was just written is what the window shows next.
    sdeReview(walk.request, walk.remote, "", "");
    return;
  }
  var one = walk.list[walk.at];
  status(one.objtype + " " + one.obj_name
       + " (" + (walk.at + 1) + " of " + walk.list.length + ") ...");
  sdePrepare(walk.request, walk.remote,
             JSON.stringify({ objtype: one.objtype, object: one.obj_name }));
}

/* A walk that cannot go on says where it stopped: what is already written
   stays written, and asking again picks the list up as it now stands. */
function stopWalk(said) {
  var at = walking && walking.list ? walking.at : 0;
  walking = null;
  status("");
  message(said + (at > 0 ? String.fromCharCode(10) + String.fromCharCode(10)
                         + at + (at === 1 ? " object was" : " objects were")
                         + " prepared before this and are kept." : ""));
}


function heading(text) {
  var h = document.createElement("h3");
  h.textContent = text;
  return h;
}

function section(title, body) {
  var box = document.createElement("div");
  box.appendChild(heading(title));
  box.appendChild(body);
  return box;
}

/* A timestamp arrives as the dictionary holds it, digits and a fraction. */
function asStamp(value) {
  var digits = String(value || "").split(".")[0];
  if (digits.length < 14) { return digits; }
  return asDate(digits.substring(0, 8)) + " " + asTime(digits.substring(8, 14));
}

/* GROUPOF is optional and names the group a row belongs to. A heading goes in
   wherever that name changes, which is why the rows arrive already in the
   order AVE puts them in - the page breaks the groups, it does not find
   them. */
function table(columns, rows, cells, groupOf) {
  var head = document.createElement("tr");
  columns.forEach(function (c) {
    var th = document.createElement("th");
    th.textContent = c;
    head.appendChild(th);
  });
  var thead = document.createElement("thead");
  thead.appendChild(head);

  var tbody = document.createElement("tbody");
  var group = null;
  rows.forEach(function (r) {
    if (groupOf && groupOf(r) !== group) {
      group = groupOf(r);
      var band = document.createElement("tr");
      band.className = "group";
      var td = document.createElement("td");
      td.colSpan = columns.length;
      td.textContent = group;
      band.appendChild(td);
      tbody.appendChild(band);
    }
    var tr = document.createElement("tr");
    cells(tr, r);
    tbody.appendChild(tr);
  });

  var t = document.createElement("table");
  t.appendChild(thead);
  t.appendChild(tbody);
  return t;
}

function count(tr, value, cls) {
  var td = document.createElement("td");
  td.className = "num" + (value && cls ? " " + cls : "");
  td.textContent = value ? String(value) : "";
  tr.appendChild(td);
  return td;
}

function objectTable(objects) {
  return table(["Object", "Type", "Author", "Blocks", "+", "-", "~", "Approved", "Declined", "Open"],
    objects, function (tr, o) {
      tr.className = "pick";
      tr.title = "Show the changed blocks of " + (o.display_name || o.obj_name);
      tr.addEventListener("click", function () { loadReviewPart(o); });
      cell(tr, o.display_name || o.obj_name);
      cell(tr, o.objtype, "mono");
      cell(tr, o.author_name || o.author);
      count(tr, o.hunks);
      count(tr, o.inserted);
      count(tr, o.deleted);
      count(tr, o.modified);
      count(tr, o.approved, "ok");
      count(tr, o.declined, "no");
      count(tr, o.open, "open");
    },
    // A method's name is only a name inside its class, and a section is called
    // "Public section" in every one of them. Ungrouped, the column reads as a
    // heap of repeats.
    function (o) {
      return o.class_name ? "Class: " + o.class_name : o.group;
    });
}

function reviewerTable(reviewers) {
  return table(["Reviewer", "Approved", "Declined", "Notes", "Last saved"],
    reviewers, function (tr, r) {
      cell(tr, r.reviewer_name || r.reviewer);
      count(tr, r.approved, "ok");
      count(tr, r.declined, "no");
      count(tr, r.notes);
      cell(tr, asStamp(r.saved_at), "mono");
    });
}

function historyTable(history) {
  return table(["When", "Who", "Approved", "Declined", "Notes"],
    history, function (tr, h) {
      cell(tr, asStamp(h.saved_at), "mono");
      cell(tr, h.saved_by_name || h.saved_by);
      count(tr, h.approved, "ok");
      count(tr, h.declined, "no");
      count(tr, h.notes);
    });
}


/* ---------- what this system has ----------

   A window reads more than one resource, and a system can have some of them
   and not others: a VERTEX hub older than the window, a resource
   class that did not activate because the tool it reads through is not
   installed. So the window asks /vertex/about once, when it opens and before
   anything else. What the system does not have is not drawn, and a line under
   the bar says what is missing and why: a button that silently went away
   explains nothing.

   A system that cannot say - nothing answers there, or its hub is older than
   the question - changes nothing: every button stays, and a failure is
   reported when it happens, as it always was. */

var USES = [
  { service: "versions", what: "the version history", main: true },
  { service: "review", what: "the saved review" },
  { service: "requests", what: "finding requests" }
];

var have = null;         // what /vertex/about said, by service; null while unsaid
var backends = {};       // the tools it named, installed or not
var loggedOn = "";       // who the system says is logged on
var askingAbout = false;
var afterAbout = null;

function askAbout(then) {
  if (typeof sdeAbout !== "function") { then(); return; }
  askingAbout = true;
  afterAbout = then;
  status("checking what this system has ...");
  sdeAbout();
}

function tookAbout(raw) {
  askingAbout = false;
  status("");
  var data = null;
  if (typeof raw === "string" && raw.indexOf("ERROR:") !== 0) {
    try { data = JSON.parse(raw); } catch (e) { data = null; }
  }
  if (data && Array.isArray(data.services)) {
    have = {};
    data.services.forEach(function (s) { have[s.name] = s; });
    (data.backends || []).forEach(function (b) { backends[b.name] = !!b.installed; });
  }
  if (data && typeof data.user === "string") { loggedOn = data.user; }
  applyAbout();
  var then = afterAbout;
  afterAbout = null;
  if (then) { then(); }
}

/* Unknown counts as usable: only a system that said so loses part of the window. */
function usable(service) {
  return have === null || (!!have[service] && !!have[service].active);
}

function whyMissing(service) {
  var said = have && have[service];
  if (!said) { return "the VERTEX hub there is older than this window"; }
  if (said.backend && backends[said.backend] === false) {
    return said.handler + " is not active, because " + said.backend + " is not installed";
  }
  return said.handler + " is not active";
}

function sayMissing() {
  var lost = USES.filter(function (u) { return !u.main && !usable(u.service); });
  var line = document.getElementById("missing");
  line.textContent = lost.length === 0 ? "" : "Not on this system: " + lost.map(function (u) {
    return u.what + " - " + whyMissing(u.service);
  }).join("; ") + ".";
  line.hidden = lost.length === 0;
}

function applyAbout() {
  showFinder();
  fillUser(loggedOn);
  renderCards();
  sayMissing();
}

/* The window proper starts once the system has said what it has. Without the
   resource this window is for, there is nothing to start. */
function startWindow() {
  if (!usable("versions")) { setupPage(""); return; }
  if (INITIAL) {
    if (INITIAL.action === "review") {
      mode = "R"; scope = true; renderCards(); loadReview();
    } else { loadParts(false); }
  }
}

/* A 404 is a setup state while the system has not said what it has, or when it
   said part of what this window reads is missing. When it has all of it, the
   404 is the resource's own answer and is shown as one. */
function notFound(detail) {
  if (have !== null && USES.every(function (u) { return usable(u.service); })) { message(detail); }
  else { setupPage(detail); }
}


/* ---------- when the ABAP half is not there ----------

   This page is half of VERTEX. The other half is ABAP, and a plugin installed
   without it reaches a path nothing answers. That is a setup state, not a
   failure: nothing is broken, the backend has simply never been put there. So
   it gets a page saying what to install, the way AVE answers a missing table
   with a setup page of its own rather than an error.

   The host says which of the two it is, because only the host saw the status
   code. Anything else - a system that is down, a password refused - is a
   failure and stays one.

   BACKEND is what THIS window reads, and it can differ per window: the hub's
   resources are one repository, and a tool a window still reaches into through
   them - AVE, behind the versions and the review - is another. Naming only the
   first would send somebody who is missing the second to install what they
   already have. */

var BACKEND = [
  { name: "VERTEX",
    url: "https://github.com/ysichov/VERTEX",
    why: "its src/ folder: the ADT resources every VERTEX window reads, the"
       + " version history, the diff and the code review" }
];

/* Opening a link is the host's business: in Eclipse it would otherwise
   navigate the view away from this page, and a webview cannot open one at
   all. A host that offers nothing leaves the address to be copied. */
function projectLink(text, url) {
  var link = document.createElement("span");
  link.className = "link";
  if (typeof sdeBrowse === "function") {
    link.textContent = text || url;
    link.title = url;
    link.addEventListener("click", function () { sdeBrowse(url); });
  } else {
    link.className = "link plain";
    link.textContent = url;
    link.title = "Copy this address into a browser";
  }
  return link;
}

/* The short link, on the start screen, always. Somebody who has just installed
   the plugin and typed nothing yet is exactly who needs to know where the
   other half of it lives. */
function startLink() {
  var line = document.createElement("div");
  line.className = "startlink";
  line.appendChild(document.createTextNode("This window reads ABAP from "));
  BACKEND.forEach(function (one, i) {
    if (i > 0) {
      line.appendChild(document.createTextNode(i + 1 === BACKEND.length ? " and " : ", "));
    }
    line.appendChild(projectLink(one.name, one.url));
  });
  document.getElementById("root").appendChild(line);
}

function setupPage(detail) {
  var root = document.getElementById("root");
  root.className = "setup";
  root.innerHTML = "";

  var head = document.createElement("h3");
  var why = document.createElement("p");
  if (have === null) {
    head.textContent = "The ABAP half is not on this system";
    why.textContent = "VERTEX is a page and a set of ADT resources. The page is"
                    + " installed here; the resources answer nothing, so there is"
                    + " nothing for it to read. A VERTEX hub older than"
                    + " this window cannot say what it has either: if it is"
                    + " installed, pull it again.";
  } else {
    head.textContent = "Part of the ABAP half is missing on this system";
    why.textContent = "The VERTEX hub answers here, and says what this window can read:";
  }
  root.appendChild(head);
  root.appendChild(why);

  if (have !== null) {
    var found = document.createElement("ul");
    USES.forEach(function (u) {
      var li = document.createElement("li");
      li.className = usable(u.service) ? "ok" : "no";
      li.textContent = usable(u.service) ? u.what + " - there"
                                         : u.what + " - missing: " + whyMissing(u.service);
      found.appendChild(li);
    });
    root.appendChild(found);
  }

  var what = document.createElement("ul");
  BACKEND.forEach(function (one) {
    var li = document.createElement("li");
    li.appendChild(projectLink(one.name, one.url));
    li.appendChild(document.createTextNode(" - " + one.why));
    what.appendChild(li);
  });
  root.appendChild(what);

  var steps = document.createElement("ol");
  (have !== null
    ? ["Pull what is missing or older with abapGit and activate it.",
       "Reopen this window."]
    : ["Pull it with abapGit and activate it.",
       "Nothing to register by hand: the BAdI implementation that claims"
         + " /sap/bc/adt/vertex/* is an object of the repository and arrives"
         + " with its filter already on it.",
       "Reopen this window."]).forEach(function (step) {
    var li = document.createElement("li");
    li.textContent = step;
    steps.appendChild(li);
  });
  root.appendChild(steps);

  if (detail) {
    var said = document.createElement("pre");
    said.className = "said";
    said.textContent = detail;
    root.appendChild(said);
  }
}

/* ---------- the assistant ----------

   Saying what to open instead of clicking down to it. The host hands the
   request to Claude Code or Codex, with lists as the only thing that assistant
   can read - parts, versions, the objects of a saved review, never a line of
   source - and gets back where this window is to go, already checked against
   the system. The window then goes there the way a person would: the parts
   first, then the part, then the version; or the review, then its object.
   Each step waits for the answer of the one before it, because what the next
   click is on only exists once that answer is on screen. */

var ASSISTANTS = [["claude", "Claude Code"], ["codex", "Codex"]];

/* One request at a time; the name of whoever is answering it, because the
   choice in the list may change while it runs. */
var asking = null;
var chatOpened = false;
var conversation = [];
var reviewPresets = [
  { name: "General review", text: "Review correctness, error handling and boundary cases. Report concrete issues with source locations, impact and suggested fixes. Answer in the user's language." },
  { name: "SQL and performance", text: "Focus on ABAP SQL, database access in loops, unnecessary reads, internal table access and algorithmic complexity. Explain the conditions under which each issue matters." },
  { name: "Security", text: "Review authorization checks, injection, sensitive data exposure and validation of external input. Give concrete exploit conditions; distinguish confirmed issues from assumptions." },
  { name: "Tests", text: "Review test coverage of changed behavior, boundary cases, failures and regressions. Suggest specific missing test scenarios." }
];

function fillReviewPresets(selected) {
  var box = document.getElementById("reviewpreset");
  box.innerHTML = "";
  reviewPresets.forEach(function (p, i) {
    var option = document.createElement("option");
    option.value = String(i);
    option.textContent = p.name;
    box.appendChild(option);
  });
  box.value = String(Math.max(0, Math.min(Number(selected) || 0, reviewPresets.length - 1)));
  selectReviewPreset();
}

function selectReviewPreset() {
  var p = reviewPresets[Number(document.getElementById("reviewpreset").value)];
  document.getElementById("presetname").value = p ? p.name : "";
  document.getElementById("presettext").value = p ? p.text : "";
  remember("review.selected", document.getElementById("reviewpreset").value);
}

function saveReviewPreset() {
  var name = document.getElementById("presetname").value.trim();
  if (!name) { return; }
  var index = reviewPresets.findIndex(function (p) { return p.name === name; });
  var p = { name: name, text: document.getElementById("presettext").value };
  if (index < 0) { index = reviewPresets.length; reviewPresets.push(p); }
  else { reviewPresets[index] = p; }
  remember("review.presets", JSON.stringify(reviewPresets));
  fillReviewPresets(index);
}

function deleteReviewPreset() {
  reviewPresets.splice(Number(document.getElementById("reviewpreset").value), 1);
  remember("review.presets", JSON.stringify(reviewPresets));
  fillReviewPresets(0);
}

function newConversation() {
  if (asking) { return; }
  conversation = [];
  remember("review.conversation", "[]");
  document.getElementById("chatlog").innerHTML = "";
  document.getElementById("ask").value = "";
  document.getElementById("ask").focus();
}

/* What the window shows now, as the assistant is told it, and what is left
   of a plan while its steps are still on their way. */
var showing = { view: "" };
var pending = null;

function recall(key) {
  // Storage can be switched off; the page then simply forgets the choice.
  try { return window.localStorage.getItem("vertex.assistant." + key) || ""; }
  catch (e) { return ""; }
}

function remember(key, value) {
  try { window.localStorage.setItem("vertex.assistant." + key, value); }
  catch (e) { /* not kept */ }
}

function say(kind, who, text, detail) {
  var log = document.getElementById("chatlog");
  var box = document.createElement("div");
  box.className = "msg " + kind;
  var name = document.createElement("span");
  name.className = "who";
  name.textContent = who;
  box.appendChild(name);
  var body = document.createElement("div");
  body.className = "text";
  body.textContent = text;
  box.appendChild(body);
  if (detail) {
    var did = document.createElement("div");
    did.className = "did";
    did.textContent = detail;
    box.appendChild(did);
  }
  log.appendChild(box);
  log.scrollTop = log.scrollHeight;
}

function openChat() {
  document.getElementById("chat").style.display = "flex";
  if (chatOpened) {
    document.getElementById("ask").focus();
    return;
  }
  chatOpened = true;
  try {
    var saved = JSON.parse(recall("review.presets"));
    if (Array.isArray(saved) && saved.every(function (p) { return p && typeof p.name === "string" && typeof p.text === "string"; })) {
      reviewPresets = saved;
    }
  } catch (e) { /* use bundled profiles */ }
  fillReviewPresets(recall("review.selected"));
  try {
    var history = JSON.parse(recall("review.conversation"));
    if (Array.isArray(history) && history.every(function (m) {
      return m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string";
    })) {
      conversation = history;
      conversation.forEach(function (m) { say(m.role, m.role === "user" ? "You" : "Assistant", m.content); });
    }
  } catch (e) { /* no saved conversation */ }

  if (typeof sdeAsk !== "function") {
    // The page is the same in Eclipse; the host there has no assistant to run.
    ["ask", "send", "who", "model"].forEach(function (id) {
      document.getElementById(id).disabled = true;
    });
    say("error", "VERTEX", "This host has no assistant yet. It runs in VS Code for now.");
    return;
  }

  var who = document.getElementById("who");
  ASSISTANTS.forEach(function (a) {
    var option = document.createElement("option");
    option.value = a[0];
    option.textContent = a[1];
    who.appendChild(option);
  });
  var kept = recall("who");
  who.value = ASSISTANTS.some(function (a) { return a[0] === kept; }) ? kept : ASSISTANTS[0][0];
  askModels();
  document.getElementById("ask").focus();
}

/* Claude Code's aliases, or the catalog Codex reports: the host knows which. */
/* A Claude model by its full id - a version the aliases no longer reach. The
   page asks the host to check it with one short request; what came back
   stays in the list, the rest is only offered. */
var SPECIFY = "?version";

function addVersionOptions(box, data, kept) {
  var listed = data.models.some(function (m) { return m.id === kept; });
  if (kept && !listed) {
    var own = document.createElement("option");
    own.value = kept;
    own.textContent = data.probed && data.probed.id === kept ? data.probed.label : kept;

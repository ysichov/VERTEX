    box.appendChild(own);
  }
  var specify = document.createElement("option");
  specify.value = SPECIFY;
  specify.textContent = "Specify version...";
  box.appendChild(specify);
}

function specifyVersion() {
  var box = document.getElementById("model");
  var who = document.getElementById("who").value;
  box.value = recall("model." + who);
  if (document.getElementById("versionrow")) { document.getElementById("versionid").focus(); return; }
  var row = document.createElement("div");
  row.id = "versionrow";
  row.style.cssText = "display: flex; gap: 4px; padding: 4px 6px;";
  var input = document.createElement("input");
  input.id = "versionid";
  input.placeholder = "claude-opus-5";
  input.spellcheck = false;
  input.style.cssText = "flex: 1 1 0; min-width: 0;";
  var check = document.createElement("button");
  check.textContent = "Check";
  var cancel = document.createElement("button");
  cancel.textContent = "Cancel";
  function close() { row.parentNode.removeChild(row); }
  function go() {
    var id = input.value.trim();
    if (!id) { input.focus(); return; }
    close();
    say("user", "VERTEX", "Checking " + id + " with Claude Code ...");
    askModels(id);
  }
  check.addEventListener("click", go);
  cancel.addEventListener("click", close);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { go(); } else if (e.key === "Escape") { close(); }
  });
  row.appendChild(input); row.appendChild(check); row.appendChild(cancel);
  var holder = box.parentNode;
  holder.parentNode.insertBefore(row, holder.nextSibling);
  input.focus();
}

function askModels(version) {
  var box = document.getElementById("model");
  box.innerHTML = "";
  var waiting = document.createElement("option");
  waiting.textContent = "loading ...";
  box.appendChild(waiting);
  box.disabled = true;
  sdeModels(document.getElementById("who").value, version || "");
}

function fillModels(data) {
  // An answer for an assistant no longer chosen: the one that is has its own
  // request on the way.
  if (data.assistant !== document.getElementById("who").value) { return; }
  var box = document.getElementById("model");
  box.innerHTML = "";
  if (data.error) {
    var none = document.createElement("option");
    none.textContent = "no models";
    box.appendChild(none);
    say("error", "VERTEX", data.error);
    return;
  }
  data.models.forEach(function (m) {
    var option = document.createElement("option");
    option.value = m.id;
    option.textContent = m.label;
    box.appendChild(option);
  });
  var kept = data.probed ? data.probed.id : recall("model." + data.assistant);
  if (data.specify) { addVersionOptions(box, data, kept); }
  if (data.probed) { remember("model." + data.assistant, kept); say("assistant", "VERTEX", "Model " + data.probed.label + " selected."); }
  if (data.probeError) { say("error", "VERTEX", data.probeError); }
  for (var k = 0; k < box.options.length; k += 1) { if (box.options[k].value === kept) { box.value = kept; } }
  box.disabled = false;
}

/* Where the window is now, as the assistant is told it: names and keys,
   never a line of source. */
function pageState() {
  return {
    type: objectType(),
    name: objectName(),
    view: showing.view,
    scope: scope,
    part: current ? current.name : "",
    part_type: current ? current.part_type : "",
    version: showing.view === "diff" ? showing.version : "",
    review_object: review_part ? review_part.obj_name : "",
    review_type: review_part ? review_part.objtype : ""
  };
}

// The Tools-window chat is a sibling iframe. It cannot see this page's
// selection directly, so the parent asks for this small, source-free context
// when composing a chat request.
function sdeContext() { return pageState(); }

var selectedFragment = "";
function selectedDiffText() {
  var selection = window.getSelection();
  var text = selection ? String(selection.toString()).trim() : "";
  var node = selection && selection.anchorNode && (selection.anchorNode.nodeType === 1 ? selection.anchorNode : selection.anchorNode.parentElement);
  return text && node && node.closest && node.closest("table.diff") ? text.slice(0, 12000) : "";
}
function askSelection() {
  selectedFragment = selectedDiffText();
  if (!selectedFragment) { return; }
  document.getElementById("selection-preview").textContent = selectedFragment;
  document.getElementById("selection-question").value = "";
  document.getElementById("selection-ask").showModal();
  document.getElementById("selection-question").focus();
}

function sendAsk() {
  if (asking) { return; }
  var input = document.getElementById("ask");
  var text = input.value.trim();
  if (!text) { return; }
  if (/^new conversation[.!]?$/i.test(text)) { newConversation(); return; }
  var who = document.getElementById("who");
  var model = document.getElementById("model");
  if (model.disabled) {
    say("error", "VERTEX", "There is no model to ask yet: the list for "
        + who.options[who.selectedIndex].text + " did not arrive.");
    return;
  }
  asking = who.options[who.selectedIndex].text;
  say("user", "You", text);
  input.value = "";
  document.getElementById("send").disabled = true;
  document.getElementById("working").textContent = asking + " is working ...";
  var state = pageState();
  state.conversation = conversation.slice();
  state.review_instructions = document.getElementById("presettext").value;
  conversation.push({ role: "user", content: text, state: pageState(), review_instructions: state.review_instructions });
  remember("review.conversation", JSON.stringify(conversation));
  document.getElementById("newconversation").disabled = true;
  sdeAsk(who.value, model.value, text, JSON.stringify(state));
}

// Invoked by the host with a model list or an answer.
function sdeAssistant(raw) {
  var data;
  try { data = JSON.parse(raw); }
  catch (e) { data = { call: "ask", error: "The host answered with something that is not JSON." }; }

  if (data.call === "models") {
    fillModels(data);
    return;
  }

  var who = (asking || "Assistant") + (data.model ? " · " + data.model : "")
          + (data.system ? " · " + data.system : "");
  asking = null;
  document.getElementById("newconversation").disabled = false;
  document.getElementById("send").disabled = false;
  document.getElementById("working").textContent = "";

  if (data.error) {
    conversation.push({ role: "assistant", content: "Request failed: " + data.error });
    remember("review.conversation", JSON.stringify(conversation));
    say("error", who, data.error);
    return;
  }
  var plan = data.plan;
  conversation.push({ role: "assistant", content: plan.reply || "Done.", plan: plan });
  remember("review.conversation", JSON.stringify(conversation));
  say("assistant", who, plan.reply || "Done.", plan.name ? describePlan(plan) : "");
  // An empty name is an answer without a move: the assistant says why.
  if (plan.name) { applyPlan(plan); }
}

function describePlan(plan) {
  var bits = [plan.type + " " + plan.name];
  if (plan.part) { bits.push(plan.part.replace(/\s+/g, " ") + " (" + plan.part_type + ")"); }
  if (plan.version) { bits.push("version " + asVersion(plan.version)); }
  if (plan.review_object) { bits.push("review: " + plan.review_object.replace(/\s+/g, " ")); }
  else if (plan.view === "review") { bits.push("review"); }
  return bits.join(" · ");
}

// A key compares with its blanks: only trailing ones go, and case.
function sameKey(a, b) {
  return String(a || "").replace(/\s+$/, "").toUpperCase()
     === String(b || "").replace(/\s+$/, "").toUpperCase();
}

/* The first step of a plan: the object, exactly as Load would open it. */
function applyPlan(plan) {
  var box = document.getElementById("type");
  if (!Array.prototype.some.call(box.options, function (o) { return o.value === plan.type; })) {
    var option = document.createElement("option");
    option.value = plan.type;
    option.textContent = plan.type;
    box.appendChild(option);
  }
  box.value = plan.type;
  document.getElementById("name").value = plan.name;
  mode = "V";
  pending = plan.view === "parts" ? null : plan;
  loadParts(false);
}

/* The next step, once the answer the last one waited for is on screen. An
   answer about something else means the person went elsewhere in the
   meantime, and the rest of the plan is dropped rather than sprung on them. */
function continuePlan(data) {
  var plan = pending;
  pending = null;

  if (data.parts) {
    if (String(data.object || "").toUpperCase() !== plan.name) { return; }
    if (plan.view === "review" || plan.view === "review_object") {
      mode = "R";
      renderCards();
      if (plan.view === "review_object") { pending = plan; }
      loadReview();
      return;
    }
    var part = null;
    parts.forEach(function (p) {
      if (sameKey(p.name, plan.part)
          && String(p.part_type).toUpperCase() === plan.part_type.toUpperCase()) { part = p; }
    });
    if (!part) {
      say("error", "VERTEX", plan.name + " no longer lists " + plan.part.replace(/\s+/g, " ") + ".");
      return;
    }
    if (plan.view === "diff") { pending = plan; }
    loadVersions(part);
    return;
  }

  if (data.versions) {
    if (!sameKey(data.part, plan.part)) { return; }
    var index = -1;
    versions.forEach(function (v, i) {
      if (v.version === plan.version) { index = i; }
    });
    if (index < 0) {
      say("error", "VERTEX", "Version " + asVersion(plan.version) + " is no longer listed.");
      return;
    }
    loadDiff(index);
    return;
  }

  if (data.reviewers) {
    if (String(data.request || "").toUpperCase() !== plan.name) { return; }
    var object = null;
    (data.objects || []).forEach(function (o) {
      if (sameKey(o.obj_name, plan.review_object)
          && String(o.objtype).toUpperCase() === plan.review_type.toUpperCase()) { object = o; }
    });
    if (!object) {
      say("error", "VERTEX", "The review no longer lists " + plan.review_object.replace(/\s+/g, " ") + ".");
      return;
    }
    loadReviewPart(object);
  }
}

function stopPlan() {
  if (!pending) { return; }
  pending = null;
  say("error", "VERTEX", "The assistant's plan stopped here: SAP answered with an error, shown in the window.");
}

/* ---------- wiring ---------- */

document.getElementById("partsfold").addEventListener("click", function () {
  foldParts(!partsFolded);
});

document.getElementById("partssplit").addEventListener("mousedown", function (e) {
  if (e.button !== 0) { return; }
  e.preventDefault();
  var panel = document.getElementById("partspanel");
  var split = e.currentTarget;
  var startX = e.clientX;
  var startWidth = panel.getBoundingClientRect().width;
  var room = panel.parentNode.getBoundingClientRect().width;
  split.classList.add("dragging");
  document.body.classList.add("dragging");
  function move(ev) {
    var width = Math.max(120, Math.min(room - 200, startWidth + ev.clientX - startX));
    panel.style.flexBasis = width + "px";
  }
  function up() {
    split.classList.remove("dragging");
    document.body.classList.remove("dragging");
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
  }
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

document.getElementById("load").addEventListener("click", function () { loadParts(false); });

document.getElementById("name").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { loadParts(false); }
});

document.getElementById("type").addEventListener("change", showFinder);
document.getElementById("find").addEventListener("click", findRequests);

document.getElementById("user").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { findRequests(); }
});

document.getElementById("assist").addEventListener("click", function () {
  var chat = document.getElementById("chat");
  if (chat.style.display === "flex") { chat.style.display = "none"; } else { openChat(); }
});

document.getElementById("chatclose").addEventListener("click", function () {
  document.getElementById("chat").style.display = "none";
});

document.getElementById("send").addEventListener("click", sendAsk);
document.getElementById("newconversation").addEventListener("click", newConversation);
document.getElementById("reviewpreset").addEventListener("change", selectReviewPreset);
document.getElementById("savepreset").addEventListener("click", saveReviewPreset);
document.getElementById("deletepreset").addEventListener("click", deleteReviewPreset);

document.getElementById("ask").addEventListener("keydown", function (e) {
  // Enter sends; Shift+Enter is a new line in the request.
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendAsk();
  }
});

document.getElementById("who").addEventListener("change", function (e) {
  remember("who", e.target.value);
  askModels();
});

document.getElementById("model").addEventListener("change", function (e) {
  if (e.target.value === SPECIFY) { specifyVersion(); return; }
  remember("model." + document.getElementById("who").value, e.target.value);
});
document.getElementById("root").addEventListener("contextmenu", function (event) {
  if (selectedDiffText()) { event.preventDefault(); askSelection(); }
});
document.getElementById("selection-cancel").addEventListener("click", function () { document.getElementById("selection-ask").close(); });
document.getElementById("selection-question").addEventListener("keydown", function (event) {
  // A placeholder is intentionally not submitted text. Tab accepts the
  // suggested question so it can be edited like ordinary input.
  if (event.key === "Tab" && !event.shiftKey && !event.target.value.trim()) {
    event.preventDefault();
    event.target.value = event.target.placeholder;
    event.target.select();
  }
});
document.getElementById("selection-send").addEventListener("click", function () {
  var question = document.getElementById("selection-question").value.trim() || "What does this fragment do?";
  if (!question || !selectedFragment || typeof sdeAskSelection !== "function") { return; }
  document.getElementById("selection-ask").close();
  sdeAskSelection(question, selectedFragment, pageState());
});

var INITIAL = /*INIT*/null/*INIT*/;
fillTypes(INITIAL ? INITIAL.type : null);
showFinder();
if (INITIAL) {
  document.getElementById("name").value = INITIAL.name;
} else {
  message("Type an object name and press Load.");
  startLink();
}
// Wait for the document, so sdeReady exists before the host calls it. What the
// system has is asked first; an object the window was opened on is read after.
window.addEventListener("load", function () { askAbout(startWindow); });
</script>

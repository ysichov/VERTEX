<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VERTEX Metrics</title>
<style>
  /* Same three-way palette as table.html, for the same reason: the hosts
     report the theme differently.
       :root                 - the light default
       prefers-color-scheme  - follows the OS, which is what the browser inside
                               Eclipse reports
       body.vscode-*         - the class VS Code puts on the webview body */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #1c1c1c;
    --muted: #666666;
    --faint: #b0b0b0;
    --border: #d6d6d6;
    --line: #e2e2e2;
    --surface: #fbfbfb;
    --field-bg: #ffffff;
    --field-border: #b8b8b8;
    --hover: #eaf2fb;
    --th-bg: #eef2f7;
    --th-sorted-bg: #dbe6f4;
    --row-alt: #fafafa;
    --danger: #a5292a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1f1f1f;
      --fg: #d4d4d4;
      --muted: #9d9d9d;
      --faint: #5a5a5a;
      --border: #3c3c3c;
      --line: #333333;
      --surface: #252526;
      --field-bg: #3c3c3c;
      --field-border: #5a5a5a;
      --hover: #2a3d55;
      --th-bg: #2b3a4a;
      --th-sorted-bg: #35506b;
      --row-alt: #232323;
      --danger: #f48771;
    }
  }

  body.vscode-light {
    color-scheme: light;
    --bg: var(--vscode-editor-background, #ffffff); --fg: var(--vscode-editor-foreground, #1c1c1c); --muted: var(--vscode-descriptionForeground, #666666); --faint: var(--vscode-disabledForeground, #b0b0b0);
    --border: var(--vscode-panel-border, #d6d6d6); --line: var(--vscode-editorWidget-border, #e2e2e2); --surface: var(--vscode-editorWidget-background, #fbfbfb);
    --field-bg: var(--vscode-input-background, #ffffff); --field-border: var(--vscode-input-border, #b8b8b8); --hover: var(--vscode-list-hoverBackground, #eaf2fb);
    --th-bg: var(--vscode-keybindingTable-headerBackground, #eef2f7); --th-sorted-bg: var(--vscode-list-activeSelectionBackground, #dbe6f4); --row-alt: var(--vscode-tree-tableOddRowsBackground, #fafafa);
    --danger: var(--vscode-errorForeground, #a5292a);
  }

  body.vscode-dark, body.vscode-high-contrast {
    color-scheme: dark;
    --bg: var(--vscode-editor-background, #1f1f1f); --fg: var(--vscode-editor-foreground, #d4d4d4); --muted: var(--vscode-descriptionForeground, #9d9d9d); --faint: var(--vscode-disabledForeground, #5a5a5a);
    --border: var(--vscode-panel-border, #3c3c3c); --line: var(--vscode-editorWidget-border, #333333); --surface: var(--vscode-editorWidget-background, #252526);
    --field-bg: var(--vscode-input-background, #3c3c3c); --field-border: var(--vscode-input-border, #5a5a5a); --hover: var(--vscode-list-hoverBackground, #2a3d55);
    --th-bg: var(--vscode-keybindingTable-headerBackground, #2b3a4a); --th-sorted-bg: var(--vscode-list-activeSelectionBackground, #35506b); --row-alt: var(--vscode-tree-tableOddRowsBackground, #232323);
    --danger: var(--vscode-errorForeground, #f48771);
  }

  html, body { margin: 0; padding: 0; height: 100%; }
  body { font: 12px "Segoe UI", system-ui, sans-serif; color: var(--fg);
         background: var(--bg); display: flex; flex-direction: column; }

  button { padding: 2px 8px; font: inherit; cursor: pointer; color: var(--fg);
           background: var(--field-bg); border: 1px solid var(--field-border); }
  button:hover { background: var(--hover); }

  .bar { padding: 6px 10px; background: var(--surface);
         border-bottom: 1px solid var(--border); display: flex;
         align-items: center; gap: 8px; flex: 0 0 auto; }
  .bar .status { margin-left: auto; color: var(--muted); }
  .bar select, .bar input { font: inherit; padding: 2px 4px; color: var(--fg);
                            background: var(--field-bg);
                            border: 1px solid var(--field-border); }
  .bar input { width: 240px; text-transform: uppercase; }
  .bar .shown { color: var(--muted); }

  .totals { padding: 6px 10px; background: var(--surface);
            border-bottom: 1px solid var(--border); display: flex;
            flex-wrap: wrap; gap: 14px; flex: 0 0 auto; color: var(--muted); }
  .totals b { color: var(--fg); font-family: Consolas, monospace; }
  .totals.hidden { display: none; }
  .section { margin: 12px 10px 0; border: 1px solid var(--border); }
  .section h3 { margin: 0; padding: 6px 8px; font-size: 12px;
                background: var(--surface); border-bottom: 1px solid var(--border); }
  .section .scroll { overflow: auto; }
  tr.total, tr.total:nth-child(even) { background: var(--surface); font-weight: 600; }
  details.class-group { border-top: 1px solid var(--line); }
  details.class-group:first-of-type { border-top: 0; }
  details.class-group summary { cursor: pointer; padding: 6px 8px; color: var(--fg);
                                background: var(--surface); }
  details.class-group summary:hover { background: var(--hover); }
  details.class-group .class-caption { color: var(--muted); margin-left: 10px; }

  /* One row of panes. In flow mode the unit list shrinks to its names and
     the diagram takes the rest; otherwise the list is the whole window. */
  .panes { flex: 1 1 auto; display: flex; min-height: 0; }
  .scroll { flex: 1 1 auto; overflow: auto; }
  body.flow #list { flex: 0 0 auto; max-width: 24rem;
                    border-right: 1px solid var(--border); }
  table { border-collapse: collapse; white-space: nowrap; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  th { position: sticky; top: 0; background: var(--th-bg); font-weight: 600;
       cursor: pointer; z-index: 1; }
  th:hover { background: var(--th-sorted-bg); }
  th.sorted { background: var(--th-sorted-bg); }
  td.num { text-align: right; font-family: Consolas, monospace; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--hover); }
  .message { padding: 12px; white-space: pre-wrap; font-family: Consolas, monospace;
             color: var(--danger); }
  /* The setup page, and the short link that is always on the start screen.
     A link is a span, not an anchor: a real one would navigate the view away
     from the page it is on. */
  .setup { padding: 12px; max-width: 640px; }
  .setup h3 { margin: 0 0 8px; font-size: 13px; }
  .setup p { margin: 0 0 8px; color: var(--muted); }
  .setup ol { margin: 0 0 8px; padding-left: 20px; }
  .setup li { margin-bottom: 4px; }
  .setup li.ok { color: var(--ins-mark); }
  .setup li.no { color: var(--danger); }
  /* What this system does not have, when a part of the window is left out. */
  .missing { padding: 4px 10px; color: var(--danger); background: var(--surface);
             border-bottom: 1px solid var(--line); }
  .setup pre.said { margin: 8px 0 0; padding: 8px; background: var(--surface);
                    border: 1px solid var(--line); border-radius: 6px;
                    white-space: pre-wrap; color: var(--muted);
                    font-family: Consolas, monospace; }
  .startlink { margin-top: 10px; color: var(--muted);
               font-family: "Segoe UI", system-ui, sans-serif; }
  .link { cursor: pointer; text-decoration: underline; }
  .link.plain { cursor: text; text-decoration: none; user-select: text;
                font-family: Consolas, monospace; }

  /* Flow. The button stays pressed while the mode is on, because which of
     the two a click on a row does is not otherwise visible. */
  tbody tr.pick { cursor: pointer; }
  /* The flow is about the whole object, so it gets the whole window. */
  body.calls #list { display: none; }
  tbody tr.sel, tbody tr.sel:nth-child(even) { background: var(--th-sorted-bg); }
  /* The diagram's own controls, next to the button that brings it up. */
  .bar .tools { display: flex; gap: 4px; align-items: center; }
  .bar .tools button { min-width: 1.9rem; }
  /* Depth is a question about following calls, so only the flow asks it. */
  .bar .depth { display: none; color: var(--muted); gap: 3px; align-items: center; }
  body.calls .bar .depth { display: flex; }
  .bar .depth input { width: 3.2rem; font: inherit; padding: 2px 4px; color: var(--fg);
                      background: var(--field-bg); border: 1px solid var(--field-border); }
  /* The diagram sizes itself; the pane scrolls in both directions rather
     than shrinking a picture nobody could then read.
     ACE's colours are light: a call is pale pink, a database statement pale
     blue, a protected block pale green. Left alone on a dark page they keep
     those fills and get light text written on them, which leaves exactly the
     nodes that carry the meaning unreadable. The hue is the meaning, so it is
     kept and only the lightness is turned over - see darkened(). */
  /* A sheet in a light window, the window's own ground in a dark one. The
     three-way palette above decides which, for the same reason it does for
     everything else here: the hosts report the theme differently. */
  #diagram { padding: 10px; background: #ffffff; color: #111111; }
  @media (prefers-color-scheme: dark) {
    #diagram { background: var(--bg); color: var(--fg); }
  }
  body.vscode-light #diagram { background: #ffffff; color: #111111; }
  body.vscode-dark #diagram, body.vscode-high-contrast #diagram {
    background: var(--bg); color: var(--fg); }
  #diagram svg { max-width: none; height: auto; }
  #diagram .hint { color: #666666; font-family: "Segoe UI", system-ui, sans-serif; }
  #diagram .failed { color: #a5292a; white-space: pre-wrap;
                     font-family: Consolas, monospace; }
  /* ACE marks a node it can open in the source window. Here there is no
     source window, so only the stretches that fold carry a hand. */
  .diagram a[href^="sapevent:aceexp"] { cursor: pointer; }
  .diagram a { text-decoration: none; }
</style>
</head>
<body>

<div class="bar">
  <select id="type" title="Object type"></select>
  <input id="name" spellcheck="false" autocomplete="off" placeholder="object name">
  <button id="load">Load</button>
  <select id="mode" title="What this window draws">
    <option value="calls">Flow</option>
    <option value="scheme">Scheme</option>
    <option value="metrics">Metrics</option>
    <option value="class">UML class</option>
  </select>
  <span class="tools" id="tools" hidden>
    <label class="depth" id="depthbox" title="How far the flow follows calls">depth
      <input id="depth" type="number" min="1" max="99" step="1" value="3"></label>
    <button id="dir" title="Lay the diagram out down the page instead of across">&#8646;</button>
    <button id="out" title="Smaller">&#8722;</button>
    <button id="in" title="Larger">+</button>
    <button id="fit" title="Scale the whole diagram into the pane">Fit</button>
  </span>
  <span class="shown" id="object"></span>
  <span class="status" id="status"></span>
</div>

<div class="missing" id="missing" hidden></div>
<div class="totals hidden" id="totals"></div>

<div class="panes">
  <div class="scroll" id="list"><div id="root"></div></div>
  <div class="scroll" id="diagram" hidden></div>
</div>

<script>
"use strict";

/* Column definitions. "num" decides the alignment and the sort comparison, so
   a column is described once and the header, the cell and the sort follow. */
var COLUMNS = [
  { key: "unit_name",   text: "Unit",        num: false },
  { key: "unit_type",   text: "Type",        num: false },
  { key: "include",     text: "Include",     num: false },
  { key: "cyclomatic",  text: "CC",          num: true  },
  { key: "mi",          text: "MI",          num: true  },
  { key: "loc",         text: "LOC",         num: true  },
  { key: "lloc",        text: "LLOC",        num: true  },
  { key: "cloc",        text: "CLOC",        num: true  },
  { key: "volume",      text: "Volume",      num: true  },
  { key: "difficulty",  text: "Difficulty",  num: true  },
  { key: "effort",      text: "Effort",      num: true  },
  { key: "bugs",        text: "Bugs",        num: true  },
  { key: "vocabulary",  text: "Vocabulary",  num: true  },
  { key: "prog_length", text: "Length",      num: true  }
];

/* A class has one implementation pool.  Its include and the repeated class
   prefix only expose SAP's storage layout, not information the reader needs.
   The useful distinction between its methods is their visibility instead. */
var CLASS_COLUMNS = [
  { key: "unit_name",  text: "Method",     num: false },
  { key: "visibility", text: "Visibility", num: false },
  { key: "cyclomatic", text: "CC",         num: true  },
  { key: "mi",         text: "MI",         num: true  },
  { key: "loc",        text: "LOC",        num: true  },
  { key: "lloc",       text: "LLOC",       num: true  },
  { key: "cloc",       text: "CLOC",       num: true  },
  { key: "volume",     text: "Volume",     num: true  },
  { key: "difficulty", text: "Difficulty", num: true  },
  { key: "effort",     text: "Effort",     num: true  },
  { key: "bugs",       text: "Bugs",       num: true  },
  { key: "vocabulary", text: "Vocabulary", num: true  },
  { key: "prog_length",text: "Length",     num: true  }
];

var OBJECT_COLUMNS = [
  { key: "object", text: "Object", num: false },
  { key: "object_type", text: "Type", num: false },
  { key: "units", text: "Units", num: true },
  { key: "cyclomatic", text: "CC", num: true },
  { key: "avg_cyclomatic", text: "Avg CC", num: true },
  { key: "loc", text: "LOC", num: true },
  { key: "lloc", text: "LLOC", num: true },
  { key: "cloc", text: "CLOC", num: true },
  { key: "volume", text: "Volume", num: true },
  { key: "effort", text: "Effort", num: true },
  { key: "time_t", text: "Time", num: true },
  { key: "bugs", text: "Bugs", num: true }
];

var units = [];
var totals = null;
var sortKey = null;
var sortDown = true;

/* What the last answer was about. One request is outstanding at a time - a
   click reaches the host, the host answers - so one name is enough to tell
   sdeReady which of the three it is holding. */
var waiting = null;

/* The object the table on screen was read for. Kept apart from the input
   bar: somebody can type a new name without pressing Load, and a diagram
   must still be asked for the object whose row was clicked. */
var loadedObject = "";
var loadedType = "";

function status(text) {
  document.getElementById("status").textContent = text || "";
}

function message(text) {
  var root = document.getElementById("root");
  root.className = "message";
  root.textContent = text;
  document.getElementById("totals").className = "totals hidden";
}

/* ---------- data ---------- */

/* The types this service reads. The page does not enforce the list - a type
   the resource refuses comes back as its own sentence, and one authority for
   that rule is enough. */
var TYPES = [["CLAS", "Class"], ["INTF", "Interface"],
             ["PROG", "Program"], ["INCL", "Include"], ["DEVC", "Package"]];

function objectName() {
  return document.getElementById("name").value.trim().toUpperCase();
}

function objectType() {
  return document.getElementById("type").value;
}

function load() {
  var name = objectName();
  if (!name) {
    message("Type an object name and press Load.");
    return;
  }
  if (mode === "class" || (INITIAL && INITIAL.action === "uml")) {
    loadedObject = name; loadedType = objectType(); setMode("class"); return;
  }
  shownUnit = null;
  expanded = [];
  lastMermaid = null;
  if (mode === "scheme") { hint("Pick a method on the left."); }
  status("reading " + name + " ...");
  waiting = "metrics";
  // Returns at once. The host answers later by calling sdeReady.
  sdeLoad(name, objectType());
}

function loadClassDiagram() {
  if (!loadedObject) { return; }
  status("reading class definition ...");
  waiting = "class";
  sdeClass(loadedObject, loadedType);
}

/* The type arrives from the object tree with its subtype - CLAS/OC. Only the
   head selects the entry; an unknown one is added rather than dropped, so a
   window opened on it still shows what it was opened for. */
function fillTypes(chosen) {
  var head = chosen ? String(chosen).split("/")[0] : "";
  var known = TYPES.slice();
  var found = known.some(function (t) { return t[0] === head; });
  if (head && !found) { known.unshift([head, head]); }

  var box = document.getElementById("type");
  known.forEach(function (t) {
    var option = document.createElement("option");
    option.value = t[0];
    option.textContent = t[1];
    if (t[0] === head) { option.selected = true; }
    box.appendChild(option);
  });
}

/* Invoked by the host when the answer is waiting.

   Taking the answer is instant; everything done with it is not. This runs
   inside the host's own callback - in Eclipse that is the WebView2 message
   pump - and the page's own rules about not blocking it apply here too:
   running three megabytes of library, or laying out a diagram, while the
   pump waits is how Edge ends up giving up on the operation. So the answer
   is picked up here and handled on the next task. */
function sdeReady() {
  var kind = waiting;
  waiting = null;
  var raw = sdeTake();
  setTimeout(function () { answered(kind, raw); }, 0);
}

function answered(kind, raw) {
  // The first thing a window asks is what the system has.
  if (kind === "about") { tookAbout(raw); return; }
  if (kind === "class") { drawClass(raw); return; }
  // Kept so that an answer this window drops can leave it as it was: the
  // request actually being waited for is still on its way, and "reading ..."
  // is still the truth.
  var wasSaying = document.getElementById("status").textContent;
  status("");
  if (typeof raw !== "string") { lost(kind); return; }
  if (raw.indexOf("ERROR:") === 0) {
    var said = raw.substring(6);
    // The host marks the one failure that is really a setup state.
    // A failure while a diagram is being fetched belongs in the diagram pane:
    // the unit list beside it is still good, and wiping it would cost the
    // reader the place they had got to.
    if (kind === "flow" || kind === "asset") { failed(said.replace("NOBACKEND:", "")); }
    else if (said.indexOf("NOBACKEND:") === 0) { notFound(said.substring(10)); }
    else { message(said); }
    status("");
    return;
  }
  // The library is JavaScript, not an answer to a question about ABAP.
  if (kind === "asset") { startMermaid(raw); return; }
  var data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    message("Response is not JSON:" + String.fromCharCode(10) + raw.substring(0, 2000));
    return;
  }
  /* Which answer this is, read from the answer itself rather than from what
     was last asked for. Two questions can be in flight at once - a second
     method clicked while the first is still coming, a depth changed mid
     request - and the slot that remembered the question has by then been
     emptied by the first reply. Reading the shape cannot be got wrong that
     way: a picture carries a mode, a table carries units. */
  if (data.mode !== undefined) {
    // Only the picture still being looked at is worth drawing. An answer to a
    // question the reader has moved on from is dropped, not shown.
    if (data.mode !== mode) { status(wasSaying); return; }
    if (data.mode === "scheme"
        && (!shownUnit
            || String(data.unit).toUpperCase() !== String(shownUnit.name).toUpperCase())) {
      status(wasSaying);
      return;
    }
    renderDiagram(data);
    return;
  }
  // A program/class returns code units; a package returns its source objects.
  // Both are Metrics answers and are rendered by the same entry point.
  if (data.units !== undefined || data.objects !== undefined) { render(data); return; }
  message("The host answered something this window does not recognise:"
          + String.fromCharCode(10) + raw.substring(0, 400));
}

function drawClass(raw) {
  if (typeof raw !== "string") { failed("No class definition returned."); return; }
  if (mode !== "class") { return; }
  if (raw.indexOf("ERROR:") === 0) { status(""); failed(raw.substring(6)); return; }
  if (!mermaidLoaded) {
    pendingClass = raw;
    waiting = "asset";
    sdeAsset("mermaid");
    return;
  }
  try {
    var data = JSON.parse(raw);
    var nodes = data.nodes || (data.class ? [{name:data.class,methods:data.methods}] : []);
    if (!nodes.length) { hint("This package has no classes or interfaces."); status(""); return; }
    var lines = ["classDiagram", "direction " + direction], ids = new Map();
    function label(value) { return String(value || "").replace(/[^A-Za-z0-9_/$~]/g, "_"); }
    function node(name) {
      if (!ids.has(name)) { var id="n"+ids.size; ids.set(name,id); lines.push('class '+id+'["'+label(name)+'"]'); }
      return ids.get(name);
    }
    nodes.forEach(function(n){node(n.name);});
    nodes.forEach(function(n){
      var id=node(n.name);
      if(n.kind==="interface") lines.push("<<interface>> "+id);
      (n.methods||[]).forEach(function(m){
        var visibility={public:"+",protected:"#",private:"-"}[m.visibility]||"";
        lines.push(id+" : "+visibility+label(m.name).replace(/~/g,"_")+"()"+(m.is_static?"$":""));
      });
    });
    (data.edges||[]).forEach(function(e){
      var arrow={inheritance:"--|>",implementation:"..|>",dependency:"..>"}[e.kind];
      if(arrow)lines.push(node(e.source)+" "+arrow+" "+node(e.target));
    });
    lastMermaid=lines.join("\n"); lastCaption=nodes.length+" classes / interfaces"; refit=true; draw();
  } catch (e) { failed("Invalid class definition: " + e.message); }
}

/* An answer the host never left behind. Whatever went wrong, it must not take
   the unit list with it: the reader is looking at that list, and a message in
   its place costs them the place they had got to. */
function lost(kind) {
  if (kind === "flow" || kind === "asset") {
    failed("No response from the host.");
  } else if (units.length > 0) {
    status("no response from the host");
  } else {
    message("No response from the host.");
  }
}

/* ---------- rendering ---------- */

function renderTotals(totals) {
  var box = document.getElementById("totals");
  box.className = "totals";
  box.innerHTML = "";
  [["units", totals.units], ["cyclomatic", totals.cyclomatic],
   ["avg CC", totals.avg_cyclomatic], ["LOC", totals.loc],
   ["LLOC", totals.lloc], ["CLOC", totals.cloc],
   ["volume", totals.volume], ["effort", totals.effort], ["time", totals.time_t],
   ["bugs", totals.bugs]].forEach(function (pair) {
    var span = document.createElement("span");
    span.appendChild(document.createTextNode(pair[0] + " "));
    var b = document.createElement("b");
    b.textContent = pair[1];
    span.appendChild(b);
    box.appendChild(span);
  });
}

function sorted() {
  if (sortKey === null) { return units; }
  var column = null;
  COLUMNS.forEach(function (c) { if (c.key === sortKey) { column = c; } });
  var copy = units.slice();
  copy.sort(function (a, b) {
    var x = a[sortKey], y = b[sortKey];
    if (column && column.num) {
      x = Number(x); y = Number(y);
    } else {
      x = String(x); y = String(y);
    }
    if (x < y) { return sortDown ? 1 : -1; }
    if (x > y) { return sortDown ? -1 : 1; }
    return 0;
  });
  return copy;
}

function renderTable() {
  var root = document.getElementById("root");
  root.className = "";
  root.innerHTML = "";

  // In flow mode the numbers give way to the diagram: only the name is left,
  // which is what picking a unit needs. The order stays whatever column was
  // sorted on, so a list opened on the worst complexity keeps that order.
  var columns = flowMode() ? COLUMNS.slice(0, 1) : COLUMNS;

  var headRow = document.createElement("tr");
  columns.forEach(function (c) {
    var th = document.createElement("th");
    th.textContent = c.text + (c.key === sortKey ? (sortDown ? " ▼" : " ▲") : "");
    th.title = "Sort by " + c.text;
    if (c.key === sortKey) { th.className = "sorted"; }
    th.addEventListener("click", function () {
      // A second click on the same column reverses it; a new column starts
      // with the largest value on top, which is what a hotspot list is for.
      if (sortKey === c.key) { sortDown = !sortDown; }
      else { sortKey = c.key; sortDown = true; }
      renderTable();
    });
    headRow.appendChild(th);
  });
  var thead = document.createElement("thead");
  thead.appendChild(headRow);

  var tbody = document.createElement("tbody");
  sorted().forEach(function (u) {
    var tr = document.createElement("tr");
    if (mode === "scheme") {
      tr.className = shown(u) ? "pick sel" : "pick";
      tr.title = "Branch scheme of " + u.unit_name;
      tr.addEventListener("click", function () { openUnit(u); });
    }
    columns.forEach(function (c) {
      var td = document.createElement("td");
      td.textContent = u[c.key];
      if (c.num) { td.className = "num"; }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  var table = document.createElement("table");
  table.appendChild(thead);
  table.appendChild(tbody);
  root.appendChild(table);
}

function unitTotal(rows) {
  var total = { unit_name: "TOTAL" };
  ["cyclomatic", "mi", "loc", "lloc", "cloc", "volume", "difficulty",
   "effort", "bugs", "vocabulary", "prog_length"].forEach(function (key) {
    total[key] = rows.reduce(function (sum, row) { return sum + Number(row[key] || 0); }, 0);
  });
  return total;
}

function labelForUnitType(type) {
  var labels = { event: "Events", form: "Forms", method: "Methods",
                 module: "Modules", function: "Functions", program: "Program" };
  return labels[String(type || "").toLowerCase()] || String(type || "Units");
}

function makeTable(columns, rows, total, isClass) {
  var table = document.createElement("table"), thead = document.createElement("thead"), tr = document.createElement("tr");
  columns.forEach(function (column) { var th = document.createElement("th"); th.textContent = column.text; tr.appendChild(th); });
  thead.appendChild(tr); table.appendChild(thead);
  var body = document.createElement("tbody");
  rows.forEach(function (row) {
    var line = document.createElement("tr");
    columns.forEach(function (column) { var cell = document.createElement("td"); cell.textContent = cellValue(row, column.key, isClass); if (column.num) { cell.className = "num"; } line.appendChild(cell); });
    body.appendChild(line);
  });
  if (total) {
    var totalRow = document.createElement("tr"); totalRow.className = "total";
    columns.forEach(function (column) { var cell = document.createElement("td"); cell.textContent = total[column.key] === undefined ? "" : total[column.key]; if (column.num) { cell.className = "num"; } totalRow.appendChild(cell); });
    body.appendChild(totalRow);
  }
  table.appendChild(body); return table;
}

function classMetrics() { return String(loadedType || "").toUpperCase() === "CLAS"; }

function metricColumns() { return classMetrics() ? CLASS_COLUMNS : COLUMNS; }

function cellValue(row, key, isClass) {
  var value = row[key] === undefined ? "" : row[key];
  if (isClass && key === "unit_name") {
    return String(value).replace(/^.*=>/, "");
  }
  return value;
}

function renderMetricSections() {
  if (flowMode()) { renderTable(); return; }
  var root = document.getElementById("root"); root.className = ""; root.innerHTML = "";
  var groups = {};
  sorted().forEach(function (unit) { var key = unit.unit_type || "unit"; (groups[key] || (groups[key] = [])).push(unit); });
  Object.keys(groups).sort().forEach(function (key) {
    var section = document.createElement("section"); section.className = "section";
    var heading = document.createElement("h3"); heading.textContent = labelForUnitType(key) + " (" + groups[key].length + ")";
    section.appendChild(heading); var scroll = document.createElement("div"); scroll.className = "scroll";
    if (String(key).toLowerCase() === "method") {
      var classes = {};
      groups[key].forEach(function (method) {
        var name = String(method.unit_name || "");
        var at = name.indexOf("=>");
        var className = at > 0 ? name.substring(0, at) : "Other methods";
        (classes[className] || (classes[className] = [])).push(method);
      });
      Object.keys(classes).sort().forEach(function (className) {
        var methods = classes[className], block = document.createElement("details");
        block.className = "class-group";
        var summary = document.createElement("summary");
        var aggregate = unitTotal(methods);
        summary.textContent = className + " (" + methods.length + ")";
        var caption = document.createElement("span"); caption.className = "class-caption";
        caption.textContent = "CC " + aggregate.cyclomatic + " · LOC " + aggregate.loc + " · MI " + aggregate.mi;
        summary.appendChild(caption); block.appendChild(summary);
        var table = makeTable(metricColumns(), methods, aggregate, classMetrics());
        if (classMetrics() && Object.keys(classes).length === 1) {
          scroll.appendChild(table);
        } else {
          block.appendChild(table); scroll.appendChild(block);
        }
      });
    } else {
      scroll.appendChild(makeTable(metricColumns(), groups[key], unitTotal(groups[key]), classMetrics()));
    }
    section.appendChild(scroll); root.appendChild(section);
  });
}

function renderPackage(data) {
  units = []; totals = data.totals || {}; loadedObject = data.object; loadedType = data.type;
  document.getElementById("object").textContent = "package " + data.object;
  if (typeof sdeTitle === "function") { sdeTitle(data.object.toUpperCase()); }
  renderTotals(totals);
  var root = document.getElementById("root"); root.className = ""; root.innerHTML = "";
  var section = document.createElement("section"); section.className = "section";
  var heading = document.createElement("h3"); heading.textContent = "Objects (" + (data.objects || []).length + ")"; section.appendChild(heading);
  var scroll = document.createElement("div"); scroll.className = "scroll";
  (data.objects || []).forEach(function (object) {
    var block = document.createElement("details"); block.className = "class-group";
    var summary = document.createElement("summary");
    summary.textContent = String(object.object || "") + " · " + String(object.object_type || "").toUpperCase();
    var caption = document.createElement("span"); caption.className = "class-caption";
    caption.textContent = "units " + object.units + " · CC " + object.cyclomatic
      + " · Avg CC " + object.avg_cyclomatic + " · LOC " + object.loc;
    summary.appendChild(caption); block.appendChild(summary);
    var rows = object.unit_rows || [];
    var objectIsClass = String(object.object_type || "").toUpperCase() === "CLAS";
    block.appendChild(makeTable(objectIsClass ? CLASS_COLUMNS : COLUMNS, rows,
      rows.length ? unitTotal(rows) : null, objectIsClass));
    scroll.appendChild(block);
  });
  section.appendChild(scroll); root.appendChild(section);
  status((data.objects || []).length + " objects");
}

function render(data) {
  if (data.objects !== undefined) { renderPackage(data); return; }
  units = data.units || [];
  totals = data.totals;
  var first = loadedObject !== data.object;
  loadedObject = data.object;
  loadedType = data.type;
  // A class pool name (ZCL_FOO=====CP) is SAP's implementation include, not
  // the object the reader asked metrics for.  It remains necessary in the
  // request for a scheme, but never needs to be presented for a class.
  document.getElementById("object").textContent = String(data.type || "").toUpperCase() === "CLAS"
    ? data.object : data.program;
  // Optional on purpose: a host with no tab to rename simply does not define
  // it, and the VS Code shim is exactly that host today.
  if (typeof sdeTitle === "function") { sdeTitle(data.object.toUpperCase()); }

  if (units.length === 0) {
    // Not an error: a class of nothing but declarations has no code unit. Say
    // which program was read, so it is clear what was looked at. Totals of
    // zeros would say nothing, and message() hides that row anyway.
    message("No code units in " + (String(data.type || "").toUpperCase() === "CLAS" ? data.object : data.program) + ".");
    return;
  }

  renderTotals(data.totals);
  renderMetricSections();
  status(units.length + (units.length === 1 ? " unit" : " units"));
  // A window opened on an object chooses its own first picture; one the
  // reader has since set is theirs and stays.
  if (first) { setMode(INITIAL && INITIAL.action ? ({flow:"calls",uml:"class"}[INITIAL.action] || INITIAL.action) : modeFor(data.type)); }
}


/* ---------- the branch scheme ----------

   The picture is ACE's, not this page's. ZCL_ACE_CODE_HTML=>BUILD_SCHEME
   writes the same mermaid text the Scheme window draws in SAP GUI, for the
   one unit that was clicked, and the resource hands it over as a string.
   What is left here is drawing that string and passing one kind of click
   back - opening a folded stretch - because that is the only thing the
   picture cannot answer by itself.

   The list stays beside it, cut down to the names. Reading a class means
   walking its methods, and a picture that replaced the list would make every
   step of that walk a step back first.

   mermaid is not fetched from anywhere. It sits in the plugin next to this
   page, and the host reads it and hands over its text the first time a
   diagram is asked for; until then this window costs what it always did. */

/* What the window draws. "metrics" is the table, "scheme" the branch
   structure of one unit, "calls" the order the units would run in. Which one
   a window opens on follows from the object: a program has top-level code and
   a flow to show, a class has methods and nothing above them. */
var mode = "metrics";
var shownUnit = null;     // the unit on display, while one is
var expanded = [];        // stretches the reader opened, by their anchor line
var mermaidLoaded = false;
var diagramSeq = 0;

/* How the diagram is laid out and how big it is drawn. Neither leaves the
   page: both are questions about this drawing, not about the code, and
   asking ABAP again to turn a picture the reader is already looking at
   would be a wait for nothing. */
/* How far the flow follows calls. ACE's own window starts at 19, which draws
   a picture too big to read the first time; three is enough to see the shape
   and the reader winds it out from there. */
var depth = 3;

var direction = "TB";
// A method is drawn to fit the pane when it is opened: one fixed percentage
// is wrong in both directions, because a short FORM and a whole PBO event
// differ by more than an order of magnitude. A scale the reader picks then
// holds while they stay on that unit - turning it, opening a stretch - and
// the next unit is fitted again.
var zoom = 1;
var refit = true;
var natural = null;      // the size mermaid drew, before any scaling
/* Whether the scale on screen is one this page worked out rather than one the
   reader chose. A fitted diagram follows the pane when the pane changes; a
   scale somebody set by hand is theirs and is left alone. */
var fitted = true;
var fittedFor = null;    // the pane size the current fit was worked out for
var lastMermaid = null;  // the text ACE sent, kept so it can be redrawn
var lastCaption = "";
var pendingClass = null;

function flowMode() { return mode !== "metrics"; }

/* Whether this row is the one on display. Include and name together, because
   a program can hold two FORMs of the same name in different includes. */
function shown(unit) {
  return !!shownUnit
      && shownUnit.include === unit.include
      && shownUnit.name === unit.unit_name;
}

function setMode(next) {
  mode = next;
  document.getElementById("mode").value = next;
  document.body.classList.toggle("flow", flowMode());
  document.body.classList.toggle("calls", next === "calls");
  document.getElementById("list").hidden = next === "class";
  document.getElementById("totals").classList.toggle("hidden", next === "class");
  document.getElementById("diagram").hidden = !flowMode();
  document.getElementById("tools").hidden = !flowMode();
  shownUnit = null;
  expanded = [];
  lastMermaid = null;
  refit = true;

  if (units.length > 0) { renderMetricSections(); }

  if (next === "class") {
    loadClassDiagram();
  } else if (next === "metrics") {
    status(units.length ? units.length + (units.length === 1 ? " unit" : " units") : "");
  } else if (next === "scheme") {
    hint("Pick a method on the left.");
  } else if (loadedObject) {
    requestDiagram();
  }
}

/* Which picture an object opens on. A program or an include has code above
   its units - events, top-level statements - so the order things run in is
   the thing to show first. A class has no such code: its pool is nothing but
   INCLUDE statements, and until the class map is here the useful first sight
   of it is the list of its methods. */
function modeFor(type) {
  // Without the flow resource there is only the one picture.
  if (!usable("flow")) { return "metrics"; }
  var head = String(type || "").toLowerCase();
  // A package has both useful views.  Its explicit UML action has already
  // selected "class" before this point; the default Metrics action shows the
  // ACE-style package summary instead of silently changing the reader's mode.
  if (head === "devc") { return "metrics"; }
  return head === "prog" || head === "incl" ? "calls" : "scheme";
}

function openUnit(unit) {
  if (mode !== "scheme") { return; }
  shownUnit = { include: unit.include, name: unit.unit_name };
  expanded = [];
  lastMermaid = null;
  refit = true;
  renderTable();
  requestDiagram();
}

/* The diagram pane speaks for itself: a failure there must not take the list
   with it, which is what message() would do. */
function hint(text) { note(text, "hint"); }
function failed(text) { note(text, "failed"); }

function note(text, kind) {
  var pane = document.getElementById("diagram");
  pane.innerHTML = "";
  var box = document.createElement("div");
  box.className = kind;
  box.textContent = text;
  pane.appendChild(box);
}

/* Every version of the diagram is a fresh question to ABAP, the one after a
   stretch is opened included. ACE decides what a stretch collapses to, and
   deciding that here as well is how the two pictures would drift apart. */
function requestDiagram() {
  status("reading " + (shownUnit ? shownUnit.name : loadedObject) + " ...");
  if (!mermaidLoaded) {
    waiting = "asset";
    sdeAsset("mermaid");
    return;
  }
  waiting = "flow";
  if (mode === "calls") {
    // The flow is the whole object; there is no unit to name.
    sdeFlow(loadedObject, loadedType, "calls", "", "", "", String(depth));
  } else {
    sdeFlow(loadedObject, loadedType, "scheme", shownUnit.include,
            shownUnit.name, expanded.join(","), "");
  }
}

/* ---- scale ----

   Nothing is asked of ABAP to resize: the drawing is an SVG with a viewBox,
   so its own width and height are all that change. The scale a reader picked
   survives a move to the next method - they picked it to read this class, not
   this one diagram. */

function setZoom(value) {
  zoom = Math.max(0.15, Math.min(4, value));
  applyZoom();
}

function applyZoom() {
  var svg = document.querySelector("#diagram svg");
  if (!svg || !natural) { return; }
  svg.style.maxWidth = "none";
  svg.style.width = Math.round(natural.w * zoom) + "px";
  svg.style.height = Math.round(natural.h * zoom) + "px";
}

function fitDiagram() {
  var pane = document.getElementById("diagram");
  if (!natural || !natural.w || !natural.h) { return; }
  // Room inside the padding, and never blown up past full size: a short
  // method stretched over a wide pane reads worse, not better.
  var room = 20;
  setZoom(Math.min((pane.clientWidth - room) / natural.w,
                   (pane.clientHeight - room) / natural.h, 1));
  fitted = true;
  fittedFor = { w: pane.clientWidth, h: pane.clientHeight };
}

/* The pane changes size when the editor's windows are rearranged, and a
   drawing sized in pixels knows nothing about that. Fitting it again is only
   right while it is still the fit this page chose. */
function paneResized() {
  var pane = document.getElementById("diagram");
  if (!fitted || !natural || pane.hidden) { return; }
  if (fittedFor && fittedFor.w === pane.clientWidth
                && fittedFor.h === pane.clientHeight) { return; }
  fitDiagram();
}

/* ---- colours ----

   ACE writes its node colours as mermaid classDef lines, and every one of
   them is a pale fill meant for a white page. On a dark one the fill has to
   go dark and the text light, or the reader gets grey on pink. What must not
   change is which hue means what: a call stays red, a database statement
   blue, a protected block green, an event orange. So the hue is taken from
   the line ACE wrote and only its lightness is turned over. */

/* What the editor is actually painted with.

   VS Code hands a webview its whole palette as CSS variables, so the diagram
   can sit on the editor's own background whatever theme is loaded, including
   one nobody has seen. Eclipse hands the browser a bare document and injects
   nothing, so there the page's own tokens are the best there is - they at
   least follow the system's light or dark. */
function themeColour(name, fallback) {
  var value = "";
  try {
    value = getComputedStyle(document.body).getPropertyValue(name) || "";
  } catch (e) {
    value = "";
  }
  value = value.trim();
  return value || fallback;
}

function ground() {
  return themeColour("--vscode-editor-background", themeColour("--bg", "#ffffff"));
}

function ink() {
  return themeColour("--vscode-editor-foreground", themeColour("--fg", "#111111"));
}

/* Read from the colour itself, not from the class the host set. A theme is
   free to call itself dark and paint a pale editor, and what decides whether
   light text can be read is the background, not the name. */
function darkPage() {
  var c = channels(ground());
  if (!c) { return false; }
  return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 128;
}

/* Accepts what a stylesheet may hand back: #abc, #aabbcc, rgb(1, 2, 3). */
function channels(colour) {
  var text = String(colour || "").trim();
  var rgb = /^rgba?\(([^)]+)\)$/.exec(text);
  if (rgb) {
    var parts = rgb[1].split(",");
    if (parts.length < 3) { return null; }
    return [parseInt(parts[0], 10), parseInt(parts[1], 10), parseInt(parts[2], 10)];
  }
  var h = text.replace("#", "");
  if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
  if (!/^[0-9a-fA-F]{6}$/.test(h)) { return null; }
  return [parseInt(h.substring(0, 2), 16),
          parseInt(h.substring(2, 4), 16),
          parseInt(h.substring(4, 6), 16)];
}

/* One colour moved part of the way towards another. */
function toward(from, to, part) {
  var a = channels(from), b = channels(to), out = "#";
  if (!a || !b) { return from; }
  for (var i = 0; i < 3; i++) {
    var v = Math.round(a[i] + (b[i] - a[i]) * part);
    out += (v < 16 ? "0" : "") + v.toString(16);
  }
  return out;
}

function darkened(text) {
  return text.replace(/^([ \t]*classDef[ \t]+\S+[ \t]+)(.+)$/gm,
    function (whole, head, rules) {
      var fill = null, stroke = null;
      rules.split(",").forEach(function (rule) {
        var found = /^[ \t]*(fill|stroke)[ \t]*:[ \t]*(#[0-9a-fA-F]{3,6})/.exec(rule);
        if (!found) { return; }
        if (found[1] === "fill") { fill = found[2]; } else { stroke = found[2]; }
      });
      // The stroke carries the hue at full strength; the fill is that hue
      // watered down for a white page, so it is the worse thing to read from.
      var hue = stroke || fill;
      var bg = ground();
      var out = [];
      if (fill) { out.push("fill:" + (hue ? toward(hue, bg, 0.72) : bg)); }
      if (stroke) { out.push("stroke:" + toward(stroke, ink(), 0.3)); }
      out.push("color:" + ink());
      return head + out.join(",");
    });
}

/* ---- which way it runs ----

   ACE writes the scheme left to right and says so in two kinds of line: the
   chart's own header, and the direction inside every frame it draws round a
   loop or a TRY. Turning the picture is those lines and nothing else, so it
   happens here. The frames have to turn with the chart, or their bodies run
   across a diagram that runs down.

   This is the one thing the page knows about the shape of ACE's text. If ACE
   ever stops writing that header, the toggle says so instead of quietly
   doing nothing. */

var DIRECTIONS = /^([ \t]*)(flowchart|graph|direction)[ \t]+(LR|RL|TB|TD|BT)\b/gm;

function turned(text, dir) {
  DIRECTIONS.lastIndex = 0;
  if (!DIRECTIONS.test(text)) { return null; }
  DIRECTIONS.lastIndex = 0;
  return text.replace(DIRECTIONS, "$1$2 " + dir);
}

function setDirection(value) {
  direction = value;
  var button = document.getElementById("dir");
  button.innerHTML = direction === "TB" ? "&#8645;" : "&#8646;";
  button.title = direction === "TB"
    ? "Lay the diagram out across the page instead of down"
    : "Lay the diagram out down the page instead of across";
  if (lastMermaid) { draw(); }
}

/* The library arrives as text, so it is run here rather than fetched. */
function startMermaid(source) {
  var script = document.createElement("script");
  script.textContent = source;
  document.head.appendChild(script);
  if (typeof mermaid === "undefined") {
    failed("mermaid.min.js was read but defined no mermaid object.");
    return;
  }
  mermaidLoaded = true;
  if (pendingClass) {
    var definition = pendingClass;
    pendingClass = null;
    drawClass(definition);
  } else if (mode === "calls" || shownUnit) { requestDiagram(); }
}

function renderDiagram(data) {
  // A class pool has no entry point of its own, so a flow of no steps is a
  // real answer. Saying so beats an empty frame the reader has to interpret.
  if (data.mode === "calls" && !data.steps) {
    hint("Nothing runs from " + data.program + " on its own."
         + String.fromCharCode(10)
         + "A class is entered through its methods; pick Scheme to read one.");
    return;
  }
  if (!data.mermaid) {
    failed("ACE drew nothing for " + (data.unit || data.program) + ".");
    return;
  }
  lastMermaid = data.mermaid;
  lastCaption = data.mode === "calls"
    ? data.steps + (data.steps === 1 ? " step" : " steps")
    : data.unit_type + ", lines " + data.line_from + " to " + data.line_to;
  draw();
}

/* Everything that puts a picture on the screen goes through here: a unit just
   asked for, a stretch just opened, a chart just turned. */
function draw() {
  var isClass = /^classDiagram\b/.test(lastMermaid);
  var text = isClass ? lastMermaid.replace(/^direction .+$/m, "direction " + direction) : turned(lastMermaid, direction);
  if (!isClass && text !== null && darkPage()) { text = darkened(text); }
  if (text === null) {
    failed("This diagram does not say which way it runs, so it cannot be turned."
           + String.fromCharCode(10)
           + "ACE must have changed how it writes the chart header.");
    return;
  }
  var pane = document.getElementById("diagram");
  // The sheet is the editor's own ground, so a theme nobody anticipated still
  // looks of a piece. Set here rather than in the stylesheet because only the
  // host knows the colour, and it can change under an open window.
  pane.style.background = ground();
  pane.style.color = ink();
  // Set every time rather than once: the host can change theme under a window
  // that is already open, and the next picture should follow it.
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: isClass ? "strict" : "loose",
    theme: darkPage() ? "dark" : "default",
    flowchart: { htmlLabels: false, useMaxWidth: false },
    maxTextSize: 90000000,
    maxEdges: 100000
  });
  diagramSeq = diagramSeq + 1;
  mermaid.render("vertexflow" + diagramSeq, text).then(function (out) {
    pane.innerHTML = out.svg;
    pane.scrollTop = 0;
    pane.scrollLeft = 0;
    natural = naturalSize(pane.querySelector("svg"));
    if (refit) {
      refit = false;
      fitDiagram();
    } else {
      applyZoom();
    }
    status(lastCaption);
  }, function (e) {
    failed("mermaid could not draw this diagram." + String.fromCharCode(10)
           + (e && e.message ? e.message : String(e)));
  });
}

/* The size mermaid drew, taken from the viewBox rather than from the element:
   the element is what gets resized, so measuring it would compound. */
function naturalSize(svg) {
  var box = svg && svg.getAttribute("viewBox");
  if (!box) { return null; }
  var parts = box.split(/[ ,]+/);
  return { w: parseFloat(parts[2]), h: parseFloat(parts[3]) };
}

/* Which node opens a folded stretch is ACE's decision, and it travels in
   the diagram: it puts a link on exactly those nodes, and the number in the
   link is the line the stretch is anchored at. The other link it writes,
   acego_, selects code in ACE's source window - there is none here, so it
   does nothing, but it must still not navigate this page anywhere. */
function onDiagramClick(e) {
  if (!shownUnit) { return; }
  var node = e.target;
  var href = "";
  while (node && node.getAttribute) {
    href = node.getAttribute("href") || node.getAttribute("xlink:href") || "";
    if (href) { break; }
    node = node.parentNode;
  }
  if (href.indexOf("sapevent:") !== 0) { return; }
  e.preventDefault();
  var at = href.indexOf("aceexp_");
  if (at < 0) { return; }
  var line = parseInt(href.substring(at + 7), 10);
  if (!line) { return; }
  var already = expanded.indexOf(line);
  if (already < 0) { expanded.push(line); } else { expanded.splice(already, 1); }
  requestDiagram();
}


/* ---------- what this system has ----------

   A window reads more than one resource, and a system can have some of them
   and not others: a VERTEX hub older than the window, a resource
   class that did not activate because the tool it reads through is not
   installed. So the window asks /vertex/about once, when it opens and before
   anything else. What the system does not have is not drawn, and a line under
   the bar says what is missing and why: a button that silently went away
   explains nothing.

   A system that cannot say - nothing answers there, or its hub is older than
   the question - changes nothing: every button stays, and a failure is
   reported when it happens, as it always was. */

var USES = [
  { service: "metrics", what: "the metrics", main: true },
  { service: "flow", what: "the flow and the branch scheme" }
];

var have = null;         // what /vertex/about said, by service; null while unsaid
var backends = {};       // the tools it named, installed or not
var afterAbout = null;

function askAbout(then) {
  if (typeof sdeAbout !== "function") { then(); return; }
  afterAbout = then;
  waiting = "about";
  status("checking what this system has ...");
  sdeAbout();
}

function tookAbout(raw) {
  status("");
  var data = null;
  if (typeof raw === "string" && raw.indexOf("ERROR:") !== 0) {
    try { data = JSON.parse(raw); } catch (e) { data = null; }
  }
  if (data && Array.isArray(data.services)) {
    have = {};
    data.services.forEach(function (s) { have[s.name] = s; });
    (data.backends || []).forEach(function (b) { backends[b.name] = !!b.installed; });
  }
  applyAbout();
  var then = afterAbout;
  afterAbout = null;
  if (then) { then(); }
}

/* Without the flow resource the mode list keeps Metrics alone. */
function applyAbout() {
  if (!usable("flow")) {
    var box = document.getElementById("mode");
    for (var i = box.options.length - 1; i >= 0; i--) {
      if (box.options[i].value === "calls" || box.options[i].value === "scheme") { box.remove(i); }
    }
    if (mode === "calls" || mode === "scheme") { setMode("metrics"); }
  }
  sayMissing();
}

/* The window proper starts once the system has said what it has. Without the
   resource this window is for, there is nothing to start. */
function startWindow() {
  if (INITIAL && (INITIAL.action === "uml" || INITIAL.type === "DEVC")) {
    var service = INITIAL.type === "DEVC" ? "package" : "class";
    if (!usable(service)) { message("Update the VERTEX backend: missing " + service + " resource."); return; }
    load(); return;
  }
  if (!usable("metrics")) { setupPage(""); return; }
  if (INITIAL) { load(); }
}

/* Unknown counts as usable: only a system that said so loses part of the window. */
function usable(service) {
  return have === null || (!!have[service] && !!have[service].active);
}

function whyMissing(service) {
  var said = have && have[service];
  if (!said) { return "the VERTEX hub there is older than this window"; }
  if (said.backend && backends[said.backend] === false) {
    return said.handler + " is not active, because " + said.backend + " is not installed";
  }
  return said.handler + " is not active";
}

function sayMissing() {
  var lost = USES.filter(function (u) { return !u.main && !usable(u.service); });
  var line = document.getElementById("missing");
  line.textContent = lost.length === 0 ? "" : "Not on this system: " + lost.map(function (u) {
    return u.what + " - " + whyMissing(u.service);
  }).join("; ") + ".";
  line.hidden = lost.length === 0;
}

/* A 404 is a setup state while the system has not said what it has, or when it
   said part of what this window reads is missing. When it has all of it, the
   404 is the resource's own answer and is shown as one. */
function notFound(detail) {
  if (have !== null && USES.every(function (u) { return usable(u.service); })) { message(detail); }
  else { setupPage(detail); }
}


/* ---------- when the ABAP half is not there ----------

   This page is half of VERTEX. The other half is ABAP, and a plugin installed
   without it reaches a path nothing answers. That is a setup state, not a
   failure: nothing is broken, the backend has simply never been put there. So
   it gets a page saying what to install, the way AVE answers a missing table
   with a setup page of its own rather than an error.

   The host says which of the two it is, because only the host saw the status
   code. Anything else - a system that is down, a password refused - is a
   failure and stays one.

   BACKEND is what THIS window reads, and it can differ per window: the hub's
   resources are one repository, and a tool a window still reaches into through
   them - AVE, behind the versions and the review - is another. Naming only the
   first would send somebody who is missing the second to install what they
   already have. */

var BACKEND = [
  { name: "VERTEX",
    url: "https://github.com/ysichov/VERTEX",
    why: "its src/ folder: the ADT resources every VERTEX window reads, and the"
       + " flow, the schemes and the metrics this window shows" }
];

/* Opening a link is the host's business: in Eclipse it would otherwise
   navigate the view away from this page, and a webview cannot open one at
   all. A host that offers nothing leaves the address to be copied. */
function projectLink(text, url) {
  var link = document.createElement("span");
  link.className = "link";
  if (typeof sdeBrowse === "function") {
    link.textContent = text || url;
    link.title = url;
    link.addEventListener("click", function () { sdeBrowse(url); });
  } else {
    link.className = "link plain";
    link.textContent = url;
    link.title = "Copy this address into a browser";
  }
  return link;
}

/* The short link, on the start screen, always. Somebody who has just installed
   the plugin and typed nothing yet is exactly who needs to know where the
   other half of it lives. */
function startLink() {
  var line = document.createElement("div");
  line.className = "startlink";
  line.appendChild(document.createTextNode("This window reads ABAP from "));
  BACKEND.forEach(function (one, i) {
    if (i > 0) {
      line.appendChild(document.createTextNode(i + 1 === BACKEND.length ? " and " : ", "));
    }
    line.appendChild(projectLink(one.name, one.url));
  });
  document.getElementById("root").appendChild(line);
}

function setupPage(detail) {
  var root = document.getElementById("root");
  root.className = "setup";
  root.innerHTML = "";

  var head = document.createElement("h3");
  var why = document.createElement("p");
  if (have === null) {
    head.textContent = "The ABAP half is not on this system";
    why.textContent = "VERTEX is a page and a set of ADT resources. The page is"
                    + " installed here; the resources answer nothing, so there is"
                    + " nothing for it to read. A VERTEX hub older than"
                    + " this window cannot say what it has either: if it is"
                    + " installed, pull it again.";
  } else {
    head.textContent = "Part of the ABAP half is missing on this system";
    why.textContent = "The VERTEX hub answers here, and says what this window can read:";
  }
  root.appendChild(head);
  root.appendChild(why);

  if (have !== null) {
    var found = document.createElement("ul");
    USES.forEach(function (u) {
      var li = document.createElement("li");
      li.className = usable(u.service) ? "ok" : "no";
      li.textContent = usable(u.service) ? u.what + " - there"
                                         : u.what + " - missing: " + whyMissing(u.service);
      found.appendChild(li);
    });
    root.appendChild(found);
  }

  var what = document.createElement("ul");
  BACKEND.forEach(function (one) {
    var li = document.createElement("li");
    li.appendChild(projectLink(one.name, one.url));
    li.appendChild(document.createTextNode(" - " + one.why));
    what.appendChild(li);
  });
  root.appendChild(what);

  var steps = document.createElement("ol");
  (have !== null
    ? ["Pull what is missing or older with abapGit and activate it.",
       "Reopen this window."]
    : ["Pull it with abapGit and activate it.",
       "Nothing to register by hand: the BAdI implementation that claims"
         + " /sap/bc/adt/vertex/* is an object of the repository and arrives"
         + " with its filter already on it.",
       "Reopen this window."]).forEach(function (step) {
    var li = document.createElement("li");
    li.textContent = step;
    steps.appendChild(li);
  });
  root.appendChild(steps);

  if (detail) {
    var said = document.createElement("pre");
    said.className = "said";
    said.textContent = detail;
    root.appendChild(said);
  }
}

/* ---------- wiring ---------- */

document.getElementById("load").addEventListener("click", load);

document.getElementById("name").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { load(); }
});

document.getElementById("mode").addEventListener("change", function () {
  setMode(document.getElementById("mode").value);
});

document.getElementById("depth").addEventListener("change", function () {
  var asked = parseInt(document.getElementById("depth").value, 10);
  if (!asked || asked < 1) { asked = 1; }
  if (asked > 99) { asked = 99; }
  document.getElementById("depth").value = asked;
  if (asked === depth) { return; }
  depth = asked;
  // A different depth is a different picture, so it is fitted again.
  refit = true;
  if (mode === "calls" && loadedObject) { requestDiagram(); }
});

document.getElementById("diagram").addEventListener("click", onDiagramClick);

document.getElementById("dir").addEventListener("click", function () {
  setDirection(direction === "TB" ? "LR" : "TB");
});
document.getElementById("out").addEventListener("click", function () {
  fitted = false;
  setZoom(zoom / 1.25);
});
document.getElementById("in").addEventListener("click", function () {
  fitted = false;
  setZoom(zoom * 1.25);
});
document.getElementById("fit").addEventListener("click", fitDiagram);

/* Kept in a variable on purpose: an observer nothing holds on to may be
   collected, and the callbacks then stop with no sign that they have. */
var paneWatch = null;
var paneWatchTimer = null;
/* A theme can change under an open window. Everything the stylesheet paints
   follows on its own, because those tokens are var()s pointing at the host's
   own colours. The diagram does not: its colours were written into the
   mermaid text when it was drawn, so it has to be drawn again. */
var themeWatch = null;
var themeWatchTimer = null;

function themeChanged() {
  clearTimeout(themeWatchTimer);
  themeWatchTimer = setTimeout(function () {
    var pane = document.getElementById("diagram");
    if (pane.hidden) { return; }
    pane.style.background = ground();
    pane.style.color = ink();
    if (lastMermaid) { draw(); }
  }, 80);
}

if (typeof MutationObserver === "function") {
  // VS Code swaps the class on the body and rewrites the variables on the
  // root element; which of the two moves depends on the host and the version,
  // so both are watched.
  themeWatch = new MutationObserver(themeChanged);
  themeWatch.observe(document.body,
    { attributes: true, attributeFilter: ["class", "style"] });
  themeWatch.observe(document.documentElement,
    { attributes: true, attributeFilter: ["class", "style"] });
}

// And the system's own light or dark, which is all Eclipse ever reports.
if (window.matchMedia) {
  var scheme = window.matchMedia("(prefers-color-scheme: dark)");
  if (scheme.addEventListener) { scheme.addEventListener("change", themeChanged); }
}

if (typeof ResizeObserver === "function") {
  paneWatch = new ResizeObserver(function () {
    // After the layout settles, not during it: a pane being dragged reports a
    // new size many times a second.
    clearTimeout(paneWatchTimer);
    paneWatchTimer = setTimeout(paneResized, 150);
  });
  paneWatch.observe(document.getElementById("diagram"));
}

// Ctrl and the wheel, the way every other drawing in this editor behaves.
document.getElementById("diagram").addEventListener("wheel", function (e) {
  if (!e.ctrlKey) { return; }
  e.preventDefault();
  fitted = false;
  setZoom(e.deltaY < 0 ? zoom * 1.1 : zoom / 1.1);
}, { passive: false });

var INITIAL = /*INIT*/null/*INIT*/;
fillTypes(INITIAL ? INITIAL.type : null);
if (INITIAL) {
  document.getElementById("name").value = INITIAL.name;
} else {
  message("Type an object name and press Load.");
  startLink();
}
// Wait for the document, so sdeReady exists before the host calls it. What the
// system has is asked first; an object the window was opened on is read after.
window.addEventListener("load", function () { askAbout(startWindow); });
</script>
</body>
</html>

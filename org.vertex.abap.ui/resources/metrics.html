<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VERTEX Metrics</title>
<style>
  /* Same three-way palette as table.html, for the same reason: the hosts
     report the theme differently.
       :root                 - the light default
       prefers-color-scheme  - follows the OS, which is what the browser inside
                               Eclipse reports
       body.vscode-*         - the class VS Code puts on the webview body */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #1c1c1c;
    --muted: #666666;
    --faint: #b0b0b0;
    --border: #d6d6d6;
    --line: #e2e2e2;
    --surface: #fbfbfb;
    --field-bg: #ffffff;
    --field-border: #b8b8b8;
    --hover: #eaf2fb;
    --th-bg: #eef2f7;
    --th-sorted-bg: #dbe6f4;
    --row-alt: #fafafa;
    --danger: #a5292a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1f1f1f;
      --fg: #d4d4d4;
      --muted: #9d9d9d;
      --faint: #5a5a5a;
      --border: #3c3c3c;
      --line: #333333;
      --surface: #252526;
      --field-bg: #3c3c3c;
      --field-border: #5a5a5a;
      --hover: #2a3d55;
      --th-bg: #2b3a4a;
      --th-sorted-bg: #35506b;
      --row-alt: #232323;
      --danger: #f48771;
    }
  }

  body.vscode-light {
    color-scheme: light;
    --bg: #ffffff; --fg: #1c1c1c; --muted: #666666; --faint: #b0b0b0;
    --border: #d6d6d6; --line: #e2e2e2; --surface: #fbfbfb;
    --field-bg: #ffffff; --field-border: #b8b8b8; --hover: #eaf2fb;
    --th-bg: #eef2f7; --th-sorted-bg: #dbe6f4; --row-alt: #fafafa;
    --danger: #a5292a;
  }

  body.vscode-dark, body.vscode-high-contrast {
    color-scheme: dark;
    --bg: #1f1f1f; --fg: #d4d4d4; --muted: #9d9d9d; --faint: #5a5a5a;
    --border: #3c3c3c; --line: #333333; --surface: #252526;
    --field-bg: #3c3c3c; --field-border: #5a5a5a; --hover: #2a3d55;
    --th-bg: #2b3a4a; --th-sorted-bg: #35506b; --row-alt: #232323;
    --danger: #f48771;
  }

  html, body { margin: 0; padding: 0; height: 100%; }
  body { font: 12px "Segoe UI", system-ui, sans-serif; color: var(--fg);
         background: var(--bg); display: flex; flex-direction: column; }

  button { padding: 2px 8px; font: inherit; cursor: pointer; color: var(--fg);
           background: var(--field-bg); border: 1px solid var(--field-border); }
  button:hover { background: var(--hover); }

  .bar { padding: 6px 10px; background: var(--surface);
         border-bottom: 1px solid var(--border); display: flex;
         align-items: center; gap: 8px; flex: 0 0 auto; }
  .bar .status { margin-left: auto; color: var(--muted); }
  .bar select, .bar input { font: inherit; padding: 2px 4px; color: var(--fg);
                            background: var(--field-bg);
                            border: 1px solid var(--field-border); }
  .bar input { width: 240px; text-transform: uppercase; }
  .bar .shown { color: var(--muted); }

  .totals { padding: 6px 10px; background: var(--surface);
            border-bottom: 1px solid var(--border); display: flex;
            flex-wrap: wrap; gap: 14px; flex: 0 0 auto; color: var(--muted); }
  .totals b { color: var(--fg); font-family: Consolas, monospace; }
  .totals.hidden { display: none; }

  .scroll { flex: 1 1 auto; overflow: auto; }
  table { border-collapse: collapse; white-space: nowrap; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  th { position: sticky; top: 0; background: var(--th-bg); font-weight: 600;
       cursor: pointer; z-index: 1; }
  th:hover { background: var(--th-sorted-bg); }
  th.sorted { background: var(--th-sorted-bg); }
  td.num { text-align: right; font-family: Consolas, monospace; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--hover); }
  .message { padding: 12px; white-space: pre-wrap; font-family: Consolas, monospace;
             color: var(--danger); }
  /* The setup page, and the short link that is always on the start screen.
     A link is a span, not an anchor: a real one would navigate the view away
     from the page it is on. */
  .setup { padding: 12px; max-width: 640px; }
  .setup h3 { margin: 0 0 8px; font-size: 13px; }
  .setup p { margin: 0 0 8px; color: var(--muted); }
  .setup ol { margin: 0 0 8px; padding-left: 20px; }
  .setup li { margin-bottom: 4px; }
  .setup pre.said { margin: 8px 0 0; padding: 8px; background: var(--surface);
                    border: 1px solid var(--line); border-radius: 6px;
                    white-space: pre-wrap; color: var(--muted);
                    font-family: Consolas, monospace; }
  .startlink { margin-top: 10px; color: var(--muted);
               font-family: "Segoe UI", system-ui, sans-serif; }
  .link { cursor: pointer; text-decoration: underline; }
  .link.plain { cursor: text; text-decoration: none; user-select: text;
                font-family: Consolas, monospace; }

  /* Flow. The button stays pressed while the mode is on, because which of
     the two a click on a row does is not otherwise visible. */
  button.on { background: var(--th-sorted-bg); border-color: var(--fg); }
  .bar .unit { color: var(--fg); font-family: Consolas, monospace; }
  tbody tr.pick { cursor: pointer; }
  /* The diagram sizes itself; the pane scrolls in both directions rather
     than shrinking a picture nobody could then read. */
  .diagram { padding: 10px; }
  .diagram svg { max-width: none; height: auto; }
  /* ACE marks a node it can open in the source window. Here there is no
     source window, so only the stretches that fold carry a hand. */
  .diagram a[href^="sapevent:aceexp"] { cursor: pointer; }
  .diagram a { text-decoration: none; }
</style>
</head>
<body>

<div class="bar">
  <select id="type" title="Object type"></select>
  <input id="name" spellcheck="false" autocomplete="off" placeholder="object name">
  <button id="load">Load</button>
  <button id="flow" title="Show the branch scheme of a unit instead of its numbers">Flow</button>
  <button id="back" hidden title="Back to the unit list">&#8592; Units</button>
  <span class="shown" id="object"></span>
  <span class="unit" id="unit"></span>
  <span class="status" id="status"></span>
</div>

<div class="totals hidden" id="totals"></div>

<div class="scroll"><div id="root"></div></div>

<script>
"use strict";

/* Column definitions. "num" decides the alignment and the sort comparison, so
   a column is described once and the header, the cell and the sort follow. */
var COLUMNS = [
  { key: "unit_name",   text: "Unit",        num: false },
  { key: "unit_type",   text: "Type",        num: false },
  { key: "include",     text: "Include",     num: false },
  { key: "cyclomatic",  text: "CC",          num: true  },
  { key: "mi",          text: "MI",          num: true  },
  { key: "loc",         text: "LOC",         num: true  },
  { key: "lloc",        text: "LLOC",        num: true  },
  { key: "cloc",        text: "CLOC",        num: true  },
  { key: "volume",      text: "Volume",      num: true  },
  { key: "difficulty",  text: "Difficulty",  num: true  },
  { key: "effort",      text: "Effort",      num: true  },
  { key: "bugs",        text: "Bugs",        num: true  },
  { key: "vocabulary",  text: "Vocabulary",  num: true  },
  { key: "prog_length", text: "Length",      num: true  }
];

var units = [];
var totals = null;
var sortKey = null;
var sortDown = true;

/* What the last answer was about. One request is outstanding at a time - a
   click reaches the host, the host answers - so one name is enough to tell
   sdeReady which of the three it is holding. */
var waiting = null;

/* The object the table on screen was read for. Kept apart from the input
   bar: somebody can type a new name without pressing Load, and a diagram
   must still be asked for the object whose row was clicked. */
var loadedObject = "";
var loadedType = "";

function status(text) {
  document.getElementById("status").textContent = text || "";
}

function message(text) {
  var root = document.getElementById("root");
  root.className = "message";
  root.textContent = text;
  document.getElementById("totals").className = "totals hidden";
}

/* ---------- data ---------- */

/* The types this service reads. The page does not enforce the list - a type
   the resource refuses comes back as its own sentence, and one authority for
   that rule is enough. */
var TYPES = [["CLAS", "Class"], ["INTF", "Interface"],
             ["PROG", "Program"], ["INCL", "Include"]];

function objectName() {
  return document.getElementById("name").value.trim().toUpperCase();
}

function objectType() {
  return document.getElementById("type").value;
}

function load() {
  var name = objectName();
  if (!name) {
    message("Type an object name and press Load.");
    return;
  }
  closeDiagram();
  status("reading " + name + " ...");
  waiting = "metrics";
  // Returns at once. The host answers later by calling sdeReady.
  sdeLoad(name, objectType());
}

/* The type arrives from the object tree with its subtype - CLAS/OC. Only the
   head selects the entry; an unknown one is added rather than dropped, so a
   window opened on it still shows what it was opened for. */
function fillTypes(chosen) {
  var head = chosen ? String(chosen).split("/")[0] : "";
  var known = TYPES.slice();
  var found = known.some(function (t) { return t[0] === head; });
  if (head && !found) { known.unshift([head, head]); }

  var box = document.getElementById("type");
  known.forEach(function (t) {
    var option = document.createElement("option");
    option.value = t[0];
    option.textContent = t[1];
    if (t[0] === head) { option.selected = true; }
    box.appendChild(option);
  });
}

// Invoked by the host when the answer is waiting.
function sdeReady() {
  var kind = waiting;
  waiting = null;
  var raw = sdeTake();
  status("");
  if (typeof raw !== "string") { message("No response from the host."); return; }
  if (raw.indexOf("ERROR:") === 0) {
    var said = raw.substring(6);
    // The host marks the one failure that is really a setup state.
    if (said.indexOf("NOBACKEND:") === 0) { setupPage(said.substring(10)); }
    else { message(said); }
    status("");
    return;
  }
  // The library is JavaScript, not an answer to a question about ABAP.
  if (kind === "asset") { startMermaid(raw); return; }
  var data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    message("Response is not JSON:" + String.fromCharCode(10) + raw.substring(0, 2000));
    return;
  }
  if (kind === "flow") { renderDiagram(data); return; }
  render(data);
}

/* ---------- rendering ---------- */

function renderTotals(totals) {
  var box = document.getElementById("totals");
  box.className = "totals";
  box.innerHTML = "";
  [["units", totals.units], ["cyclomatic", totals.cyclomatic],
   ["avg CC", totals.avg_cyclomatic], ["LOC", totals.loc],
   ["LLOC", totals.lloc], ["CLOC", totals.cloc],
   ["volume", totals.volume], ["effort", totals.effort],
   ["bugs", totals.bugs]].forEach(function (pair) {
    var span = document.createElement("span");
    span.appendChild(document.createTextNode(pair[0] + " "));
    var b = document.createElement("b");
    b.textContent = pair[1];
    span.appendChild(b);
    box.appendChild(span);
  });
}

function sorted() {
  if (sortKey === null) { return units; }
  var column = null;
  COLUMNS.forEach(function (c) { if (c.key === sortKey) { column = c; } });
  var copy = units.slice();
  copy.sort(function (a, b) {
    var x = a[sortKey], y = b[sortKey];
    if (column && column.num) {
      x = Number(x); y = Number(y);
    } else {
      x = String(x); y = String(y);
    }
    if (x < y) { return sortDown ? 1 : -1; }
    if (x > y) { return sortDown ? -1 : 1; }
    return 0;
  });
  return copy;
}

function renderTable() {
  var root = document.getElementById("root");
  root.className = "";
  root.innerHTML = "";

  var headRow = document.createElement("tr");
  COLUMNS.forEach(function (c) {
    var th = document.createElement("th");
    th.textContent = c.text + (c.key === sortKey ? (sortDown ? " ▼" : " ▲") : "");
    th.title = "Sort by " + c.text;
    if (c.key === sortKey) { th.className = "sorted"; }
    th.addEventListener("click", function () {
      // A second click on the same column reverses it; a new column starts
      // with the largest value on top, which is what a hotspot list is for.
      if (sortKey === c.key) { sortDown = !sortDown; }
      else { sortKey = c.key; sortDown = true; }
      renderTable();
    });
    headRow.appendChild(th);
  });
  var thead = document.createElement("thead");
  thead.appendChild(headRow);

  var tbody = document.createElement("tbody");
  sorted().forEach(function (u) {
    var tr = document.createElement("tr");
    if (flowMode) {
      tr.className = "pick";
      tr.title = "Branch scheme of " + u.unit_name;
      tr.addEventListener("click", function () { openUnit(u); });
    }
    COLUMNS.forEach(function (c) {
      var td = document.createElement("td");
      td.textContent = u[c.key];
      if (c.num) { td.className = "num"; }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  var table = document.createElement("table");
  table.appendChild(thead);
  table.appendChild(tbody);
  root.appendChild(table);
}

function render(data) {
  units = data.units || [];
  totals = data.totals;
  loadedObject = data.object;
  loadedType = data.type;
  document.getElementById("object").textContent = data.program;
  // Optional on purpose: a host with no tab to rename simply does not define
  // it, and the VS Code shim is exactly that host today.
  if (typeof sdeTitle === "function") { sdeTitle(data.object.toUpperCase()); }

  if (units.length === 0) {
    // Not an error: a class of nothing but declarations has no code unit. Say
    // which program was read, so it is clear what was looked at. Totals of
    // zeros would say nothing, and message() hides that row anyway.
    message("No code units in " + data.program + ".");
    return;
  }

  renderTotals(data.totals);
  renderTable();
  status(units.length + (units.length === 1 ? " unit" : " units"));
}


/* ---------- the branch scheme ----------

   The picture is ACE's, not this page's. ZCL_ACE_CODE_HTML=>BUILD_SCHEME
   writes the same mermaid text the Scheme window draws in SAP GUI, for the
   one unit that was clicked, and the resource hands it over as a string.
   What is left here is drawing that string and passing one kind of click
   back - opening a folded stretch - because that is the only thing the
   picture cannot answer by itself.

   mermaid is not fetched from anywhere. It sits in the plugin next to this
   page, and the host reads it and hands over its text the first time a
   diagram is asked for; until then this window costs what it always did. */

var flowMode = false;
var shownUnit = null;     // the unit on display, while one is
var expanded = [];        // stretches the reader opened, by their anchor line
var mermaidLoaded = false;
var diagramSeq = 0;

/* mermaid draws its own colours, so it has to be told which way round the
   page is - and the hosts report that in their own ways. */
function darkTheme() {
  var css = document.body.classList;
  if (css.contains("vscode-dark") || css.contains("vscode-high-contrast")) { return true; }
  if (css.contains("vscode-light")) { return false; }
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}

function setFlowMode(on) {
  flowMode = on;
  document.getElementById("flow").className = on ? "on" : "";
  if (!on) { closeDiagram(); }
  if (units.length > 0 && !shownUnit) { renderTable(); }
}

function openUnit(unit) {
  shownUnit = { include: unit.include, name: unit.unit_name };
  expanded = [];
  requestDiagram();
}

/* Every version of the diagram is a fresh question to ABAP, the one after a
   stretch is opened included. ACE decides what a stretch collapses to, and
   deciding that here as well is how the two pictures would drift apart. */
function requestDiagram() {
  document.getElementById("back").hidden = false;
  document.getElementById("unit").textContent = shownUnit.name;
  document.getElementById("totals").className = "totals hidden";
  status("reading " + shownUnit.name + " ...");
  if (!mermaidLoaded) {
    waiting = "asset";
    sdeAsset("mermaid");
    return;
  }
  waiting = "flow";
  sdeFlow(loadedObject, loadedType, shownUnit.include, shownUnit.name,
          expanded.join(","));
}

function closeDiagram() {
  if (!shownUnit) { return; }
  shownUnit = null;
  expanded = [];
  document.getElementById("back").hidden = true;
  document.getElementById("unit").textContent = "";
  status("");
  if (units.length > 0) {
    renderTotals(totals);
    renderTable();
    status(units.length + (units.length === 1 ? " unit" : " units"));
  }
}

/* The library arrives as text, so it is run here rather than fetched. */
function startMermaid(source) {
  var script = document.createElement("script");
  script.textContent = source;
  document.head.appendChild(script);
  if (typeof mermaid === "undefined") {
    message("mermaid.min.js was read but defined no mermaid object.");
    return;
  }
  // The same settings ACE gives its own diagrams: loose, so that the click
  // directives in the text survive, and limits a long method cannot hit.
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "loose",
    theme: darkTheme() ? "dark" : "default",
    flowchart: { htmlLabels: false, useMaxWidth: false },
    maxTextSize: 90000000,
    maxEdges: 100000
  });
  mermaidLoaded = true;
  requestDiagram();
}

function renderDiagram(data) {
  var root = document.getElementById("root");
  if (!data.mermaid) {
    message("ACE drew nothing for " + data.unit + ".");
    return;
  }
  root.className = "diagram";
  root.innerHTML = "";
  diagramSeq = diagramSeq + 1;
  mermaid.render("vertexflow" + diagramSeq, data.mermaid).then(function (out) {
    root.innerHTML = out.svg;
    status(data.unit_type + ", lines " + data.line_from + " to " + data.line_to);
  }, function (e) {
    message("mermaid could not draw this diagram." + String.fromCharCode(10)
            + (e && e.message ? e.message : String(e)));
  });
}

/* Which node opens a folded stretch is ACE's decision, and it travels in
   the diagram: it puts a link on exactly those nodes, and the number in the
   link is the line the stretch is anchored at. The other link it writes,
   acego_, selects code in ACE's source window - there is none here, so it
   does nothing, but it must still not navigate this page anywhere. */
function onDiagramClick(e) {
  var node = e.target;
  var href = "";
  while (node && node.getAttribute) {
    href = node.getAttribute("href") || node.getAttribute("xlink:href") || "";
    if (href) { break; }
    node = node.parentNode;
  }
  if (href.indexOf("sapevent:") !== 0) { return; }
  e.preventDefault();
  var at = href.indexOf("aceexp_");
  if (at < 0) { return; }
  var line = parseInt(href.substring(at + 7), 10);
  if (!line) { return; }
  var already = expanded.indexOf(line);
  if (already < 0) { expanded.push(line); } else { expanded.splice(already, 1); }
  requestDiagram();
}


/* ---------- when the ABAP half is not there ----------

   This page is half of VERTEX. The other half is ABAP, and a plugin installed
   without it reaches a path nothing answers. That is a setup state, not a
   failure: nothing is broken, the backend has simply never been put there. So
   it gets a page saying what to install, the way AVE answers a missing table
   with a setup page of its own rather than an error.

   The host says which of the two it is, because only the host saw the status
   code. Anything else - a system that is down, a password refused - is a
   failure and stays one.

   BACKEND is what THIS window reads, and it differs per window: the resources
   are one repository, and the tool a window reaches into through them is
   another. Naming only the first would send somebody who is missing the second
   to install what they already have. */

var BACKEND = [
  { name: "Simple-Data-Explorer",
    url: "https://github.com/ysichov/Simple-Data-Explorer",
    why: "the ADT resources every VERTEX window reads" },
  { name: "ACE",
    url: "https://github.com/ysichov/ACE",
    why: "the metrics this window shows" }
];

/* Opening a link is the host's business: in Eclipse it would otherwise
   navigate the view away from this page, and a webview cannot open one at
   all. A host that offers nothing leaves the address to be copied. */
function projectLink(text, url) {
  var link = document.createElement("span");
  link.className = "link";
  if (typeof sdeBrowse === "function") {
    link.textContent = text || url;
    link.title = url;
    link.addEventListener("click", function () { sdeBrowse(url); });
  } else {
    link.className = "link plain";
    link.textContent = url;
    link.title = "Copy this address into a browser";
  }
  return link;
}

/* The short link, on the start screen, always. Somebody who has just installed
   the plugin and typed nothing yet is exactly who needs to know where the
   other half of it lives. */
function startLink() {
  var line = document.createElement("div");
  line.className = "startlink";
  line.appendChild(document.createTextNode("This window reads ABAP from "));
  BACKEND.forEach(function (one, i) {
    if (i > 0) {
      line.appendChild(document.createTextNode(i + 1 === BACKEND.length ? " and " : ", "));
    }
    line.appendChild(projectLink(one.name, one.url));
  });
  document.getElementById("root").appendChild(line);
}

function setupPage(detail) {
  var root = document.getElementById("root");
  root.className = "setup";
  root.innerHTML = "";

  var head = document.createElement("h3");
  head.textContent = "The ABAP half is not on this system";
  root.appendChild(head);

  var why = document.createElement("p");
  why.textContent = "VERTEX is a page and a set of ADT resources. The page is"
                  + " installed here; the resources answer nothing, so there is"
                  + " nothing for it to read.";
  root.appendChild(why);

  var what = document.createElement("ul");
  BACKEND.forEach(function (one) {
    var li = document.createElement("li");
    li.appendChild(projectLink(one.name, one.url));
    li.appendChild(document.createTextNode(" - " + one.why));
    what.appendChild(li);
  });
  root.appendChild(what);

  var steps = document.createElement("ol");
  ["Pull each of those with abapGit and activate it.",
   "Activate ZCL_SDE_ADT_RES_APP with the rest of the resources.",
   "Register the BAdI implementation ZSDE_ADT_RES_APP on"
     + " BADI_ADT_REST_RFC_APPLICATION, with the filter STATIC_URI_PATH"
     + " covering /sap/bc/adt/zsde/* .",
   "Reopen this window."].forEach(function (step) {
    var li = document.createElement("li");
    li.textContent = step;
    steps.appendChild(li);
  });
  root.appendChild(steps);

  if (detail) {
    var said = document.createElement("pre");
    said.className = "said";
    said.textContent = detail;
    root.appendChild(said);
  }
}

/* ---------- wiring ---------- */

document.getElementById("load").addEventListener("click", load);

document.getElementById("name").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { load(); }
});

document.getElementById("flow").addEventListener("click", function () {
  setFlowMode(!flowMode);
});

document.getElementById("back").addEventListener("click", closeDiagram);

document.getElementById("root").addEventListener("click", onDiagramClick);

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeDiagram(); }
});

var INITIAL = /*INIT*/null/*INIT*/;
fillTypes(INITIAL ? INITIAL.type : null);
if (INITIAL) {
  document.getElementById("name").value = INITIAL.name;
  // Wait for the document, so sdeReady exists before the host calls it.
  window.addEventListener("load", load);
} else {
  message("Type an object name and press Load.");
  startLink();
}

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SelecTor</title>
<style>
  /* One palette, three ways of choosing it, because the two hosts report the
     theme differently:
       :root                 - the light default
       prefers-color-scheme  - follows the OS, which is what the browser inside
                               Eclipse reports
       body.vscode-*         - the class VS Code puts on the webview body; it
                               wins over :root by sitting closer to the content,
                               so a light VS Code on a dark OS still looks right */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #1c1c1c;
    --muted: #666666;
    --faint: #b0b0b0;
    --border: #d6d6d6;
    --line: #e2e2e2;
    --surface: #fbfbfb;
    --surface-2: #f0f0f0;
    --field-bg: #ffffff;
    --field-border: #b8b8b8;
    --hover: #eaf2fb;
    --th-bg: #eef2f7;
    --th-key-bg: #dbe6f4;
    --th-filtered-bg: #cfe3cf;
    --row-alt: #fafafa;
    --danger: #a5292a;
    --c1-bg: #d8ecff; --c1-line: #5797c9; --c2-bg: #dcf5d6; --c2-line: #67a95e;
    --c3-bg: #fff1c2; --c3-line: #c09a2b; --c4-bg: #f3ddff; --c4-line: #a678c2;
    --c5-bg: #ffdede; --c5-line: #c87373; --c6-bg: #d9f4ef; --c6-line: #58a99b;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1f1f1f;
      --fg: #d4d4d4;
      --muted: #9d9d9d;
      --faint: #5a5a5a;
      --border: #3c3c3c;
      --line: #333333;
      --surface: #252526;
      --surface-2: #2d2d30;
      --field-bg: #3c3c3c;
      --field-border: #5a5a5a;
      --hover: #2a3d55;
      --th-bg: #2b3a4a;
      --th-key-bg: #35506b;
      --th-filtered-bg: #2f4d34;
      --row-alt: #232323;
      --danger: #f48771;
      --c1-bg: #1d3448; --c1-line: #4a86b8; --c2-bg: #1f3a22; --c2-line: #5b9553;
      --c3-bg: #3d3420; --c3-line: #b08d2a; --c4-bg: #33244a; --c4-line: #9268b2;
      --c5-bg: #3f2424; --c5-line: #b56868; --c6-bg: #1d3a36; --c6-line: #4f9a8d;
    }
  }

  body.vscode-light {
    color-scheme: light;
    --bg: var(--vscode-editor-background, #ffffff); --fg: var(--vscode-editor-foreground, #1c1c1c); --muted: var(--vscode-descriptionForeground, #666666); --faint: var(--vscode-disabledForeground, #b0b0b0);
    --border: var(--vscode-panel-border, #d6d6d6); --line: var(--vscode-editorWidget-border, #e2e2e2); --surface: var(--vscode-editorWidget-background, #fbfbfb); --surface-2: var(--vscode-sideBar-background, #f0f0f0);
    --field-bg: var(--vscode-input-background, #ffffff); --field-border: var(--vscode-input-border, #b8b8b8); --hover: var(--vscode-list-hoverBackground, #eaf2fb);
    --th-bg: var(--vscode-keybindingTable-headerBackground, #eef2f7); --th-key-bg: var(--vscode-list-activeSelectionBackground, #dbe6f4); --th-filtered-bg: #cfe3cf;
    --row-alt: var(--vscode-tree-tableOddRowsBackground, #fafafa); --danger: var(--vscode-errorForeground, #a5292a);
    --c1-bg: #d8ecff; --c1-line: #5797c9; --c2-bg: #dcf5d6; --c2-line: #67a95e;
    --c3-bg: #fff1c2; --c3-line: #c09a2b; --c4-bg: #f3ddff; --c4-line: #a678c2;
    --c5-bg: #ffdede; --c5-line: #c87373; --c6-bg: #d9f4ef; --c6-line: #58a99b;
  }

  body.vscode-dark, body.vscode-high-contrast {
    color-scheme: dark;
    --bg: var(--vscode-editor-background, #1f1f1f); --fg: var(--vscode-editor-foreground, #d4d4d4); --muted: var(--vscode-descriptionForeground, #9d9d9d); --faint: var(--vscode-disabledForeground, #5a5a5a);
    --border: var(--vscode-panel-border, #3c3c3c); --line: var(--vscode-editorWidget-border, #333333); --surface: var(--vscode-editorWidget-background, #252526); --surface-2: var(--vscode-sideBar-background, #2d2d30);
    --field-bg: var(--vscode-input-background, #3c3c3c); --field-border: var(--vscode-input-border, #5a5a5a); --hover: var(--vscode-list-hoverBackground, #2a3d55);
    --th-bg: var(--vscode-keybindingTable-headerBackground, #2b3a4a); --th-key-bg: var(--vscode-list-activeSelectionBackground, #35506b); --th-filtered-bg: #2f4d34;
    --row-alt: var(--vscode-tree-tableOddRowsBackground, #232323); --danger: var(--vscode-errorForeground, #f48771);
    --c1-bg: #1d3448; --c1-line: #4a86b8; --c2-bg: #1f3a22; --c2-line: #5b9553;
    --c3-bg: #3d3420; --c3-line: #b08d2a; --c4-bg: #33244a; --c4-line: #9268b2;
    --c5-bg: #3f2424; --c5-line: #b56868; --c6-bg: #1d3a36; --c6-line: #4f9a8d;
  }

  html, body { margin: 0; padding: 0; height: 100%; }
  body { font: 12px "Segoe UI", system-ui, sans-serif; color: var(--fg);
         background: var(--bg); }

  input, select, button { color: var(--fg); background: var(--field-bg);
                          border: 1px solid var(--field-border); }

  .app { display: flex; height: 100%; }

  .panel { flex: 0 0 250px; display: flex; flex-direction: column;
           border-right: 1px solid var(--border); background: var(--surface);
           overflow: auto; }
  .app.collapsed .panel { display: none; }
  .panel-head { display: flex; align-items: center; padding: 6px 6px 6px 10px;
                background: var(--surface-2); border-bottom: 1px solid var(--line);
                font-weight: 600; }
  .panel-head button { margin-left: auto; }
  .criteria { padding: 4px; }
  .hint { padding: 10px; color: var(--muted); }

  .crit { border: 1px solid var(--line); background: var(--bg); margin-bottom: 4px;
          padding: 4px 6px; }
  .crit-head { display: flex; align-items: center; margin-bottom: 3px; }
  .crit-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .crit-head button { margin-left: auto; border: none; background: none;
                      color: var(--danger); cursor: pointer; font-size: 13px;
                      line-height: 1; padding: 0 2px; }
  .crit-line { display: flex; gap: 3px; }
  .crit-line select, .crit-line input { font: inherit; padding: 1px 3px; min-width: 0; }
  .crit-line select { flex: 0 0 auto; }
  .crit-line input { flex: 1 1 auto; text-transform: uppercase; }

  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .bar { padding: 6px 10px; background: var(--surface);
         border-bottom: 1px solid var(--border); display: flex; align-items: center;
         gap: 6px; flex: 0 0 auto; flex-wrap: wrap; }
  .bar label { color: var(--muted); }
  .bar input { width: 140px; padding: 2px 5px; font: inherit; text-transform: uppercase; }
  button { padding: 2px 8px; font: inherit; cursor: pointer; }
  button:hover { background: var(--hover); }
  .bar .status { margin-left: auto; color: var(--muted); }
  #expand { display: none; }
  .app.collapsed #expand { display: inline-block; }

  .scroll { flex: 1 1 auto; overflow: auto; padding: 8px; }
  table { border-collapse: separate; border-spacing: 0; white-space: nowrap;
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  /* SEPARATE collapse keeps the rounded corner, so the grid lines are drawn
     on two sides of a cell instead of four. */
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
           padding: 3px 8px; text-align: left; }
  tr > :last-child { border-right: none; }
  tbody tr:last-child > td { border-bottom: none; }
  th { position: sticky; top: 0; background: var(--th-bg); font-weight: 600;
       cursor: pointer; z-index: 1; }
  th:hover { background: var(--th-key-bg); }
  th .pick { border: none; background: none; color: var(--muted); cursor: pointer;
             font: inherit; font-weight: normal; padding: 0 2px; margin-left: 6px;
             visibility: hidden; }
  th:hover .pick { visibility: visible; }
  th .pick:hover { color: var(--fg); }
  th.filtered .pick { visibility: visible; color: var(--fg); }
  th.key { background: var(--th-key-bg); }
  th.filtered { background: var(--th-filtered-bg); }
  td.num { text-align: right; font-family: Consolas, monospace; }
  td.empty { color: var(--faint); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--hover); }
  .message { padding: 12px; white-space: pre-wrap; font-family: Consolas, monospace;
             color: var(--danger); }

  /* The join replaces the grid rather than docking under it. SDE docks it, and
     that is better when there is room; an Eclipse view rarely has any. */
  .join { padding: 10px; }
  .join h3 { margin: 0 0 6px; font-size: 12px; }
  .join section { margin-bottom: 14px; }
  .chip.cand { cursor: pointer; padding: 1px 6px; }
  .chip.cand:hover { background: var(--hover); }
  .chip.cand.on { background: var(--th-key-bg); border-color: var(--field-border);
                  font-weight: 600; }
  .chip.cand .dir { color: var(--muted); }
  .chip.cand.on .dir { color: var(--fg); }
  .join table { margin-top: 4px; }
  .join pre { margin: 0; padding: 8px; background: var(--surface);
              border: 1px solid var(--line); border-radius: 8px; overflow: auto;
              font-family: Consolas, monospace; white-space: pre-wrap; }
  .join pre.none { color: var(--muted); font-family: inherit; }
  .join .back { cursor: pointer; color: var(--muted); }
  .join .back:hover { color: var(--fg); text-decoration: underline; }

  .modes { display: flex; gap: 6px; margin: 6px 0 12px; }
  .modes button.on { background: var(--th-key-bg); font-weight: 600; }
  .modes .full { margin-left: auto; }

  /* Ten rows of the answer while the join is being put together: enough to see
     what comes out, little enough to leave the builder on screen. The rest is
     a scroll away, or a press of Full view. */
  .join .preview { max-height: 200px; overflow: auto; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { border: 1px solid var(--line); background: var(--bg); padding: 1px 6px;
          border-radius: 9px; display: flex; align-items: center; gap: 4px; }

  /* One colour per table, cycled through six, exactly as SDE cycles them in
     the SAP GUI. A join of four tables is four hundred chips, and which table
     a field came from should be visible without reading the alias. */
  .chip.c1 { background: var(--c1-bg); border-color: var(--c1-line); }
  .chip.c2 { background: var(--c2-bg); border-color: var(--c2-line); }
  .chip.c3 { background: var(--c3-bg); border-color: var(--c3-line); }
  .chip.c4 { background: var(--c4-bg); border-color: var(--c4-line); }
  .chip.c5 { background: var(--c5-bg); border-color: var(--c5-line); }
  .chip.c6 { background: var(--c6-bg); border-color: var(--c6-line); }
  .picks .olabel.c1 { color: var(--c1-line); }
  .picks .olabel.c2 { color: var(--c2-line); }
  .picks .olabel.c3 { color: var(--c3-line); }
  .picks .olabel.c4 { color: var(--c4-line); }
  .picks .olabel.c5 { color: var(--c5-line); }
  .picks .olabel.c6 { color: var(--c6-line); }
  .chip .put { border: none; background: none; color: var(--muted); cursor: pointer;
               padding: 0 2px; font: inherit; }
  .chip .put:hover { color: var(--fg); }
  .chip.placed { color: var(--faint); }
  /* A key field, marked the way SDE marks one in the SAP GUI: a doubled
     border. It keeps the table's own tint, because being a key is a fact
     about the field within its table, not across the join. */
  .chip.keyfld { border-style: double; border-width: 3px; font-weight: 600; }
  /* The heading of one table's fields: its alias, then what to do with them. */
  .picks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
           margin: 8px 0 3px; }
  .picks .olabel { color: var(--muted); font-weight: 600; }
  button.link { border: none; background: none; color: var(--muted);
                padding: 0; font: inherit; cursor: pointer; }
  button.link:hover { color: var(--fg); text-decoration: underline;
                      background: none; }
  /* The order the statement is written in. Same chips as everywhere else, with
     a grab cursor and a dashed end marker, as in the SAP GUI. */
  .order .orow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
                 padding: 2px 0; }
  .order .olabel { flex: 0 0 58px; color: var(--muted); }
  .chip.move { cursor: grab; }
  .chip.move:active { cursor: grabbing; }
  .chip.fixed { color: var(--faint); cursor: default; }
  .chip.end { color: var(--muted); border-style: dashed; }
  .chip.over { border-color: var(--fg); background: var(--th-key-bg); }

  /* The cross, as SDE draws it: columns across the top, rows down the left,
     measures beside them. An empty slot is a dashed box with a dot in it, and
     a section that fills up grows by one more - ZCL_SDE_PIVOT's rule. */
  .cross .crow { display: flex; align-items: flex-start; gap: 6px;
                 margin-bottom: 6px; }
  .czone { border: 1px solid var(--line); background: var(--surface);
           border-radius: 8px; padding: 5px 8px; }
  .czone.corner { flex: 0 0 230px; }
  .czone.down { flex: 0 0 230px; }
  .chead { font-size: 10px; font-weight: 600; color: var(--muted);
           text-transform: uppercase; margin-bottom: 3px; }
  .chead i { font-weight: normal; font-style: normal; color: var(--faint);
             text-transform: none; }
  .chint { color: var(--muted); }
  .holding { border: 1px solid var(--field-border); background: var(--th-key-bg);
             border-radius: 9px;
             padding: 1px 7px; margin: 3px 0; display: inline-block;
             font-family: Consolas, monospace; }
  .cslots { display: flex; flex-wrap: wrap; gap: 4px; }
  .czone.down .cslots { flex-direction: column; }
  .cslot { border: 1px dashed var(--field-border); background: var(--bg);
           border-radius: 7px;
           padding: 2px 6px; min-width: 90px; color: var(--faint);
           text-align: center; cursor: pointer; display: flex;
           align-items: center; gap: 4px; justify-content: center; }
  .cslot.fill { border-style: solid; color: var(--fg); justify-content: flex-start;
                font-family: Consolas, monospace; }
  .cslot.ready { border-color: var(--fg); color: var(--fg); }
  .cslot.over { background: var(--th-key-bg); }
  .cslot .lbl { cursor: grab; }
  .cslot .lbl:active { cursor: grabbing; }
  .cslot select { font: inherit; }
  .cslot .rmx { border: none; background: none; color: var(--danger);
                cursor: pointer; font: inherit; padding: 0 2px; margin-left: auto; }
  .avail { border: 1px solid var(--line); background: var(--surface);
           border-radius: 8px; padding: 6px; }
  .avchip { cursor: grab; }
  .avchip:active { cursor: grabbing; }
  .avchip.held { border-color: var(--fg); background: var(--th-key-bg);
                 font-weight: 600; }
  /* The setup page, and the short link that is always on the start screen.
     A link is a span, not an anchor: a real one would navigate the view away
     from the page it is on. */
  .setup { padding: 12px; max-width: 640px; }
  .setup h3 { margin: 0 0 8px; font-size: 13px; }
  .setup p { margin: 0 0 8px; color: var(--muted); }
  .setup ol { margin: 0 0 8px; padding-left: 20px; }
  .setup li { margin-bottom: 4px; }
  .setup li.ok { color: var(--ins-mark); }
  .setup li.no { color: var(--danger); }
  /* What this system does not have, when a part of the window is left out. */
  .missing { padding: 4px 10px; color: var(--danger); background: var(--surface);
             border-bottom: 1px solid var(--line); }
  .setup pre.said { margin: 8px 0 0; padding: 8px; background: var(--surface);
                    border: 1px solid var(--line); border-radius: 6px;
                    white-space: pre-wrap; color: var(--muted);
                    font-family: Consolas, monospace; }
  .startlink { margin-top: 10px; color: var(--muted);
               font-family: "Segoe UI", system-ui, sans-serif; }
  .link { cursor: pointer; text-decoration: underline; }
  .link.plain { cursor: text; text-decoration: none; user-select: text;
                font-family: Consolas, monospace; }

  /* The assistant: a panel on the right, closed until it is asked for. */
  .chat { display: none; flex: 0 0 300px; flex-direction: column; min-width: 0;
          border-left: 1px solid var(--border); background: var(--surface); }
  .chat-head { display: flex; align-items: center; padding: 6px 6px 6px 10px;
               background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .chat-head .title { font-weight: 600; margin-right: auto; }
  .chat-pick { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); }
  .chat-pick select { flex: 1 1 0; min-width: 0; font: inherit; padding: 1px 3px; }
  .chat-log { flex: 1 1 auto; overflow: auto; padding: 6px; }
  .msg { margin-bottom: 10px; }
  .msg .who { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .msg .text { white-space: pre-wrap; }
  .msg.user .text { display: inline-block; padding: 4px 6px; border-radius: 6px;
                    background: var(--hover); }
  .msg.error .text { color: var(--danger); }
  .msg .did { margin-top: 3px; color: var(--muted); font-size: 11px;
              font-family: Consolas, monospace; }
  .chat-input { display: flex; flex-direction: column; gap: 4px; padding: 6px;
                border-top: 1px solid var(--line); }
  .chat-input textarea { font: inherit; min-height: 48px; resize: vertical; padding: 4px;
                         color: var(--fg); background: var(--field-bg);
                         border: 1px solid var(--field-border); }
  .chat-input .row { display: flex; align-items: center; gap: 6px; }
  .chat-input .working { margin-right: auto; color: var(--muted); }
</style>
</head>
<body>

<!-- Closed until there is something in it: see addCriterion. -->
<div class="app collapsed" id="app">

  <aside class="panel">
    <div class="panel-head">
      <span>Selection</span>
      <button id="collapse" title="Hide the selection panel">&#8249;</button>
    </div>
    <div class="criteria" id="criteria"></div>
    <div class="hint" id="hint">Press the magnifier on a column to select on that field.</div>
  </aside>

  <main class="main">
    <div class="bar">
      <button id="expand" title="Show the selection panel">&#8250;</button>
      <label for="name">Table</label>
      <input id="name" spellcheck="false" autocomplete="off">
      <button id="load">Load</button>
      <button id="join">Join</button>
      <button id="open">Open in new window</button>
      <button id="assist" title="Say what to show, and let an assistant set it up">Assistant</button>
      <span class="status" id="status"></span>
    </div>
    <div class="missing" id="missing" hidden></div>
    <div class="scroll"><div id="root"></div></div>
  </main>

  <aside class="chat" id="chat">
    <div class="chat-head">
      <span class="title">Assistant</span>
      <button id="chatclose" title="Hide the assistant">&#8250;</button>
    </div>
    <div class="chat-pick">
      <select id="who" title="Which assistant"></select>
      <select id="model" title="Which model"></select>
    </div>
    <div class="chat-log" id="chatlog"></div>
    <div class="chat-input">
      <textarea id="ask" rows="3"
                placeholder="For example: SFLIGHT for carrier AA, joined with SCARR"></textarea>
      <div class="row">
        <span class="working" id="working"></span>
        <button id="send">Send</button>
      </div>
    </div>
  </aside>

</div>

<script>
"use strict";

var NUMERIC = ["INT1", "INT2", "INT4", "INT8", "DEC", "CURR", "QUAN", "FLTP", "NUMC"];
var OPTIONS = ["EQ", "NE", "GT", "GE", "LT", "LE", "CP", "NP", "BT", "NB"];
var RANGED = ["BT", "NB"];
var ROWS = 100;

// One line per chosen field: {field, text, sign, option, low, high}
var criteria = [];
var currentTable = null;

/* The answer on screen. Sorting draws it again without asking for it twice. */
var shown = null;

function status(text) {
  document.getElementById("status").textContent = text || "";
}

function message(text) {
  var root = document.getElementById("root");
  root.className = "message";
  root.textContent = text;
}

function tableName() {
  return document.getElementById("name").value.trim().toUpperCase();
}

/* ---------- selection panel ---------- */

function addCriterion(field, text) {
  // The panel earns its width when there is something in it. Until a column is
  // clicked it holds one sentence telling the reader to click a column, so it
  // opens on the click that makes it useful.
  document.getElementById("app").className = "app";
  for (var i = 0; i < criteria.length; i++) {
    if (criteria[i].field === field) { return; }
  }
  criteria.push({ field: field, text: text, sign: "I", option: "EQ", low: "", high: "" });
  renderCriteria();
}

function select(values, chosen, onChange) {
  var el = document.createElement("select");
  values.forEach(function (v) {
    var o = document.createElement("option");
    o.value = v[0];
    o.textContent = v[1];
    if (v[0] === chosen) { o.selected = true; }
    el.appendChild(o);
  });
  el.addEventListener("change", onChange);
  return el;
}

function renderCriteria() {
  var box = document.getElementById("criteria");
  box.innerHTML = "";
  document.getElementById("hint").style.display = criteria.length ? "none" : "block";

  criteria.forEach(function (c) {
    var row = document.createElement("div");
    row.className = "crit";

    var head = document.createElement("div");
    head.className = "crit-head";
    var name = document.createElement("span");
    name.className = "crit-name";
    name.textContent = c.text || c.field;
    name.title = c.field;
    var del = document.createElement("button");
    del.textContent = "×";
    del.title = "Remove";
    del.addEventListener("click", function () {
      criteria.splice(criteria.indexOf(c), 1);
      renderCriteria();
      apply();
    });
    head.appendChild(name);
    head.appendChild(del);

    var line = document.createElement("div");
    line.className = "crit-line";

    line.appendChild(select([["I", "in"], ["E", "not"]], c.sign, function (e) {
      c.sign = e.target.value;
    }));

    line.appendChild(select(OPTIONS.map(function (o) { return [o, o]; }), c.option,
      function (e) {
        c.option = e.target.value;
        renderCriteria();
      }));

    var low = document.createElement("input");
    low.value = c.low;
    low.title = "Value";
    low.addEventListener("input", function (e) { c.low = e.target.value.toUpperCase(); });
    low.addEventListener("keydown", function (e) { if (e.key === "Enter") { apply(); } });
    line.appendChild(low);

    if (RANGED.indexOf(c.option) !== -1) {
      var high = document.createElement("input");
      high.value = c.high;
      high.title = "Upper bound";
      high.addEventListener("input", function (e) { c.high = e.target.value.toUpperCase(); });
      high.addEventListener("keydown", function (e) { if (e.key === "Enter") { apply(); } });
      line.appendChild(high);
    } else {
      c.high = "";
    }

    row.appendChild(head);
    row.appendChild(line);
    box.appendChild(row);
  });
}

/* An empty line restricts nothing, exactly as an empty select-option does. */
function query() {
  var parts = [];
  var n = 0;
  criteria.forEach(function (c) {
    if (c.low === "" && c.high === "") { return; }
    n++;
    parts.push("f" + n + "=" + encodeURIComponent(c.field));
    parts.push("s" + n + "=" + c.sign);
    parts.push("o" + n + "=" + c.option);
    parts.push("l" + n + "=" + encodeURIComponent(c.low));
    if (c.high !== "") { parts.push("h" + n + "=" + encodeURIComponent(c.high)); }
  });
  return parts.join("&");
}

function apply() {
  if (currentTable) { load(currentTable); }
}

/* ---------- data ---------- */

function load(name) {
  if (!name) { return; }
  // Field names belong to one table, so a different table starts over.
  if (currentTable !== null && name !== currentTable) {
    criteria = [];
    renderCriteria();
  }
  status("loading " + name + " ...");
  // Returns at once. The host answers later by calling sdeReady.
  sdeLoad(name, ROWS, query());
}

// Invoked by the host when the answer is waiting.
function sdeReady() {
  var raw = sdeTake();
  // The first thing a window asks is what the system has, and nothing else is
  // asked until that answer is in.
  if (askingAbout) { tookAbout(raw); return; }
  status("");
  if (typeof raw !== "string") { message("No response from the host."); return; }
  if (raw.indexOf("ERROR:") === 0) {
    var said = raw.substring(6);
    // The host marks the one failure that can be a setup state.
    if (said.indexOf("NOBACKEND:") === 0) { notFound(said.substring(10)); }
    else { message(said); }
    status("");
    return;
  }
  var data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    message("Response is not JSON:" + String.fromCharCode(10) + raw.substring(0, 2000));
    return;
  }
  // Two questions about the same table, and the answer says which it is.
  if (data.candidates) { renderJoin(data); } else { render(data); }
}

/* Which column the rows are shown by, and which way. It sorts the rows that
   were read, not the table: a hundred rows came back and those hundred are
   what gets ordered. The status line says so, because "sorted by PRICE" would
   otherwise read as the cheapest flight there is. */
var sorted = { field: null, down: false };

function sortRows(rows, fields) {
  if (!sorted.field) { return rows; }
  var f = null;
  fields.forEach(function (one) { if (one.name === sorted.field) { f = one; } });
  var numeric = f && NUMERIC.indexOf(f.datatype) !== -1;
  var out = rows.slice();
  out.sort(function (a, b) {
    var x = a[sorted.field], y = b[sorted.field];
    if (x === y) { return 0; }
    // An empty cell has no value to compare, so it goes last either way.
    if (x === null || x === undefined || x === "") { return 1; }
    if (y === null || y === undefined || y === "") { return -1; }
    var less = numeric ? Number(x) < Number(y) : String(x) < String(y);
    return (less ? -1 : 1) * (sorted.down ? -1 : 1);
  });
  return out;
}

function render(data) {
  currentTable = data.table.toUpperCase();
  shown = data;

  var root = document.getElementById("root");
  root.className = "";
  root.innerHTML = "";

  var active = {};
  criteria.forEach(function (c) {
    if (c.low !== "" || c.high !== "") { active[c.field] = true; }
  });

  var headRow = document.createElement("tr");
  data.fields.forEach(function (f) {
    var th = document.createElement("th");
    th.title = f.name + " " + f.datatype + " " + f.length
             + (f.decimals ? "," + f.decimals : "") + (f.key ? " key" : "")
             + " - click to sort on this field";
    if (active[f.name]) { th.className = "filtered"; }
    else if (f.key) { th.className = "key"; }

    var name = document.createElement("span");
    name.textContent = (f.text || f.name)
      + (sorted.field === f.name ? (sorted.down ? " ▼" : " ▲") : "");
    name.addEventListener("click", function () {
      // The same column again turns the order round; another column starts
      // over at the top.
      if (sorted.field === f.name) { sorted.down = !sorted.down; }
      else { sorted = { field: f.name, down: false }; }
      render(shown);
    });
    th.appendChild(name);

    // Selecting on a field is its own button. It was the whole header, which
    // left no plain way to sort and opened a panel on every stray click.
    var pick = document.createElement("button");
    pick.className = "pick";
    pick.textContent = "⌕";
    pick.title = "Select on " + (f.text || f.name);
    pick.addEventListener("click", function (e) {
      e.stopPropagation();
      addCriterion(f.name, f.text);
    });
    th.appendChild(pick);

    headRow.appendChild(th);
  });
  var thead = document.createElement("thead");
  thead.appendChild(headRow);

  var tbody = document.createElement("tbody");
  sortRows(data.rows, data.fields).forEach(function (row) {
    var tr = document.createElement("tr");
    data.fields.forEach(function (f) {
      var td = document.createElement("td");
      var v = row[f.name];
      if (v === null || v === undefined || v === "") {
        td.className = "empty";
        td.textContent = "·";
      } else {
        td.textContent = v;
        if (NUMERIC.indexOf(f.datatype) !== -1) { td.className = "num"; }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  var table = document.createElement("table");
  table.appendChild(thead);
  table.appendChild(tbody);
  root.appendChild(table);

  status(data.table + " " + data.count + " rows, " + data.fields.length + " columns"
       + (sorted.field ? " · these " + data.rows.length + " by " + sorted.field : ""));
}

/* ---------- join and pivot ---------- */

/* Join or Pivot, the two cards of SDE's tools area. The mode decides which
   statement the resource generates, so it travels with the request. */
var mode = "J";

/* The answer on its own, with everything that builds it put away. A join that
   returns eighty columns needs the screen; assembling one needs the builder. */
var full = false;

/* The cross: row and column dimensions by key, and measures with the aggregate
   each is taken under. A key is alias~field, the name the statement uses. */
var cross = { rows: [], cols: [], vals: [] };

/* The SELECT list as a set of keys, and the join type of each joined table by
   alias. Both empty means "as the builder proposes": every field selected and
   the type it chose. Sending a set rather than a history of clicks is what
   lets the page rebuild the request from what is on screen. */
var picked = null;
var jtypes = {};

function buildQuery() {
  var parts = [];
  if (picked) {
    // The flag says the list below is the caller's, even when it is empty -
    // which is not the same as having no opinion about it.
    parts.push("pick=X");
    picked.forEach(function (key, i) {
      parts.push("sf" + (i + 1) + "=" + encodeURIComponent(key));
    });
  }
  Object.keys(jtypes).forEach(function (alias) {
    parts.push("j" + alias + "=" + encodeURIComponent(jtypes[alias]));
  });
  return parts.join("&");
}

function crossQuery() {
  if (mode !== "P") { return ""; }
  var parts = [];
  cross.rows.forEach(function (key, i) {
    parts.push("r" + (i + 1) + "=" + encodeURIComponent(key));
  });
  cross.cols.forEach(function (key, i) {
    parts.push("c" + (i + 1) + "=" + encodeURIComponent(key));
  });
  cross.vals.forEach(function (v, i) {
    parts.push("v" + (i + 1) + "=" + encodeURIComponent(v.key));
    if (v.agg) { parts.push("a" + (i + 1) + "=" + v.agg); }
  });
  return parts.join("&");
}

function place(zone, key) {
  var list = cross[zone];
  if (zone === "vals") {
    if (!list.some(function (v) { return v.key === key; })) {
      list.push({ key: key, agg: "SUM" });
    }
  } else if (list.indexOf(key) === -1) {
    list.push(key);
  }
  loadJoin(ROWS);
}

function unplace(zone, index) {
  cross[zone].splice(index, 1);
  loadJoin(ROWS);
}

/* ---------- join ---------- */

/* The tables taken into the join, in the order they were taken. The builder
   hands out an alias on first selection and never reuses it, and the request
   replays this list from the base table - so the order is what keeps a column
   called T1_MATNR from becoming T2_MATNR under the reader. */
var taken = [];

function loadJoin(rows) {
  if (!currentTable) {
    message("Load a table first: the join is built around it.");
    return;
  }
  if (typeof sdeJoin !== "function") {
    message("This host does not offer the join yet.");
    return;
  }
  status(rows ? "running the join ..." : "building the join ...");
  // Every change runs it. The statement alone used to come back, to keep a tick
  // of a checkbox off the database - but then the rows on screen belonged to an
  // older join than the one being looked at, and Run had to be pressed after
  // every move. Stale rows are worse than a read of a hundred.
  // The selection panel travels along: a filter typed on the table belongs to
  // the join built from it, and query() already encodes exactly that.
  sdeJoin(currentTable, taken.join(","), rows || 0, query(), crossQuery(), buildQuery());
}

function toggleTaken(tabname) {
  var at = taken.indexOf(tabname);
  if (at === -1) { taken.push(tabname); } else { taken.splice(at, 1); }
  // A table joining or leaving changes which fields exist at all, so the
  // SELECT list goes back to what the builder proposes for the new shape.
  picked = null;
  loadJoin(ROWS);
}

function renderJoin(data) {
  shown = data;
  tintAliases(data.fields);
  var root = document.getElementById("root");
  root.className = "join";
  root.innerHTML = "";

  var back = document.createElement("div");
  var link = document.createElement("span");
  link.className = "back";
  link.textContent = "← Data";
  link.addEventListener("click", function () { load(currentTable); });
  back.appendChild(link);
  root.appendChild(back);

  root.appendChild(modeCards());

  // The rows come first. Every change to the join runs it again, so what is
  // being assembled and what it returns are on screen together, and the answer
  // is the thing a reader is looking at rather than something below the fold.
  if (data.rows) {
    var body = resultTable(data.rows);
    if (!full) {
      // The box scrolls rather than the list being cut: ten rows on screen and
      // the other eighty still reachable without leaving the builder.
      var window_ = document.createElement("div");
      window_.className = "preview";
      window_.appendChild(body);
      body = window_;
    }
    root.appendChild(section(data.rows.length + " rows", body));
    status(data.rows.length + " rows");
  } else {
    status(data.tables ? data.tables.length + " tables in the join" : "");
  }

  // Full view is the answer with nothing else on screen. What built it is one
  // press away and unchanged underneath.
  if (full) { return; }

  if (mode === "J") {
    // The SELECT list is settled before anything draws it, because both the
    // picker and the order strip read it and neither owns it.
    if (data.fields && picked === null) {
      picked = data.fields
        .filter(function (f) { return f.sel === "X" || f.sel === true; })
        .map(fieldKey);
    }
    root.appendChild(section("Tables around " + data.table, candidateList(data.candidates)));
    if (data.tables && data.tables.length > 0) {
      root.appendChild(section("The join", joinTable(data.tables)));
    }
    if (data.fields && data.fields.length > 0) {
      root.appendChild(section("The SELECT list", fieldPicker(data.fields, data.tables)));
      root.appendChild(section("SELECT", orderStrip(data.tables)));
    }
  } else {
    root.appendChild(crossPanel(data.fields || []));
  }

  var sql = document.createElement("pre");
  if (data.sql) {
    sql.textContent = data.sql;
  } else {
    // Nothing chosen is not everything chosen, so there is no statement to
    // show and none was run. The resource says so by sending none.
    sql.className = "none";
    sql.textContent = "No field is in the SELECT list. A statement starts at one.";
  }
  var statement = section("Statement", sql);
  if (data.sql) {
    var run = document.createElement("button");
    run.textContent = "Run";
    run.addEventListener("click", function () { loadJoin(ROWS); });
    statement.appendChild(run);
  }
  root.appendChild(statement);
}

function modeCards() {
  var box = document.createElement("div");
  box.className = "modes";
  [["J", "Join"], ["P", "Pivot table"]].forEach(function (m) {
    var button = document.createElement("button");
    button.textContent = m[1];
    if (mode === m[0]) { button.className = "on"; }
    button.addEventListener("click", function () {
      mode = m[0];
      loadJoin(ROWS);
    });
    box.appendChild(button);
  });

  var wide = document.createElement("button");
  wide.className = "full" + (full ? " on" : "");
  wide.textContent = full ? "Settings" : "Full view";
  wide.title = full ? "Show what builds the answer again"
                    : "The answer on its own, with the builder put away";
  wide.addEventListener("click", function () {
    full = !full;
    // Nothing is asked for again: the answer on screen is the one being shown
    // either way.
    renderJoin(shown);
  });
  box.appendChild(wide);
  return box;
}

/* ---------- the pivot cross ----------

   The shape SDE draws in the SAP GUI: columns across the top, rows down the
   left, measures beside them, and the fields underneath. A field goes into a
   slot by being dragged onto it, or by being clicked and then having a slot
   clicked - the second way exists because a drop target that misses is worse
   than two clicks, and a slot in an Eclipse view is small.

   MIN_SLOTS and the growing rule are ZCL_SDE_PIVOT's: a section shows one more
   slot than it holds, and never fewer than three. */

var MIN_SLOTS = 3;

/* The field waiting for a slot, and where it was picked up: the field list, or
   a slot it is being moved out of. Clicking it again puts it down. */
var holding = null;

function crossPanel(fields) {
  var box = document.createElement("div");
  box.className = "cross";

  var top = document.createElement("div");
  top.className = "crow";
  top.appendChild(corner());
  top.appendChild(zone("cols", "COLUMNS", "field values become result columns", fields));
  box.appendChild(top);

  var bottom = document.createElement("div");
  bottom.className = "crow";
  bottom.appendChild(zone("rows", "ROWS", "grouped, one line each", fields));
  bottom.appendChild(zone("vals", "MEASURES", "aggregated per row and column", fields));
  box.appendChild(bottom);

  box.appendChild(fieldChips(fields));
  return box;
}

function corner() {
  var box = document.createElement("div");
  box.className = "czone corner";

  var head = document.createElement("div");
  head.className = "chead";
  head.appendChild(document.createTextNode("PIVOT "));
  var clear = document.createElement("button");
  clear.className = "link";
  clear.textContent = "clear";
  clear.addEventListener("click", function () {
    cross = { rows: [], cols: [], vals: [] };
    holding = null;
    loadJoin(ROWS);
  });
  head.appendChild(clear);
  box.appendChild(head);

  var hint = document.createElement("div");
  hint.className = "chint";
  if (holding) {
    hint.innerHTML = "";
    var what = document.createElement("div");
    what.className = "holding";
    what.textContent = holding.key;
    box.appendChild(what);
    hint.textContent = "Click a slot to drop it there, or the chip again to let go.";
  } else {
    hint.textContent = "Drag a field into a slot, or click the field and then the"
                     + " slot. A section that fills up grows by one more slot.";
  }
  box.appendChild(hint);
  return box;
}

function placedKeys() {
  return cross.rows.concat(cross.cols)
    .concat(cross.vals.map(function (v) { return v.key; }));
}

/* Which aggregates this field may be taken under. The resource says, because
   ZCL_SDE_PIVOT decides it from the internal type, which never travels. */
function aggsOf(key, fields) {
  var found = null;
  fields.forEach(function (f) {
    if ((f.alias + "~" + f.fieldname).toLowerCase() === key) { found = f; }
  });
  if (found && found.aggs && found.aggs.length) { return found.aggs; }
  return ["COUNT"];
}

function defaultAgg(key, fields) {
  var found = null;
  fields.forEach(function (f) {
    if ((f.alias + "~" + f.fieldname).toLowerCase() === key) { found = f; }
  });
  return (found && found.agg) || "COUNT";
}

/* Put what is being held into one slot of one section. A field lands once per
   section: dropping it again moves it rather than doubling it. */
function drop(zone, index, fields) {
  if (!holding) { return; }
  var key = holding.key;
  var agg = holding.agg;
  var from = holding.from;
  holding = null;

  if (from) { cross[from.zone].splice(from.index, 1); }

  var list = cross[zone];
  var at = -1;
  list.forEach(function (one, i) {
    if ((zone === "vals" ? one.key : one) === key) { at = i; }
  });
  if (at !== -1) { list.splice(at, 1); }

  var where = Math.min(index, list.length);
  if (zone === "vals") {
    list.splice(where, 0, { key: key, agg: agg || defaultAgg(key, fields) });
  } else {
    list.splice(where, 0, key);
  }
  loadJoin(ROWS);
}

function slot(zone, index, fields) {
  var list = cross[zone];
  var item = list[index];
  var box = document.createElement("span");
  box.className = "cslot" + (item ? " fill" : "") + (holding ? " ready" : "");

  box.addEventListener("dragover", function (e) {
    if (!holding) { return; }
    e.preventDefault();
    box.className = box.className + " over";
  });
  box.addEventListener("dragleave", function () {
    box.className = box.className.replace(" over", "");
  });
  box.addEventListener("drop", function (e) {
    e.preventDefault();
    drop(zone, index, fields);
  });

  if (!item) {
    box.textContent = holding ? "+" : "·";
    box.title = holding ? "Drop " + holding.key + " here" : "";
    box.addEventListener("click", function () { drop(zone, index, fields); });
    return box;
  }

  var key = zone === "vals" ? item.key : item;

  if (zone === "vals") {
    var pick = document.createElement("select");
    aggsOf(key, fields).forEach(function (agg) {
      var option = document.createElement("option");
      option.value = agg;
      option.textContent = agg;
      if (agg === item.agg) { option.selected = true; }
      pick.appendChild(option);
    });
    pick.addEventListener("change", function (e) {
      item.agg = e.target.value;
      loadJoin(ROWS);
    });
    box.appendChild(pick);
  }

  var label = document.createElement("span");
  label.className = "lbl";
  label.textContent = key;
  label.title = key + " - drag into another slot";
  label.draggable = true;
  label.addEventListener("dragstart", function (e) {
    holding = { key: key, agg: item.agg, from: { zone: zone, index: index } };
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", key); } catch (x) { }
  });
  label.addEventListener("click", function () {
    // Picking it up out of a slot: clicking a second slot moves it there.
    if (holding && holding.key === key) { holding = null; }
    else { holding = { key: key, agg: item.agg, from: { zone: zone, index: index } }; }
    loadJoin(ROWS);
  });
  box.appendChild(label);

  var out = document.createElement("button");
  out.className = "rmx";
  out.textContent = "✕";
  out.title = "Take it out";
  out.addEventListener("click", function (e) {
    e.stopPropagation();
    unplace(zone, index);
  });
  box.appendChild(out);
  return box;
}

function zone(name, title, what, fields) {
  var box = document.createElement("div");
  box.className = "czone" + (name === "rows" ? " down" : "");

  var head = document.createElement("div");
  head.className = "chead";
  head.appendChild(document.createTextNode(title + " "));
  var note = document.createElement("i");
  note.textContent = "- " + what;
  head.appendChild(note);
  box.appendChild(head);

  var slots = document.createElement("div");
  slots.className = "cslots";
  var filled = cross[name].length;
  var total = Math.max(MIN_SLOTS, filled + 1);
  for (var i = 0; i < total; i++) { slots.appendChild(slot(name, i, fields)); }
  box.appendChild(slots);
  return box;
}

function fieldChips(fields) {
  var box = document.createElement("div");
  box.className = "chips avail";
  var placed = placedKeys();

  if (fields.length === 0) {
    var none = document.createElement("span");
    none.className = "olabel";
    none.textContent = "No fields selected - pick them in the join.";
    box.appendChild(none);
    return box;
  }

  fields.forEach(function (f) {
    var key = (f.alias + "~" + f.fieldname).toLowerCase();
    var chip = document.createElement("span");
    chip.className = "chip avchip" + tintOf(f.alias)
                   + (placed.indexOf(key) === -1 ? "" : " placed")
                   + (f.key === "X" || f.key === true ? " keyfld" : "")
                   + (holding && !holding.from && holding.key === key ? " held" : "");
    // The key, not the bare field name: a join of two tables that both have a
    // CARRID would otherwise offer two chips with the same label and different
    // meanings, and the slots show keys anyway.
    chip.textContent = key;
    chip.title = (f.ddtext || "") + "  " + key + "  " + (f.datatype || "");

    chip.draggable = true;
    chip.addEventListener("dragstart", function (e) {
      holding = { key: key, agg: null, from: null };
      e.dataTransfer.effectAllowed = "copy";
      try { e.dataTransfer.setData("text/plain", key); } catch (x) { }
    });
    chip.addEventListener("click", function () {
      if (holding && !holding.from && holding.key === key) { holding = null; }
      else { holding = { key: key, agg: null, from: null }; }
      loadJoin(ROWS);
    });

    box.appendChild(chip);
  });
  return box;
}

/* A join result has no field catalogue of its own: the columns are what the
   statement asked for, under the alias-prefixed names it gave them. So the
   keys of the first row are the header. */
function resultTable(rows) {
  var columns = rows.length ? Object.keys(rows[0]) : [];

  var head = document.createElement("tr");
  columns.forEach(function (c) {
    var th = document.createElement("th");
    th.textContent = c;
    head.appendChild(th);
  });
  var thead = document.createElement("thead");
  thead.appendChild(head);

  var tbody = document.createElement("tbody");
  rows.forEach(function (r) {
    var tr = document.createElement("tr");
    columns.forEach(function (c) {
      var td = document.createElement("td");
      var v = r[c];
      if (v === null || v === undefined || v === "") {
        td.className = "empty";
        td.textContent = "·";
      } else {
        td.textContent = v;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  var table = document.createElement("table");
  table.appendChild(thead);
  table.appendChild(tbody);
  return table;
}

function section(heading, body) {
  var box = document.createElement("section");
  var h = document.createElement("h3");
  h.textContent = heading;
  box.appendChild(h);
  box.appendChild(body);
  return box;
}

/* A direction is how the dictionary found the table: out of the base table's
   foreign keys, into it, its text table, or added by hand. */
/* One tint per table, handed out in the order the tables appear and cycled
   through six - SDE's own rule in the SAP GUI. */
var TINTS = 6;
var tints = {};

function tintAliases(fields) {
  tints = {};
  var n = 0;
  (fields || []).forEach(function (f) {
    if (tints[f.alias] === undefined) { tints[f.alias] = (n++ % TINTS) + 1; }
  });
}

/* By alias, or by the alias in front of a key like t1~carrname. */
function tintOf(alias) {
  var a = String(alias || "");
  if (a.indexOf("~") !== -1) { a = a.split("~")[0]; }
  return tints[a] ? " c" + tints[a] : "";
}

var DIRECTION = { O: "foreign key", I: "used by", T: "text table", M: "added" };

/* Which way the key points, drawn rather than spelled out: a table this one
   points at, or one that points back at it. The word is in the tooltip. */
var ARROW = { O: "→", I: "←", T: "≡", M: "+" };

/* Chips in rows, not a checkbox per line. A table around SFLIGHT can be thirty
   tables, and thirty lines of name plus description is a screen of list before
   the join itself comes into view. The name is what a reader picks by; the
   description is one hover away. */
function candidateList(candidates) {
  var box = document.createElement("div");
  box.className = "chips";

  (candidates || []).forEach(function (c) {
    var chip = document.createElement("span");
    var on = c.selected === "X" || c.selected === true;
    chip.className = "chip cand" + (on ? " on" : "");
    chip.title = (ARROW[c.direction] || "") + " "
               + (DIRECTION[c.direction] || c.direction)
               + (c.ddtext ? "  ·  " + c.ddtext : "");

    var dir = document.createElement("span");
    dir.className = "dir";
    dir.textContent = ARROW[c.direction] || c.direction;
    chip.appendChild(dir);
    chip.appendChild(document.createTextNode(" " + c.tabname));

    chip.addEventListener("click", function () { toggleTaken(c.tabname); });
    box.appendChild(chip);
  });
  return box;
}

/* The field list is a set the page owns from the first answer onwards: the
   resource is told which fields are in, not which one was clicked. */
/* ---------- the order it is written in ----------

   The tables of the FROM travel as t1..tN and the SELECT list as sf1..sfN, so
   the order on screen is the order in the statement, and moving a chip is
   moving one entry of an array. Drop a chip on another to put it before that
   one, or on the end marker to put it last: the two targets the SAP GUI
   offers, and the reason it offers a marker at all - there is nothing to drop
   after the last chip. */

var dragged = null;

function moveIn(list, from, to) {
  var one = list.splice(from, 1)[0];
  // Taking it out shifts everything behind it down by one.
  list.splice(from < to ? to - 1 : to, 0, one);
}

function orderChip(index, text, title, fixed, onMove, tint) {
  var chip = document.createElement("span");
  chip.className = "chip " + (text === null ? "end" : (fixed ? "fixed" : "move")) + (tint || "");
  chip.textContent = text === null ? "→ end" : text;
  if (title) { chip.title = title; }

  if (text !== null && !fixed) {
    chip.draggable = true;
    chip.addEventListener("dragstart", function (e) {
      dragged = index;
      e.dataTransfer.effectAllowed = "move";
      // Firefox starts no drag at all unless the transfer carries something.
      try { e.dataTransfer.setData("text/plain", String(index)); } catch (x) { }
    });
    chip.addEventListener("dragend", function () { dragged = null; });
  }

  chip.addEventListener("dragover", function (e) {
    if (dragged === null || dragged === index) { return; }
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    chip.className = chip.className + " over";
  });
  chip.addEventListener("dragleave", function () {
    chip.className = chip.className.replace(" over", "");
  });
  chip.addEventListener("drop", function (e) {
    e.preventDefault();
    chip.className = chip.className.replace(" over", "");
    if (dragged === null || dragged === index) { return; }
    var from = dragged;
    dragged = null;
    onMove(from, index);
  });
  return chip;
}

function orderRow(label, items, onMove) {
  var row = document.createElement("div");
  row.className = "orow";

  var name = document.createElement("span");
  name.className = "olabel";
  name.textContent = label;
  row.appendChild(name);

  items.forEach(function (item, index) {
    row.appendChild(orderChip(index, item.text, item.title, item.fixed, onMove, item.tint));
  });
  row.appendChild(orderChip(items.length, null, "Put it last", false, onMove, ""));
  return row;
}

function orderStrip(tables) {
  var box = document.createElement("div");
  box.className = "order";

  // The base table stands in the FROM and the request is replayed from it, so
  // it is shown and cannot be moved. Moving it would be choosing another base.
  var rows = [{ text: tables[0].alias + " " + tables[0].tabname,
                tint: tintOf(tables[0].alias),
                title: "The base table the join is built around", fixed: true }];
  taken.forEach(function (tabname, i) {
    var t = tables[i + 1];
    rows.push({ text: (t ? t.alias + " " : "") + tabname,
                tint: t ? tintOf(t.alias) : "",
                title: "Drop it on another table to put it before that one" });
  });
  box.appendChild(orderRow("Tables", rows, function (from, to) {
    // The first chip is the base, which is not in TAKEN.
    if (from === 0) { return; }
    moveIn(taken, from - 1, Math.max(to - 1, 0));
    // An alias is handed out by position, so moving a table renames its
    // columns. The SELECT list is keyed by alias and would name fields that no
    // longer exist, so it goes back to what the builder proposes.
    picked = null;
    loadJoin(ROWS);
  }));

  box.appendChild(orderRow("Fields", (picked || []).map(function (key) {
    return { text: key, tint: tintOf(key),
             title: "Drop it on another field to put it before that one" };
  }), function (from, to) {
    moveIn(picked, from, to);
    loadJoin(ROWS);
  }));

  return box;
}

function setPicked(keep) {
  picked = keep;
  loadJoin(ROWS);
}

function pickButtons(bar, fields) {
  [["all", function () { return fields.map(fieldKey); }],
   ["none", function () { return []; }],
   ["keys", function () {
      return fields.filter(function (f) { return f.key === "X" || f.key === true; })
                   .map(fieldKey);
    }]].forEach(function (b) {
    var button = document.createElement("button");
    button.className = "link";
    button.textContent = b[0];
    button.addEventListener("click", function () {
      // A group's buttons touch that group only: the rest of the list keeps
      // whatever was ticked in it.
      var mine = fields.map(fieldKey);
      var kept = picked.filter(function (k) { return mine.indexOf(k) === -1; });
      setPicked(kept.concat(b[1]()));
    });
    bar.appendChild(button);
  });
}

/* One row of chips per table, not one long ribbon. A join of three tables is
   eighty fields, and a table that starts halfway along a line is a table the
   reader has to go looking for - which is why the SAP GUI heads each with its
   alias and gives each its own all/none/keys. */
function fieldPicker(fields, tables) {
  var names = {};
  (tables || []).forEach(function (t) { names[t.alias] = t.tabname; });

  var box = document.createElement("div");

  var all = document.createElement("div");
  all.className = "picks";
  var label = document.createElement("span");
  label.className = "olabel";
  label.textContent = "Everything";
  all.appendChild(label);
  pickButtons(all, fields);
  box.appendChild(all);

  var order = [];
  var byAlias = {};
  fields.forEach(function (f) {
    if (!byAlias[f.alias]) { byAlias[f.alias] = []; order.push(f.alias); }
    byAlias[f.alias].push(f);
  });

  order.forEach(function (alias) {
    var mine = byAlias[alias];

    var head = document.createElement("div");
    head.className = "picks";
    var name = document.createElement("span");
    name.className = "olabel" + tintOf(alias);
    name.textContent = alias + (names[alias] ? " " + names[alias] : "");
    head.appendChild(name);
    pickButtons(head, mine);
    box.appendChild(head);

    var chips = document.createElement("div");
    chips.className = "chips";
    mine.forEach(function (f) {
      var key = fieldKey(f);
      var chip = document.createElement("label");
      chip.className = "chip" + tintOf(f.alias)
                     + (f.key === "X" || f.key === true ? " keyfld" : "");
      chip.title = (f.ddtext || "") + "  " + key;

      var tick = document.createElement("input");
      tick.type = "checkbox";
      tick.checked = picked.indexOf(key) !== -1;
      tick.addEventListener("change", function () {
        var at = picked.indexOf(key);
        if (at === -1) { picked.push(key); } else { picked.splice(at, 1); }
        loadJoin(ROWS);
      });
      chip.appendChild(tick);
      // The alias is on the heading above, so the chip carries the field.
      chip.appendChild(document.createTextNode(" " + f.fieldname.toLowerCase()));
      chips.appendChild(chip);
    });
    box.appendChild(chips);
  });

  return box;
}

function fieldKey(f) {
  return (f.alias + "~" + f.fieldname).toLowerCase();
}

function joinTable(tables) {
  var thead = document.createElement("thead");
  var head = document.createElement("tr");
  ["Alias", "Table", "Join", "On"].forEach(function (text) {
    var th = document.createElement("th");
    th.textContent = text;
    head.appendChild(th);
  });
  thead.appendChild(head);

  var tbody = document.createElement("tbody");
  tables.forEach(function (t, index) {
    var tr = document.createElement("tr");
    [t.alias, t.tabname + (t.ddtext ? "  " + t.ddtext : "")].forEach(function (text) {
      var td = document.createElement("td");
      td.textContent = text || "";
      tr.appendChild(td);
    });

    var type = document.createElement("td");
    // The base table stands in the FROM and joins nothing, so it has no type
    // to choose - the builder fills one and the statement never uses it.
    if (index === 0) {
      type.textContent = "";
    } else {
      var pick = document.createElement("select");
      ["INNER", "LEFT OUTER"].forEach(function (jt) {
        var option = document.createElement("option");
        option.value = jt;
        option.textContent = jt;
        if (jt === t.jtype) { option.selected = true; }
        pick.appendChild(option);
      });
      pick.addEventListener("change", function (e) {
        jtypes[t.alias] = e.target.value;
        loadJoin(ROWS);
      });
      type.appendChild(pick);
    }
    tr.appendChild(type);

    var on = document.createElement("td");
    on.textContent = t.cond || "";
    tr.appendChild(on);

    tbody.appendChild(tr);
  });

  var table = document.createElement("table");
  table.appendChild(thead);
  table.appendChild(tbody);
  return table;
}


/* ---------- what this system has ----------

   A window reads more than one resource, and a system can have some of them
   and not others: a Simple-Data-Explorer older than the window, a resource
   class that did not activate because the tool it reads through is not
   installed. So the window asks /vertex/about once, when it opens and before
   anything else. What the system does not have is not drawn, and a line under
   the bar says what is missing and why: a button that silently went away
   explains nothing.

   A system that cannot say - nothing answers there, or its hub is older than
   the question - changes nothing: every button stays, and a failure is
   reported when it happens, as it always was. */

var USES = [
  { service: "table", what: "reading a table", main: true },
  { service: "join", what: "the join builder" }
];

var have = null;         // what /vertex/about said, by service; null while unsaid
var backends = {};       // the tools it named, installed or not
var askingAbout = false;
var afterAbout = null;

function askAbout(then) {
  if (typeof sdeAbout !== "function") { then(); return; }
  askingAbout = true;
  afterAbout = then;
  status("checking what this system has ...");
  sdeAbout();
}

function tookAbout(raw) {
  askingAbout = false;
  status("");
  var data = null;
  if (typeof raw === "string" && raw.indexOf("ERROR:") !== 0) {
    try { data = JSON.parse(raw); } catch (e) { data = null; }
  }
  if (data && Array.isArray(data.services)) {
    have = {};
    data.services.forEach(function (s) { have[s.name] = s; });
    (data.backends || []).forEach(function (b) { backends[b.name] = !!b.installed; });
  }
  applyAbout();
  var then = afterAbout;
  afterAbout = null;
  if (then) { then(); }
}

function applyAbout() {
  document.getElementById("join").hidden = !usable("join");
  sayMissing();
}

/* The window proper starts once the system has said what it has. Without the
   resource this window is for, there is nothing to start. */
function startWindow() {
  if (!usable("table")) { setupPage(""); return; }
  if (INITIAL) { load(INITIAL); }
}

/* Unknown counts as usable: only a system that said so loses part of the window. */
function usable(service) {
  return have === null || (!!have[service] && !!have[service].active);
}

function whyMissing(service) {
  var said = have && have[service];
  if (!said) { return "the Simple-Data-Explorer there is older than this window"; }
  if (said.backend && backends[said.backend] === false) {
    return said.handler + " is not active, because " + said.backend + " is not installed";
  }
  return said.handler + " is not active";
}

function sayMissing() {
  var lost = USES.filter(function (u) { return !u.main && !usable(u.service); });
  var line = document.getElementById("missing");
  line.textContent = lost.length === 0 ? "" : "Not on this system: " + lost.map(function (u) {
    return u.what + " - " + whyMissing(u.service);
  }).join("; ") + ".";
  line.hidden = lost.length === 0;
}

/* A 404 is a setup state while the system has not said what it has, or when it
   said part of what this window reads is missing. When it has all of it, the
   404 is the resource's own answer and is shown as one. */
function notFound(detail) {
  if (have !== null && USES.every(function (u) { return usable(u.service); })) { message(detail); }
  else { setupPage(detail); }
}


/* ---------- when the ABAP half is not there ----------

   This page is half of VERTEX. The other half is ABAP, and a plugin installed
   without it reaches a path nothing answers. That is a setup state, not a
   failure: nothing is broken, the backend has simply never been put there. So
   it gets a page saying what to install, the way AVE answers a missing table
   with a setup page of its own rather than an error.

   The host says which of the two it is, because only the host saw the status
   code. Anything else - a system that is down, a password refused - is a
   failure and stays one.

   BACKEND is what THIS window reads, and it differs per window: the resources
   are one repository, and the tool a window reaches into through them is
   another. Naming only the first would send somebody who is missing the second
   to install what they already have. */

var BACKEND = [
  { name: "Simple-Data-Explorer",
    url: "https://github.com/ysichov/Simple-Data-Explorer",
    why: "the ADT resources every VERTEX window reads" }
];

/* Opening a link is the host's business: in Eclipse it would otherwise
   navigate the view away from this page, and a webview cannot open one at
   all. A host that offers nothing leaves the address to be copied. */
function projectLink(text, url) {
  var link = document.createElement("span");
  link.className = "link";
  if (typeof sdeBrowse === "function") {
    link.textContent = text || url;
    link.title = url;
    link.addEventListener("click", function () { sdeBrowse(url); });
  } else {
    link.className = "link plain";
    link.textContent = url;
    link.title = "Copy this address into a browser";
  }
  return link;
}

/* The short link, on the start screen, always. Somebody who has just installed
   the plugin and typed nothing yet is exactly who needs to know where the
   other half of it lives. */
function startLink() {
  var line = document.createElement("div");
  line.className = "startlink";
  line.appendChild(document.createTextNode("This window reads ABAP from "));
  BACKEND.forEach(function (one, i) {
    if (i > 0) {
      line.appendChild(document.createTextNode(i + 1 === BACKEND.length ? " and " : ", "));
    }
    line.appendChild(projectLink(one.name, one.url));
  });
  document.getElementById("root").appendChild(line);
}

function setupPage(detail) {
  var root = document.getElementById("root");
  root.className = "setup";
  root.innerHTML = "";

  var head = document.createElement("h3");
  var why = document.createElement("p");
  if (have === null) {
    head.textContent = "The ABAP half is not on this system";
    why.textContent = "VERTEX is a page and a set of ADT resources. The page is"
                    + " installed here; the resources answer nothing, so there is"
                    + " nothing for it to read. A Simple-Data-Explorer older than"
                    + " this window cannot say what it has either: if it is"
                    + " installed, pull it again.";
  } else {
    head.textContent = "Part of the ABAP half is missing on this system";
    why.textContent = "Simple-Data-Explorer answers here, and says what this window can read:";
  }
  root.appendChild(head);
  root.appendChild(why);

  if (have !== null) {
    var found = document.createElement("ul");
    USES.forEach(function (u) {
      var li = document.createElement("li");
      li.className = usable(u.service) ? "ok" : "no";
      li.textContent = usable(u.service) ? u.what + " - there"
                                         : u.what + " - missing: " + whyMissing(u.service);
      found.appendChild(li);
    });
    root.appendChild(found);
  }

  var what = document.createElement("ul");
  BACKEND.forEach(function (one) {
    var li = document.createElement("li");
    li.appendChild(projectLink(one.name, one.url));
    li.appendChild(document.createTextNode(" - " + one.why));
    what.appendChild(li);
  });
  root.appendChild(what);

  var steps = document.createElement("ol");
  (have !== null
    ? ["Pull what is missing or older with abapGit and activate it.",
       "Reopen this window."]
    : ["Pull each of those with abapGit and activate it.",
       "Activate ZCL_VX_ADT_RES_APP with the rest of the resources.",
       "Register the BAdI implementation ZVX_ADT_RES_APP on"
         + " BADI_ADT_REST_RFC_APPLICATION, with the filter STATIC_URI_PATH"
         + " covering /sap/bc/adt/vertex/* .",
       "Reopen this window."]).forEach(function (step) {
    var li = document.createElement("li");
    li.textContent = step;
    steps.appendChild(li);
  });
  root.appendChild(steps);

  if (detail) {
    var said = document.createElement("pre");
    said.className = "said";
    said.textContent = detail;
    root.appendChild(said);
  }
}

/* ---------- the assistant ----------

   Saying what to show instead of clicking it together. The host hands the
   request to Claude Code or Codex, with the table's layout as the only thing
   that assistant can read, and gets back the whole state this page is to be
   put in, already checked against the dictionary. Applying it goes through
   the same variables and the same load and loadJoin the clicks use, so what
   comes out is a SelecTor like any other: every filter, chip and slot can be
   changed by hand afterwards. */

var ASSISTANTS = [["claude", "Claude Code"], ["codex", "Codex"]];

/* One request at a time; the name of whoever is answering it, because the
   choice in the list may change while it runs. */
var asking = null;
var chatOpened = false;

function recall(key) {
  // Storage can be switched off; the page then simply forgets the choice.
  try { return window.localStorage.getItem("vertex.assistant." + key) || ""; }
  catch (e) { return ""; }
}

function remember(key, value) {
  try { window.localStorage.setItem("vertex.assistant." + key, value); }
  catch (e) { /* not kept */ }
}

function say(kind, who, text, detail) {
  var log = document.getElementById("chatlog");
  var box = document.createElement("div");
  box.className = "msg " + kind;
  var name = document.createElement("span");
  name.className = "who";
  name.textContent = who;
  box.appendChild(name);
  var body = document.createElement("div");
  body.className = "text";
  body.textContent = text;
  box.appendChild(body);
  if (detail) {
    var did = document.createElement("div");
    did.className = "did";
    did.textContent = detail;
    box.appendChild(did);
  }
  log.appendChild(box);
  log.scrollTop = log.scrollHeight;
}

function openChat() {
  document.getElementById("chat").style.display = "flex";
  if (chatOpened) {
    document.getElementById("ask").focus();
    return;
  }
  chatOpened = true;

  if (typeof sdeAsk !== "function") {
    // The page is the same in Eclipse; the host there has no assistant to run.
    ["ask", "send", "who", "model"].forEach(function (id) {
      document.getElementById(id).disabled = true;
    });
    say("error", "VERTEX", "This host has no assistant yet. It runs in VS Code for now.");
    return;
  }

  var who = document.getElementById("who");
  ASSISTANTS.forEach(function (a) {
    var option = document.createElement("option");
    option.value = a[0];
    option.textContent = a[1];
    who.appendChild(option);
  });
  var kept = recall("who");
  who.value = ASSISTANTS.some(function (a) { return a[0] === kept; }) ? kept : ASSISTANTS[0][0];
  askModels();
  document.getElementById("ask").focus();
}

/* Claude Code's aliases, or the catalog Codex reports: the host knows which. */
function askModels() {
  var box = document.getElementById("model");
  box.innerHTML = "";
  var waiting = document.createElement("option");
  waiting.textContent = "loading ...";
  box.appendChild(waiting);
  box.disabled = true;
  sdeModels(document.getElementById("who").value);
}

function fillModels(data) {
  // An answer for an assistant no longer chosen: the one that is has its own
  // request on the way.
  if (data.assistant !== document.getElementById("who").value) { return; }
  var box = document.getElementById("model");
  box.innerHTML = "";
  if (data.error) {
    var none = document.createElement("option");
    none.textContent = "no models";
    box.appendChild(none);
    say("error", "VERTEX", data.error);
    return;
  }
  data.models.forEach(function (m) {
    var option = document.createElement("option");
    option.value = m.id;
    option.textContent = m.label;
    box.appendChild(option);
  });
  var kept = recall("model." + data.assistant);
  if (data.models.some(function (m) { return m.id === kept; })) { box.value = kept; }
  box.disabled = false;
}

/* What is on screen now, as the assistant is told it: names and settings,
   never a row. */
function pageState() {
  var view = document.getElementById("root").className !== "join" ? "table"
           : (mode === "P" ? "pivot" : "join");
  return {
    table: currentTable || "",
    view: view,
    filters: criteria
      .filter(function (c) { return c.low !== "" || c.high !== ""; })
      .map(function (c) {
        return { field: c.field, sign: c.sign, option: c.option, low: c.low, high: c.high };
      }),
    join: taken.slice(),
    fields: picked ? picked.slice() : [],
    pivot: {
      rows: cross.rows.slice(),
      cols: cross.cols.slice(),
      vals: cross.vals.map(function (v) { return { key: v.key, agg: v.agg }; })
    }
  };
}

function sendAsk() {
  if (asking) { return; }
  var input = document.getElementById("ask");
  var text = input.value.trim();
  if (!text) { return; }
  var who = document.getElementById("who");
  var model = document.getElementById("model");
  if (model.disabled) {
    say("error", "VERTEX", "There is no model to ask yet: the list for "
        + who.options[who.selectedIndex].text + " did not arrive.");
    return;
  }
  asking = who.options[who.selectedIndex].text;
  say("user", "You", text);
  input.value = "";
  document.getElementById("send").disabled = true;
  document.getElementById("working").textContent = asking + " is working ...";
  sdeAsk(who.value, model.value, text, JSON.stringify(pageState()));
}

// Invoked by the host with a model list or an answer.
function sdeAssistant(raw) {
  var data;
  try { data = JSON.parse(raw); }
  catch (e) { data = { call: "ask", error: "The host answered with something that is not JSON." }; }

  if (data.call === "models") {
    fillModels(data);
    return;
  }

  var who = (asking || "Assistant") + (data.model ? " · " + data.model : "")
          + (data.system ? " · " + data.system : "");
  asking = null;
  document.getElementById("send").disabled = false;
  document.getElementById("working").textContent = "";

  if (data.error) {
    say("error", who, data.error);
    return;
  }
  var plan = data.plan;
  say("assistant", who, plan.reply || "Done.", plan.table ? describePlan(plan) : "");
  // An empty table is an answer without a change: the assistant says why.
  if (plan.table) { applyPlan(plan); }
}

function describePlan(plan) {
  var parts = [plan.table];
  plan.filters.forEach(function (f) {
    parts.push((f.sign === "E" ? "not " : "") + f.field.toUpperCase() + " " + f.option + " "
               + f.low + (f.high ? " .. " + f.high : ""));
  });
  if (plan.join.length) { parts.push("join " + plan.join.join(", ")); }
  if (plan.fields.length) { parts.push(plan.fields.length + " fields"); }
  var p = plan.pivot;
  if (p.rows.length || p.cols.length || p.vals.length) {
    parts.push("pivot: " + p.rows.length + " rows, " + p.cols.length + " columns, "
               + p.vals.length + " measures");
  }
  return parts.join(" · ");
}

/* The plan on the page, as the clicks would have put it there. Nothing is
   merged with what was on screen: the host sent the whole state wanted. */
function applyPlan(plan) {
  document.getElementById("name").value = plan.table;
  // Set before anything loads, so load() does not take the new table for a
  // change of table and throw the new filters away.
  currentTable = plan.table;
  criteria = plan.filters.map(function (f) {
    return { field: f.field, text: f.text, sign: f.sign, option: f.option,
             low: f.low, high: f.high };
  });
  if (criteria.length) { document.getElementById("app").classList.remove("collapsed"); }
  renderCriteria();

  taken = plan.join.slice();
  picked = plan.fields.length ? plan.fields.slice() : null;
  jtypes = {};
  cross = {
    rows: plan.pivot.rows.slice(),
    cols: plan.pivot.cols.slice(),
    vals: plan.pivot.vals.map(function (v) { return { key: v.key, agg: v.agg }; })
  };
  var pivot = cross.rows.length + cross.cols.length + cross.vals.length > 0;
  mode = pivot ? "P" : "J";
  full = false;
  sorted = { field: null, down: false };

  if (pivot || taken.length || picked) { loadJoin(ROWS); } else { load(plan.table); }
}

/* ---------- wiring ---------- */

document.getElementById("load").addEventListener("click", function () { load(tableName()); });

document.getElementById("name").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { load(tableName()); }
});

document.getElementById("join").addEventListener("click", function () { loadJoin(ROWS); });

document.getElementById("open").addEventListener("click", function () {
  var name = tableName();
  if (name) { sdeOpen(name); }
});

document.getElementById("collapse").addEventListener("click", function () {
  document.getElementById("app").classList.add("collapsed");
});

document.getElementById("expand").addEventListener("click", function () {
  document.getElementById("app").classList.remove("collapsed");
});

document.getElementById("assist").addEventListener("click", function () {
  var chat = document.getElementById("chat");
  if (chat.style.display === "flex") { chat.style.display = "none"; } else { openChat(); }
});

document.getElementById("chatclose").addEventListener("click", function () {
  document.getElementById("chat").style.display = "none";
});

document.getElementById("send").addEventListener("click", sendAsk);

document.getElementById("ask").addEventListener("keydown", function (e) {
  // Enter sends; Shift+Enter is a new line in the request.
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendAsk();
  }
});

document.getElementById("who").addEventListener("change", function (e) {
  remember("who", e.target.value);
  askModels();
});

document.getElementById("model").addEventListener("change", function (e) {
  remember("model." + document.getElementById("who").value, e.target.value);
});

var INITIAL = /*INIT*/null/*INIT*/;
if (INITIAL) {
  document.getElementById("name").value = INITIAL;
} else {
  message("Type a table name and press Load.");
  startLink();
}
// Wait for the document, so sdeReady exists before the host calls it. What the
// system has is asked first; a table the window was opened on is read after.
window.addEventListener("load", function () { askAbout(startWindow); });
</script>

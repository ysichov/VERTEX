var INITIAL=/*INIT*/null/*INIT*/;var fragment=null,selectedPart=null,allLines=[],allParts=[],shownRange=null,sourceHistory=[];

function variableTypes(){var found={};allLines.forEach(function(line){var typed=/\b(?:DATA|CONSTANTS|STATICS|FIELD-SYMBOLS?)\s+([A-Za-z_][A-Za-z0-9_]*)\s+(TYPE|LIKE)\s+([^\.]+)/i.exec(line);if(typed)found[typed[1].toUpperCase()]=typed[3].trim();var parameter=/\b!?([A-Za-z_][A-Za-z0-9_]*)\s+(TYPE|LIKE)\s+([A-Za-z_/$][A-Za-z0-9_/$]*)/ig,match;while((match=parameter.exec(line)))found[match[1].toUpperCase()]=match[3].trim();});return found;}

function paintLine(row,text,types,methods){var tokens=/((?:".*)|(?:'[^']*')|\b(?:CLASS|INTERFACE|METHOD|METHODS|ENDMETHOD|ENDCLASS|DATA|TYPE|LIKE|REF|TO|RETURNING|IMPORTING|EXPORTING|CHANGING|RAISING|IF|ENDIF|LOOP|ENDLOOP|CASE|WHEN|ENDCASE|TRY|CATCH|ENDTRY|CALL|FUNCTION)\b|\/[A-Za-z0-9_]+\/(?:ZCL_|CL_)[A-Za-z0-9_/$]*|\b(?:ZCL_|CL_)[A-Za-z0-9_/$]*\b|\b[A-Za-z_][A-Za-z0-9_]*\b)/ig;var at=0,match;while((match=tokens.exec(text))){row.appendChild(document.createTextNode(text.slice(at,match.index)));let word=match[0],node=document.createElement("span"),upper=word.toUpperCase(),before=text.slice(0,match.index);if(/^"/.test(word))node.className="comment";else if(/^'/.test(word))node.className="str";else if(/^(?:(?:ZCL_|CL_)|\/[A-Za-z0-9_]+\/(?:ZCL_|CL_))/i.test(word)){node.className="classref";node.title="Double-click to open class "+upper;node.addEventListener("dblclick",function(){if(typeof sdeSelectObject==="function")sdeSelectObject({type:"CLAS",name:upper,action:"view"});});}else if(methods[upper]){node.className="methodref";node.title=methods[upper];node.addEventListener("dblclick",function(){goDefinition(upper);});}else if(types[upper]){node.className="var";node.title=types[upper];}else if(/^(?:TY|TT|TS)_[A-Z0-9_/$]+$/i.test(word)&&/\b(?:TYPE|LIKE)\s*$/i.test(before)){node.className="classref";node.title="Double-click to open type "+upper;node.addEventListener("dblclick",function(){if(typeof sdeSelectObject==="function")sdeSelectObject({type:"TABL",name:upper,action:"data"});});}else if(/^(?:CLASS|INTERFACE|METHOD|METHODS|ENDMETHOD|ENDCLASS|DATA|TYPE|LIKE|REF|TO|RETURNING|IMPORTING|EXPORTING|CHANGING|RAISING|IF|ENDIF|LOOP|ENDLOOP|CASE|WHEN|ENDCASE|TRY|CATCH|ENDTRY|CALL|FUNCTION)$/i.test(word))node.className="kw";node.textContent=word;row.appendChild(node);at=match.index+word.length;}row.appendChild(document.createTextNode(text.slice(at)));}
function renderRanges(ranges){var code=document.getElementById("code"),out=[],types=variableTypes(),methods=methodTypes();ranges.forEach(function(range){for(var i=range.start;i<=range.end;i++)out.push(i);});if(!document.createElement){code.textContent=out.map(function(i){return allLines[i-1]||"";}).join("\n");return;}code.textContent="";out.forEach(function(i){var row=document.createElement("span"),no=document.createElement("span");row.className="line";row.id="line-"+i;no.className="line-no";no.textContent=i;row.appendChild(no);paintLine(row,allLines[i-1]||"",types,methods);code.appendChild(row);});}

<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--vscode-editor-background,Canvas);color:var(--vscode-editor-foreground,CanvasText);font:13px var(--vscode-editor-font-family,monospace);height:100vh;display:flex;flex-direction:column}header{padding:8px;border-bottom:1px solid var(--vscode-panel-border,GrayText);font-family:system-ui;flex:none}#hint{color:var(--vscode-descriptionForeground,GrayText);margin-top:3px}.panes{display:flex;min-height:0;flex:1}.parts{width:280px;flex:none;overflow:auto;border-right:1px solid var(--vscode-panel-border,GrayText);font-family:system-ui}.parts h3{font-size:12px;margin:0;padding:8px;border-bottom:1px solid var(--vscode-panel-border,GrayText)}.part{display:block;width:100%;padding:6px 10px;border:0;border-bottom:1px solid var(--vscode-panel-border,GrayText);text-align:left;color:inherit;background:transparent;font:13px var(--vscode-editor-font-family,monospace);cursor:pointer}.part:hover,.part.on{background:var(--vscode-list-activeSelectionBackground,Highlight);color:var(--vscode-list-activeSelectionForeground,HighlightText)}.code{margin:0;overflow:auto;flex:1;tab-size:2;padding:12px}.line{display:block;white-space:pre;min-height:1.25em}.line-no{display:inline-block;width:4em;text-align:right;padding-right:1em;user-select:none;color:var(--vscode-editorLineNumber-foreground,GrayText)}.kw{color:var(--vscode-debugTokenExpression-name,Highlight)}.str{color:var(--vscode-debugTokenExpression-string,DarkOliveGreen)}.comment{color:var(--vscode-editorLineNumber-foreground,GrayText)}.classref{color:var(--vscode-symbolIcon-classForeground,MediumPurple);text-decoration:underline;cursor:pointer}.methodref{color:var(--vscode-symbolIcon-methodForeground,MediumPurple);text-decoration:underline dotted}.var{color:var(--vscode-symbolIcon-variableForeground,Teal)}@media(max-width:650px){.parts{width:180px}}
</style></head><body><header><span id="title">Reading source…</span><div id="hint">Read only · Select code to ask the assistant</div></header><main class="panes"><aside class="parts" id="parts"></aside><pre class="code" id="code"></pre></main><script>
var INITIAL=/*INIT*/null/*INIT*/;var fragment=null,selectedPart=null,allLines=[];
function sdeContext(){var context={type:INITIAL.type,name:INITIAL.name,view:"source",part:selectedPart&&selectedPart.name||null};if(selectedPart&&selectedPart.signature)context.method_signature=allLines.slice(selectedPart.signature.start-1,selectedPart.signature.end).join("\n");return context;}function sdeSelection(){return fragment;}
function publishContext(){if(typeof sdeContextUpdate==="function")sdeContextUpdate({vertex_view:sdeContext(),selected_fragment:fragment});}
document.addEventListener("selectionchange",function(){var s=window.getSelection(),c=document.getElementById("code");if(s&&s.rangeCount&&c.contains(s.anchorNode)&&c.contains(s.focusNode)){var t=s.toString();fragment=t?{text:t.slice(0,12000),view:sdeContext()}:null;publishContext();}});document.getElementById("code").addEventListener("mousedown",function(){fragment=null;publishContext();});
function add(parts,kind,name,start,end,signature){parts.push({kind:kind,name:name,start:start,end:end,signature:signature||null});}
function endOf(lines,start,closer){for(var n=start;n<lines.length;n++)if(closer.test(lines[n]))return n+1;return lines.length;}
function methodSignature(lines,name){var pattern=new RegExp("^\\s*(?:CLASS-)?METHODS\\s+"+name.replace(/[\\/$]/g,"\\$&")+"\\b","i");for(var i=0;i<lines.length;i++)if(pattern.test(lines[i]))return {start:i+1,end:endOf(lines,i,/\\.\\s*(?:\".*)?$/)};return null;}
/* The ADT source is authoritative. This is only a clickable outline of its
   entry points, and each entry supplies its own source range. */
function outline(source,type){var parts=[],seen={},lines=source.split(/\r?\n/),klass=String(type).toUpperCase()==="CLAS";lines.forEach(function(text,index){var m,line=index+1;if(klass&&(m=/^\s*METHOD\s+([A-Z0-9_/$]+)\s*\./i.exec(text))){add(parts,"Methods",m[1],line,endOf(lines,index,/^\s*ENDMETHOD\s*\./i),methodSignature(lines,m[1]));return;}if(!klass&&(m=/^\s*FORM\s+([A-Z0-9_/$]+)\s*\./i.exec(text))){add(parts,"Forms",m[1],line,endOf(lines,index,/^\s*ENDFORM\s*\./i));return;}if(!klass&&(m=/^\s*CLASS\s+([A-Z0-9_/$]+)\s+(?:DEFINITION|IMPLEMENTATION)\b/i.exec(text))){var key=m[1].toUpperCase();if(!seen[key]){seen[key]=true;add(parts,"Local classes",m[1],line,endOf(lines,index,/^\s*ENDCLASS\s*\./i));}return;}if(!klass&&/^\s*(INITIALIZATION|LOAD-OF-PROGRAM|START-OF-SELECTION|END-OF-SELECTION|TOP-OF-PAGE|END-OF-PAGE|AT\s+(?:SELECTION-SCREEN|LINE-SELECTION|PF\d+|USER-COMMAND)|GET\s+\S+)/i.test(text)){add(parts,"Events",text.replace(/^\s*/,"").replace(/\.$/,""),line,line);}});parts.forEach(function(part,index){if(part.kind==="Events"){var next=parts.slice(index+1).find(function(other){return other.start>part.start;});part.end=next?next.start-1:lines.length;}});return parts;}
function renderCode(start,end){renderRanges([{start:start,end:end}]);}
function variableTypes(){var found={};allLines.forEach(function(line){var match=/\b(?:DATA|CONSTANTS|STATICS|FIELD-SYMBOLS?)\s+([A-Za-z_][A-Za-z0-9_]*)\s+(TYPE|LIKE)\s+([^\.]+)/i.exec(line);if(match)found[match[1].toUpperCase()]=match[2].toUpperCase()+" "+match[3].trim();});return found;}
function paintLine(row,text,types){var tokens=/((?:".*)|(?:'[^']*')|\b(?:CLASS|INTERFACE|METHOD|METHODS|ENDMETHOD|ENDCLASS|DATA|TYPE|LIKE|REF|TO|RETURNING|IMPORTING|EXPORTING|CHANGING|RAISING|IF|ENDIF|LOOP|ENDLOOP|CASE|WHEN|ENDCASE|TRY|CATCH|ENDTRY|CALL|FUNCTION)\b|\b(?:ZCL_|CL_)[A-Za-z0-9_/$]*\b|\b[A-Za-z_][A-Za-z0-9_]*\b)/ig;var at=0,match;while((match=tokens.exec(text))){row.appendChild(document.createTextNode(text.slice(at,match.index)));let word=match[0],node=document.createElement("span"),upper=word.toUpperCase();if(/^"/.test(word))node.className="comment";else if(/^'/.test(word))node.className="str";else if(/^(?:ZCL_|CL_)/i.test(word)){node.className="classref";node.title="Double-click to open class "+upper;node.addEventListener("dblclick",function(){if(typeof sdeSelectObject==="function")sdeSelectObject({type:"CLAS",name:upper,action:"view"});});}else if(selectedPart&&upper===String(selectedPart.name).toUpperCase()&&selectedPart.signature){node.className="methodref";node.title=allLines.slice(selectedPart.signature.start-1,selectedPart.signature.end).join("\n");}else if(types[upper]){node.className="var";node.title=types[upper];}else if(/^(?:CLASS|INTERFACE|METHOD|METHODS|ENDMETHOD|ENDCLASS|DATA|TYPE|LIKE|REF|TO|RETURNING|IMPORTING|EXPORTING|CHANGING|RAISING|IF|ENDIF|LOOP|ENDLOOP|CASE|WHEN|ENDCASE|TRY|CATCH|ENDTRY|CALL|FUNCTION)$/i.test(word))node.className="kw";node.textContent=word;row.appendChild(node);at=match.index+word.length;}row.appendChild(document.createTextNode(text.slice(at)));}
function renderRanges(ranges){var code=document.getElementById("code"),out=[],types=variableTypes();ranges.forEach(function(range){for(var i=range.start;i<=range.end;i++)out.push(i);});if(!document.createElement){code.textContent=out.map(function(i){return allLines[i-1]||"";}).join("\n");return;}code.textContent="";out.forEach(function(i){var row=document.createElement("span"),no=document.createElement("span");row.className="line";row.id="line-"+i;no.className="line-no";no.textContent=i;row.appendChild(no);paintLine(row,allLines[i-1]||"",types);code.appendChild(row);});}
function jump(part){selectedPart=part;fragment=null;document.querySelectorAll(".part").forEach(function(n){n.classList.toggle("on",n.dataset.start===String(part.start));});renderCode(part.start,part.end);document.getElementById("code").scrollTop=0;publishContext();}
function renderParts(items){var root=document.getElementById("parts");renderCode(1,allLines.length);if(!root||!document.createElement)return;root.textContent="";if(!items.length){root.hidden=true;return;}root.hidden=false;var groups={};items.forEach(function(item){(groups[item.kind]||(groups[item.kind]=[])).push(item);});Object.keys(groups).forEach(function(kind){var h=document.createElement("h3");h.textContent=kind+" ("+groups[kind].length+")";root.appendChild(h);groups[kind].forEach(function(part){var b=document.createElement("button");b.className="part";b.textContent=part.name;b.dataset.start=part.start;b.addEventListener("click",function(){jump(part);});root.appendChild(b);});});jump(items[0]);}
function sdeReady(){var raw=sdeTake();try{if(String(raw).startsWith("ERROR:"))throw new Error(String(raw).slice(6));var data=JSON.parse(raw),source=data.source||"";document.getElementById("title").textContent=(data.object_name||INITIAL.name)+" · View source";allLines=source.split(/\r?\n/);renderParts(outline(source,data.object_type||INITIAL.type));}catch(error){document.getElementById("title").textContent="Could not read source";document.getElementById("code").textContent=error.message;}}
if(INITIAL&&INITIAL.name)sdeSource(INITIAL.name,INITIAL.type);
</script></body></html>
